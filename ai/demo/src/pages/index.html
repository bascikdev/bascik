<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bascik Chat: books</title>
    <meta
      name="description"
      content="A chat interface with generative UI, streamed as HTML by Bascik."
    />
    <link rel="stylesheet" href="/style.css" />
    <!-- Hold the first paint until the stored conversation is parsed. The
         reply streams in after it. -->
    <link rel="expect" href="#thread-ready" blocking="render" />
  </head>
  <body>
    <!-- chat-app is the frame, the thread and the client runtime. This demo
         replaces two of its parts: the sidebar, for its app links, model
         picker and memory link, and the composer, for its voice parts. -->
    <chat-app>
      <template data-bascik-slot="sidebar"><site-menu /></template>
      <template data-bascik-slot="composer">
        <chat-composer
          data-bascik-prop-app="books"
          data-bascik-prop-autofocus="autofocus"
          enctype="multipart/form-data"
        >
          <span data-bascik-slot="start"><chat-attach /></span>
          <chat-voice />
          <voice-call data-bascik-prop-app="books" />
        </chat-composer>
      </template>
    </chat-app>
  </body>
</html>
