<!-- @bascik
A link to a documentation page: the page or section title, its full URL as href, and one sentence on what the reader finds there as content. Use it to cite every page an answer came from. Never also write the URL in the text.
-->
<style>
  .link {
    display: grid;
    gap: 0.1rem;
    margin: 0;
    padding: 0.45rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: inherit;
    text-decoration: none;
  }
  .link:hover {
    border-color: var(--accent);
  }
  .link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .title {
    font-size: var(--text-small, 0.875rem);
    font-weight: 600;
  }
  .title::after {
    content: " ↗";
    color: var(--muted);
  }
  .summary {
    color: var(--muted);
    font-size: var(--text-smaller, 0.8125rem);
  }
</style>
<!-- The docs are another site, so the link opens in a new tab and the
     conversation stays open: the ↗ after the title says so. -->
<a
  class="link"
  target="_blank"
  rel="noopener noreferrer"
  data-testid="doc-link"
  data-bascik-attr-href="href"
>
  <span
    class="title"
    data-testid="doc-link-title"
    data-bascik-prop-title
  ></span>
  <span class="summary"><span data-bascik-slot></span></span>
</a>
