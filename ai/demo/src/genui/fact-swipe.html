<!-- @bascik
A stack of facts for the expert to validate quickly, swiping right for correct and left for wrong. Props: item (a short id for the batch, letters digits dots dashes) and question; hint (replaces the line that explains the gesture; leave it out for the usual one) and radios (leave it out, and the buttons answer; radios="show" also shows the Wrong and Right radio buttons on each card); two to eight fact-card children; every answer is recorded as one decision; without JavaScript it is a plain list of Right/Wrong choices with a Record answers button. Use it for several short facts from one source at once; use fact-check for a single fact that needs a note.
-->
<style>
  .deck {
    margin: 0;
    display: grid;
    gap: 0.75rem;
    max-inline-size: 26rem;
  }
  .stack {
    display: grid;
    gap: 0.75rem;
  }
  .live {
    display: grid;
    position: relative;
    /* The top card and the label stack high: they stay inside this box. */
    isolation: isolate;
    touch-action: pan-y;
    padding-block-end: 1.5rem;
  }
  .question {
    font-weight: bold;
  }
  .question:has(+ .hint:not([hidden])) {
    margin-block-end: 0;
  }
  .hint {
    margin-block: -0.5rem 0;
    color: var(--muted);
    font-size: 0.875rem;
  }
  .verdict {
    display: none;
  }
  .live .verdict {
    display: block;
    grid-area: 1 / 1;
    place-self: start center;
    z-index: 20;
    margin-block-start: 0.5rem;
    padding: 0.2rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    font-weight: 600;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease-out;
  }
  @media (prefers-reduced-motion: reduce) {
    .live .verdict {
      transition: none;
    }
  }
  .progress {
    color: var(--muted);
    font-size: 0.875rem;
    text-align: center;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
  }
  .off {
    display: none;
  }
  .choice {
    min-block-size: 2.75rem;
    min-inline-size: 2.75rem;
    padding: 0.5rem 1.1rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: inherit;
    font: inherit;
    cursor: pointer;
    border-radius: 999px;
  }
  .choice-yes {
    background: var(--accent);
    color: var(--on-accent);
  }
  .done {
    justify-self: start;
    margin-top: 0.35rem;
    min-block-size: 2.75rem;
    padding: 0.45rem 1rem;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .choice:focus-visible,
  .done:focus-visible {
    outline: 2px solid var(--accent);
  }
</style>
<form class="deck" method="post" action="/api/decide" data-testid="fact-swipe">
  <input type="hidden" name="app" value="review" />
  <input type="hidden" name="kind" value="facts" />
  <input type="hidden" name="verdict" value="reviewed" />
  <input type="hidden" name="item" data-bascik-attr-value="item" />
  <p class="question" data-bascik-prop-question>Are these right?</p>
  <p
    id="hint"
    class="hint"
    hidden
    data-testid="fact-swipe-hint"
    data-bascik-prop-hint
  ></p>
  <div
    id="stack"
    class="stack"
    data-testid="fact-swipe-stack"
    data-bascik-attr-data-radios="radios"
  >
    <span data-bascik-slot></span>
    <span
      id="verdict"
      class="verdict"
      aria-hidden="true"
      data-testid="fact-swipe-verdict"
    ></span>
  </div>
  <p
    id="progress"
    class="progress"
    role="status"
    aria-live="polite"
    hidden
    data-testid="fact-swipe-progress"
  ></p>
  <div id="controls" class="controls off">
    <button
      id="no"
      type="button"
      class="choice choice-no"
      data-testid="fact-swipe-wrong"
    >
      Wrong
    </button>
    <button
      id="undo"
      type="button"
      class="choice choice-undo"
      data-testid="fact-swipe-undo"
    >
      Undo
    </button>
    <button
      id="yes"
      type="button"
      class="choice choice-yes"
      data-testid="fact-swipe-correct"
    >
      Correct
    </button>
  </div>
  <button id="done" class="done" data-testid="fact-swipe-done">
    Record answers
  </button>
  <script type="text/typescript">
    const stack = document.getElementById("stack")!;
    const controls = document.getElementById("controls")!;
    const progress = document.getElementById("progress")!;
    const done = document.getElementById("done")!;
    const yesBtn = document.getElementById("yes")!;
    const noBtn = document.getElementById("no")!;
    const undoBtn = document.getElementById("undo")!;
    const hint = document.getElementById("hint")!;
    const verdict = document.getElementById("verdict")!;
    const form = stack.closest("form")!;

    // bascik-ignore js-attribute-selector the fact cards are another component's roots, found by their test id
    const cards = [...stack.querySelectorAll('[data-testid="fact-card"]')] as HTMLElement[];
    if (cards.length === 0 || cards.length > 50) {
      // Leave the plain form
    } else {
      stack.classList.add("live");
      controls.classList.remove("off");
      progress.hidden = false;
      done.hidden = true;

      // The line under the question names the gesture with the deck's own labels, unless the deck brought its own.
      const yesLabel = yesBtn.textContent!.trim();
      const noLabel = noBtn.textContent!.trim();
      if (!hint.textContent!.trim()) {
        hint.textContent = `Swipe or drag right for ${yesLabel}, left for ${noLabel}. The arrow keys work from the buttons.`;
      }
      hint.hidden = false;

      // The radios are the form without scripts. Here the buttons answer, so the radios show only when the deck asks for them, and then they carry the buttons' labels.
      const showRadios = stack.dataset.radios === "show";
      for (const card of cards) {
        if (!showRadios) {
          card.dataset.answers = "hidden";
          continue;
        }
        for (const label of [...card.getElementsByTagName("label")]) {
          const radio = label.getElementsByTagName("input")[0];
          const text = label.getElementsByTagName("span")[0];
          if (radio && text) text.textContent = radio.value === "right" ? yesLabel : noLabel;
        }
      }

      // How far a card must travel before letting go answers it.
      const reach = (card: HTMLElement): number => Math.max(80, card.offsetWidth * 0.3);
      let nudge: Animation | undefined;

      let answered: HTMLElement[] = [];
      const answeredSet = new Set<HTMLElement>();
      let submitted = false;
      const leaving = new Set<HTMLElement>();

      const remaining = (): HTMLElement[] => {
        return cards.filter(c => !answeredSet.has(c));
      };

      const setShown = (card: HTMLElement, shown: boolean): void => { card.hidden = !shown; card.style.display = shown ? "" : "none"; };

      const getTop = (): HTMLElement | undefined => {
        return remaining()[0];
      };

      const layout = (): void => {
        const rem = remaining();
        cards.forEach(card => {
          card.style.gridArea = "1 / 1";
        });
        rem.forEach((card, i) => {
          if (i === 0) {
            setShown(card, true);
            card.style.transform = "";
            card.inert = false;
            card.removeAttribute("aria-hidden");
            card.style.zIndex = "10";
            card.style.userSelect = "none";
            card.style.cursor = "grab";
          } else if (i <= 2) {
            setShown(card, true);
            card.style.transform = `translateY(${i * 10}px) scale(${1 - i * 0.04})`;
            card.style.zIndex = String(10 - i);
            card.inert = true;
            card.setAttribute("aria-hidden", "true");
            card.style.userSelect = "";
            card.style.cursor = "";
          } else {
            setShown(card, false);
            card.style.userSelect = "";
          }
        });
        cards.forEach(card => {
          if (answeredSet.has(card)) {
            if (!leaving.has(card)) {
              setShown(card, false);
            }
          }
        });
        if (remaining().length === 0) {
          progress.textContent = "All answered";
        } else {
          const title = rem[0].querySelector("legend")?.textContent ?? "";
          progress.textContent = `${answered.length} of ${cards.length} answered. Next: ${title}`;
        }
      };

      const answer = (card: HTMLElement, value: "right" | "wrong"): void => {
        const hadFocus = card.contains(document.activeElement);
        const radios = card.getElementsByTagName("input");
        for (const radio of [...radios]) {
          if ((radio as HTMLInputElement).value === value) {
            (radio as HTMLInputElement).checked = true;
            break;
          }
        }
        answered.push(card);
        answeredSet.add(card);
        nudge?.cancel();
        verdict.style.opacity = "0";

        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

        if (!reducedMotion) {
          leaving.add(card);
          card.style.transition = "transform 0.25s ease-out, opacity 0.25s";
          card.style.transform = `translateX(${value === "right" ? 120 : -120}%) rotate(${value === "right" ? 18 : -18}deg)`;
          card.style.opacity = "0";

          setTimeout(() => {
            leaving.delete(card);
            card.style.transition = "";
            card.style.opacity = "";
            card.style.transform = "";
            layout();
          }, 250);
        } else {
          card.style.transition = "";
          card.style.opacity = "";
          card.style.transform = "";
        }

        layout();

        if (hadFocus) {
          const next = getTop();
          // With the radios hidden nothing in the next card takes focus, so a button does.
          const target = showRadios && next ? next.getElementsByTagName("input")[0] : yesBtn;
          (target as HTMLElement | undefined)?.focus();
        }

        if (remaining().length === 0 && !submitted) {
          submitted = true;
          form.requestSubmit();
        }
      };

      yesBtn.addEventListener("click", () => {
        const top = getTop();
        if (top) answer(top, "right");
      });

      noBtn.addEventListener("click", () => {
        const top = getTop();
        if (top) answer(top, "wrong");
      });

      undoBtn.addEventListener("click", () => {
        if (answered.length === 0) return;
        const last = answered.pop()!;
        answeredSet.delete(last);
        leaving.delete(last);
        const radios = last.getElementsByTagName("input");
        for (const radio of [...radios]) {
          (radio as HTMLInputElement).checked = false;
        }
        last.style.transform = "";
        last.style.opacity = "";
        last.style.transition = "";
        submitted = false;
        layout();
      });

      form.addEventListener("keydown", (event) => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        const top = getTop();
        if (!top) return;
        if (event.key === "ArrowRight") {
          event.preventDefault();
          answer(top, "right");
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          answer(top, "wrong");
        }
      });

      stack.addEventListener("change", (event) => {
        const target = event.target as HTMLElement;
        if (target.tagName === "INPUT" && (target as HTMLInputElement).type === "radio") {
          const card = cards.find((c) => c.contains(target));
          if (card && !answeredSet.has(card)) {
            answer(card, (target as HTMLInputElement).value as "right" | "wrong");
          }
        }
      });

      let dragging = false;
      let justDragged = false;
      let startX = 0;
      let dragCard: HTMLElement | null = null;
      let dx = 0;

      stack.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        const top = getTop();
        if (!top) return;
        if (!top.contains(event.target as Node)) return;

        nudge?.cancel();
        startX = event.clientX;
        dragCard = top;
        dragging = false;
        justDragged = false;
        dx = 0;
      });

      stack.addEventListener("pointermove", (event) => {
        if (!dragCard) return;
        // A press let go outside the stack never sent its pointerup here.
        if (!(event.buttons & 1)) {
          endDrag(event);
          return;
        }
        dx = event.clientX - startX;

        if (!dragging && Math.abs(dx) > 6) {
          dragging = true;
          dragCard.setPointerCapture(event.pointerId);
          dragCard.style.transition = "";
          dragCard.style.cursor = "grabbing";
        }

        if (dragging) {
          dragCard.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
          // The label rides on the card, names the answer this direction gives, and is solid once letting go would give it.
          verdict.textContent = dx > 0 ? yesLabel : noLabel;
          verdict.style.transform = `translateX(${dx}px)`;
          verdict.style.opacity = String(Math.min(1, Math.abs(dx) / reach(dragCard)));
        }
      });

      const endDrag = (event: PointerEvent) => {
        if (!dragCard) return;
        if (dragging) {
          justDragged = true;
          setTimeout(() => { justDragged = false; }, 0);
          verdict.style.opacity = "0";
          dragCard.style.cursor = "grab";
          if (Math.abs(dx) > reach(dragCard)) {
            answer(dragCard, dx > 0 ? "right" : "wrong");
          } else {
            const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (!reducedMotion) {
              dragCard.style.transition = "transform 0.2s ease-out";
              dragCard.style.transform = "";
              setTimeout(() => {
                if (dragCard) dragCard.style.transition = "";
              }, 200);
            } else {
              dragCard.style.transform = "";
            }
          }
        }
        dragging = false;
        dragCard = null;
      };

      stack.addEventListener("pointerup", endDrag);
      stack.addEventListener("pointercancel", endDrag);

      stack.addEventListener("click", (event) => {
        if (justDragged) {
          event.preventDefault();
          justDragged = false;
        }
      });

      // The first deck a reader sees on a page moves its top card aside once, to show that it can be dragged.
      const page = document.documentElement;
      if (!page.dataset.swipeNudged && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const watcher = new IntersectionObserver((entries) => {
          if (!entries.some((entry) => entry.isIntersecting)) return;
          watcher.disconnect();
          const top = getTop();
          if (!top || page.dataset.swipeNudged || answered.length > 0 || dragCard) return;
          page.dataset.swipeNudged = "1";
          nudge = top.animate(
            [
              { transform: "none", easing: "ease-out" },
              { transform: "translateX(14px) rotate(0.7deg)", easing: "ease-in-out" },
              { transform: "none" },
            ],
            { duration: 450 },
          );
        }, { threshold: 0.6 });
        watcher.observe(stack);
      }

      layout();
    }
  </script>
</form>
