<!-- @bascik
The turns of the conversation, for the default slot of `chat-thread`: the turns so far (or the welcome), the marker that ends them, then the reply being written. Its two stream scripts read the app from the request, so one component serves every app. It has no element of its own: what it prints are the thread's children.
-->
<!-- 1. The conversation so far, or the welcome when there is none. Stored
     replies are the model's own text, rendered through the same catalog as
     a live reply. -->
<script data-bascik-stream type="text/typescript">
  import { html, raw } from "@bascik/bascik/html";
  import { filesOf, partsOf, renderMessage, shownOf } from "@bascik/ai";
  import { formatSize, isImageType } from "@bascik/ai/files";
  import { appFor, chatFor } from "@/lib/chat.ts";

  /** How many messages a page load renders unless the visitor asks for all. */
  const RECENT = 40;

  export default async function* (request: Request) {
    // The conversation as stored. While a reply is being written it is the
    // conversation as it was when that reply started, so the reply is only
    // ever shown once, by the script below.
    const app = appFor(request);
    const chat = chatFor(app);
    const { messages: stored } = await chat.thread(request);
    const conversation = { messages: stored };
    if (stored.length === 0) {
      yield html`<chat-welcome
        data-bascik-prop-heading="${app.heading}"
        data-bascik-prop-tagline="${app.tagline}"
      >
        ${app.suggestions.map(
          (suggestion) =>
            html`<ask-button data-bascik-prop-say="${suggestion.say}"
              >${suggestion.label}</ask-button
            >`,
        )}
      </chat-welcome>`;
      return;
    }
    const catalog = await chat.catalog();
    const all = new URL(request.url).searchParams.has("all");
    const messages = all
      ? conversation.messages
      : conversation.messages.slice(-RECENT);
    const earlier = conversation.messages.length - messages.length;
    if (earlier > 0) {
      yield html`<a
          class="earlier"
          href="?all"
          data-chat-part="earlier"
          data-testid="chat-earlier"
        >Show ${earlier} earlier messages</a
      >`;
    }
    const options = chat.renderOptions;
    const carriedOn = conversation.messages.at(-1)?.awaiting === "model";
    // One message per yield: each is sent as soon as it is rendered, and
    // each gets its own share of Bascik's per-output component budget.
    for (const message of messages) {
      if (message.role === "user") {
        // Attached files come first, as links to the file route. A name
        // is text: the html tag escapes it.
        const files = filesOf(message);
        if (files.length) {
          yield html`<ul
            class="turn-files"
            data-chat-part="files"
            data-testid="turn-files"
          >
            ${files.map(
              (file) =>
                isImageType(file.mediaType)
                  ? html`<li>
                      <chat-attachment
                        data-bascik-prop-href="/api/file?id=${file.id}"
                        data-bascik-prop-thumb="/api/file?id=${file.id}"
                        data-bascik-prop-name="${file.name}"
                        data-bascik-prop-size="${formatSize(file.size)}"
                      ></chat-attachment>
                    </li>`
                  : html`<li>
                      <chat-attachment
                        data-bascik-prop-href="/api/file?id=${file.id}"
                        data-bascik-prop-name="${file.name}"
                        data-bascik-prop-size="${formatSize(file.size)}"
                      ></chat-attachment>
                    </li>`,
            )}
          </ul>`;
        }
        // What the reader sees of their turn: a pressed form shows its label.
        const shown = shownOf(message);
        if (shown) {
          yield html`<p
            class="turn-user"
            data-chat-part="turn"
            data-role="user"
            data-testid="turn-user"
          >${shown}</p>`;
        }
        continue;
      }
      // A call the reader just allowed is about to run in the live reply
      // below, so it is drawn there.
      const shown =
        carriedOn && message === messages.at(-1)
          ? {
              ...message,
              parts: partsOf(message).filter(
                (part) => part.type !== "tool" || part.state !== "approved",
              ),
            }
          : message;
      yield html`<div
        class="turn-assistant"
        data-chat-part="turn"
        data-role="assistant"
        data-testid="turn-assistant"
      >${raw(
        renderMessage(shown, catalog, options),
      )}</div>`;
    }
  }
</script>

<!-- The stored conversation ends here. Each page's <link rel="expect">
     names this element, so the browser's first paint already has the whole
     conversation and nothing moves as the page loads. -->
<span
  id="thread-ready"
  class="thread-ready"
  data-chat-part="ready"
  data-bascik-preserve="id"
  data-testid="chat-thread-ready"
></span>

<!-- 2. The reply being written, when there is one: the model's text, and
     each tool call as its state changes. The turn itself runs in
     the chat (createChat in @bascik/ai/app), apart from any request, so
     this only reads it. -->
<div
  class="turn-assistant live"
  data-chat-part="turn"
  data-role="assistant"
  data-live
  data-testid="turn-live"
>
  <script data-bascik-stream type="text/typescript">
    import { appFor, chatFor } from "@/lib/chat.ts";

    export default async function* (request: Request) {
      const { turn } = await chatFor(appFor(request)).thread(request);
      if (!turn) return;
      // The caret shows from here until the .done marker below.
      yield `<span class="writing" data-chat-part="writing" data-testid="turn-writing"></span>`;
      // The reply from its first chunk, however late this page joined it.
      // It goes on being written, and is stored, if this reader leaves.
      yield* turn.html.subscribe();
      yield `<span class="done" data-chat-part="done" data-testid="turn-done"></span>`;
    }
  </script>
</div>
