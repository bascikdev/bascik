<!-- @bascik
The reader's memory for one app, read from the chat on every request, under a link back to that app. Each memory is a memory-item with a Forget button, and the text is escaped by the html helper, so nothing a reader or a model saved is ever drawn as markup.
-->
<style>
  .panel {
    flex: 1;
    min-block-size: 0;
    overflow-y: auto;
  }
  /* The page's column: the list fills whatever width it is given. */
  .column {
    display: grid;
    gap: 1.5rem;
    max-inline-size: 46rem;
    margin-inline: auto;
    padding-block: 1rem 1.5rem;
  }
  .top {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 1rem;
    align-items: baseline;
    justify-content: space-between;
    font-size: 0.875rem;
  }
  .back {
    display: inline-flex;
    align-items: center;
    min-block-size: 2.75rem;
    color: inherit;
    font-weight: 600;
    text-underline-offset: 0.2em;
  }
  .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .scope {
    margin: 0;
    color: var(--muted);
  }
</style>
<div class="panel" data-testid="memory-panel">
  <script data-bascik-stream type="text/typescript">
    import { html } from "@bascik/bascik/html";
    import { appFor, chatFor } from "@/lib/chat.ts";

    export default async function* (request: Request) {
      const app = appFor(request);
      const memories = await chatFor(app).memories(request);
      yield html`<div class="column">
        <nav class="top" aria-label="Memory">
          <a class="back" href="${app.path}" data-testid="memory-back"
            >Back to ${app.name}</a
          >
          <p class="scope" data-testid="memory-scope">
            Memory for ${app.name}
          </p>
        </nav>
        <memory-list
        >${memories.map(
          (memory) =>
            html`<memory-item
              data-bascik-prop-app="${app.id}"
              data-bascik-prop-memory="${memory.id}"
              data-bascik-prop-saved="${new Date(memory.created)
                .toISOString()
                .slice(0, 10)}"
              data-bascik-prop-back="/memory?app=${app.id}"
              >${memory.text}</memory-item
            >`,
        )}</memory-list
      >
      </div>`;
    }
  </script>
</div>
