<!-- @bascik
The memory page's column: a link back to the app the request is for, over the package's `chat-memories`, which reads that app's memories from the chat on every request and prints each as a memory-item with a Forget button.
-->
<style>
  .panel {
    flex: 1;
    min-block-size: 0;
    overflow-y: auto;
  }
  /* The page's column: the list fills whatever width it is given. */
  .column {
    display: grid;
    gap: 1.5rem;
    max-inline-size: 46rem;
    margin-inline: auto;
    padding-block: 1rem 1.5rem;
  }
  .top {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 1rem;
    align-items: baseline;
    justify-content: space-between;
    font-size: 0.875rem;
  }
  .back {
    display: inline-flex;
    align-items: center;
    min-block-size: 2.75rem;
    color: inherit;
    font-weight: 600;
    text-underline-offset: 0.2em;
  }
  .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .scope {
    margin: 0;
    color: var(--muted);
  }
</style>
<div class="panel" data-testid="memory-panel">
  <div class="column">
    <script data-bascik-server type="text/typescript">
      import { html } from "@bascik/bascik/html";
      import { appFor } from "@/lib/chat.ts";

      export default (request: Request) => {
        const app = appFor(request);
        return html`<nav class="top" aria-label="Memory">
          <a class="back" href="${app.path}" data-testid="memory-back"
            >Back to ${app.name}</a
          >
          <p class="scope" data-testid="memory-scope">
            Memory for ${app.name}
          </p>
        </nav>`;
      };
    </script>
    <chat-memories />
  </div>
</div>
