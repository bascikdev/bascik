<!-- @bascik
The demo's sidebar: the package's `chat-sidebar`, with the demo's own links around the package's data parts. Its server script reads only which app the request is for: the app links, New chat for that app, and the links to that app's memory and to the gallery. The search, the conversations and the models are the data parts `chat-find`, `chat-conversations` and `chat-models`. It has no element of its own.
-->
<style>
  .apps {
    display: grid;
    gap: 0.15rem;
    padding-block-end: 1rem;
    border-block-end: 1px solid var(--border);
  }
  .apps a {
    padding: 0.45rem 0.6rem;
    border-radius: calc(var(--radius) - 2px);
    color: inherit;
    font-weight: 600;
    text-decoration: none;
  }
  /* On the memory page the app it belongs to stays marked. */
  .apps a:hover,
  .apps a[aria-current="page"],
  .apps a[aria-current="true"] {
    background: var(--bg);
  }
  .settings a {
    display: block;
    padding: 0.45rem 0.6rem;
    border-radius: calc(var(--radius) - 2px);
    color: inherit;
    font-size: 0.875rem;
    text-decoration: none;
  }
  .settings a:hover,
  .settings a[aria-current="page"] {
    background: var(--bg);
  }
  .about {
    margin: 0;
    padding-inline: 0.6rem;
    color: var(--muted);
    font-size: 0.75rem;
    line-height: 1.4;
  }
  .about a {
    color: inherit;
  }
  .apps a:focus-visible,
  .settings a:focus-visible,
  .about a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  /* A finger gets a 44px target. */
  @media (pointer: coarse) {
    .apps a,
    .settings a {
      display: flex;
      align-items: center;
      min-block-size: 2.75rem;
    }
    .about a {
      display: inline-block;
      padding-block: 0.75rem;
    }
  }
</style>
<script data-bascik-server type="text/typescript">
  import { html } from "@bascik/bascik/html";
  import { APPS } from "@/lib/apps.ts";
  import { appFor } from "@/lib/chat.ts";

  export default (request: Request) => {
    const app = appFor(request);
    const url = new URL(request.url);
    const onMemory = url.pathname === "/memory";
    const content = html`<nav class="apps" aria-label="Apps">
        ${APPS.map(
          (entry) =>
            html`<a
              href="${entry.path}"
              data-testid="chat-sidebar-app"
              aria-current="${entry.id !== app.id
                ? "false"
                : onMemory
                  ? "true"
                  : "page"}"
              >${entry.name}</a
            >`,
        )}
      </nav>
      <chat-new data-bascik-prop-app="${app.id}" />
      <chat-find />
      <chat-conversations />
      <template data-bascik-slot="foot">
        <chat-models />
        <nav class="settings" aria-label="Your data">
          <a
            href="/memory?app=${app.id}"
            data-testid="chat-sidebar-memory"
            aria-current="${onMemory ? "page" : "false"}"
            >Memory</a
          >
        </nav>
        <p class="about" data-testid="chat-sidebar-about">
          A demo of @bascik/ai.
          <a href="/gallery?app=${app.id}" data-testid="chat-sidebar-gallery"
            >Component gallery</a
          >
        </p>
      </template>`;
    // A search loads a page: on a narrow screen its results are in view.
    return url.searchParams.has("q")
      ? html`<chat-sidebar data-bascik-prop-open="open"
          >${content}</chat-sidebar
        >`
      : html`<chat-sidebar>${content}</chat-sidebar>`;
  };
</script>
