<!-- @bascik
The demo's sidebar: its server script reads the apps, the reader's conversations, the search and the models on every request, and prints them as the package's sidebar parts inside `chat-sidebar`. The app links, the Memory link and the line about the gallery are the demo's own markup. It has no element of its own.
-->
<style>
  .apps {
    display: grid;
    gap: 0.15rem;
    padding-block-end: 1rem;
    border-block-end: 1px solid var(--border);
  }
  .apps a {
    padding: 0.45rem 0.6rem;
    border-radius: calc(var(--radius) - 2px);
    color: inherit;
    font-weight: 600;
    text-decoration: none;
  }
  /* On the memory page the app it belongs to stays marked. */
  .apps a:hover,
  .apps a[aria-current="page"],
  .apps a[aria-current="true"] {
    background: var(--bg);
  }
  .settings a {
    display: block;
    padding: 0.45rem 0.6rem;
    border-radius: calc(var(--radius) - 2px);
    color: inherit;
    font-size: 0.875rem;
    text-decoration: none;
  }
  .settings a:hover,
  .settings a[aria-current="page"] {
    background: var(--bg);
  }
  .about {
    margin: 0;
    padding-inline: 0.6rem;
    color: var(--muted);
    font-size: 0.75rem;
    line-height: 1.4;
  }
  .about a {
    color: inherit;
  }
  .apps a:focus-visible,
  .settings a:focus-visible,
  .about a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  /* A finger gets a 44px target. */
  @media (pointer: coarse) {
    .apps a,
    .settings a {
      display: flex;
      align-items: center;
      min-block-size: 2.75rem;
    }
    .about a {
      display: inline-block;
      padding-block: 0.75rem;
    }
  }
  .found {
    display: grid;
    align-content: start;
    gap: 0.4rem;
  }
  .found-note {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    margin: 0;
    color: var(--muted);
    font-size: 0.8125rem;
  }
  .found-note a {
    color: var(--accent);
  }
  .matches {
    display: grid;
    align-content: start;
    gap: 0.15rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }
</style>
<script data-bascik-server type="text/typescript">
  import { html } from "@bascik/bascik/html";
  import type { SearchMatch } from "@bascik/ai/app";
  import { APPS } from "@/lib/apps.ts";
  import { appFor, chatFor } from "@/lib/chat.ts";
  import { listModels, pickModel, requestedModel } from "@/lib/models.ts";

  /**
   * A snippet with its matched words in mark. The snippet is something a
   * reader or a model said: it is only ever text here, and html escapes it.
   */
  const marked = (match: SearchMatch) => {
    const pieces = [];
    let at = 0;
    for (const [from, to] of match.marks) {
      pieces.push(match.snippet.slice(at, from));
      pieces.push(html`<mark>${match.snippet.slice(from, to)}</mark>`);
      at = to;
    }
    pieces.push(match.snippet.slice(at));
    return pieces;
  };

  export default async (request: Request) => {
    const app = appFor(request);
    const chat = chatFor(app);
    const session = chat.session(request);
    const current = session.conversationId;
    const conversations = await chat.list(session);
    const found = await chat.search(request);
    const searching = new URL(request.url).searchParams.has("q");
    const models = await listModels();
    const chosen = pickModel(models, requestedModel(request));
    const groups = [...new Set(models.map((model) => model.group))];
    const onMemory = new URL(request.url).pathname === "/memory";
    const content = html`<nav class="apps" aria-label="Apps">
        ${APPS.map(
          (entry) =>
            html`<a
              href="${entry.path}"
              data-testid="chat-sidebar-app"
              aria-current="${entry.id !== app.id
                ? "false"
                : onMemory
                  ? "true"
                  : "page"}"
              >${entry.name}</a
            >`,
        )}
      </nav>
      <chat-new data-bascik-prop-app="${app.id}" />
      <chat-search
        data-bascik-prop-route="${app.path}"
        data-bascik-prop-query="${found.query}"
      />
      ${searching
        ? html`<section class="found" aria-label="Search results">
            <p class="found-note" data-testid="chat-sidebar-search-note">
              ${found.tooShort
                ? "Type at least 2 characters."
                : found.matches.length === 0
                  ? html`<span data-testid="chat-sidebar-search-empty"
                      >No conversation mentions “${found.query}”.</span
                    >`
                  : `${found.matches.length} found`}
              <a href="${app.path}" data-testid="chat-sidebar-search-clear"
                >Clear</a
              >
            </p>
            <ol class="matches" data-testid="chat-sidebar-search-results">
              ${found.matches.map(
                (match) =>
                  html`<search-result
                    data-bascik-prop-app="${app.id}"
                    data-bascik-prop-conversation="${match.id}"
                    data-bascik-prop-title="${match.title}"
                    >${marked(match)}</search-result
                  >`,
              )}
            </ol>
          </section>`
        : html`<conversation-list>
            ${conversations
              .filter((conversation) => conversation.messages.length > 0)
              .map(
                (conversation) =>
                  html`<conversation-item
                    data-bascik-prop-app="${app.id}"
                    data-bascik-prop-conversation="${conversation.id}"
                    data-bascik-prop-title="${conversation.title}"
                    data-bascik-prop-current="${conversation.id === current
                      ? "true"
                      : "false"}"
                  />`,
              )}
          </conversation-list>`}
      <template data-bascik-slot="foot">
        <model-picker
          data-bascik-prop-app="${app.id}"
          data-bascik-prop-label="Model for typed chat"
        >
          ${groups.map(
            (group) =>
              html`<optgroup label="${group}">
                ${models
                  .filter((model) => model.group === group)
                  .map((model) =>
                    model.id === chosen.id
                      ? html`<option value="${model.id}" selected>
                          ${model.name}
                        </option>`
                      : html`<option value="${model.id}">
                          ${model.name}
                        </option>`,
                  )}
              </optgroup>`,
          )}
          <template data-bascik-slot="note">
            <p data-testid="chat-sidebar-voice-note">
              A voice call uses the speech model this server started with, not
              this one.
            </p>
            ${models.length === 1
              ? html`<p data-testid="chat-sidebar-model-note">
                  No model is set up, so typed replies come from a fixed
                  script. Set ANTHROPIC_API_KEY, or run Ollama or LM Studio,
                  and restart.
                </p>`
              : ""}
          </template>
        </model-picker>
        <nav class="settings" aria-label="Your data">
          <a
            href="/memory?app=${app.id}"
            data-testid="chat-sidebar-memory"
            aria-current="${onMemory ? "page" : "false"}"
            >Memory</a
          >
        </nav>
        <p class="about" data-testid="chat-sidebar-about">
          A demo of @bascik/ai.
          <a href="/gallery?app=${app.id}" data-testid="chat-sidebar-gallery"
            >Component gallery</a
          >
        </p>
      </template>`;
    // A search loads a page: on a narrow screen its results are in view.
    return searching
      ? html`<chat-sidebar data-bascik-prop-open="open"
          >${content}</chat-sidebar
        >`
      : html`<chat-sidebar>${content}</chat-sidebar>`;
  };
</script>
