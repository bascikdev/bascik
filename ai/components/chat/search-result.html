<!-- @bascik
One match in a list of search results: the conversation's title, and what was found in it. A plain form that posts the conversation's id, the way a conversation list does, so it works with no JavaScript. Written by the app from stored text, never by a model.

Props: `conversation` (the conversation's id, posted as `id`), `title` (its title; "Conversation" without it), `app` (posted as `app`) and `route` (where the form posts; `/api/open` without it). Setting `route` prints one build line, "Attribute binding conflict … prop wins": that is the prop replacing the default, as meant.

Slot: the default slot is what was found, with the matched words in `mark`.

Around it: an `ol` or a `ul`; its root is a list item. It reads the theme tokens `--radius`, `--bg`, `--muted`, `--accent` and `--on-accent`.
-->
<style>
  .result {
    display: block;
  }
  .result form {
    display: contents;
  }
  .open {
    display: grid;
    gap: 0.15rem;
    inline-size: 100%;
    padding: 0.45rem 0.6rem;
    border: 0;
    border-radius: calc(var(--radius) - 2px);
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 0.875rem;
    text-align: start;
    cursor: pointer;
  }
  .open:hover,
  .open:focus-visible {
    background: var(--bg);
  }
  .title {
    overflow: hidden;
    font-weight: 600;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .snippet {
    color: var(--muted);
    font-size: 0.8125rem;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  .snippet mark {
    padding: 0 0.1em;
    border-radius: 2px;
    background: var(--accent);
    color: var(--on-accent);
  }
</style>
<li class="result" data-testid="search-result">
  <form method="post" action="/api/open" data-bascik-attr-action="route">
    <input type="hidden" name="app" data-bascik-attr-value="app" />
    <input type="hidden" name="id" data-bascik-attr-value="conversation" />
    <button class="open" data-testid="search-result-open">
      <span
        class="title"
        data-testid="search-result-title"
        data-bascik-prop-title
        >Conversation</span
      >
      <span class="snippet" data-testid="search-result-snippet"
        ><span data-bascik-slot></span
      ></span>
    </button>
  </form>
</li>
