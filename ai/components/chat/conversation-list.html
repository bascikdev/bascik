<!-- @bascik
The reader's conversations: a `nav` that lists them. It holds no data: put one `conversation-item` inside per conversation, or use `chat-conversations`, the data part that prints this list from the project's chat.

Prop: `label` (the list's name for a screen reader; "Conversations"). Setting it prints one build line, "Attribute binding conflict … prop wins": that is the prop replacing the default, as meant.

Slot: the default slot is the items.

Around it: anything; it fills the width it is given, and `chat-sidebar` is where it usually goes. Beside a `search-results` part (a sibling marked `data-chat-part="found"`, before or after it) the list is not shown: the results stand where it was.
-->
<style>
  .list {
    display: grid;
    align-content: start;
    gap: 0.15rem;
  }
  /* Beside what a search found, the results stand where the list was. */
  .list:is([data-chat-part="found"] ~ *, :has(~ [data-chat-part="found"])) {
    display: none;
  }
</style>
<nav
  class="list"
  aria-label="Conversations"
  data-bascik-attr-aria-label="label"
  data-testid="conversation-list"
  data-bascik-slot
></nav>
