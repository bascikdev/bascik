<!-- @bascik
Asks the reader to allow or refuse a tool call before it runs. Written by the app for a tool part that is waiting for approval, never by a model. A plain form: each of its two buttons posts the answer as `verdict` (`approve` or `deny`), so it works with no JavaScript.

Props: `action` (what the tool would do, as the card's title; "Run a tool" without it), `call` (the tool call's id, posted as `call`), `app` (posted as `app`) and `route` (where the answer posts; `/api/approve` without it). Setting `route` prints one build line, "Attribute binding conflict … prop wins": that is the prop replacing the default, as meant.

Slot: the default slot is the details of the call, as `dt` and `dd` pairs.

Around it: a reply in the thread. Inside a `data-chat` element the client runtime sends the form and streams the answer in; during a voice call `voice-call` answers it on the call, with no request to this route. It reads the theme tokens `--accent`, `--on-accent`, `--radius`, `--surface`, `--muted`, `--border` and `--bg`, and `--text-small` when it is set.
-->
<style>
  .card {
    display: grid;
    gap: 0.5rem;
    margin: 0;
    padding: 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .eyebrow {
    margin: 0;
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .action {
    margin: 0;
    font-size: 1.05rem;
  }
  .details {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.15rem 0.75rem;
    margin: 0;
    font-size: var(--text-small, 0.875rem);
  }
  .details dt {
    color: var(--muted);
  }
  .details dd {
    margin: 0;
  }
  .buttons {
    display: flex;
    gap: 0.5rem;
    margin-block-start: 0.25rem;
  }
  .buttons button {
    padding: 0.45rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg);
    color: inherit;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .buttons .allow {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--on-accent);
  }
</style>
<form
  class="card"
  method="post"
  action="/api/approve"
  data-bascik-attr-action="route"
  data-testid="tool-approval"
>
  <input type="hidden" name="app" data-bascik-attr-value="app" />
  <input type="hidden" name="call" data-bascik-attr-value="call" />
  <p class="eyebrow">Needs your OK</p>
  <h3 class="action" data-testid="tool-approval-action" data-bascik-prop-action>
    Run a tool
  </h3>
  <dl class="details"><span data-bascik-slot></span></dl>
  <p class="buttons">
    <button
      class="allow"
      name="verdict"
      value="approve"
      data-testid="tool-approval-allow"
    >
      Allow
    </button>
    <button name="verdict" value="deny" data-testid="tool-approval-deny">
      Don't allow
    </button>
  </p>
</form>
