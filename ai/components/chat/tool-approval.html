<!-- @bascik
Asks the reader to allow or refuse a tool call before it runs. Written by the app for a tool part that is waiting for approval, never by a model. A plain form: the two buttons post the answer to /api/approve.
-->
<style>
  .card {
    display: grid;
    gap: 0.5rem;
    margin: 0;
    padding: 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .eyebrow {
    margin: 0;
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .action {
    margin: 0;
    font-size: 1.05rem;
  }
  .details {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.15rem 0.75rem;
    margin: 0;
    font-size: var(--text-small, 0.875rem);
  }
  .details dt {
    color: var(--muted);
  }
  .details dd {
    margin: 0;
  }
  .buttons {
    display: flex;
    gap: 0.5rem;
    margin-block-start: 0.25rem;
  }
  .buttons button {
    padding: 0.45rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg);
    color: inherit;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .buttons .allow {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--on-accent);
  }
</style>
<form
  class="card"
  method="post"
  action="/api/approve"
  data-testid="tool-approval"
>
  <input type="hidden" name="app" data-bascik-attr-value="app" />
  <input type="hidden" name="call" data-bascik-attr-value="call" />
  <p class="eyebrow">Needs your OK</p>
  <h3 class="action" data-testid="tool-approval-action" data-bascik-prop-action>
    Run a tool
  </h3>
  <dl class="details"><span data-bascik-slot></span></dl>
  <p class="buttons">
    <button
      class="allow"
      name="verdict"
      value="approve"
      data-testid="tool-approval-allow"
    >
      Allow
    </button>
    <button name="verdict" value="deny" data-testid="tool-approval-deny">
      Don't allow
    </button>
  </p>
</form>
