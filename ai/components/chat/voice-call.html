<!-- @bascik
A spoken conversation with a speech-to-speech model: the reader talks, the model answers aloud, and what it shows arrives in the thread as components. Captions follow the voice a few words at a time, with the current word in bold, and the same word is marked in the answer in the thread. The reader can mute the microphone and stay in the call. A call nobody speaks on asks whether anyone is there, and then ends: `idle-seconds` (default 120, 0 for never) and `idle-warning-seconds` (default 30) set how long each takes. It speaks two providers' protocols, named by the ticket: gemini-live and azure-voice-live. Optional and all script. It needs three routes of yours: /api/voice-session for a ticket, /api/voice-tool to run the model's tool calls, and /api/voice-turn to store what was said, and a /voice-view page that renders what a call shows. The app prop is sent to them. Put it inside the composer (`<chat-composer><voice-call /></chat-composer>`): its button joins the composer's row, and its caption and status are a line above the message box. It also works on its own, next to the composer.

Around it: it finds the `thread` (where it adds the reader's turn and the spoken reply, and whose forms it answers during a call), the `composer` and its `input` (a message typed during a call is said to the model) from the nearest `data-chat` element, by `data-chat-part`; on a page with no `data-chat` element, by their test hooks. The /voice-view page marks what it shows with `data-chat-part="view"`.

State and events: while a call is on, `data-genui-call="on"` is set on the `data-chat` element and on `<html>`; `chat:call-start` and `chat:call-end` bubble from the `data-chat` element.
-->

<div

>

  </div>
  <button
    id="toggle"
    class="toggle"
    type="button"
    aria-pressed="false"
    title="Voice call"
    data-testid="voice-call-toggle"
  >
    <svg
      class="icon"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <rect x="5.5" y="1.5" width="5" height="8" rx="2.5" />
      <path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2" />
    </svg>
    <span class="live" aria-hidden="true"></span>
    <span
      class="spinner"
      aria-hidden="true"
      data-testid="voice-call-connecting"
    ></span>
    <span id="label" class="label">Voice call</span>
  </button>
  <button
    id="mute"
    class="mute"
    type="button"
    hidden
    aria-pressed="false"
    title="Mute microphone"
    data-testid="voice-call-mute"
  >
    <svg
      class="icon"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <rect x="5.5" y="1.5" width="5" height="8" rx="2.5" />
      <path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2" />
      <path class="slash" d="M2 2l12 12" />
    </svg>
    <span class="mute-label">Mute microphone</span>
  </button>
  <input id="app" type="hidden" data-bascik-attr-value="app" />
  <script type="text/typescript">
    import {
      barTransform,
      CHUNK,
      decodePcm16,
      isPlaying,
      measureSpeech,
      MUTE_TAIL,
      pcmChunker,
      silentChunk,
    } from "./voice-call/audio.ts";
    import { azureVoiceLive } from "./voice-call/azure-voice-live.ts";
    import {
      captionAt,
      captionGroup,
      captionParts,
      newResponse as resetResponse,
      newTimeline,
      scheduleAudio,
      silent,
      spokenRange,
      timedWord as placeWord,
      voicing,
    } from "./voice-call/captions.ts";
    import { callOf, fillForm, isApproval, openForm, sendForm, toldText } from "./voice-call/forms.ts";
    import type { SentForm } from "./voice-call/forms.ts";
    import { geminiLive } from "./voice-call/gemini-live.ts";
    import { aliveDue, idleLimits, idlePhase } from "./voice-call/idle.ts";
    import type { IdleLimits } from "./voice-call/idle.ts";
    import { closeCall, muteMicrophone, openMicrophone } from "./voice-call/microphone.ts";
    import { closePieces, hear, readerText } from "./voice-call/reader.ts";
    import type { ReaderPiece } from "./voice-call/reader.ts";
    import { fetchView, postForm, viewHolder } from "./voice-call/requests.ts";
    import { announce, findPart, newTurn, partIn, setState } from "./chat-root/parts.ts";
    import {
      closeReason,
      LISTENING,
      MUTED,
      NOBODY_SPOKE,
      providerLabel,
      sessionFailure,
      statusText,
      toggleLabel,
    } from "./voice-call/status.ts";
    import { answerTool as routeTool, runTool } from "./voice-call/tools.ts";
    import type { ToolCall } from "./voice-call/tools.ts";
    import type {
      Call,
      StatusPatch,
      Ticket,
      ToolAnswer,
      ToolRequest,
      Voiced,
      WireHooks,
    } from "./voice-call/types.ts";

    const root = document.getElementById("call")!;
    const caption = document.getElementById("caption")!;
    const status = document.getElementById("status")!;
    const toggle = document.getElementById("toggle")!;
    const label = document.getElementById("label")!;
    const provider = document.getElementById("provider")!;
    const meter = document.getElementById("meter")!;
    const bars = [...meter.children] as HTMLElement[];
    const mute = document.getElementById("mute")!;
    const stay = document.getElementById("stay")!;
    /** The button says what pressing it does. */
    const pressed = (on: boolean): void => {
      toggle.setAttribute("aria-pressed", String(on));
      label.textContent = toggleLabel(on);
      toggle.title = toggleLabel(on);
      if (!on) {
        provider.textContent = "";
        toggle.removeAttribute("aria-busy");
      }
    };
    const app = (document.getElementById("app") as HTMLInputElement).value;
    let call: Call | null = null;

    /* ---- The status line: one thing at a time, the most pressing first ---- */

    function refresh(): void {
      if (!call) return;
      status.textContent = statusText(call);
    }
    let thinkingStamp = 0;
    function mark(patch: StatusPatch, current: Call | null = call): void {
      if (!current) return;
      Object.assign(current, patch);
      if (patch.thinking) {
        // A sound that is not speech never gets an answer: do not wait for one for ever.
        const stamp = ++thinkingStamp;
        setTimeout(() => {
          if (stamp === thinkingStamp) mark({ thinking: false }, current);
        }, 20_000);
      }
      if (current === call) refresh();
    }
    /** A job that takes time: the status says so until it is done. */
    async function busy<T>(current: Call | null, job: () => Promise<T>): Promise<T> {
      if (current) {
        current.thinking = false;
        current.working++;
        if (current === call) refresh();
      }
      try {
        return await job();
      } finally {
        if (current) {
          current.working--;
          if (current === call) refresh();
        }
      }
    }

    /** The turn being spoken: its words, its audio, and where it is drawn. */
    const heardPieces: ReaderPiece[] = [];
    /** Utterances of turns that are over or were replaced: words of theirs that come late are no turn's. */
    const closedPieces = new Set<string>();
    let reader = "";
    let said = "";
    let readerBubble: HTMLElement | null = null;
    let reply: HTMLElement | null = null;
    let saidText: Text | null = null;
    /** What the caption follows, apart from the turn (see captions.ts). */
    const timeline = newTimeline();

    const post = (
      path: string,
      fields: Record<string, string>,
      signal?: AbortSignal,
      keepalive = false,
    ): Promise<Response> => postForm(app, path, fields, signal, fetch, keepalive);

    /* ---- The thread: what was said and shown, as it happens ---- */

    // Looked up each time: the client runtime replaces the thread with every answer.
    const thread = (): HTMLElement | null => findPart(root, "thread");

    function showReader(): void {
      if (!readerBubble) {
        readerBubble = newTurn("user", "turn-user");
        // What the reader said can be written down after the answer has begun.
        if (reply) reply.before(readerBubble);
        else thread()?.append(readerBubble);
      }
      readerBubble.textContent = reader.trim();
    }

    /** The reader's turn is `text`, typed or pressed: whatever was heard before it is replaced. */
    function wrote(text: string): void {
      closePieces(heardPieces, closedPieces);
      hear(heardPieces, text);
      reader = text;
      showReader();
      touch();
    }

    function showReply(): HTMLElement {
      if (!reply) {
        reply = newTurn("assistant", "turn-voice");
        // What the voice says, as a paragraph: the same as a stored turn's.
        const words = document.createElement("p");
        words.className = "spoken";
        words.dataset.spoken = "";
        words.dataset.testid = "voice-call-said";
        saidText = document.createTextNode("");
        words.append(saidText);
        reply.append(words);
        // An approval card in a spoken reply is answered in the call, not by
        // a page load: the model is waiting on the line for the result.
        reply.addEventListener("submit", (event) => {
          const form = event.target as HTMLFormElement;
          const id = callOf(form);
          const answer = (event.submitter as HTMLButtonElement | null)?.value;
          const decide = id !== undefined && call?.waiting.get(id);
          // While a call is on, an approval card never loads a page: a second
          // press, after the first was taken, would end the call.
          if (call && isApproval(form)) event.preventDefault();
          if (!decide || !answer) return;
          event.preventDefault();
          event.stopPropagation();
          decide(answer);
        });
        thread()?.append(reply);
      }
      return reply;
    }

    /**
     * Put a call's view in the reply. The view is a page the server renders,
     * so its components arrive as finished markup (see requests.ts).
     */
    async function showView(id: string): Promise<void> {
      // Where the view will go, until it comes.
      const target = showReply();
      const placeholder = document.createElement("div");
      placeholder.dataset.view = id;
      placeholder.className = "skeleton";
      placeholder.dataset.testid = "voice-call-loading";
      placeholder.setAttribute("aria-busy", "true");
      const earlier = target.querySelector(`[data-view="${CSS.escape(id)}"]`);
      if (earlier) earlier.replaceWith(placeholder);
      else target.append(placeholder);
      try {
        const view = await fetchView(app, id);
        if (view) placeholder.replaceWith(viewHolder(view, id));
      } finally {
        // A view that did not come leaves nothing behind.
        placeholder.remove();
      }
    }

    /* ---- Tool calls: the model asks here, the server runs them ---- */

    function serverTool(tool: ToolCall): Promise<string> {
      const current = call;
      return runTool(tool, {
        ask: (fields) =>
          busy(current, async () => {
            const answer = (await (await post("/api/voice-tool", fields)).json()) as ToolAnswer;
            // The tool has run. A view that cannot be drawn does not undo
            // that, and the model must not be told the tool failed. A view
            // for a call that has ended has no reply to go in.
            if (answer.view && current === call) await showView(tool.id).catch(() => {});
            return answer;
          }),
        wait: (id) =>
          call
            ? new Promise<string>((resolve) => {
                call!.waiting.set(id, resolve);
                refresh();
              })
            : null,
        done: (id) => call?.waiting.delete(id),
      });
    }

    const answerTool = (tool: ToolRequest): Promise<string> => {
      mark({ thinking: false });
      touch();
      return routeTool(tool, {
        fillForm: (args) =>
          fillForm(
            args,
            openForm(thread()),
            (form, button) => sendForm(form, button, (job) => busy(call, job)),
            answeredForm,
          ),
        runTool: serverTool,
      });
    };

    /* ---- Sound out: the model's voice, and captions that follow it ---- */

    function play(base64: string): void {
      if (!call) return;
      let samples: Float32Array;
      try {
        samples = decodePcm16(base64);
      } catch {
        // A piece that is not audio is left out; the next one is played.
        return;
      }
      if (!samples.length) return;
      wake(call);
      const buffer = call.playback.createBuffer(1, samples.length, 24_000);
      buffer.getChannelData(0).set(samples);
      const source = call.playback.createBufferSource();
      source.buffer = buffer;
      source.connect(call.playback.destination);
      const now = call.playback.currentTime;
      if (call.nextAt < now) call.nextAt = now + 0.05;
      mark({ thinking: false });
      touch();
      scheduleAudio(timeline, call.nextAt, buffer.duration);
      source.start(call.nextAt);
      call.nextAt += buffer.duration;
      call.sources.add(source);
      source.onended = () => call?.sources.delete(source);
    }

    /**
     * A browser can put sound to sleep: a phone call comes in, the tab rests.
     * Nothing plays and nothing is heard until it is woken, so a call wakes
     * its sound whenever it has some to play, and when the page is looked at again.
     */
    function wake(current: Call): void {
      for (const context of [current.playback, current.capture]) {
        if (context && context.state !== "running" && context.state !== "closed") {
          void context.resume().catch(() => {});
        }
      }
    }
    document.addEventListener("visibilitychange", () => {
      if (!call || document.visibilityState !== "visible") return;
      wake(call);
      // A page that slept through its limit ends as soon as it is looked at.
      checkIdle(call);
    });

    /** The reader cut in: stop talking at once. */
    function quiet(): void {
      for (const source of call?.sources ?? []) source.stop();
      call?.sources.clear();
      if (call) call.nextAt = 0;
      timeline.voiced = silent(false);
      resetResponse(timeline);
      clearWord();
    }

    /* ---- The word being said, marked in the answer in the thread ---- */

    /** Where the turn being voiced is written: the text in the thread, and where its words begin in it. */
    let spokenIn: { voiced: Voiced; node: Text; offset: number } | null = null;
    /** The answer that carries the mark, so a test and a style can tell. */
    let spokenHolder: HTMLElement | null = null;
    // A highlight marks text without changing it, so nothing is read out
    // again. A browser without highlights still has the caption.
    // The page has one highlight of this name, whatever number of calls it holds.
    const marks =
      typeof Highlight === "function" && CSS.highlights
        ? (CSS.highlights.get("voice-call-word") ?? new Highlight())
        : null;
    if (marks && !CSS.highlights.has("voice-call-word")) CSS.highlights.set("voice-call-word", marks);
    const wordRange = document.createRange();

    function clearWord(): void {
      marks?.delete(wordRange);
      if (spokenHolder) {
        delete spokenHolder.dataset.spokenWord;
        delete spokenHolder.dataset.spokenAt;
      }
      spokenHolder = null;
    }

    /** Mark the word of `frame` in the thread, or nothing when there is none. */
    function markWord(frame: ReturnType<typeof captionAt>): void {
      if (!marks) return;
      const { node, offset } = spokenIn ?? {};
      const where =
        frame && node?.isConnected && spokenIn!.voiced === timeline.voiced
          ? spokenRange(timeline.voiced, frame)
          : null;
      const start = where ? offset! + where.start : 0;
      const end = where ? Math.min(node!.length, offset! + where.end) : 0;
      const holder = node?.parentElement;
      if (!where || !holder || start >= end) {
        if (spokenHolder) clearWord();
        return;
      }
      if (holder === spokenHolder && holder.dataset.spokenAt === String(start) && wordRange.endOffset === end) return;
      clearWord();
      wordRange.setStart(node!, start);
      wordRange.setEnd(node!, end);
      marks.add(wordRange);
      holder.dataset.spokenWord = node!.data.slice(start, end);
      holder.dataset.spokenAt = String(start);
      spokenHolder = holder;
    }

    /** Draw the word being spoken, a frame at a time, for as long as the call is on. */
    function captions(): void {
      if (!call) return;
      const frame = captionAt(timeline.voiced, call.playback.currentTime);
      markWord(frame);
      if (!frame) {
        caption.replaceChildren();
        delete caption.dataset.key;
      } else {
        const { key } = captionGroup(frame);
        if (caption.dataset.key !== key) {
          caption.dataset.key = key;
          caption.dataset.timing = frame.timed ? "words" : "estimate";
          caption.replaceChildren(
            ...captionParts(frame.words, frame.index).map((part) => {
              if (typeof part === "string") return part;
              const current = document.createElement("strong");
              current.textContent = part.current;
              return current;
            }),
          );
        }
      }
      requestAnimationFrame(captions);
    }

    /* ---- Sound in: the microphone, as the provider wants it ---- */

    /** One block of microphone sound: its level, and whether the reader speaks. */
    function measure(current: Call, rms: number): void {
      measureSpeech(current, rms, performance.now());
      if (!current.wire.byMeter || current !== call) return;
      const hearing = current.speaking && !isPlaying(current);
      if (hearing === current.hearing) return;
      // Speaking again is not waiting for an answer; stopping is, if words were heard.
      const waits = !hearing && reader.trim() !== "" && !said.trim();
      mark(hearing ? { hearing, thinking: false } : { hearing, thinking: waits || current.thinking });
    }

    /** Draw the level, a frame at a time, for as long as the call is on. */
    function drawMeter(current: Call): void {
      if (current !== call || !current.microphone) return;
      const shown = current.level.toFixed(2);
      if (meter.dataset.level !== shown) {
        meter.dataset.level = shown;
        bars.forEach((bar, at) => {
          bar.style.transform = barTransform(current.level, at);
        });
      }
      meter.toggleAttribute("data-speaking", current.speaking);
      requestAnimationFrame(() => drawMeter(current));
    }

    /** Microphone sound waiting to be sent, in bytes: about five seconds of it. */
    const MAX_UNSENT = 220_000;

    /** There is no microphone, or no longer: say so, and show no level. */
    function noMicrophone(current: Call): void {
      if (current === call) {
        meter.hidden = true;
        delete meter.dataset.on;
      }
      current.speaking = false;
      current.level = 0;
      current.muted = false;
      current.muteTail = 0;
      if (current === call) hideMute();
      mark({ base: "No microphone: type to talk.", hearing: false }, current);
    }

    /**
     * Put a button away, and keep the keyboard's place when it had it. While
     * a call is on, that place is never the button that ends it: a key meant
     * for the button that went away would hang up.
     */
    function putAway(button: HTMLElement): void {
      if (document.activeElement === button) {
        const next = !call
          ? toggle
          : button !== mute && !mute.hidden
            ? mute
            : findPart(root, "input");
        next?.focus();
      }
      button.hidden = true;
    }

    function hideMute(): void {
      putAway(mute);
      mute.setAttribute("aria-pressed", "false");
      meter.removeAttribute("data-muted");
    }

    /**
     * Switch the microphone off or on. Off, nothing the reader says is sent:
     * a few seconds of silence follow their last sound, so the provider hears
     * them stop, and then nothing at all until it is on again.
     */
    function setMuted(current: Call, on: boolean): void {
      if (!current.microphone || current.muted === on) return;
      current.muted = on;
      muteMicrophone(current, on);
      current.muteTail = on ? MUTE_TAIL : 0;
      current.level = 0;
      current.speaking = false;
      current.quietAt = 0;
      if (current === call) {
        mute.setAttribute("aria-pressed", String(on));
        meter.toggleAttribute("data-muted", on);
      }
      touch(current);
      mark({ base: on ? MUTED : LISTENING, hearing: false }, current);
    }
    mute.addEventListener("click", () => {
      if (call) setMuted(call, !call.muted);
    });

    /* ---- A call nobody is speaking on: asked about, then ended ---- */

    let limits: IdleLimits = idleLimits({});
    let idleCheck: ReturnType<typeof setInterval> | undefined;

    /** Something happened on the call: it is in use. */
    function touch(current: Call | null = call): void {
      if (!current) return;
      current.activeAt = performance.now();
      // The provider cannot see all that is use here, so it is told, now and then.
      if (aliveDue(current.activeAt, current.aliveAt)) {
        current.aliveAt = current.activeAt;
        current.wire.alive();
      }
      if (!current.idle) return;
      current.idle = false;
      if (current === call) {
        putAway(stay);
        refresh();
      }
    }

    /** Two short notes, for a reader who is not looking at the page. */
    function chime(current: Call): void {
      wake(current);
      const at = current.playback.currentTime;
      [660, 880].forEach((pitch, note) => {
        const tone = current.playback.createOscillator();
        const level = current.playback.createGain();
        tone.frequency.value = pitch;
        level.gain.setValueAtTime(0.0001, at + note * 0.18);
        level.gain.exponentialRampToValueAtTime(0.08, at + note * 0.18 + 0.02);
        level.gain.exponentialRampToValueAtTime(0.0001, at + note * 0.18 + 0.16);
        tone.connect(level).connect(current.playback.destination);
        tone.start(at + note * 0.18);
        tone.stop(at + note * 0.18 + 0.17);
      });
    }

    function checkIdle(current: Call): void {
      if (current !== call) return;
      // The reader or the model speaking, a tool running, an answer awaited on screen: in use.
      if (
        isPlaying(current) ||
        current.hearing ||
        current.working > 0 ||
        current.thinking ||
        current.waiting.size
      ) {
        touch(current);
        return;
      }
      const phase = idlePhase(performance.now(), current.activeAt, limits);
      if (phase === "over") {
        hangUp(NOBODY_SPOKE);
      } else if (phase === "warning" && !current.idle) {
        current.idle = true;
        stay.hidden = false;
        chime(current);
        refresh();
      }
    }
    stay.addEventListener("click", () => touch());

    async function listen(current: Call): Promise<void> {
      const node = await openMicrophone(
        current,
        () => current === call,
        () => noMicrophone(current),
      );
      if (!node) return;
      const chunks = pcmChunker();
      /** Samples that have gone by since the last piece of silence was sent. */
      let silence = 0;
      meter.dataset.on = "";
      requestAnimationFrame(() => drawMeter(current));
      node.port.onmessage = ({ data }: MessageEvent<Float32Array>) => {
        if (current.muted) {
          // Nothing from the microphone is kept, measured or sent.
          chunks.reset();
          if (current.muteTail <= 0) return;
          silence += data.length;
          while (silence >= CHUNK && current.muteTail > 0) {
            silence -= CHUNK;
            current.wire.audio(silentChunk());
            if (--current.muteTail === 0) current.wire.pause();
          }
          return;
        }
        silence = 0;
        measure(current, chunks.add(data));
        // Taken whether or not it can be sent, so what waits never grows.
        const chunk = chunks.take();
        if (chunk === null || current.socket.readyState !== WebSocket.OPEN) return;
        // A connection that cannot keep up gets no more until it has caught
        // up: sound the model would hear seconds late is worse than a gap.
        if (current.socket.bufferedAmount > MAX_UNSENT) return;
        current.wire.audio(chunk);
      };
    }

    /* ---- The call ---- */

    /** A name for one turn, so the server stores it once however often it is sent. */
    const turnId = (): string =>
      typeof crypto.randomUUID === "function"
        ? crypto.randomUUID()
        : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;

    /**
     * Send a turn to be stored. It is sent even when the page is being left,
     * and once more when the first try did not get through: the turn's name
     * keeps a second arrival from being a second turn.
     */
    function storeTurn(fields: Record<string, string>, tries = 2): void {
      post("/api/voice-turn", fields, undefined, true).then(
        (response) => {
          if (response.status >= 500 && tries > 1) retry();
        },
        () => {
          if (tries > 1) retry();
        },
      );
      function retry(): void {
        setTimeout(() => storeTurn(fields, tries - 1), 1000);
      }
    }

    /** What each form sent in this turn said to the model, by the reader piece that shows it. */
    const formsSaid = new Map<string, string>();

    /**
     * A sent form is the reader's answer. The thread shows its label as
     * their turn, or nothing; what it said is kept for the model.
     */
    function answeredForm(sent: SentForm): void {
      const piece = `sent-form:${formsSaid.size}`;
      formsSaid.set(piece, sent.say);
      const shown = sent.show ?? sent.say;
      heard(shown && reader.trim() ? `\n${shown}` : shown, piece, true);
    }

    /** Store what was said, and start the next turn with a clean slate. */
    function endTurn(): void {
      // The model's history keeps what a form said; `show` is what the thread showed.
      const told = formsSaid.size ? toldText(heardPieces, formsSaid) : reader;
      if (told.trim() || said.trim() || reply) {
        storeTurn({
          reader: told,
          model: said,
          turn: turnId(),
          ...(told.trim() === reader.trim() ? {} : { show: reader.trim() }),
        });
      }
      reader = said = "";
      closePieces(heardPieces, closedPieces);
      formsSaid.clear();
      readerBubble = reply = saidText = null;
      mark({ thinking: false });
      // The next thing said starts a new caption; this one plays out.
      timeline.voiced.open = false;
    }

    /** The call is on. The microphone joins when the reader allows it;
     * without one the call still works, and the reader types. */
    function connected(current: Call): void {
      toggle.removeAttribute("aria-busy");
      mark({ base: "Connected. Type to talk." }, current);
      listen(current).then(
        // A microphone that went away while it was being opened is not listening.
        () => {
          if (!current.microphone) return;
          if (current === call) mute.hidden = false;
          mark({ base: LISTENING }, current);
        },
        // The reader declined, or this browser cannot capture: there is no level to show.
        () => noMicrophone(current),
      );
    }

    function heard(text: string, piece = "", whole = false): void {
      hear(heardPieces, text, piece, whole);
      reader = readerText(heardPieces);
      // An utterance whose words have not come yet shows nothing.
      if (!reader.trim() && !readerBubble) return;
      showReader();
      touch();
      // Words that arrive after the reader stopped are an answer being waited for.
      if (call?.wire.byMeter && !call.speaking && !said.trim()) mark({ thinking: true });
    }

    function spoke(text: string): void {
      showReply();
      const turn = voicing(timeline);
      // Where this turn's voice begins in the answer's text, for the mark.
      if (spokenIn?.voiced !== turn) spokenIn = { voiced: turn, node: saidText!, offset: said.length };
      said += text;
      turn.text += text;
      // Added, not rewritten: a mark in the text stays where it is.
      saidText!.appendData(text);
      touch();
    }

    /** How much of a reply must have played for the reader to have heard it, in seconds. */
    const HEARD_AFTER = 0.5;

    /**
     * The reader spoke over the reply. One they had not heard yet, and that
     * shows nothing, is taken back: the model was answering a pause.
     */
    function dropReply(): boolean {
      // Its words are its one child; anything more is something it shows.
      if (!call || !reply || reply.childElementCount > 1) return false;
      const voiced = timeline.voiced;
      const played = voiced.open && voiced.seconds > 0 ? call.playback.currentTime - voiced.start : 0;
      if (played > HEARD_AFTER) return false;
      reply.remove();
      reply = saidText = null;
      said = "";
      return true;
    }

    /** What a provider's messages do to `current` (see types.ts). */
    const hooksFor = (current: Call): WireHooks => ({
      connected: () => connected(current),
      answerTool,
      mark: (patch) => mark(patch, current),
      quiet,
      heard: (text, piece, whole) => {
        if (!piece || !closedPieces.has(piece)) heard(text, piece, whole);
      },
      dropReply,
      active: () => touch(current),
      play,
      spoke,
      timedWord: (text, ms) => placeWord(timeline, text, ms),
      newResponse: () => resetResponse(timeline),
      endTurn,
      said: () => said,
      hasReply: () => reply !== null,
      isCurrent: () => current === call,
    });

    const decoder = new TextDecoder();

    /**
     * One message from the provider. It is read at once, so messages are
     * acted on in the order they came; one that cannot be read is left out,
     * and the call goes on.
     */
    function onMessage(current: Call, event: MessageEvent): void {
      if (current !== call) return;
      let message: unknown;
      try {
        message = JSON.parse(
          typeof event.data === "string" ? event.data : decoder.decode(event.data as ArrayBuffer),
        );
      } catch {
        return;
      }
      if (typeof message !== "object" || message === null) return;
      current.wire.receive(message).catch(() => {});
    }

    function hangUp(why = ""): void {
      const ending = call;
      if (!ending) return;
      call = null;
      endTurn();
      closeCall(ending);
      clearInterval(idleCheck);
      clearWord();
      spokenIn = null;
      // The next call's clock starts again: nothing of this one's voice is left to caption.
      timeline.voiced = silent(false);
      resetResponse(timeline);
      hideMute();
      putAway(stay);
      caption.replaceChildren();
      delete caption.dataset.key;
      status.textContent = why;
      meter.hidden = true;
      delete meter.dataset.on;
      meter.dataset.level = "0.00";
      meter.removeAttribute("data-speaking");
      for (const bar of bars) bar.style.transform = "";
      pressed(false);
      const wasOn = Boolean(document.documentElement.dataset.genuiCall);
      setState(root, "genuiCall", null);
      if (wasOn) announce(root, "chat:call-end");
    }

    /** How long a call may take to be on, once its connection is asked for. */
    const CONNECT_WITHIN = 20_000;

    /** The call that is being started: its session is asked for, and not yet answered. */
    let starting: AbortController | null = null;

    /** Give up on a call that is not on yet, and say why when there is something to say. */
    function cancelStart(why = ""): void {
      starting?.abort();
      starting = null;
      meter.hidden = true;
      status.textContent = why;
      pressed(false);
    }

    async function start(): Promise<void> {
      const attempt = new AbortController();
      starting = attempt;
      pressed(true);
      // Busy from the press until the call is on.
      toggle.setAttribute("aria-busy", "true");
      status.textContent = "Connecting…";
      // Its room is kept now, so that it can show later without moving anything.
      meter.hidden = false;
      // Whatever this attempt holds is closed unless the call takes it over.
      let playback: AudioContext | null = null;
      try {
        // Made in the click, so the browser lets it play.
        playback = new AudioContext({ sampleRate: 24_000 });
        const response = await post("/api/voice-session", {}, attempt.signal);
        if (!response.ok) {
          cancelStart(sessionFailure(response.status));
          return;
        }
        const ticket = (await response.json()) as Ticket;
        // The reader pressed the button again while the session was on its way.
        if (attempt.signal.aborted) return;
        const current = {
          socket: new WebSocket(ticket.url),
          playback,
          sources: new Set(),
          nextAt: 0,
          waiting: new Map(),
          base: "Connecting…",
          hearing: false,
          thinking: false,
          working: 0,
          level: 0,
          speaking: false,
          quietAt: 0,
          muted: false,
          muteTail: 0,
          activeAt: performance.now(),
          idle: false,
          aliveAt: performance.now(),
        } as Call;
        current.wire =
          ticket.protocol === "azure-voice-live"
            ? azureVoiceLive(current, hooksFor(current))
            : geminiLive(current, ticket.setup, hooksFor(current));
        timeline.voiced = silent(false);
        resetResponse(timeline);
        closedPieces.clear();
        call = current;
        // The call has its own audio now, and the attempt is over.
        playback = null;
        starting = null;
        provider.textContent = providerLabel(ticket);
        // Other voices on the page stay quiet while a call is on.
        setState(root, "genuiCall", "on");
        announce(root, "chat:call-start");
        // Binary frames arrive as bytes, which are read without waiting.
        current.socket.binaryType = "arraybuffer";
        if (current.socket.readyState === WebSocket.OPEN) current.wire.begin();
        else current.socket.onopen = () => current.wire.begin();
        current.socket.onmessage = (event) => onMessage(current, event);
        // A provider that takes the connection and then says nothing is not
        // waited for for ever.
        setTimeout(() => {
          if (current === call && toggle.getAttribute("aria-busy") === "true") {
            hangUp("The voice service did not answer.");
          }
        }, CONNECT_WITHIN);
        current.socket.onclose = (event) => {
          // A relay or a provider can say why it hung up.
          if (current === call) hangUp(closeReason(event.reason));
        };
        requestAnimationFrame(captions);
        // Read now, so a page can set them before a call.
        limits = idleLimits(root.dataset);
        clearInterval(idleCheck);
        idleCheck = setInterval(() => checkIdle(current), 1000);
      } catch {
        // A press that canceled this attempt has already said what there is to say.
        if (attempt.signal.aborted) return;
        if (call) hangUp("The call could not start.");
        else cancelStart("The call could not start.");
      } finally {
        void playback?.close();
      }
    }

    toggle.addEventListener("click", () => {
      if (call) hangUp();
      // Pressed while connecting: this is a cancel, not a second call.
      else if (starting) cancelStart();
      else void start();
    });

    // During a call, a typed message is said to the model, not posted.
    document.addEventListener(
      "submit",
      (event) => {
        const form = event.target as HTMLFormElement;
        // Any form's submit comes here: only this chat's composer, which is
        // not the model's, is used by its own property names.
        if (!call || form !== findPart(root, "composer")) return;
        const input =
          partIn<HTMLTextAreaElement>(form, "input") ?? form.querySelector("textarea");
        const text = input?.value.trim();
        if (!text || call.socket.readyState !== WebSocket.OPEN) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        quiet();
        if (reader.trim() || said.trim() || formsSaid.size) endTurn();
        wrote(text);
        call.wire.text(text);
        mark({ thinking: true });
        form.reset();
      },
      true,
    );

    // During a call, a form in the thread that the reader presses is said to
    // the model too: its answer does not start a typed reply.
    document.addEventListener(
      "submit",
      (event) => {
        const form = event.target as HTMLFormElement;
        if (!call || !thread()?.contains(form) || isApproval(form)) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const current = call;
        void sendForm(form, event.submitter, (job) => busy(call, job)).then((sent: SentForm | null) => {
          if (!sent || current !== call) return;
          quiet();
          if (reader.trim() || said.trim() || formsSaid.size) endTurn();
          answeredForm(sent);
          touch(current);
          current.wire.text(sent.say);
          mark({ thinking: true }, current);
        });
      },
      true,
    );

    window.addEventListener("pagehide", () => hangUp());
    if (typeof WebSocket === "function" && typeof AudioContext === "function") {
      root.hidden = false;
    }
  </script>
</div>
