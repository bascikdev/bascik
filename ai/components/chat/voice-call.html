<!-- @bascik
A spoken conversation with a speech-to-speech model: the reader talks, the model answers aloud, and what it shows arrives in the thread as components. Captions follow the voice a few words at a time, with the current word in bold. It speaks two providers' protocols, named by the ticket: gemini-live and azure-voice-live. Optional and all script. It needs three routes of yours: /api/voice-session for a ticket, /api/voice-tool to run the model's tool calls, and /api/voice-turn to store what was said, and a /voice-view page that renders what a call shows. The app prop is sent to them. Put it inside the composer (`<chat-composer><voice-call /></chat-composer>`): its button joins the composer's row, and its caption and status are a line above the message box. It also works on its own, next to the composer.
-->
<style>
  /* The component has no box of its own: its parts are laid out by whatever
     holds it, which in a composer is the row of the message box. */
  .call {
    display: contents;
  }
  .call[hidden] {
    display: none;
  }
  /* One line above the message box: who is on the line, what is happening,
     and the words being spoken. */
  .strip {
    order: -2;
    flex: 0 0 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 0.6rem;
    align-items: center;
    padding: 0.15rem 0.4rem 0.5rem;
    border-block-end: 1px solid var(--border);
    font-size: 0.8125rem;
  }
  /* Nothing to say: no line. */
  .strip:not(
    :has(.status:not(:empty), .provider:not(:empty), .caption:not(:empty))
  ) {
    display: none;
  }
  .status {
    margin: 0;
    color: var(--muted);
  }
  .status:empty,
  .provider:empty,
  .caption:empty {
    display: none;
  }
  /* The microphone's level, as a few bars. It keeps its room from the moment
     a call starts, so showing it moves nothing. */
  .meter {
    display: inline-flex;
    gap: 0.15rem;
    align-items: center;
    inline-size: 1.5rem;
    block-size: 1rem;
    color: var(--muted);
    visibility: hidden;
  }
  .meter[hidden] {
    display: none;
  }
  .meter[data-on] {
    visibility: visible;
  }
  .meter[data-speaking] {
    color: var(--accent);
  }
  .bar {
    flex: 1;
    block-size: 100%;
    border-radius: 999px;
    background: currentColor;
    transform: scaleY(0.12);
    transition: transform 90ms linear;
  }
  /* A view on its way: a block where it will go. */
  .skeleton {
    min-block-size: 6rem;
    margin-block: 0.5rem;
    border-radius: var(--radius);
    background: var(--bg);
    animation: pulse-block 1.4s ease-in-out infinite;
  }
  /* Which speech model is on the line, so it is not taken for the browser's voice. */
  .provider {
    margin: 0;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    background: var(--bg);
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 600;
  }
  .caption {
    flex: 1 1 14rem;
    margin: 0;
    color: var(--muted);
    font-size: 1.125rem;
    line-height: 1.35;
    text-align: center;
    text-wrap: balance;
  }
  .toggle {
    display: inline-flex;
    gap: 0.4rem;
    align-items: center;
    justify-content: center;
    min-inline-size: 2.5rem;
    block-size: 2.5rem;
    padding: 0 0.6rem;
    border: 0;
    border-radius: var(--radius);
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .toggle:hover {
    background: var(--bg);
    color: var(--accent);
  }
  .toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .toggle[aria-pressed="true"] {
    padding-inline: 0.8rem;
    background: var(--accent);
    color: var(--on-accent);
  }
  .icon {
    inline-size: 1.15rem;
    block-size: 1.15rem;
    flex: none;
  }
  /* Until a call is on, the button is its icon; its name is still read out. */
  .toggle[aria-pressed="false"] .label {
    position: absolute;
    inline-size: 1px;
    block-size: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  /* While a call is on, the microphone gives way to a light that it is live. */
  .live {
    display: none;
    inline-size: 0.55rem;
    block-size: 0.55rem;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .toggle[aria-pressed="true"] .icon {
    display: none;
  }
  .toggle[aria-pressed="true"] .live {
    display: block;
  }
  /* From the press until the call is on, a ring turns in place of the light. */
  .spinner {
    display: none;
    inline-size: 1rem;
    block-size: 1rem;
    flex: none;
    border: 2px solid currentColor;
    border-inline-end-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .toggle[aria-busy="true"] .spinner {
    display: block;
  }
  .toggle[aria-busy="true"] .live {
    display: none;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
  @keyframes pulse-block {
    50% {
      opacity: 0.5;
    }
  }
  @keyframes pulse {
    50% {
      opacity: 0.35;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .live,
    .spinner,
    .skeleton {
      animation: none;
    }
    .bar {
      transition: none;
    }
  }
</style>
<div id="call" class="call" hidden data-testid="voice-call">
  <div class="strip">
    <p id="provider" class="provider" data-testid="voice-call-provider"></p>
    <p
      id="status"
      class="status"
      role="status"
      data-testid="voice-call-status"
    ></p>
    <!-- Decoration: the status above says what is happening. -->
    <span
      id="meter"
      class="meter"
      hidden
      aria-hidden="true"
      data-level="0.00"
      data-testid="voice-call-meter"
    >
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </span>
    <!-- The same words as the voice, so it is hidden from a screen reader. -->
    <p
      id="caption"
      class="caption"
      aria-hidden="true"
      data-testid="voice-call-caption"
    ></p>
  </div>
  <button
    id="toggle"
    class="toggle"
    type="button"
    aria-pressed="false"
    title="Voice call"
    data-testid="voice-call-toggle"
  >
    <svg
      class="icon"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <rect x="5.5" y="1.5" width="5" height="8" rx="2.5" />
      <path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2" />
    </svg>
    <span class="live" aria-hidden="true"></span>
    <span
      class="spinner"
      aria-hidden="true"
      data-testid="voice-call-connecting"
    ></span>
    <span id="label" class="label">Voice call</span>
  </button>
  <input id="app" type="hidden" data-bascik-attr-value="app" />
  <script type="text/typescript">
    const root = document.getElementById("call")!;
    const caption = document.getElementById("caption")!;
    const status = document.getElementById("status")!;
    const toggle = document.getElementById("toggle")!;
    const label = document.getElementById("label")!;
    const provider = document.getElementById("provider")!;
    const meter = document.getElementById("meter")!;
    const bars = [...meter.children] as HTMLElement[];
    /** The speech models a ticket can name, as the reader is told. */
    const PROVIDERS: Record<string, string> = {
      "azure-voice-live": "Azure Voice Live",
      "gemini-live": "Gemini Live",
    };
    /** The button says what pressing it does. */
    const pressed = (on: boolean): void => {
      toggle.setAttribute("aria-pressed", String(on));
      label.textContent = on ? "End call" : "Voice call";
      toggle.title = on ? "End call" : "Voice call";
      if (!on) {
        provider.textContent = "";
        toggle.removeAttribute("aria-busy");
      }
    };
    const app = (document.getElementById("app") as HTMLInputElement).value;

    /** Everything one call holds, so ending it is letting go of this. */
    interface Call {
      socket: WebSocket;
      playback: AudioContext;
      /** Audio that is playing or queued, to stop it when the reader cuts in. */
      sources: Set<AudioBufferSourceNode>;
      /** When the next piece of audio starts, on the playback clock. */
      nextAt: number;
      microphone?: MediaStream;
      capture?: AudioContext;
      /** Calls that wait for the reader's answer, by id. */
      waiting: Map<string, (decision: string) => void>;
      wire: Wire;
      /** What the status line says when nothing more urgent is going on. */
      base: string;
      /** The reader is speaking. */
      hearing: boolean;
      /** The reader has finished, and the model has not yet answered. */
      thinking: boolean;
      /** Tool calls and forms on their way to the server. */
      working: number;
      /** The microphone's level, 0 to 1, and whether it counts as speech. */
      level: number;
      speaking: boolean;
      /** When the level last fell quiet, while still counted as speech. */
      quietAt: number;
    }
    /** One provider's protocol: what to send, and what its messages mean. */
    interface Wire {
      /** True when only the microphone's level tells that the reader speaks. */
      readonly byMeter: boolean;
      /** The first message, when the provider wants one from the browser. */
      begin(): void;
      /** A piece of microphone audio: 16 kHz, 16-bit, base64. */
      audio(base64: string): void;
      /** A typed message, said to the model. */
      text(text: string): void;
      receive(message: any): Promise<void>;
    }
    let call: Call | null = null;

    /* ---- The status line: one thing at a time, the most pressing first ---- */

    /** Approval waits, then work, then thinking, then hearing, then listening. */
    function refresh(): void {
      if (!call) return;
      status.textContent = call.waiting.size
        ? "Waiting for your answer on screen."
        : call.working > 0
          ? "Working…"
          : call.thinking
            ? "Thinking…"
            : call.hearing
              ? "Hearing you…"
              : call.base;
    }
    let thinkingStamp = 0;
    function mark(
      patch: Partial<Pick<Call, "base" | "hearing" | "thinking">>,
      current: Call | null = call,
    ): void {
      if (!current) return;
      Object.assign(current, patch);
      if (patch.thinking) {
        // A sound that is not speech never gets an answer: do not wait for one for ever.
        const stamp = ++thinkingStamp;
        setTimeout(() => {
          if (stamp === thinkingStamp) mark({ thinking: false }, current);
        }, 20_000);
      }
      if (current === call) refresh();
    }
    /** A job that takes time: the status says so until it is done. */
    async function busy<T>(current: Call | null, job: () => Promise<T>): Promise<T> {
      if (current) {
        current.thinking = false;
        current.working++;
        if (current === call) refresh();
      }
      try {
        return await job();
      } finally {
        if (current) {
          current.working--;
          if (current === call) refresh();
        }
      }
    }

    /** The turn being spoken: its words, its audio, and where it is drawn. */
    let reader = "";
    let said = "";
    let readerBubble: HTMLElement | null = null;
    let reply: HTMLElement | null = null;
    let saidText: Text | null = null;
    /**
     * What the caption follows: the words and the audio of the turn being
     * played. It is kept apart from the turn above, because a turn is over,
     * and stored, well before its audio has finished playing.
     */
    interface TimedWord {
      text: string;
      /** Seconds from the start of the turn's audio. */
      at: number;
    }
    interface Voiced {
      text: string;
      start: number;
      seconds: number;
      open: boolean;
      /** The time of each word, when the provider says it. */
      words: TimedWord[];
    }
    const silent = (open: boolean): Voiced => ({
      text: "",
      start: 0,
      seconds: 0,
      open,
      words: [],
    });
    let voiced = silent(false);
    const voicing = (): Voiced => {
      if (!voiced.open) voiced = silent(true);
      return voiced;
    };
    /**
     * A provider times words from the start of one response's audio, and a
     * turn can have more than one response. This is where the response being
     * played starts in the turn's audio; null until its first audio arrives,
     * and words that come before that wait in `early`.
     */
    let responseAt: number | null = null;
    let early: { text: string; ms: number }[] = [];
    const newResponse = (): void => {
      responseAt = null;
      early = [];
    };
    function timedWord(text: string, ms: number): void {
      if (responseAt === null) {
        early.push({ text, ms });
        return;
      }
      const words = voicing().words;
      // A full stop comes as a word of its own: it belongs to the word before.
      if (/^[\p{P}\p{S}]+$/u.test(text) && words.length) {
        words[words.length - 1]!.text += text;
      } else {
        words.push({ text, at: responseAt + ms / 1000 });
      }
    }

    const post = (
      path: string,
      fields: Record<string, string>,
      signal?: AbortSignal,
    ): Promise<Response> => {
      const body = new FormData();
      body.set("app", app);
      for (const [name, value] of Object.entries(fields)) body.set(name, value);
      return fetch(path, { method: "POST", body, signal });
    };

    /* ---- The thread: what was said and shown, as it happens ---- */

    const thread = (): HTMLElement | null =>
      document.querySelector<HTMLElement>('[data-testid="chat-thread"]');

    function showReader(): void {
      if (!readerBubble) {
        readerBubble = document.createElement("p");
        readerBubble.className = "turn-user";
        readerBubble.dataset.testid = "turn-user";
        // What the reader said can be written down after the answer has begun.
        if (reply) reply.before(readerBubble);
        else thread()?.append(readerBubble);
      }
      readerBubble.textContent = reader.trim();
    }

    function showReply(): HTMLElement {
      if (!reply) {
        reply = document.createElement("div");
        reply.className = "turn-assistant";
        reply.dataset.testid = "turn-voice";
        saidText = document.createTextNode("");
        reply.append(saidText);
        // An approval card in a spoken reply is answered in the call, not by
        // a page load: the model is waiting on the line for the result.
        reply.addEventListener("submit", (event) => {
          const form = event.target as HTMLFormElement;
          const id = callOf(form);
          const answer = (event.submitter as HTMLButtonElement | null)?.value;
          const decide = id !== undefined && call?.waiting.get(id);
          if (!decide || !answer) return;
          event.preventDefault();
          event.stopPropagation();
          decide(answer);
        });
        thread()?.append(reply);
      }
      return reply;
    }

    /**
     * Put a call's view in the reply. The view is a page the server renders,
     * so its components arrive as finished markup; a script in it is made
     * again here, because a script that was parsed elsewhere does not run.
     */
    async function showView(id: string): Promise<void> {
      // Where the view will go, until it comes.
      const target = showReply();
      const placeholder = document.createElement("div");
      placeholder.dataset.view = id;
      placeholder.className = "skeleton";
      placeholder.dataset.testid = "voice-call-loading";
      placeholder.setAttribute("aria-busy", "true");
      const earlier = target.querySelector(`[data-view="${CSS.escape(id)}"]`);
      if (earlier) earlier.replaceWith(placeholder);
      else target.append(placeholder);
      try {
        await fillView(id, placeholder);
      } finally {
        // A view that did not come leaves nothing behind.
        placeholder.remove();
      }
    }

    async function fillView(id: string, placeholder: HTMLElement): Promise<void> {
      const response = await fetch(
        `/voice-view?app=${encodeURIComponent(app)}&call=${encodeURIComponent(id)}`,
      );
      if (!response.ok) return;
      const page = new DOMParser().parseFromString(await response.text(), "text/html");
      // A data attribute is not renamed per instance, so it can be selected as written.
      // bascik-ignore js-attribute-selector
      const view = page.querySelector('[data-testid="voice-view"]');
      if (!view) return;
      const holder = document.createElement("div");
      holder.dataset.view = id;
      holder.append(...[...view.childNodes].map((node) => document.importNode(node, true)));
      for (const parsed of holder.querySelectorAll("script")) {
        const script = document.createElement("script");
        for (const { name, value } of parsed.attributes) script.setAttribute(name, value);
        script.textContent = parsed.textContent;
        parsed.replaceWith(script);
      }
      placeholder.replaceWith(holder);
    }

    /* ---- Tool calls: the model asks here, the server runs them ---- */

    interface ToolAnswer {
      state: string;
      output?: string;
      view: boolean;
    }

    async function runTool(tool: { id: string; name: string; args: unknown }): Promise<string> {
      const fields = { id: tool.id, name: tool.name, input: JSON.stringify(tool.args ?? {}) };
      const current = call;
      const run = (extra: Record<string, string>): Promise<ToolAnswer> =>
        busy(current, async () => {
          const answer = (await (
            await post("/api/voice-tool", { ...fields, ...extra })
          ).json()) as ToolAnswer;
          if (answer.view) await showView(tool.id);
          return answer;
        });
      let answer = await run({});
      if (answer.state === "approval-requested" && call) {
        const decision = await new Promise<string>((resolve) => {
          call!.waiting.set(tool.id, resolve);
          refresh();
        });
        call?.waiting.delete(tool.id);
        answer = await run({ decision });
      }
      return answer.output ?? "";
    }

    /* ---- Sound out: the model's voice, and captions that follow it ---- */

    function play(base64: string): void {
      if (!call) return;
      const bytes = Uint8Array.from(atob(base64), (character) => character.charCodeAt(0));
      const samples = new Int16Array(bytes.buffer, 0, bytes.length >> 1);
      const buffer = call.playback.createBuffer(1, samples.length, 24_000);
      const channel = buffer.getChannelData(0);
      for (let at = 0; at < samples.length; at++) channel[at] = samples[at]! / 32_768;
      const source = call.playback.createBufferSource();
      source.buffer = buffer;
      source.connect(call.playback.destination);
      const now = call.playback.currentTime;
      if (call.nextAt < now) call.nextAt = now + 0.05;
      mark({ thinking: false });
      const turn = voicing();
      if (turn.seconds === 0) turn.start = call.nextAt;
      if (responseAt === null) {
        responseAt = call.nextAt - turn.start;
        for (const word of early.splice(0)) timedWord(word.text, word.ms);
      }
      source.start(call.nextAt);
      call.nextAt += buffer.duration;
      // Measured on the clock, so a pause between two responses is counted.
      turn.seconds = call.nextAt - turn.start;
      call.sources.add(source);
      source.onended = () => call?.sources.delete(source);
    }

    /** The reader cut in: stop talking at once. */
    function quiet(): void {
      for (const source of call?.sources ?? []) source.stop();
      call?.sources.clear();
      if (call) call.nextAt = 0;
      voiced = silent(false);
      newResponse();
    }

    /**
     * Which word is being spoken. A provider that sends the time of each
     * word is followed exactly. One that sends only text is estimated: the
     * text and the audio grow together, so the word is found by how far into
     * the turn's audio the playback is.
     */
    const GROUP = 6;
    function captions(): void {
      if (!call) return;
      const timed = voiced.words.length > 0;
      const text = voiced.text.trim();
      const words = timed
        ? voiced.words.map((word) => word.text)
        : text.split(/\s+/).filter(Boolean);
      const elapsed = call.playback.currentTime - voiced.start;
      if (!words.length || voiced.seconds === 0 || elapsed > voiced.seconds + 0.4) {
        caption.replaceChildren();
        delete caption.dataset.key;
      } else {
        let index = 0;
        if (timed) {
          voiced.words.forEach((word, at) => {
            if (word.at <= elapsed) index = at;
          });
        } else {
          const position = Math.max(0, elapsed / voiced.seconds) * text.length;
          for (let at = 0, word = 0; word < words.length; word++) {
            if (at <= position) index = word;
            at += words[word]!.length + 1;
          }
        }
        const start = Math.floor(index / GROUP) * GROUP;
        const key = `${start}:${index}:${words.length}`;
        if (caption.dataset.key !== key) {
          caption.dataset.key = key;
          caption.dataset.timing = timed ? "words" : "estimate";
          caption.replaceChildren(
            ...words.slice(start, start + GROUP).flatMap((word, offset) => {
              if (offset + start !== index) return [`${word} `];
              const current = document.createElement("strong");
              current.textContent = word;
              return [current, " "];
            }),
          );
        }
      }
      requestAnimationFrame(captions);
    }

    /* ---- Sound in: the microphone, as the provider wants it ---- */

    const WORKLET = `registerProcessor("mic", class extends AudioWorkletProcessor {
      process(inputs) {
        const channel = inputs[0][0];
        if (channel) this.port.postMessage(channel.slice(0));
        return true;
      }
    });`;

    /** Above this the reader counts as speaking; below the lower one, as quiet. */
    const SPEECH_ON = 0.15;
    const SPEECH_OFF = 0.08;
    /** How long it must stay quiet before speech is over, in milliseconds. */
    const QUIET_FOR = 500;
    const BAR_SHAPE = [0.55, 0.8, 1, 0.8, 0.55];

    /** True while the model's voice is playing, when the microphone hears it back. */
    const playing = (current: Call): boolean => current.playback.currentTime < current.nextAt;

    /** One block of microphone sound: smooth its level, and tell when speech starts and ends. */
    function measure(current: Call, rms: number): void {
      // A voice is far quieter than a full-scale tone: this puts speech near the top.
      const target = Math.min(1, rms * 8);
      current.level += (target - current.level) * (target > current.level ? 0.5 : 0.06);
      const now = performance.now();
      if (!current.speaking && current.level > SPEECH_ON) {
        current.speaking = true;
        current.quietAt = 0;
      } else if (current.speaking && current.level < SPEECH_OFF) {
        current.quietAt ||= now;
        if (now - current.quietAt > QUIET_FOR) current.speaking = false;
      } else if (current.speaking) {
        current.quietAt = 0;
      }
      if (!current.wire.byMeter || current !== call) return;
      const hearing = current.speaking && !playing(current);
      if (hearing === current.hearing) return;
      // Speaking again is not waiting for an answer; stopping is, if words were heard.
      const waits = !hearing && reader.trim() !== "" && !said.trim();
      mark(hearing ? { hearing, thinking: false } : { hearing, thinking: waits || current.thinking });
    }

    /** Draw the level, a frame at a time, for as long as the call is on. */
    function drawMeter(current: Call): void {
      if (current !== call || !current.microphone) return;
      const shown = current.level.toFixed(2);
      if (meter.dataset.level !== shown) {
        meter.dataset.level = shown;
        bars.forEach((bar, at) => {
          bar.style.transform = `scaleY(${Math.max(0.12, current.level * BAR_SHAPE[at]!).toFixed(2)})`;
        });
      }
      meter.toggleAttribute("data-speaking", current.speaking);
      requestAnimationFrame(() => drawMeter(current));
    }

    async function listen(current: Call): Promise<void> {
      const microphone = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
      });
      // The call ended while the browser was asking: nothing may keep the microphone.
      if (current !== call) {
        microphone.getTracks().forEach((track) => track.stop());
        return;
      }
      // Asking for 16 kHz here means the browser resamples, not this script.
      const capture = new AudioContext({ sampleRate: 16_000 });
      current.microphone = microphone;
      current.capture = capture;
      await capture.audioWorklet.addModule(
        URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })),
      );
      if (current !== call) return;
      const node = new AudioWorkletNode(capture, "mic");
      capture.createMediaStreamSource(microphone).connect(node);
      let pending: number[] = [];
      meter.dataset.on = "";
      requestAnimationFrame(() => drawMeter(current));
      node.port.onmessage = ({ data }: MessageEvent<Float32Array>) => {
        let squares = 0;
        for (const sample of data) {
          squares += sample * sample;
          pending.push(Math.max(-1, Math.min(1, sample)) * 32_767);
        }
        measure(current, Math.sqrt(squares / (data.length || 1)));
        // A tenth of a second at a time.
        if (pending.length < 1600 || current.socket.readyState !== WebSocket.OPEN) return;
        const bytes = new Uint8Array(Int16Array.from(pending).buffer);
        pending = [];
        let binary = "";
        for (const byte of bytes) binary += String.fromCharCode(byte);
        current.wire.audio(btoa(binary));
      };
    }

    /* ---- The call ---- */

    /** Store what was said, and start the next turn with a clean slate. */
    function endTurn(): void {
      if (reader.trim() || said.trim() || reply) {
        void post("/api/voice-turn", { reader, model: said });
      }
      reader = said = "";
      readerBubble = reply = saidText = null;
      mark({ thinking: false });
      // The next thing said starts a new caption; this one plays out.
      voiced.open = false;
    }

    /** The call is on. The microphone joins when the reader allows it;
     * without one the call still works, and the reader types. */
    function connected(current: Call): void {
      toggle.removeAttribute("aria-busy");
      mark({ base: "Connected. Type to talk." }, current);
      listen(current).then(
        () => mark({ base: "Listening." }, current),
        () => {
          // The reader declined: there is no level to show.
          meter.hidden = true;
          mark({ base: "No microphone: type to talk." }, current);
        },
      );
    }

    function heard(text: string, whole = false): void {
      reader = whole ? text : reader + text;
      showReader();
      // Words that arrive after the reader stopped are an answer being waited for.
      if (call?.wire.byMeter && !call.speaking && !said.trim()) mark({ thinking: true });
    }

    function spoke(text: string): void {
      said += text;
      voicing().text += text;
      showReply();
      saidText!.data = said;
    }

    const answerTool = (tool: { id: unknown; name: string; args: unknown }): Promise<string> => {
      mark({ thinking: false });
      // A call with no id cannot be matched to its answer or its approval:
      // it is refused here, and never posted as "undefined".
      const id = tool.id;
      if (typeof id !== "string" || !id) {
        return Promise.resolve("Error: the tool call has no id.");
      }
      return (
        tool.name === "fill_form" ? fillForm(tool.args) : runTool({ ...tool, id })
      ).catch(
        () => "Error: the tool could not be run.",
      );
    };

    /* ---- Forms on screen: the reader presses them, or says the answer ---- */

    const plain = (text: string | null | undefined): string =>
      (text ?? "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();

    /*
     * A form's controls are also its properties, by name, and they win over
     * the form's own: `<input name="action">` makes `form.action` that input.
     * The model names the fields of the forms it writes, so a form in the
     * thread is read only through the prototype, never by property name.
     */
    const formGet = <K extends keyof HTMLFormElement>(form: HTMLFormElement, key: K): HTMLFormElement[K] =>
      Reflect.get(HTMLFormElement.prototype, key, form) as HTMLFormElement[K];
    const controlsOf = (form: HTMLFormElement): Element[] => [...formGet(form, "elements")];

    /**
     * A question about allowing an action is the reader's alone to answer. It
     * answers a call by a hidden field, which no field the model writes is.
     */
    const callOf = (form: HTMLFormElement): string | undefined =>
      controlsOf(form).find(
        (control): control is HTMLInputElement =>
          control instanceof HTMLInputElement && control.type === "hidden" && control.name === "call",
      )?.value;
    const isApproval = (form: HTMLFormElement): boolean =>
      callOf(form) !== undefined || Element.prototype.closest.call(form, "[data-part]") !== null;

    /** The newest form in the thread that has not been sent. */
    function openForm(): HTMLFormElement | null {
      const forms = [...(thread()?.querySelectorAll("form") ?? [])].filter(
        (form) =>
          !formGet(form, "dataset").sent &&
          !isApproval(form) &&
          // One that is on the page but not shown is not one the reader means.
          Element.prototype.checkVisibility.call(form),
      );
      return forms.at(-1) ?? null;
    }

    /**
     * Send a form the way a call needs it sent: to its own address, marked as
     * coming from a call. The server does what the form does and answers with
     * what it says, which goes to the speech model in place of a typed reply.
     */
    async function sendForm(
      form: HTMLFormElement,
      submitter: HTMLElement | null,
    ): Promise<{ say: string; hidden: boolean } | null> {
      // Read before the controls are disabled: a disabled control is not sent.
      const body = new FormData(form, submitter);
      body.set("voice", "1");
      const locked = controlsOf(form).filter(
        (control): control is HTMLInputElement | HTMLButtonElement | HTMLTextAreaElement =>
          "disabled" in control && !control.disabled,
      );
      const style = formGet(form, "style");
      Element.prototype.setAttribute.call(form, "aria-busy", "true");
      // A form is not part of this component's template, so it is dimmed here.
      style.cssText += ";opacity:0.7;cursor:progress";
      for (const control of locked) control.disabled = true;
      let answer: { say?: unknown; hidden?: unknown } | null = null;
      try {
        answer = await busy(call, async () => {
          const response = await fetch(formGet(form, "action"), { method: "POST", body });
          return response.ok
            ? ((await response.json().catch(() => null)) as {
                say?: unknown;
                hidden?: unknown;
              } | null)
            : null;
        });
      } finally {
        Element.prototype.removeAttribute.call(form, "aria-busy");
        style.opacity = "";
        style.cursor = "";
        for (const control of locked) control.disabled = false;
      }
      if (typeof answer?.say !== "string" || !answer.say.trim()) return null;
      // Sent once: it stays on screen as it was answered, and says so.
      formGet(form, "dataset").sent = "";
      Reflect.set(HTMLElement.prototype, "inert", true, form);
      style.opacity = "0.7";
      const pressed = submitter?.textContent?.trim();
      const note = document.createElement("p");
      note.dataset.testid = "voice-call-answered";
      note.style.cssText = "margin:0;font-size:0.8125rem;font-weight:600";
      note.textContent = pressed ? `Answered: ${pressed}` : "Answered";
      Element.prototype.append.call(form, note);
      // A record in a fixed shape is for the model; the reader's own words are theirs.
      return { say: answer.say.trim(), hidden: answer.hidden === true };
    }

    /** The model fills in the newest form with what the reader said, and presses it. */
    async function fillForm(input: unknown): Promise<string> {
      const { press, text, field } = (
        typeof input === "object" && input !== null ? input : {}
      ) as Record<string, unknown>;
      const form = openForm();
      if (!form) return "Error: there is no form on the screen to fill in.";
      const controls = controlsOf(form) as (HTMLInputElement | HTMLButtonElement | HTMLTextAreaElement)[];
      const named = (control: HTMLElement & { labels?: NodeListOf<HTMLLabelElement> | null }): string =>
        control instanceof HTMLButtonElement
          ? plain(control.textContent)
          : plain(control.labels?.[0]?.textContent);
      const boxes = controls.filter(
        (control) =>
          control instanceof HTMLTextAreaElement ||
          (control instanceof HTMLInputElement &&
            !["hidden", "radio", "checkbox", "submit", "button"].includes(control.type)),
      );
      const options = controls.filter(
        (control): control is HTMLInputElement =>
          control instanceof HTMLInputElement &&
          (control.type === "radio" || control.type === "checkbox"),
      );
      const buttons = controls.filter(
        (control): control is HTMLButtonElement =>
          control instanceof HTMLButtonElement && control.type === "submit",
      );
      const has = (kind: string, list: HTMLElement[]): string =>
        list.length ? ` ${kind}: ${list.map((control) => named(control) || "unnamed").join(", ")}.` : "";
      const contents = `This form has${has("buttons", buttons)}${has("options", options)}${has("text boxes", boxes)}`;

      if (typeof text === "string" && text.trim()) {
        const wanted = plain(typeof field === "string" ? field : "");
        const box = (wanted && boxes.find((candidate) => named(candidate).includes(wanted))) || boxes[0];
        if (!box) return `Error: this form has no text box. ${contents}`;
        (box as HTMLTextAreaElement).value = text.trim();
        box.dispatchEvent(new Event("input", { bubbles: true }));
      }
      const wanted = plain(typeof press === "string" ? press : "");
      if (!wanted) return `Error: say what to press. ${contents}`;
      const match = <T extends HTMLElement>(list: T[]): T | undefined =>
        list.find((control) => named(control) === wanted) ??
        list.find((control) => named(control).includes(wanted));
      const option = match(options);
      if (option) {
        option.checked = true;
        option.dispatchEvent(new Event("change", { bubbles: true }));
        return `Chose "${named(option)}". It is not sent yet. ${contents}`;
      }
      const button = match(buttons);
      if (!button) return `Error: no button or option says "${String(press)}". ${contents}`;
      const sent = await sendForm(form, button);
      if (!sent) return "Error: the form could not be sent.";
      // What was sent is the reader's answer, and is shown and stored as theirs.
      if (!sent.hidden) heard(reader.trim() ? `\n${sent.say}` : sent.say);
      return `Sent for the reader: ${sent.say}\nThis is the reader's answer, sent and recorded. Nothing more will arrive for it: carry on now with what comes next.`;
    }

    /* ---- The providers ---- */

    function geminiLive(current: Call, setup: unknown): Wire {
      const send = (message: unknown): void => {
        if (current.socket.readyState === WebSocket.OPEN) {
          current.socket.send(JSON.stringify(message));
        }
      };
      return {
        byMeter: true,
        begin: () => send(setup),
        audio: (data) =>
          send({ realtimeInput: { audio: { data, mimeType: "audio/pcm;rate=16000" } } }),
        text: (text) =>
          send({
            clientContent: { turns: [{ role: "user", parts: [{ text }] }], turnComplete: true },
          }),
        async receive(message) {
          if (message.setupComplete) {
            connected(current);
            return;
          }
          if (message.toolCall) {
            const functionResponses = [];
            for (const tool of message.toolCall.functionCalls ?? []) {
              const result = await answerTool(tool);
              functionResponses.push({ id: tool.id, name: tool.name, response: { result } });
            }
            send({ toolResponse: { functionResponses } });
            // The model goes on with what the tools said.
            mark({ thinking: true }, current);
            return;
          }
          const content = message.serverContent;
          if (!content) return;
          if (content.interrupted) quiet();
          if (content.inputTranscription?.text) heard(content.inputTranscription.text);
          for (const part of content.modelTurn?.parts ?? []) {
            if (part.inlineData?.data) play(part.inlineData.data);
          }
          if (content.outputTranscription?.text) spoke(content.outputTranscription.text);
          // A turn that only called tools is not over: the model speaks next.
          if (content.turnComplete && (said.trim() || !reply)) endTurn();
        },
      };
    }

    /**
     * Azure Voice Live, through the server's relay. The relay sends the
     * session's setup, so the first thing heard here is that it is on.
     */
    function azureVoiceLive(current: Call): Wire {
      const send = (message: unknown): void => {
        if (current.socket.readyState === WebSocket.OPEN) {
          current.socket.send(JSON.stringify(message));
        }
      };
      /** A reply is being made. */
      let active = false;
      /** The tool calls of the reply being made. */
      let tools: Promise<void>[] = [];
      return {
        byMeter: false,
        begin: () => {},
        audio: (audio) => send({ type: "input_audio_buffer.append", audio }),
        text(text) {
          if (active) send({ type: "response.cancel" });
          send({
            type: "conversation.item.create",
            item: { type: "message", role: "user", content: [{ type: "input_text", text }] },
          });
          send({ type: "response.create" });
        },
        async receive(message) {
          switch (message.type) {
            case "session.updated":
              connected(current);
              break;
            case "input_audio_buffer.speech_started":
              // The reader cut in, or began a new turn.
              quiet();
              if (said.trim()) endTurn();
              mark({ hearing: true, thinking: false });
              break;
            case "input_audio_buffer.speech_stopped":
              // The reader is done: the model has not answered yet.
              mark({ hearing: false, thinking: true });
              break;
            case "conversation.item.input_audio_transcription.delta":
              // The words so far; the completed text that follows replaces them.
              if (message.delta) heard(message.delta);
              break;
            case "conversation.item.input_audio_transcription.completed":
              if (message.transcript) heard(message.transcript, true);
              break;
            case "response.created":
              active = true;
              newResponse();
              // A turn can be more than one response: keep their words apart.
              if (said && !/\s$/.test(said)) spoke(" ");
              break;
            case "response.audio.delta":
              if (message.delta) play(message.delta);
              break;
            case "response.audio_transcript.delta":
              if (message.delta) spoke(message.delta);
              break;
            case "response.audio_timestamp.delta":
              if (message.text) timedWord(message.text, message.audio_offset_ms ?? 0);
              break;
            case "response.function_call_arguments.done": {
              let args: unknown;
              try {
                args = JSON.parse(message.arguments || "{}");
              } catch {
                // Passed on as it is: the server refuses it, and the model is told.
                args = message.arguments;
              }
              const tool = { id: message.call_id, name: message.name, args };
              tools.push(
                answerTool(tool).then((output) =>
                  send({
                    type: "conversation.item.create",
                    item: { type: "function_call_output", call_id: tool.id, output },
                  }),
                ),
              );
              break;
            }
            case "response.done": {
              active = false;
              const called = tools;
              tools = [];
              if (called.length && message.response?.status !== "cancelled") {
                // The model hears the results once its reply is over, and goes on.
                await Promise.all(called);
                if (current === call) {
                  mark({ thinking: true });
                  send({ type: "response.create" });
                }
              } else {
                endTurn();
              }
              break;
            }
          }
        },
      };
    }

    async function onMessage(current: Call, event: MessageEvent): Promise<void> {
      const text = typeof event.data === "string" ? event.data : await (event.data as Blob).text();
      const message = JSON.parse(text);
      if (current !== call) return;
      await current.wire.receive(message);
    }

    function hangUp(why = ""): void {
      const ending = call;
      if (!ending) return;
      call = null;
      endTurn();
      for (const decide of ending.waiting.values()) decide("deny");
      ending.socket.close();
      for (const source of ending.sources) source.stop();
      ending.microphone?.getTracks().forEach((track) => track.stop());
      void ending.capture?.close();
      void ending.playback.close();
      caption.replaceChildren();
      status.textContent = why;
      meter.hidden = true;
      delete meter.dataset.on;
      meter.dataset.level = "0.00";
      meter.removeAttribute("data-speaking");
      for (const bar of bars) bar.style.transform = "";
      pressed(false);
      delete document.documentElement.dataset.genuiCall;
    }

    /** The call that is being started: its session is asked for, and not yet answered. */
    let starting: AbortController | null = null;

    /** Give up on a call that is not on yet, and say why when there is something to say. */
    function cancelStart(why = ""): void {
      starting?.abort();
      starting = null;
      meter.hidden = true;
      status.textContent = why;
      pressed(false);
    }

    async function start(): Promise<void> {
      const attempt = new AbortController();
      starting = attempt;
      pressed(true);
      // Busy from the press until the call is on.
      toggle.setAttribute("aria-busy", "true");
      status.textContent = "Connecting…";
      // Its room is kept now, so that it can show later without moving anything.
      meter.hidden = false;
      // Whatever this attempt holds is closed unless the call takes it over.
      let playback: AudioContext | null = null;
      try {
        // Made in the click, so the browser lets it play.
        playback = new AudioContext({ sampleRate: 24_000 });
        const response = await post("/api/voice-session", {}, attempt.signal);
        if (!response.ok) {
          cancelStart(
            response.status === 404
              ? "Voice is not set up on this server."
              : "The voice service did not answer.",
          );
          return;
        }
        const ticket = (await response.json()) as {
          protocol: string;
          url: string;
          setup: unknown;
          label?: string;
        };
        // The reader pressed the button again while the session was on its way.
        if (attempt.signal.aborted) return;
        const current = {
          socket: new WebSocket(ticket.url),
          playback,
          sources: new Set(),
          nextAt: 0,
          waiting: new Map(),
          base: "Connecting…",
          hearing: false,
          thinking: false,
          working: 0,
          level: 0,
          speaking: false,
          quietAt: 0,
        } as Call;
        current.wire =
          ticket.protocol === "azure-voice-live"
            ? azureVoiceLive(current)
            : geminiLive(current, ticket.setup);
        newResponse();
        call = current;
        // The call has its own audio now, and the attempt is over.
        playback = null;
        starting = null;
        provider.textContent = ticket.label ?? PROVIDERS[ticket.protocol] ?? "";
        // Other voices on the page stay quiet while a call is on.
        document.documentElement.dataset.genuiCall = "on";
        if (current.socket.readyState === WebSocket.OPEN) current.wire.begin();
        else current.socket.onopen = () => current.wire.begin();
        current.socket.onmessage = (event) => void onMessage(current, event);
        current.socket.onclose = (event) => {
          // A relay or a provider can say why it hung up.
          if (current === call) hangUp(event.reason.slice(0, 160) || "The call ended.");
        };
        requestAnimationFrame(captions);
      } catch {
        // A press that cancelled this attempt has already said what there is to say.
        if (attempt.signal.aborted) return;
        if (call) hangUp("The call could not start.");
        else cancelStart("The call could not start.");
      } finally {
        void playback?.close();
      }
    }

    toggle.addEventListener("click", () => {
      if (call) hangUp();
      // Pressed while connecting: this is a cancel, not a second call.
      else if (starting) cancelStart();
      else void start();
    });

    // During a call, a typed message is said to the model, not posted.
    document.addEventListener(
      "submit",
      (event) => {
        const form = event.target as HTMLFormElement;
        // Any form's submit comes here: only the composer, which is not the
        // model's, is used by its own property names.
        if (!call || formGet(form, "dataset").testid !== "chat-composer") return;
        const input = form.querySelector("textarea");
        const text = input?.value.trim();
        if (!text || call.socket.readyState !== WebSocket.OPEN) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        quiet();
        if (reader.trim() || said.trim()) endTurn();
        reader = text;
        showReader();
        call.wire.text(text);
        mark({ thinking: true });
        form.reset();
      },
      true,
    );

    // During a call, a form in the thread that the reader presses is said to
    // the model too: its answer does not start a typed reply.
    document.addEventListener(
      "submit",
      (event) => {
        const form = event.target as HTMLFormElement;
        if (!call || !thread()?.contains(form) || isApproval(form)) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const current = call;
        void sendForm(form, event.submitter).then((sent) => {
          if (!sent || current !== call) return;
          quiet();
          if (reader.trim() || said.trim()) endTurn();
          if (!sent.hidden) {
            reader = sent.say;
            showReader();
          }
          current.wire.text(sent.say);
          mark({ thinking: true }, current);
        });
      },
      true,
    );

    window.addEventListener("pagehide", () => hangUp());
    if (typeof WebSocket === "function" && typeof AudioContext === "function") {
      root.hidden = false;
    }
  </script>
</div>
