<!-- @bascik
A line in a reply that says the assistant just saved something about the reader, with an Undo button. Written by the app for a finished remember call, never by a model. It is a plain form, so Undo works with no JavaScript.

Props: `memory` (the memory's id, posted as `id`), `app` (posted as `app`) and `route` (where Undo posts; `/api/forget` without it). Setting `route` prints one build line, "Attribute binding conflict … prop wins": that is the prop replacing the default, as meant.

Slot: the default slot is the words that were saved.

Around it: a reply in the thread. Inside a `data-chat` element the client runtime sends the form and streams the answer in. It reads the theme tokens `--border`, `--radius`, `--muted`, `--bg` and `--accent`, and `--text-small` when it is set.
-->
<style>
  .note {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 0.75rem;
    align-items: center;
    margin: 0;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: var(--text-small, 0.875rem);
  }
  .label {
    color: var(--muted);
    font-weight: 600;
  }
  .text {
    flex: 1 1 10rem;
    min-inline-size: 0;
    overflow-wrap: anywhere;
  }
  .undo {
    padding: 0.25rem 0.65rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg);
    color: inherit;
    font: inherit;
    font-size: 0.8125rem;
    font-weight: 600;
    cursor: pointer;
  }
  .undo:hover,
  .undo:focus-visible {
    border-color: var(--accent);
  }
</style>
<form
  class="note"
  method="post"
  action="/api/forget"
  data-bascik-attr-action="route"
  role="status"
  data-testid="memory-note"
>
  <input type="hidden" name="app" data-bascik-attr-value="app" />
  <input type="hidden" name="id" data-bascik-attr-value="memory" />
  <span class="label">Remembered:</span>
  <span class="text" data-testid="memory-note-text"
    ><span data-bascik-slot></span
  ></span>
  <button class="undo" data-testid="memory-note-undo">Undo</button>
</form>
