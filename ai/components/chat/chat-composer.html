<!-- @bascik
The message box: a plain form with a textarea and a Send button, so sending works with no JavaScript. With scripts on, Enter sends and Shift+Enter adds a line; with the client runtime (`chat-enhance`) a Stop button takes Send's place while this chat's reply streams. It holds no attachments, no voice and no model picker of its own: those are parts a page puts in its slots.

Props, all optional: `app` (sent with every message as the `app` field), `route` (where the form posts; `/api/send`), `stop-route` (where Stop posts; `/api/stop`), `placeholder` ("Ask a question…"), `label` (the message box's name for a screen reader; "Message"), `send-label` ("Send"), `stop-label` ("Stop") and `autofocus` (write `data-bascik-prop-autofocus="autofocus"` on the one composer of a page that takes the keyboard when the page opens; without it none does, and any value turns it on). Setting `route`, `stop-route`, `placeholder` or `label` prints one build line each, "Attribute binding conflict … prop wins": that is the prop replacing the default, as meant. Any other attribute on the tag lands on the form: write `enctype="multipart/form-data"` there for a form that sends files.

Slots, each optional, and an unfilled one takes no room:
- `above`: a line above the message box, for a status or a note. A status that comes and goes carries the `hidden` attribute while it has nothing to say: the line takes no room while every element in it is hidden. The same holds for `below`.
- `start`: before the message box, which is where `chat-attach` goes.
- the default slot: between the message box and Send, which is where `chat-voice` and `voice-call` go.
- `below`: a row under the message box, for a model picker or a note.
A named slot is filled by a wrapper element, never by the attribute on a component's own tag: `<chat-composer><span data-bascik-slot="start"><chat-attach /></span><chat-voice /></chat-composer>`.

Lines: a part in any slot can put an element of its own on a full line above or below the message box by marking it `data-chat-line="above"` or `data-chat-line="below"`. Two more values place a line among those above: `data-chat-line="top"` is the first line of all, which is where captions go, and `data-chat-line="near"` is the last, next to the message box, which is where controls that a button in the row opens go. Lines of the same kind stack in source order. The marked element must be a child of the part's root, and that root must have no box (`display: contents`), so the line is laid out by the composer; `chat-attach`, `chat-voice` and `voice-call` are written this way.

Around it: a `data-chat` element that also holds the thread. The client runtime writes `data-genui="streaming"` on that element while its reply streams, and this part shows Stop from it, so with two chats on a page only the one that is streaming shows Stop; on a page with no `data-chat` element the state is read from `<html>`. Stop is a submit button that carries its route as `formaction`; the client runtime takes its click, so the form is never sent there. Its parts are marked `data-chat-part`: `composer` (the form), `input`, `send` and `stop`. A part may set `data-dragging` on the form while files are dragged over it. It reads the theme tokens `--border`, `--radius`, `--surface`, `--accent`, `--on-accent` and `--muted`.
-->
<style>
  .composer {
    display: flex;
    /* A line above or below the box is an item that takes a whole row. */
    flex-wrap: wrap;
    gap: 0.5rem 0.25rem;
    align-items: end;
    max-inline-size: 46rem;
    inline-size: 100%;
    margin-inline: auto;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) + 6px);
    background: var(--surface);
  }
  .composer:focus-within {
    border-color: var(--accent);
  }
  .composer[data-dragging] {
    border-color: var(--accent);
    border-style: dashed;
  }
  /* The lines: the composer's own two regions, and any element a slotted
     part marks as one. */
  .composer [data-chat-line] {
    flex: 0 0 100%;
  }
  .composer [data-chat-line="top"] {
    order: -3;
  }
  .composer [data-chat-line="above"] {
    order: -2;
  }
  .composer [data-chat-line="near"] {
    order: -1;
  }
  .composer [data-chat-line="below"] {
    order: 1;
  }
  .above,
  .below {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 0.6rem;
    align-items: center;
    padding-inline: 0.4rem;
    color: var(--muted);
    font-size: 0.8125rem;
  }
  /* A region with nothing to show takes no row: an unfilled one, and one
     whose every element is hidden. */
  .above:empty,
  .below:empty,
  .above:has(> [hidden]):not(:has(> :not([hidden]))),
  .below:has(> [hidden]):not(:has(> :not([hidden]))) {
    display: none;
  }
  /* These two regions have no box: what is slotted into them joins the row
     of the message box, and its lines join the lines. */
  .start,
  .actions {
    display: contents;
  }
  .input {
    flex: 1 1 10rem;
    min-block-size: 2.5rem;
    max-block-size: 12rem;
    padding: 0.5rem 0.6rem;
    border: 0;
    outline: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    resize: none;
    field-sizing: content;
  }
  .send {
    padding: 0.55rem 1rem;
    border: 0;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--on-accent);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    margin-inline-start: 0.25rem;
  }
  /* While this chat's reply streams, Stop takes Send's place. The state is
     on the chat's own element, or on <html> for a page that marks no chat. */
  [data-chat][data-genui="streaming"] .stop,
  html[data-genui="streaming"]:not(:has([data-chat])) .stop {
    display: inline-block;
  }
  [data-chat][data-genui="streaming"] .send:not(.stop),
  html[data-genui="streaming"]:not(:has([data-chat])) .send:not(.stop) {
    display: none;
  }
</style>
<form
  class="composer"
  method="post"
  action="/api/send"
  data-bascik-attr-action="route"
  data-chat-part="composer"
  data-testid="chat-composer"
>
  <input type="hidden" name="app" data-bascik-attr-value="app" />
  <!-- A region is written on one line, with nothing around its slot: an
       unfilled one is then empty, and takes no room. -->
  <!-- prettier-ignore -->
  <div class="above" data-chat-line="above"><span data-bascik-slot="above"></span></div>
  <div class="start"><span data-bascik-slot="start"></span></div>
  <textarea
    id="input"
    class="input"
    name="text"
    rows="1"
    required
    data-bascik-attr-autofocus="autofocus"
    placeholder="Ask a question…"
    data-bascik-attr-placeholder="placeholder"
    aria-label="Message"
    data-bascik-attr-aria-label="label"
    data-chat-part="input"
    data-testid="chat-composer-input"
  ></textarea>
  <div class="actions"><span data-bascik-slot></span></div>
  <button
    class="send"
    data-chat-part="send"
    data-testid="chat-composer-send"
    data-bascik-prop-send-label
  >
    Send
  </button>
  <!-- Shown while a reply streams, which takes the client runtime: never
       without a script. Its route is here so that the site's base applies;
       the runtime takes the click and posts there itself. -->
  <button
    class="send stop"
    type="submit"
    hidden
    formnovalidate
    formaction="/api/stop"
    data-bascik-attr-formaction="stop-route"
    data-chat-part="stop"
    data-testid="chat-composer-stop"
    data-bascik-prop-stop-label
  >
    Stop
  </button>
  <!-- prettier-ignore -->
  <div class="below" data-chat-line="below"><span data-bascik-slot="below"></span></div>
  <!-- Optional: Enter sends, Shift+Enter adds a line. Without it the Send
       button still works. -->
  <script>
    const input = document.getElementById("input");
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        input.form.requestSubmit();
      }
    });
  </script>
</form>
