<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bascik AI on Workers: books</title>
    <meta
      name="description"
      content="A chat with generative UI, streamed as HTML by Bascik from Cloudflare Workers and Durable Objects."
    />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/style.css" />
    <!-- Hold the first paint until the stored conversation is parsed. The
         reply streams in after it. -->
    <link rel="expect" href="#thread-ready" blocking="render" />
  </head>
  <body>
    <!-- chat-app is the frame, the thread and the client runtime. This
         example replaces two of its parts: the sidebar, for its own links
         and note, and the composer, whose limits match FILE_LIMITS in
         src/lib/chat.ts (the server enforces them either way). -->
    <chat-app>
      <template data-bascik-slot="sidebar"><site-menu /></template>
      <template data-bascik-slot="composer">
        <chat-composer
          data-bascik-prop-app="books"
          data-bascik-prop-autofocus="autofocus"
          enctype="multipart/form-data"
        >
          <span data-bascik-slot="start">
            <chat-attach
              data-bascik-prop-max-bytes="1048576"
              data-bascik-prop-max-files="2"
              data-bascik-prop-max-total="2097152"
              data-bascik-prop-types="image/png,image/jpeg,image/webp,text/plain,text/markdown,application/pdf"
            />
          </span>
        </chat-composer>
      </template>
    </chat-app>
  </body>
</html>
