<!-- @bascik
The conversation list, the search box, and a foot with the link to the memory page. Its server script reads the reader's conversations from their ReaderData object on every request.
-->
<style>
  .sidebar {
    display: grid;
    grid-template-rows: auto auto auto 1fr auto;
    align-content: start;
    gap: 1rem;
    padding: 1rem;
    border-inline-end: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
  }
  .apps {
    display: grid;
    gap: 0.15rem;
    padding-block-end: 1rem;
    border-block-end: 1px solid var(--border);
  }
  .apps a {
    padding: 0.45rem 0.6rem;
    border-radius: calc(var(--radius) - 2px);
    color: inherit;
    font-weight: 600;
    text-decoration: none;
  }
  /* On the memory page the app it belongs to stays marked. */
  .apps a:hover,
  .apps a[aria-current="page"],
  .apps a[aria-current="true"] {
    background: var(--bg);
  }
  .new {
    inline-size: 100%;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: inherit;
    font: inherit;
    text-align: start;
    cursor: pointer;
  }
  .new:hover {
    border-color: var(--accent);
  }
  .list {
    display: grid;
    align-content: start;
    gap: 0.15rem;
  }
  .list form {
    display: contents;
  }
  .list button {
    padding: 0.45rem 0.6rem;
    border: 0;
    border-radius: calc(var(--radius) - 2px);
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 0.875rem;
    text-align: start;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .list button:hover,
  .list button[aria-current="true"] {
    background: var(--bg);
  }
  /* The foot holds what is not a conversation: the link to the reader's
     memory and a note on what this demo keeps. */
  .foot {
    display: grid;
    gap: 0.75rem;
    padding-block-start: 0.75rem;
    border-block-start: 1px solid var(--border);
  }
  .settings a {
    display: block;
    padding: 0.45rem 0.6rem;
    border-radius: calc(var(--radius) - 2px);
    color: inherit;
    font-size: 0.875rem;
    text-decoration: none;
  }
  .settings a:hover,
  .settings a[aria-current="page"] {
    background: var(--bg);
  }
  .apps a:focus-visible,
  .settings a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .search form {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0.3rem 0.4rem;
  }
  .search-label {
    position: absolute;
    inline-size: 1px;
    block-size: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .search-input,
  .search-go {
    padding: 0.4rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 2px);
    background: var(--bg);
    color: inherit;
    font: inherit;
    font-size: 0.875rem;
  }
  .search-input {
    min-inline-size: 0;
  }
  .search-go {
    font-weight: 600;
    cursor: pointer;
  }
  .search-input:focus-visible,
  .search-go:focus-visible {
    border-color: var(--accent);
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .found {
    display: grid;
    align-content: start;
    gap: 0.4rem;
  }
  .found-note {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    margin: 0;
    color: var(--muted);
    font-size: 0.8125rem;
  }
  .found-note a {
    color: var(--accent);
  }
  .matches {
    display: grid;
    align-content: start;
    gap: 0.15rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .note {
    margin: 0;
    padding-inline: 0.6rem;
    color: var(--muted);
    font-size: 0.75rem;
    line-height: 1.4;
  }
  @media (max-width: 720px) {
    .sidebar {
      display: none;
    }
  }
</style>
<aside class="sidebar" data-testid="chat-sidebar">
  <script data-bascik-server type="text/typescript">
    import { html } from "@bascik/bascik/html";
    import type { SearchMatch } from "@bascik/ai/app";
    import { APP_ID, chatOf } from "@/lib/chat.ts";
    import type { RequestContext } from "@/lib/env.ts";

    /**
     * A snippet with its matched words in mark. The snippet is something a
     * reader or a model said: it is only ever text here, and html escapes it.
     */
    const marked = (match: SearchMatch) => {
      const pieces = [];
      let at = 0;
      for (const [from, to] of match.marks) {
        pieces.push(match.snippet.slice(at, from));
        pieces.push(html`<mark>${match.snippet.slice(from, to)}</mark>`);
        at = to;
      }
      pieces.push(match.snippet.slice(at));
      return pieces;
    };

    export default async (request: Request, context: RequestContext) => {
      const { chat } = chatOf(context);
      const session = chat.session(request);
      const current = session.conversationId;
      const conversations = await chat.list(session);
      const found = await chat.search(request);
      const searching = new URL(request.url).searchParams.has("q");
      const onMemory = new URL(request.url).pathname === "/memory";
      return html`<nav class="apps" aria-label="Pages">
          <a
            href="/"
            data-testid="chat-sidebar-chat"
            aria-current="${onMemory ? "true" : "page"}"
            >Bookshop</a
          >
        </nav>
        <form method="post" action="/api/open">
          <input type="hidden" name="app" value="${APP_ID}" />
          <button class="new" data-testid="chat-sidebar-new">+ New chat</button>
        </form>
        <search class="search" data-testid="chat-sidebar-search">
          <form method="get" action="/">
            <label class="search-label" for="search-q"
              >Search conversations</label
            >
            <input
              id="search-q"
              class="search-input"
              type="search"
              name="q"
              value="${found.query}"
              placeholder="Search conversations"
              maxlength="200"
              autocomplete="off"
              data-testid="chat-sidebar-search-input"
            />
            <button class="search-go" data-testid="chat-sidebar-search-go">
              Search
            </button>
          </form>
        </search>
        ${searching
          ? html`<section class="found" aria-label="Search results">
              <p class="found-note" data-testid="chat-sidebar-search-note">
                ${found.tooShort
                  ? "Type at least 2 characters."
                  : found.matches.length === 0
                    ? html`<span data-testid="chat-sidebar-search-empty"
                        >No conversation mentions “${found.query}”.</span
                      >`
                    : `${found.matches.length} found`}
                <a href="/" data-testid="chat-sidebar-search-clear">Clear</a>
              </p>
              <ol class="matches" data-testid="chat-sidebar-search-results">
                ${found.matches.map(
                  (match) =>
                    html`<search-result
                      data-bascik-prop-app="${APP_ID}"
                      data-bascik-prop-conversation="${match.id}"
                      data-bascik-prop-title="${match.title}"
                      >${marked(match)}</search-result
                    >`,
                )}
              </ol>
            </section>`
          : html`<nav class="list" aria-label="Conversations">
              ${conversations
                .filter((conversation) => conversation.messages.length > 0)
                .map(
                  (conversation) =>
                    html`<form method="post" action="/api/open">
                      <input type="hidden" name="app" value="${APP_ID}" />
                      <input
                        type="hidden"
                        name="id"
                        value="${conversation.id}"
                      />
                      <button
                        data-testid="chat-sidebar-item"
                        aria-current="${conversation.id === current
                          ? "true"
                          : "false"}"
                      >
                        ${conversation.title}
                      </button>
                    </form>`,
                )}
            </nav>`}
        <footer class="foot" data-testid="chat-sidebar-foot">
          <nav class="settings" aria-label="Your data">
            <a
              href="/memory"
              data-testid="chat-sidebar-memory"
              aria-current="${onMemory ? "page" : "false"}"
              >Memory</a
            >
          </nav>
          <p class="note" data-testid="chat-sidebar-note">
            Replies come from a fixed script, not a model. Chats, memories and
            files are deleted 24 hours after your last message.
          </p>
        </footer>`;
    };
  </script>
</aside>
