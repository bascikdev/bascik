<!-- @bascik
What the assistant remembers about the reader, read from their ReaderData object on every request, under a link back to the chat. Each memory is a memory-item with a Forget button; the html helper escapes the text, so nothing saved is ever drawn as markup.
-->
<style>
  .panel {
    flex: 1;
    min-block-size: 0;
    overflow-y: auto;
  }
  /* The page's column: the list fills whatever width it is given. */
  .column {
    display: grid;
    gap: 1.5rem;
    max-inline-size: 46rem;
    margin-inline: auto;
    padding-block: 1rem 1.5rem;
  }
  .top {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 1rem;
    align-items: baseline;
    justify-content: space-between;
    font-size: 0.875rem;
  }
  .back {
    display: inline-flex;
    align-items: center;
    min-block-size: 2.75rem;
    color: inherit;
    font-weight: 600;
    text-underline-offset: 0.2em;
  }
  .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
<div class="panel" data-testid="memory-panel">
  <script data-bascik-stream type="text/typescript">
    import { html } from "@bascik/bascik/html";
    import { APP_ID, chatOf } from "@/lib/chat.ts";
    import type { RequestContext } from "@/lib/env.ts";

    export default async function* (
      request: Request,
      context: RequestContext,
    ) {
      const memories = await chatOf(context).chat.memories(request);
      yield html`<div class="column">
        <nav class="top" aria-label="Memory">
          <a class="back" href="/" data-testid="memory-back"
            >Back to Bookshop</a
          >
        </nav>
        <memory-list
        >${memories.map(
          (memory) =>
            html`<memory-item
              data-bascik-prop-app="${APP_ID}"
              data-bascik-prop-memory="${memory.id}"
              data-bascik-prop-saved="${new Date(memory.created)
                .toISOString()
                .slice(0, 10)}"
              data-bascik-prop-back="/memory"
              >${memory.text}</memory-item
            >`,
        )}</memory-list
      >
      </div>`;
    }
  </script>
</div>
