<!-- @bascik
What the assistant remembers about the reader, read from their ReaderData object on every request. Each memory is a memory-item with a Forget button; the html helper escapes the text, so nothing saved is ever drawn as markup.
-->
<style>
  .panel {
    flex: 1;
    min-block-size: 0;
    overflow-y: auto;
  }
</style>
<div class="panel" data-testid="memory-panel">
  <script data-bascik-stream type="text/typescript">
    import { html } from "@bascik/bascik/html";
    import { APP_ID, chatOf } from "@/lib/chat.ts";
    import type { RequestContext } from "@/lib/env.ts";

    export default async function* (
      request: Request,
      context: RequestContext,
    ) {
      const memories = await chatOf(context).chat.memories(request);
      yield html`<memory-list
        >${memories.map(
          (memory) =>
            html`<memory-item
              data-bascik-prop-app="${APP_ID}"
              data-bascik-prop-memory="${memory.id}"
              data-bascik-prop-saved="${new Date(memory.created)
                .toISOString()
                .slice(0, 10)}"
              data-bascik-prop-back="/memory"
              >${memory.text}</memory-item
            >`,
        )}</memory-list
      >`;
    }
  </script>
</div>
