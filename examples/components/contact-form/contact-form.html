<!-- @bascik
A contact form that validates in the browser and posts JSON to /api/contact (the starter site's src/api/contact.ts handles it). Without JavaScript it falls back to a normal form POST. Field names ship as written, so the server receives name, email, and message.
-->
<style>
  .form {
    display: grid;
    gap: 1rem;
    max-width: 32rem;
    padding: 1.5rem;
    border-radius: var(--radius, 0.5rem);
    background: var(
      --color-surface,
      color-mix(in srgb, currentColor 8%, transparent)
    );
  }

  .field {
    display: grid;
    gap: 0.25rem;
  }

  .input {
    padding: 0.5rem 0.75rem;
    border: 1px solid
      var(--color-border, color-mix(in srgb, currentColor 30%, transparent));
    border-radius: var(--radius, 0.5rem);
    background: var(--color-bg, Field);
    color: inherit;
    font: inherit;
  }

  .input:focus-visible {
    outline: 2px solid var(--color-accent, currentColor);
    outline-offset: 1px;
  }

  .input:user-invalid {
    outline: 2px solid var(--color-danger, #c62828);
  }

  .submit {
    justify-self: start;
    padding: 0.5rem 1.25rem;
    border: 0;
    border-radius: var(--radius, 0.5rem);
    background: var(--color-accent, #2457d6);
    color: var(--color-accent-contrast, #ffffff);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  .submit:disabled {
    opacity: 0.6;
    cursor: progress;
  }

  .status {
    margin: 0;
    color: var(--color-muted, inherit);
  }
</style>
<!-- Bascik ships name as written, so the server receives the keys name, email and message. -->
<form class="form" id="form" action="/api/contact" method="post">
  <div class="field">
    <label for="name">Name</label>
    <input class="input" id="name" name="name" autocomplete="name" required />
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input
      class="input"
      id="email"
      name="email"
      type="email"
      autocomplete="email"
      required
    />
  </div>
  <div class="field">
    <label for="message">Message</label>
    <textarea
      class="input"
      id="message"
      name="message"
      rows="5"
      required
      minlength="10"
    ></textarea>
  </div>
  <button class="submit" id="submit" type="submit">Send</button>
  <p class="status" id="status" role="status"></p>
</form>
<script type="text/typescript">
  const form = document.getElementById("form") as HTMLFormElement;
  const submit = document.getElementById("submit") as HTMLButtonElement;
  const status = document.getElementById("status") as HTMLElement;

  form.addEventListener("submit", async (event: SubmitEvent) => {
    event.preventDefault();
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }
    submit.disabled = true;
    status.textContent = "Sending...";
    try {
      const response = await fetch(form.action, {
        method: "POST",
        headers: {
          "content-type": "application/json",
          accept: "application/json",
        },
        body: JSON.stringify(Object.fromEntries(new FormData(form))),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      form.reset();
      status.textContent = "Thanks. Your message was sent.";
    } catch {
      status.textContent =
        "Sorry, the message could not be sent. Please try again.";
    } finally {
      submit.disabled = false;
    }
  });
</script>
