<!-- @bascik
A contact form that validates in the browser and posts JSON to /api/contact (the starter site's src/api/contact.ts handles it). Without JavaScript it falls back to a normal form POST. Field names are preserved so the server receives name, email, and message.
-->
<style>
  .form {
    display: grid;
    gap: 1rem;
    max-width: 32rem;
  }

  .field {
    display: grid;
    gap: 0.25rem;
  }

  .input {
    font: inherit;
    padding: 0.5rem;
  }

  .input:user-invalid {
    outline: 2px solid #c62828;
  }

  .submit {
    justify-self: start;
    font: inherit;
  }

  .status {
    margin: 0;
  }
</style>
<!-- data-bascik-preserve="name" keeps the field names literal. Without it, Bascik scopes them per instance and the
     server would receive keys like bascik__contact-form__a1b2__email. -->
<form class="form" id="form" action="/api/contact" method="post" data-bascik-preserve="name" novalidate>
  <div class="field">
    <label for="name">Name</label>
    <input class="input" id="name" name="name" autocomplete="name" required />
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input class="input" id="email" name="email" type="email" autocomplete="email" required />
  </div>
  <div class="field">
    <label for="message">Message</label>
    <textarea class="input" id="message" name="message" rows="5" required minlength="10"></textarea>
  </div>
  <button class="submit" id="submit" type="submit">Send</button>
  <p class="status" id="status" role="status"></p>
</form>
<script>
  const form = document.getElementById('form');
  const submit = document.getElementById('submit');
  const status = document.getElementById('status');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }
    submit.disabled = true;
    status.textContent = 'Sending...';
    try {
      const response = await fetch(form.action, {
        method: 'POST',
        headers: { 'content-type': 'application/json', accept: 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form))),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      form.reset();
      status.textContent = 'Thanks. Your message was sent.';
    } catch {
      status.textContent = 'Sorry, the message could not be sent. Please try again.';
    } finally {
      submit.disabled = false;
    }
  });
</script>
