<!-- @bascik
Copies a text value to the clipboard and announces the result to screen readers.
@prop text - The exact text to copy.
@prop label - Button text. Defaults to "Copy".
-->
<style>
  .copy-button {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }

  .button {
    padding: 0.25rem 0.75rem;
    border: 1px solid
      var(--color-border, color-mix(in srgb, currentColor 30%, transparent));
    border-radius: var(--radius, 0.5rem);
    background: var(
      --color-surface,
      color-mix(in srgb, currentColor 8%, transparent)
    );
    color: inherit;
    font: inherit;
    cursor: pointer;
  }

  .button:hover {
    border-color: var(--color-accent, currentColor);
  }

  .status {
    color: var(--color-muted, inherit);
    font-size: 0.875em;
  }
</style>
<span class="copy-button">
  <button
    class="button"
    id="button"
    type="button"
    data-bascik-attr-data-text="text"
  >
    <span data-bascik-prop-label>Copy</span>
  </button>
  <span class="status" id="status" role="status"></span>
</span>
<script type="text/typescript">
  const button = document.getElementById("button") as HTMLButtonElement;
  const status = document.getElementById("status") as HTMLElement;
  let timer: ReturnType<typeof setTimeout> | undefined;

  button.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(button.dataset.text ?? "");
      status.textContent = "Copied";
    } catch {
      // Clipboard access needs a secure context (HTTPS or localhost) and can be denied.
      status.textContent = "Copy failed. Select the text and copy it manually.";
    }
    clearTimeout(timer);
    timer = setTimeout(() => {
      status.textContent = "";
    }, 2000);
  });
</script>
