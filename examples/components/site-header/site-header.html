<!-- @bascik
A site header: a skip link, the site name, and the main navigation, with the current page marked at build time. The links live in links.ts next to this file. Every page needs <main id="main"> for the skip link.
@prop name - Site name, linking to the home page. Defaults to "Example Site".
@slot default - Controls at the end of the bar, such as a theme toggle. Optional.
-->
<style>
  .skip-link {
    position: absolute;
    top: -10rem;
    left: var(--space-3, 1rem);
    z-index: 100;
    padding: var(--space-2, 0.5rem) var(--space-3, 1rem);
    background: var(--color-accent, #2457d6);
    color: var(--color-accent-contrast, #ffffff);
  }

  .skip-link:focus {
    top: var(--space-3, 1rem);
  }

  .header {
    border-bottom: 1px solid var(--color-border, currentColor);
  }

  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-3, 1rem);
    max-width: var(--content-width, 70rem);
    margin-inline: auto;
    padding: var(--space-3, 1rem);
  }

  .brand {
    margin-right: auto;
    color: inherit;
    font-weight: 700;
    text-decoration: none;
  }

  /* The build script below prints this list. Build script output is scoped like the template, so these selectors
     match it. Two classes outrank a site-wide rule such as `.content ul`, so the reset always applies. */
  .header .nav-list {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-3, 1rem);
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .nav-list li {
    margin: 0;
  }

  .nav-list a {
    color: inherit;
    text-decoration: none;
  }

  .nav-list a[aria-current] {
    color: var(--color-accent, inherit);
    text-decoration: underline;
    text-underline-offset: 0.3em;
  }
</style>
<!-- The skip link is the header's first child, so it is the first stop in the Tab order and the <header> is the
     component's one root (a data-testid or class on <site-header> lands on it). -->
<header class="header" data-testid="site-header">
  <a class="skip-link" href="#main" data-testid="site-header-skip-link"
    >Skip to content</a
  >
  <div class="bar">
    <a class="brand" href="/"
      ><span data-bascik-prop-name>Example Site</span></a
    >
    <nav aria-label="Site" data-testid="site-header-nav">
      <script data-bascik-build type="text/typescript">
        import { navLinks } from "./links.ts";
        export default () => navLinks(process.env.BASCIK_PAGE_PATH);
      </script>
    </nav>
    <div data-bascik-slot></div>
  </div>
</header>
