<!-- @bascik
A list with a live text filter. Pass <li> items in the default slot. Without JavaScript the full list shows and the filter box stays hidden.
@prop label - Label for the filter box. Defaults to "Filter".
@slot default - The <li> items to filter.
-->
<style>
  .filter-list {
    display: grid;
    gap: 0.5rem;
  }

  .controls {
    display: grid;
    gap: 0.25rem;
  }

  .input {
    font: inherit;
    padding: 0.5rem;
  }

  .items {
    margin: 0;
    padding-left: 1.25rem;
  }

  .count {
    margin: 0;
    font-size: 0.875em;
  }
</style>
<div class="filter-list">
  <div class="controls" id="controls" hidden>
    <label for="query" data-bascik-prop-label>Filter</label>
    <input class="input" id="query" type="search" autocomplete="off" />
    <p class="count" id="count" aria-live="polite"></p>
  </div>
  <ul class="items" id="items">
    <li data-bascik-slot></li>
  </ul>
</div>
<script>
  const query = document.getElementById('query');
  const count = document.getElementById('count');
  const items = [...document.getElementById('items').children];

  const apply = () => {
    const needle = query.value.trim().toLowerCase();
    let shown = 0;
    for (const item of items) {
      const match = item.textContent.toLowerCase().includes(needle);
      item.hidden = !match;
      if (match) shown++;
    }
    count.textContent = needle ? `${shown} of ${items.length} shown` : '';
  };

  query.addEventListener('input', apply);
  // The browser may restore a typed value on Back or reload without firing input.
  window.addEventListener('pageshow', apply);
  document.getElementById('controls').hidden = false;
</script>
