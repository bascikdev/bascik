<!doctype html>
<html lang="en">
  <head>
    <site-head />
    <script data-bascik-build type="text/typescript">
      import { html } from "@bascik/bascik/html";
      import { seo, jsonLd, breadcrumbList } from "@/lib/seo.ts";
      export default () => {
        const tags = seo({
          title: "About - Example Site",
          description:
            "Who runs Example Site, what we build, and how to get in touch with the team.",
        });
        const breadcrumbs = jsonLd(
          breadcrumbList([{ name: "Home", path: "/" }, { name: "About" }]),
        );
        return html`${tags}${breadcrumbs}`;
      };
    </script>
  </head>

  <body>
    <site-header><theme-toggle /></site-header>
    <main id="main" class="container" data-testid="about-main">
      <h1>About</h1>
      <p>
        Tell visitors who you are and why the site exists. Keep each page to one
        clear purpose.
      </p>
      <h2 id="contact">Contact</h2>
      <p>Email <a href="mailto:hello@example.com">hello@example.com</a>.</p>
    </main>
    <site-footer />
  </body>
</html>
