<!doctype html>
<html lang="en">
  <head>
    <site-head />
    <script data-bascik-build type="text/typescript">
      import { seo } from "@/lib/seo.ts";
      export default () =>
        seo({
          title: "Tags - Example Site",
          description:
            "Every topic the Example Site blog covers, with the number of posts for each.",
        });
    </script>
  </head>

  <body>
    <site-header><theme-toggle /></site-header>
    <main id="main" class="container" data-testid="blog-tags-main">
      <h1>Tags</h1>
      <script data-bascik-build type="text/typescript">
        import { html } from "@bascik/bascik/html";
        import { getPosts, groupByTag } from "@/lib/posts.ts";
        export default async () => {
          const groups = groupByTag(await getPosts());
          if (groups.length === 0) return html`<p>No tags yet.</p>`;
          return html`<ul>${groups.map(
            ({ tag, posts }) =>
              html`<li><a href="/blog/tags/${tag}/">${tag}</a> (${posts.length})</li>`,
          )}</ul>`;
        };
      </script>
    </main>
    <site-footer />
  </body>
</html>
