<!-- @bascik
The site header: a skip link, the site name, the main navigation from src/lib/nav.ts with the current page marked, and the theme toggle. Every page needs <main id="main"> for the skip link.
@prop name - Site name linking to the home page. Defaults to "Example Site".
-->
<style>
  .header {
    border-bottom: 1px solid var(--color-border);
  }

  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-3);
    padding-block: var(--space-3);
  }

  .brand {
    margin-right: auto;
    color: inherit;
    font-weight: 700;
    text-decoration: none;
  }

  /* The nav list is printed by the build script below. Build script output is scoped like the template, so these
     class and element selectors match it. */
  .nav-list {
    display: flex;
    gap: var(--space-3);
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .nav-list a {
    color: inherit;
    text-decoration: none;
  }

  .nav-list a[aria-current] {
    color: var(--color-accent);
    text-decoration: underline;
    text-underline-offset: 0.3em;
  }
</style>
<a class="skip-link" href="#main">Skip to content</a>
<header class="header">
  <div class="bar container">
    <a class="brand" href="/"><span data-bascik-prop-name>Example Site</span></a>
    <nav aria-label="Main">
      <!-- "page" makes this run for every page, so each one marks its own link as current. -->
      <script data-bascik-build="page">
        import { navLinks } from '@/lib/nav.ts';
        export default () => navLinks();
      </script>
    </nav>
    <theme-toggle />
  </div>
</header>
