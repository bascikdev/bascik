<!doctype html>
<html lang="en">

<head>
  <script data-bascik-routes>
    import { collectTags, loadPosts } from '@/lib/posts.ts';
    const tags = collectTags(await loadPosts());
    console.log(JSON.stringify(tags.map((tag) => ({ params: { tag: tag.slug } }))));
  </script>
  <script data-bascik-build>
    import { collectTags, loadPosts } from '@/lib/posts.ts';
    import { renderHead } from '@/lib/render.ts';
    const { params } = JSON.parse(process.env.BASCIK_ROUTE);
    const group = collectTags(await loadPosts()).find((tag) => tag.slug === params.tag);
    if (!group) throw new Error(`No tag for route /tags/${params.tag}/`);
    console.log(renderHead({ title: `Tagged “${group.name}”`, description: `Posts tagged ${group.name}.` }));
  </script>
</head>

<body>
  <site-header></site-header>
  <main id="main">
    <script data-bascik-build>
      import { collectTags, loadPosts } from '@/lib/posts.ts';
      import { renderTagPage } from '@/lib/render.ts';
      const { params } = JSON.parse(process.env.BASCIK_ROUTE);
      const group = collectTags(await loadPosts()).find((tag) => tag.slug === params.tag);
      if (!group) throw new Error(`No tag for route /tags/${params.tag}/`);
      console.log(renderTagPage(group));
    </script>
  </main>
  <site-footer></site-footer>
</body>

</html>
