<!-- @bascik
One book: title, author, a rating out of 5 such as 4.6, and a one-sentence blurb as content. Use it for every book you recommend or mention as an option. Its button lets the reader ask about the book.
-->
<style>
  .card {
    display: grid;
    gap: 0.35rem;
    align-content: start;
    padding: 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .title {
    margin: 0;
    font-size: 1rem;
    line-height: 1.3;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    margin: 0;
    color: var(--muted);
    font-size: 0.875rem;
  }
  .rating::before {
    content: "★ ";
    color: var(--accent);
  }
  .blurb {
    margin: 0.25rem 0 0.5rem;
    font-size: 0.9375rem;
  }
  .more {
    justify-self: start;
    padding: 0.3rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 0.8125rem;
    cursor: pointer;
  }
  .more:hover {
    border-color: var(--accent);
  }
</style>
<!-- data-say: what the voice reads for this card. A card is a picture, so
     without it the card would be skipped. -->
<article class="card" data-testid="book-card" data-bascik-attr-data-say="title">
  <h3 class="title" data-testid="book-card-title" data-bascik-prop-title>
    Untitled
  </h3>
  <p class="meta">
    <span data-testid="book-card-author" data-bascik-prop-author></span>
    <span class="rating" data-testid="book-card-rating" data-bascik-prop-rating
      >–</span
    >
  </p>
  <p class="blurb"><span data-bascik-slot></span></p>
  <form method="post" action="/api/send">
    <input
      type="hidden"
      name="Tell me more about"
      data-bascik-attr-value="title"
    />
    <button class="more" data-testid="book-card-more">Tell me more</button>
  </form>
</article>
