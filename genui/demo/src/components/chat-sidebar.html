<!-- @bascik
The conversation list. Its server script reads the stored conversations on every request.
-->
<style>
  .sidebar {
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    align-content: start;
    gap: 1rem;
    padding: 1rem;
    border-inline-end: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
  }
  .apps {
    display: grid;
    gap: 0.15rem;
    padding-block-end: 1rem;
    border-block-end: 1px solid var(--border);
  }
  .apps a {
    padding: 0.45rem 0.6rem;
    border-radius: calc(var(--radius) - 2px);
    color: inherit;
    font-weight: 600;
    text-decoration: none;
  }
  .apps a:hover,
  .apps a[aria-current="page"] {
    background: var(--bg);
  }
  .new {
    inline-size: 100%;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: inherit;
    font: inherit;
    text-align: start;
    cursor: pointer;
  }
  .new:hover {
    border-color: var(--accent);
  }
  .model {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0.3rem 0.4rem;
    padding-top: 0.75rem;
    border-block-start: 1px solid var(--border);
  }
  .model-label {
    grid-column: 1 / -1;
    color: var(--muted);
    font-size: 0.8125rem;
    font-weight: 600;
  }
  .model-select,
  .model-use {
    padding: 0.4rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 2px);
    background: var(--bg);
    color: inherit;
    font: inherit;
    font-size: 0.875rem;
  }
  .model-select {
    min-inline-size: 0;
  }
  .model-use {
    font-weight: 600;
    cursor: pointer;
  }
  .list {
    display: grid;
    align-content: start;
    gap: 0.15rem;
  }
  .list form {
    display: contents;
  }
  .list button {
    padding: 0.45rem 0.6rem;
    border: 0;
    border-radius: calc(var(--radius) - 2px);
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 0.875rem;
    text-align: start;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .list button:hover,
  .list button[aria-current="true"] {
    background: var(--bg);
  }
  @media (max-width: 720px) {
    .sidebar {
      display: none;
    }
  }
</style>
<aside class="sidebar" data-testid="chat-sidebar">
  <script data-bascik-server type="text/typescript">
    import { html } from "@bascik/bascik/html";
    import { APPS } from "@/lib/apps.ts";
    import { listConversations, sessionFor } from "@/lib/chat.ts";
    import { listModels, pickModel, requestedModel } from "@/lib/models.ts";

    export default async (request: Request) => {
      const session = sessionFor(request);
      const { app, conversationId: current } = session;
      const conversations = await listConversations(session);
      const models = await listModels();
      const chosen = pickModel(models, requestedModel(request));
      const groups = [...new Set(models.map((model) => model.group))];
      return html`<nav class="apps" aria-label="Apps">
          ${APPS.map(
            (entry) =>
              html`<a
                href="${entry.path}"
                data-testid="chat-sidebar-app"
                aria-current="${entry.id === app.id ? "page" : "false"}"
                >${entry.name}</a
              >`,
          )}
        </nav>
        <form method="post" action="/api/open">
          <input type="hidden" name="app" value="${app.id}" />
          <button class="new" data-testid="chat-sidebar-new">+ New chat</button>
        </form>
        <nav class="list" aria-label="Conversations">
          ${conversations
            .filter((conversation) => conversation.messages.length > 0)
            .map(
              (conversation) =>
                html`<form method="post" action="/api/open">
                  <input type="hidden" name="app" value="${app.id}" />
                  <input type="hidden" name="id" value="${conversation.id}" />
                  <button
                    data-testid="chat-sidebar-item"
                    aria-current="${conversation.id === current
                      ? "true"
                      : "false"}"
                  >
                    ${conversation.title}
                  </button>
                </form>`,
            )}
        </nav>
        <form
          class="model"
          method="post"
          action="/api/model"
          data-testid="chat-sidebar-model"
        >
          <input type="hidden" name="app" value="${app.id}" />
          <label class="model-label" for="model">Model</label>
          <select
            class="model-select"
            id="model"
            name="model"
            data-testid="chat-sidebar-model-select"
          >
            ${groups.map(
              (group) =>
                html`<optgroup label="${group}">
                  ${models
                    .filter((model) => model.group === group)
                    .map((model) =>
                      model.id === chosen.id
                        ? html`<option value="${model.id}" selected>
                            ${model.name}
                          </option>`
                        : html`<option value="${model.id}">
                            ${model.name}
                          </option>`,
                    )}
                </optgroup>`,
            )}
          </select>
          <button class="model-use" data-testid="chat-sidebar-model-use">
            Use
          </button>
        </form>`;
    };
  </script>
</aside>
