<!-- @bascik
The message box. A plain form that posts to /api/send, so sending works with no JavaScript. Anything put inside the tag joins the row before the Send button, which is where chat-voice and voice-call go.
-->
<style>
  .composer {
    display: flex;
    /* A component in the row can add a line of its own above the box. */
    flex-wrap: wrap;
    gap: 0.5rem 0.25rem;
    align-items: end;
    max-inline-size: 46rem;
    inline-size: 100%;
    margin-inline: auto;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) + 6px);
    background: var(--surface);
  }
  .composer:focus-within {
    border-color: var(--accent);
  }
  .input {
    flex: 1 1 10rem;
    min-block-size: 2.5rem;
    max-block-size: 12rem;
    padding: 0.5rem 0.6rem;
    border: 0;
    outline: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    resize: none;
    field-sizing: content;
  }
  .send {
    padding: 0.55rem 1rem;
    border: 0;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--on-accent);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    margin-inline-start: 0.25rem;
  }
</style>
<form
  class="composer"
  method="post"
  action="/api/send"
  data-testid="chat-composer"
>
  <input type="hidden" name="app" data-bascik-attr-value="app" />
  <textarea
    id="input"
    class="input"
    name="text"
    rows="1"
    required
    autofocus
    placeholder="Ask a question…"
    aria-label="Message"
    data-testid="chat-composer-input"
  ></textarea>
  <div data-bascik-slot></div>
  <button class="send" data-testid="chat-composer-send">Send</button>
  <!-- Shown by chat-enhance while a reply streams; never without a script. -->
  <button class="send" type="button" hidden data-testid="chat-composer-stop">
    Stop
  </button>
  <!-- The only client script in the app, and it is optional: Enter sends,
       Shift+Enter adds a line. Without it the Send button still works. -->
  <script>
    const input = document.getElementById("input");
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        input.form.requestSubmit();
      }
    });
  </script>
</form>
