<!-- @bascik
The optional client runtime. Without it every form in the chat is a page load, and everything works. With it a form is sent with fetch and the page it answers with is streamed into the open one: no reload, an instant echo of the message, a Stop button, and component scripts that start as their component arrives. Put it in the page before the thread.
-->
<script type="text/typescript">
  const byTestId = (root: ParentNode, id: string): HTMLElement | null =>
    root.querySelector<HTMLElement>(`[data-testid="${id}"]`);
  const state = document.documentElement.dataset;
  let stop: AbortController | null = null;
  let next: { form: HTMLFormElement; submitter: HTMLElement | null } | null =
    null;

  /**
   * Copies a document that is still being parsed into the page, a little
   * more after every chunk. Text grows in place, an element is copied once
   * and then filled in, and a script is created fresh, when it is complete,
   * so it runs exactly once.
   */
  function mirror(final: boolean, sourceRoot: Node, targetRoot: Node): void {
    const closed = (node: Node): boolean => {
      for (let at: Node | null = node; at && at !== sourceRoot; at = at.parentNode) {
        if (at.nextSibling) return true;
      }
      return final;
    };
    const copy = (source: Node, target: Node): void => {
      for (let child = source.firstChild; child; child = child.nextSibling) {
        if (finished.has(child)) continue;
        let twin = twins.get(child);
        if (child instanceof Text || child instanceof Comment) {
          if (!twin) {
            twin = document.importNode(child, false);
            twins.set(child, twin);
            target.appendChild(twin);
          }
          (twin as CharacterData).data = child.data;
        } else if (child instanceof Element) {
          const isScript = child.localName === "script";
          if (isScript && !closed(child)) return;
          if (!twin) {
            // importNode would carry over a script's "already started" flag.
            twin = isScript
              ? document.createElement("script")
              : document.importNode(child, false);
            if (isScript) {
              for (const { name, value } of child.attributes) {
                (twin as Element).setAttribute(name, value);
              }
              twin.textContent = child.textContent;
            }
            twins.set(child, twin);
            target.appendChild(twin);
          }
          if (!isScript) copy(child, twin);
        }
        if (closed(child)) finished.add(child);
      }
    };
    copy(sourceRoot, targetRoot);
  }
  let twins = new WeakMap<Node, Node>();
  let finished = new WeakSet<Node>();

  /** Show the message at once, and the caret, while the request is on its way. */
  function echo(thread: HTMLElement, text: string): void {
    if (text) {
      const turn = document.createElement("p");
      turn.className = "turn-user";
      // The same hook as the stored thread's message that replaces it.
      turn.dataset.testid = "turn-user";
      turn.textContent = text;
      thread.append(turn);
    }
    const live = document.createElement("div");
    live.className = "turn-assistant live";
    live.innerHTML = `<span class="writing"></span>`;
    // Until the first chunk of the answer replaces it: a reply is on its way.
    live.dataset.testid = "turn-pending";
    live.setAttribute("aria-busy", "true");
    thread.append(live);
  }

  async function send(form: HTMLFormElement, submitter: HTMLElement | null) {
    const thread = byTestId(document, "chat-thread");
    if (!thread) throw new Error("no thread");
    const body = new FormData(form, submitter);
    const text = body.get("text");
    stop = new AbortController();
    state.genui = "streaming";
    // A message with files is shown only once the server has taken it: it may
    // refuse a file, and then the reader's words and files must still be there.
    const withFiles = [...body.values()].some(
      (value) => typeof value !== "string" && value.size > 0,
    );
    const shown = (): void => {
      echo(thread, typeof text === "string" ? text.trim() : "");
      if (form.dataset.testid === "chat-composer") form.reset();
    };
    // Style on it: the request is in flight and nothing has come back yet.
    form.dataset.pending = "";
    const arrived = (): void => {
      delete form.dataset.pending;
    };
    if (!withFiles) shown();

    const response = await fetch(form.action, {
      method: "POST",
      body,
      signal: stop.signal,
      headers: { accept: "text/html" },
    });
    if (withFiles && response.status === 422) {
      // Refused: the answer is a page naming the reason. Show it in the
      // composer, which still holds the text and the files.
      const page = new DOMParser().parseFromString(
        await response.text(),
        "text/html",
      );
      const notice = byTestId(document, "chat-composer-notice");
      const why = byTestId(page.documentElement, "attach-refused")?.textContent;
      if (notice && why) {
        notice.textContent = why;
        notice.hidden = false;
        return;
      }
      throw new Error("refused");
    }
    if (!response.ok || !response.body) throw new Error("not a page");
    if (withFiles) shown();
    if (new URL(response.url).pathname !== location.pathname) {
      history.replaceState(null, "", response.url);
    }

    // Parse the answer as it arrives, in a document that is not shown.
    const parsed = document.implementation.createHTMLDocument("");
    const decoder = new TextDecoder();
    let fresh: HTMLElement | null = null;
    twins = new WeakMap();
    finished = new WeakSet();
    const sync = (final: boolean): void => {
      const source = byTestId(parsed, "chat-thread");
      if (!source) return;
      if (!fresh) {
        // Swap the thread in once the stored conversation is all there, so
        // the page never shows half of it.
        if (!final && !parsed.getElementById("thread-ready")) return;
        fresh = document.importNode(source, false);
        mirror(final, source, fresh);
        byTestId(document, "chat-thread")!.replaceWith(fresh);
        arrived();
      } else {
        mirror(final, source, fresh);
      }
    };
    const reader = response.body.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parsed.write(decoder.decode(value, { stream: true }));
      sync(false);
    }
    parsed.close();
    sync(true);
    if (!fresh) throw new Error("no thread in the answer");
    const sidebar = byTestId(parsed, "chat-sidebar");
    if (sidebar) {
      byTestId(document, "chat-sidebar")?.replaceWith(
        document.importNode(sidebar, true),
      );
    }
  }

  document.addEventListener("submit", (event) => {
    const form = event.target as HTMLFormElement;
    if (
      event.defaultPrevented ||
      form.method !== "post" ||
      !form.closest("main") ||
      form.dataset.genui === "native"
    ) {
      return;
    }
    event.preventDefault();
    const submitter = event.submitter;
    if (state.genui === "streaming") {
      // A component that sends itself (a client tool) can arrive while the
      // reply that holds it is still streaming: it is sent when that ends.
      next = { form, submitter };
      return;
    }
    send(form, submitter)
      .catch((error: unknown) => {
        // Stopped by the reader: keep what arrived, and end the caret.
        if (error instanceof DOMException && error.name === "AbortError") {
          document
            .querySelectorAll(".live:not(:has(.done))")
            .forEach((live) => live.insertAdjacentHTML("beforeend", `<span class="done"></span>`));
          return;
        }
        // Anything else: send the form the ordinary way.
        form.dataset.genui = "native";
        form.requestSubmit(submitter);
      })
      .finally(() => {
        delete form.dataset.pending;
        stop = null;
        const queued = next;
        next = null;
        if (queued?.form.isConnected) {
          // Still "streaming" to anything that watches: one reply, two requests.
          state.genui = "idle";
          queued.form.requestSubmit(queued.submitter);
          return;
        }
        state.genui = "idle";
        byTestId(document, "chat-composer-input")?.focus();
      });
  });

  // Stop asks the server to end the reply, so what was written is stored
  // before anything else is sent; the open response then ends by itself. If
  // the server cannot be asked, closing the connection ends the reply too.
  document.addEventListener("click", (event) => {
    const button = (event.target as Element).closest<HTMLButtonElement>(
      '[data-testid="chat-composer-stop"]',
    );
    if (!button?.form || !stop) return;
    const current = stop;
    fetch("/api/stop", { method: "POST", body: new FormData(button.form) })
      .then((response) => {
        if (!response.ok) current.abort();
      })
      .catch(() => current.abort());
  });
  state.genui = "idle";
</script>
