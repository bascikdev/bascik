<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />
  <script data-bascik-build>
    import { canonical } from '@/lib/canonical.ts';
    console.log(await canonical());
  </script>
  <script data-bascik-build>
    import { openGraph } from '@/lib/open-graph.ts';
    console.log(await openGraph());
  </script>
  <script data-bascik-build>
    import { breadcrumbLd } from '@/lib/breadcrumb-ld.ts';
    console.log(await breadcrumbLd());
  </script>
  <meta name="description"
    content="Release notes for every Bascik version, including new features, bug fixes, and breaking changes." />
  <title>Releases - Bascik Docs</title>
</head>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">

      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>
          import { renderSectionLabel } from '@/lib/render-nav.ts';
          console.log(renderSectionLabel('/releases'));
        </script>

        <!-- Content rendered from docs/content/releases.md at build time.
             To update page content, edit the MD file, not this file. -->
        <script data-bascik-build>
          import { renderMd } from '@/lib/md-renderer.ts';
          console.log(await renderMd('./content/releases.md'));
        </script>

        <!-- Release entries rendered from the repository CHANGELOG.md at build
             time, so this page can never drift from the canonical source. -->
        <script data-bascik-build>
          import { renderMd } from '@/lib/md-renderer.ts';
          console.log(await renderMd('../CHANGELOG.md', { skipToFirstH2: true }));
        </script>

        <docs-pagination />

      </main>
    </div>
  </div>

  <docs-footer />

</body>

</html>
