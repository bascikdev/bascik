<!doctype html>
<html lang="en">
  <head>
    <docs-head />
    <script data-bascik-build>
      import { canonical } from "@/lib/canonical.ts";
      export default async () => await canonical();
    </script>
    <script data-bascik-build>
      import { openGraph } from "@/lib/open-graph.ts";
      export default async () => await openGraph();
    </script>
    <script data-bascik-build>
      import { breadcrumbLd } from "@/lib/breadcrumb-ld.ts";
      export default async () => await breadcrumbLd();
    </script>
    <script data-bascik-build>
      import { articleSchema } from "@/lib/article-schema.ts";
      export default async () => await articleSchema();
    </script>
    <meta
      name="description"
      content="Bascik ships every name attribute as written, so form keys, radio groups, details accordions, and iframe targets work as HTML defines."
    />
    <title>The name Attribute in Components - Bascik</title>
  </head>

  <body>
    <docs-nav />
    <div class="container">
      <div class="docs-layout">
        <docs-sidebar />
        <main class="docs-content" id="main-content">
          <script data-bascik-build>
            import { renderSectionLabel } from "@/lib/render-nav.ts";
            export default async () => renderSectionLabel("/name-attribute");
          </script>
          <!-- Content rendered from docs/content/name-attribute.md at build time; the demo boxes sit between ranges. -->
          <script data-bascik-build>
            import { renderMdRange } from "@/lib/md-renderer.ts";
            export default async () =>
              await renderMdRange("./content/name-attribute.md", {
                to: "Radio Groups per Component Instance",
              });
          </script>

          <script data-bascik-build>
            import { renderMdRange } from "@/lib/md-renderer.ts";
            export default async () =>
              await renderMdRange(
                "./content/name-attribute.md",
                {
                  from: "Radio Groups per Component Instance",
                  to: "Radios Inside a Larger Form",
                },
                { stripDemoBlocks: true },
              );
          </script>

          <component-demo data-bascik-prop-file="src/components/froth-picker/">
            <div data-bascik-slot="example">
              <froth-picker data-bascik-prop-cup="Morning cup" />
              <froth-picker data-bascik-prop-cup="Evening cup" />
            </div>
            <div data-bascik-slot="source-usage">
              <code-block data-bascik-prop-lang="html">
                <script data-bascik-build>
                  import { extractDemoBlock } from "@/lib/md-renderer.ts";
                  export default async () =>
                    await extractDemoBlock(
                      "./content/name-attribute.md",
                      "name-radio-usage",
                    );
                </script>
              </code-block>
            </div>
            <div data-bascik-slot="source-html">
              <code-block data-bascik-prop-lang="html">
                <script data-bascik-build>
                  import { extractDemoBlock } from "@/lib/md-renderer.ts";
                  export default async () =>
                    await extractDemoBlock(
                      "./content/name-attribute.md",
                      "name-radio-source-html",
                    );
                </script>
              </code-block>
            </div>
            <div data-bascik-slot="output-html">
              <code-block data-bascik-prop-lang="html">
                <script data-bascik-build>
                  import { extractDemoBlock } from "@/lib/md-renderer.ts";
                  export default async () =>
                    await extractDemoBlock(
                      "./content/name-attribute.md",
                      "name-radio-output-html",
                    );
                </script>
              </code-block>
            </div>
          </component-demo>

          <script data-bascik-build>
            import { renderMdRange } from "@/lib/md-renderer.ts";
            export default async () =>
              await renderMdRange("./content/name-attribute.md", {
                from: "Radios Inside a Larger Form",
                to: "Exclusive `<details>` Accordions",
              });
          </script>

          <script data-bascik-build>
            import { renderMdRange } from "@/lib/md-renderer.ts";
            export default async () =>
              await renderMdRange(
                "./content/name-attribute.md",
                {
                  from: "Exclusive `<details>` Accordions",
                  to: "One Accordion per Copy",
                },
                { stripDemoBlocks: true },
              );
          </script>

          <component-demo
            data-bascik-prop-file="src/components/frother-question/"
          >
            <div data-bascik-slot="example">
              <frother-question>
                <span data-bascik-slot="question">Which milk froths best?</span>
                Cold whole milk gives the thickest foam.
              </frother-question>
              <frother-question>
                <span data-bascik-slot="question">Can it froth oat milk?</span>
                Yes. Use a barista blend for a finer foam.
              </frother-question>
              <frother-question>
                <span data-bascik-slot="question"
                  >How do I clean the whisk?</span
                >
                Rinse it under warm water right after use.
              </frother-question>
            </div>
            <div data-bascik-slot="source-usage">
              <code-block data-bascik-prop-lang="html">
                <script data-bascik-build>
                  import { extractDemoBlock } from "@/lib/md-renderer.ts";
                  export default async () =>
                    await extractDemoBlock(
                      "./content/name-attribute.md",
                      "name-details-usage",
                    );
                </script>
              </code-block>
            </div>
            <div data-bascik-slot="source-html">
              <code-block data-bascik-prop-lang="html">
                <script data-bascik-build>
                  import { extractDemoBlock } from "@/lib/md-renderer.ts";
                  export default async () =>
                    await extractDemoBlock(
                      "./content/name-attribute.md",
                      "name-details-source-html",
                    );
                </script>
              </code-block>
            </div>
            <div data-bascik-slot="output-html">
              <code-block data-bascik-prop-lang="html">
                <script data-bascik-build>
                  import { extractDemoBlock } from "@/lib/md-renderer.ts";
                  export default async () =>
                    await extractDemoBlock(
                      "./content/name-attribute.md",
                      "name-details-output-html",
                    );
                </script>
              </code-block>
            </div>
          </component-demo>

          <script data-bascik-build>
            import { renderMdRange } from "@/lib/md-renderer.ts";
            export default async () =>
              await renderMdRange("./content/name-attribute.md", {
                from: "One Accordion per Copy",
              });
          </script>
          <docs-pagination />
        </main>
      </div>
    </div>
    <docs-footer />
  </body>
</html>
