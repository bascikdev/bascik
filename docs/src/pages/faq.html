<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />
  <script data-bascik-build>
    import { canonical } from '@/lib/canonical.ts';
    export default async () => await canonical();
  </script>
  <script data-bascik-build>
    import { openGraph } from '@/lib/open-graph.ts';
    export default async () => await openGraph();
  </script>
  <script data-bascik-build>
    import { breadcrumbLd } from '@/lib/breadcrumb-ld.ts';
    export default async () => await breadcrumbLd();
  </script>
  <meta name="description"
    content="Frequently asked questions about Bascik: who made it, why it exists, and how edge cases like name collisions work." />
  <title>FAQ - Bascik Docs</title>
  <script data-bascik-build>
    import { faqSchema } from '@/lib/faq-schema.ts';
    export default async () => await faqSchema('content/faq.md');
  </script>
</head>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">

      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>
          import { renderSectionLabel } from '@/lib/render-nav.ts';
          export default async () => renderSectionLabel('/faq');
        </script>
        <!-- Content rendered from docs/content/faq.md at build time.
             To update page content, edit the MD file - not this file. -->
        <script data-bascik-build>
          import { renderMd } from '@/lib/md-renderer.ts';
          export default async () => await renderMd('./content/faq.md');
        </script>

        <docs-pagination />

      </main>
    </div>
  </div>

  <docs-footer />
</body>

</html>
