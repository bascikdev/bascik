<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { canonical } = await import(
      pathToFileURL(join(process.cwd(), 'scripts/canonical.ts')).href
    );
    console.log(await canonical());
  </script>
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { openGraph } = await import(
      pathToFileURL(join(process.cwd(), 'scripts/open-graph.ts')).href
    );
    console.log(await openGraph());
  </script>
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { breadcrumbLd } = await import(
      pathToFileURL(join(process.cwd(), 'scripts/breadcrumb-ld.ts')).href
    );
    console.log(await breadcrumbLd());
  </script>
  <meta name="description"
    content="Frequently asked questions about Bascik: who made it, why it exists, and how edge cases like name collisions work." />
  <title>FAQ - Bascik Docs</title>
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { faqSchema } = await import(
      pathToFileURL(join(process.cwd(), 'scripts/faq-schema.ts')).href
    );
    console.log(await faqSchema('content/faq.md'));
  </script>
</head>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">

      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderSectionLabel } = await import(
            pathToFileURL(join(process.cwd(), 'scripts/render-nav.ts')).href
          );
          console.log(renderSectionLabel('/faq'));
        </script>
        <!-- Content rendered from docs/content/faq.md at build time.
             To update page content, edit the MD file - not this file. -->
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderMd } = await import(
            pathToFileURL(join(process.cwd(), 'scripts/md-renderer.ts')).href
          );
          console.log(await renderMd('./content/faq.md'));
        </script>

        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderPagination } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.ts')).href);
          console.log(renderPagination('/faq'));
        </script>

      </main>
    </div>
  </div>

  <docs-footer />
</body>

</html>
