<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />
  <script data-bascik-build>
    import { canonical } from '@/lib/canonical.ts';
    export default async () => await canonical();
  </script>
  <script data-bascik-build>
    import { openGraph } from '@/lib/open-graph.ts';
    export default async () => await openGraph();
  </script>
  <script data-bascik-build>
    import { breadcrumbLd } from '@/lib/breadcrumb-ld.ts';
    export default async () => await breadcrumbLd();
  </script>
  <script data-bascik-build>
    import { articleSchema } from '@/lib/article-schema.ts';
    export default async () => await articleSchema();
  </script>
  <meta name="description"
    content="A complete example Bascik site with layout components, per-page SEO tags, a Markdown blog with tags and a feed, llms.txt, and a contact page." />
  <title>Starter Site Example: Layout, SEO, Blog - Bascik</title>
</head>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">

      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>
          import { renderSectionLabel } from '@/lib/render-nav.ts';
          export default async () => renderSectionLabel('/examples/starter-site');
        </script>
        <!-- Rendered from docs/content/examples/starter-site.md. The example code is read from the repo-root examples/
             folder at build time; edit it there, never in the Markdown. -->
        <script data-bascik-build>
          import { renderExample } from '@/lib/examples.ts';
          export default async () => await renderExample('./content/examples/starter-site.md');
        </script>

        <docs-pagination />
      </main>
    </div>
  </div>

  <docs-footer />

</body>

</html>
