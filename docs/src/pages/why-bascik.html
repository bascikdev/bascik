<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />
  <script data-bascik-build>
    import { canonical } from '@/lib/canonical.ts';
    console.log(await canonical());
  </script>
  <script data-bascik-build>
    import { openGraph } from '@/lib/open-graph.ts';
    console.log(await openGraph());
  </script>
  <script data-bascik-build>
    import { breadcrumbLd } from '@/lib/breadcrumb-ld.ts';
    console.log(await breadcrumbLd());
  </script>
  <script data-bascik-build>
    import { articleSchema } from '@/lib/article-schema.ts';
    console.log(await articleSchema());
  </script>
  <meta name="description"
    content="The guiding principle behind Bascik is simple: use what already exists. Do not invent new abstractions where vanilla HTML already works." />
  <title>Why Bascik - Bascik Docs</title>
</head>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">

      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>
          import { renderSectionLabel } from '@/lib/render-nav.ts';
          console.log(renderSectionLabel('/why-bascik'));
        </script>
        <!-- Intro and demo context rendered from docs/content/why-bascik.md. -->
        <script data-bascik-build>
          import { renderMdRange } from '@/lib/md-renderer.ts';
          console.log(await renderMdRange('./content/why-bascik.md', { to: 'The Problem Bascik Solves' }, { stripDemoBlocks: true }));
        </script>

        <component-demo data-bascik-prop-file="src/components/hello-card/">
          <div data-bascik-slot="example">
            <hello-card></hello-card>
          </div>
          <div data-bascik-slot="source-usage">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { extractDemoBlock } from '@/lib/md-renderer.ts';
                console.log(await extractDemoBlock('./content/why-bascik.md', 'source-usage'));
              </script>
            </code-block>
          </div>
          <div data-bascik-slot="source-html">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { extractDemoBlock } from '@/lib/md-renderer.ts';
                console.log(await extractDemoBlock('./content/why-bascik.md', 'source-html'));
              </script>
            </code-block>
          </div>
          <div data-bascik-slot="source-css">
            <code-block data-bascik-prop-lang="css">
              <script data-bascik-build>
                import { extractDemoBlock } from '@/lib/md-renderer.ts';
                console.log(await extractDemoBlock('./content/why-bascik.md', 'source-css'));
              </script>
            </code-block>
          </div>
          <div data-bascik-slot="output-html">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { extractDemoBlock } from '@/lib/md-renderer.ts';
                console.log(await extractDemoBlock('./content/why-bascik.md', 'output-html'));
              </script>
            </code-block>
          </div>
        </component-demo>

        <!-- The existing argument follows the concrete example. -->
        <script data-bascik-build>
          import { renderMdRange } from '@/lib/md-renderer.ts';
          console.log(await renderMdRange('./content/why-bascik.md', { from: 'The Problem Bascik Solves' }));
        </script>

        <docs-pagination />

      </main>
    </div>
  </div>

  <docs-footer />
</body>

</html>
