<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { canonical } = await import(
      pathToFileURL(join(process.cwd(), 'scripts/canonical.ts')).href
    );
    console.log(await canonical());
  </script>
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { openGraph } = await import(
      pathToFileURL(join(process.cwd(), 'scripts/open-graph.ts')).href
    );
    console.log(await openGraph());
  </script>
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { breadcrumbLd } = await import(
      pathToFileURL(join(process.cwd(), 'scripts/breadcrumb-ld.ts')).href
    );
    console.log(await breadcrumbLd());
  </script>
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { articleSchema } = await import(
      pathToFileURL(join(process.cwd(), 'scripts/article-schema.ts')).href
    );
    console.log(await articleSchema());
  </script>
  <meta name="description"
    content="A complete audit of which CSS and JavaScript patterns Bascik's build-time scoping engine supports, with notes on known edge cases." />
  <title>Bascik Scoping Compatibility - Bascik Docs</title>
  <style>
    .compat-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      margin: 0;
    }

    .compat-table th {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 2px solid var(--border);
      color: var(--fg-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    .compat-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .compat-table tr:last-child td {
      border-bottom: none;
    }

    .badge-ok {
      color: #7ecfa0;
      font-size: 0.9rem;
      text-align: center;
    }

    .badge-partial {
      color: #b89340;
      font-size: 0.9rem;
      text-align: center;
    }

    .badge-no {
      color: #c07070;
      font-size: 0.9rem;
      text-align: center;
    }

    .badge-intentional {
      color: #7a8795;
      font-size: 0.9rem;
      text-align: center;
    }

    .compat-note {
      color: var(--fg-muted);
      font-size: 0.82rem;
      margin-top: 4px;
    }

    .legend {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 32px;
      font-size: 0.88rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    p:has(> strong:only-child)+ul {
      margin-block-start: 4px;
    }
  </style>
</head>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">

      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderSectionLabel } = await import(
            pathToFileURL(join(process.cwd(), 'scripts/render-nav.ts')).href
          );
          console.log(renderSectionLabel('/compatibility'));
        </script>
        <!-- Content rendered from docs/content/compatibility.md at build time.
             To update page content, edit the MD file - not this file. -->
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderMd } = await import(
            pathToFileURL(join(process.cwd(), 'scripts/md-renderer.ts')).href
          );
          let html = await renderMd('./content/compatibility.md');
          html = html
            .replace(/td>\s*✓\s*<\/td/g, 'td class="badge-ok">✓</td')
            .replace(/td>\s*△\s*<\/td/g, 'td class="badge-partial">△</td')
            .replace(/td>\s*✕\s*<\/td/g, 'td class="badge-no">✕</td')
            .replace(/td>\s*–\s*<\/td/g, 'td class="badge-intentional">–</td')
            .replace(/<li>✓ /g, '<li><span class="badge-ok">✓</span> ')
            .replace(/<li>△ /g, '<li><span class="badge-partial">△</span> ')
            .replace(/<li>– /g, '<li><span class="badge-intentional">–</span> ')
            .replace(/<li>✕ /g, '<li><span class="badge-no">✕</span> ');
          console.log(html);
        </script>

        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderPagination } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.ts')).href);
          console.log(renderPagination('/compatibility'));
        </script>

      </main>
    </div>
  </div>

  <docs-footer />
</body>

</html>
