<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />
  <script data-bascik-build>
    import { canonical } from '@/lib/canonical.ts';
    export default async () => await canonical();
  </script>
  <script data-bascik-build>
    import { openGraph } from '@/lib/open-graph.ts';
    export default async () => await openGraph();
  </script>
  <script data-bascik-build>
    import { breadcrumbLd } from '@/lib/breadcrumb-ld.ts';
    export default async () => await breadcrumbLd();
  </script>
  <script data-bascik-build>
    import { articleSchema } from '@/lib/article-schema.ts';
    export default async () => await articleSchema();
  </script>
  <meta name="description"
    content="Any attribute on a component usage tag that is not a Bascik-specific attribute is forwarded to the root element automatically." />
  <title>Attribute Inheritance - Bascik Docs</title>
</head>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">
      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>
          import { renderSectionLabel } from '@/lib/render-nav.ts';
          export default async () => renderSectionLabel('/attribute-inheritance');
        </script>

        <!-- Intro and demo context rendered from docs/content/attribute-inheritance.md. -->
        <script data-bascik-build>
          import { renderMdRange } from '@/lib/md-renderer.ts';
          export default async () => (await renderMdRange('./content/attribute-inheritance.md', { to: 'How It Works' })) + (await renderMdRange('./content/attribute-inheritance.md', { from: 'See it in action' }, { stripDemoBlocks: true }));
        </script>

        <component-demo data-bascik-prop-file="src/components/inherit-demo-card/">
          <div data-bascik-slot="example">
            <inherit-demo-card class="featured-card" id="featured-inheritance" aria-label="Featured inheritance demo"
              data-testid="inherit-demo" />
          </div>
          <div data-bascik-slot="source-usage">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { extractDemoBlock } from '@/lib/md-renderer.ts';
                export default async () => await extractDemoBlock('./content/attribute-inheritance.md', 'source-usage');
              </script>
            </code-block>
          </div>
          <div data-bascik-slot="source-html">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { extractDemoBlock } from '@/lib/md-renderer.ts';
                export default async () => await extractDemoBlock('./content/attribute-inheritance.md', 'source-html');
              </script>
            </code-block>
          </div>
          <div data-bascik-slot="source-css">
            <code-block data-bascik-prop-lang="css">
              <script data-bascik-build>
                import { extractDemoBlock } from '@/lib/md-renderer.ts';
                export default async () => await extractDemoBlock('./content/attribute-inheritance.md', 'source-css');
              </script>
            </code-block>
          </div>
          <div data-bascik-slot="output-html">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { extractDemoBlock } from '@/lib/md-renderer.ts';
                export default async () => await extractDemoBlock('./content/attribute-inheritance.md', 'output-html');
              </script>
            </code-block>
          </div>
        </component-demo>

        <script data-bascik-build>
          import { renderMdRange } from '@/lib/md-renderer.ts';
          export default async () => await renderMdRange('./content/attribute-inheritance.md', { from: 'How It Works', to: 'See it in action' });
        </script>

        <docs-pagination />

      </main>
    </div>
  </div>

  <docs-footer />
</body>

</html>
