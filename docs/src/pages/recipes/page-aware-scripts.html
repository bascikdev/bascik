<!DOCTYPE html>

<head>

  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { canonical } = await import(
      pathToFileURL(join(process.cwd(), 'scripts/canonical.ts')).href
    );
    console.log(await canonical());
  </script>
  <script data-bascik-build>
    import { join } from 'node:path';

    console.log(await openGraph());
  </script>
  <script data-bascik-build>
    import { join } from 'node:path';

      pathToFileURL(join(process.cwd(), 'scripts/breadcrumb-ld.ts')).href
    );
    console.log(await breadcrumbLd());
  </script>
  <script data-bascik-build>
    import { join } from 'node:path';

    const { articleSchema } = await import(

    );
    console.log(await articleSchema());
  </script>
  <meta name="description"
    content="Use BASCIK_PAGE_FILE and other env vars to write shared build scripts that emit page-specific head tags (such as canonical URLs, Open Graph, and JSON-LD) without hardcoding anything per page." />

<body>

  <docs-nav />

  <div class="container">

      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>

        </script>
        <!-- Content rendered from docs/content/recipes/page-aware-scripts.md at build time.

        <script data-bascik-build>

          console.log(await renderMd('./content/recipes/page-aware-scripts.md'));
        </script>

        <div class="callout">
