<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { canonical } = await import(
      pathToFileURL(join(process.cwd(), 'scripts/canonical.ts')).href
    );
    console.log(await canonical());
  </script>
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { openGraph } = await import(
      pathToFileURL(join(process.cwd(), 'scripts/open-graph.ts')).href
    );
    console.log(await openGraph());
  </script>
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { breadcrumbLd } = await import(
      pathToFileURL(join(process.cwd(), 'scripts/breadcrumb-ld.ts')).href
    );
    console.log(await breadcrumbLd());
  </script>
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { articleSchema } = await import(
      pathToFileURL(join(process.cwd(), 'scripts/article-schema.ts')).href
    );
    console.log(await articleSchema());
  </script>
  <meta name="description"
    content="Bascik does not ship a Markdown pipeline, but build-time scripts are Node.js - so any Markdown library works out of the box." />
  <title>Markdown Recipes - Bascik Docs</title>
</head>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">
      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderSectionLabel } = await import(
            pathToFileURL(join(process.cwd(), 'scripts/render-nav.ts')).href
          );
          console.log(renderSectionLabel('/recipes/markdown'));
        </script>

        <!-- Intro rendered from docs/content/recipes/markdown.md. -->
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderMdRange } = await import(
            pathToFileURL(join(process.cwd(), 'scripts/md-renderer.ts')).href
          );
          console.log(await renderMdRange('./content/recipes/markdown.md', { to: 'marked' }));
        </script>

        <component-demo>
          <div data-bascik-slot="example">
            <div class="markdown-preview-body">
              <h2>A practical heading</h2>
              <p>Markdown stays comfortable for authors, while the published page stays <strong>vanilla HTML</strong>.
              </p>
              <blockquote>
                <p>Add an editorial treatment with ordinary CSS.</p>
              </blockquote>
            </div>
          </div>
          <div data-bascik-slot="source-usage">
            <code-block data-bascik-prop-lang="md">
              <script data-bascik-build>
                import { join } from 'node:path';
                import { pathToFileURL } from 'node:url';
                const { extractDemoBlock } = await import(pathToFileURL(join(process.cwd(), 'scripts/md-renderer.ts')).href);
                console.log(await extractDemoBlock('./content/recipes/markdown.md', 'source-md'));
              </script>
            </code-block>
          </div>
          <div data-bascik-slot="output-html">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { join } from 'node:path';
                import { pathToFileURL } from 'node:url';
                const { extractDemoBlock } = await import(pathToFileURL(join(process.cwd(), 'scripts/md-renderer.ts')).href);
                console.log(await extractDemoBlock('./content/recipes/markdown.md', 'output-html'));
              </script>
            </code-block>
          </div>
        </component-demo>

        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderMdRange } = await import(
            pathToFileURL(join(process.cwd(), 'scripts/md-renderer.ts')).href
          );
          console.log(await renderMdRange('./content/recipes/markdown.md', { from: 'marked' }, { stripDemoBlocks: true }));
        </script>

        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderPagination } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.ts')).href);
          console.log(renderPagination('/recipes/markdown'));
        </script>
      </main>
    </div>
  </div>

  <docs-footer />

</body>

</html>
