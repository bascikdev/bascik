<!doctype html>
<html lang="en">
  <head>
    <docs-head />
    <script data-bascik-build>
      import { canonical } from "@/lib/canonical.ts";
      export default async () => await canonical();
    </script>
    <script data-bascik-build>
      import { openGraph } from "@/lib/open-graph.ts";
      export default async () => await openGraph();
    </script>
    <script data-bascik-build>
      import { breadcrumbLd } from "@/lib/breadcrumb-ld.ts";
      export default async () => await breadcrumbLd();
    </script>
    <script data-bascik-build>
      import { articleSchema } from "@/lib/article-schema.ts";
      export default async () => await articleSchema();
    </script>
    <meta
      name="description"
      content="Bascik uses Vitest for unit tests, coverage, and benchmarks. All test files live alongside the source files they exercise."
    />
    <title>Testing Internals - Bascik Docs</title>
  </head>

  <body>
    <docs-nav />

    <div class="container">
      <div class="docs-layout">
        <docs-sidebar />

        <main class="docs-content" id="main-content">
          <script data-bascik-build>
            import { renderSectionLabel } from "@/lib/render-nav.ts";
            export default async () => renderSectionLabel("/internals/testing");
          </script>

          <!-- Content rendered from docs/content/internals/testing.md at build time.
             To update page content, edit the MD file, not this file. -->
          <script data-bascik-build>
            import { renderMdRange } from "@/lib/md-renderer.ts";
            export default async () =>
              await renderMdRange("./content/internals/testing.md", {
                to: "Testing Levels and Architecture",
              });
          </script>

          <!-- One row per committed coverage JSON, read at build time (docs/src/lib/coverage-table.ts). -->
          <script data-bascik-build>
            import { coverageTable } from "@/lib/coverage-table.ts";
            export default async () => await coverageTable();
          </script>

          <script data-bascik-build>
            import { renderMdRange } from "@/lib/md-renderer.ts";
            export default async () =>
              await renderMdRange("./content/internals/testing.md", {
                from: "Testing Levels and Architecture",
              });
          </script>

          <docs-pagination />
        </main>
      </div>
    </div>

    <docs-footer />
  </body>
</html>
