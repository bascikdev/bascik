<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />
  <script data-bascik-build>
    import { canonical } from '@/lib/canonical.ts';
    export default async () => await canonical();
  </script>
  <script data-bascik-build>
    import { openGraph } from '@/lib/open-graph.ts';
    export default async () => await openGraph();
  </script>
  <script data-bascik-build>
    import { breadcrumbLd } from '@/lib/breadcrumb-ld.ts';
    export default async () => await breadcrumbLd();
  </script>
  <script data-bascik-build>
    import { articleSchema } from '@/lib/article-schema.ts';
    export default async () => await articleSchema();
  </script>
  <meta name="description"
    content="Bascik uses GitHub Actions for CI (Vitest on every push) and for releasing @bascik/bascik and create-bascik independently to npm via version tags." />
  <title>CI / CD - Bascik Docs</title>
</head>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">

      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>
          import { renderSectionLabel } from '@/lib/render-nav.ts';
          export default async () => renderSectionLabel('/internals/ci-cd');
        </script>

        <!-- Content rendered from docs/content/internals/ci-cd.md at build time.
             To update page content, edit the MD file, not this file. -->
        <script data-bascik-build>
          import { renderMd } from '@/lib/md-renderer.ts';
          export default async () => await renderMd('./content/internals/ci-cd.md');
        </script>

        <docs-pagination />
      </main>
    </div>
  </div>

  <docs-footer />

</body>

</html>
