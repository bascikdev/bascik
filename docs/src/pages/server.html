<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />
  <script data-bascik-build>
    import { canonical } from '../lib/canonical.ts';
    console.log(await canonical());
  </script>
  <script data-bascik-build>
    import { openGraph } from '../lib/open-graph.ts';
    console.log(await openGraph());
  </script>
  <script data-bascik-build>
    import { breadcrumbLd } from '../lib/breadcrumb-ld.ts';
    console.log(await breadcrumbLd());
  </script>
  <script data-bascik-build>
    import { articleSchema } from '../lib/article-schema.ts';
    console.log(await articleSchema());
  </script>
  <meta name="description"
    content="Run Bascik as a production HTTP/2 server. Use data-bascik-server scripts to personalize pages at request time - no framework required." />
  <title>Production Server - Bascik Docs</title>
</head>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">
      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>
          import { renderSectionLabel } from '../lib/render-nav.ts';
          console.log(renderSectionLabel('/server'));
        </script>

        <!-- Content rendered from docs/content/server.md at build time.
             To update page content, edit the MD file - not this file. -->
        <script data-bascik-build>
          import { renderMd } from '../lib/md-renderer.ts';
          console.log(await renderMd('./content/server.md'));
        </script>

        <div class="callout">
          <p><strong>Next:</strong> Learn how <a href="/build-scripts">build scripts</a> run at transpile time, or see
            the <a href="/configuration">configuration reference</a> for all <code>serve</code> options.</p>
        </div>

        <docs-pagination />
      </main>
    </div>
  </div>

  <docs-footer />
</body>

</html>
