<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />
  <script data-bascik-build>
    import { canonical } from '@/lib/canonical.ts';
    console.log(await canonical());
  </script>
  <script data-bascik-build>
    import { openGraph } from '@/lib/open-graph.ts';
    console.log(await openGraph());
  </script>
  <script data-bascik-build>
    import { breadcrumbLd } from '@/lib/breadcrumb-ld.ts';
    console.log(await breadcrumbLd());
  </script>
  <script data-bascik-build>
    import { articleSchema } from '@/lib/article-schema.ts';
    console.log(await articleSchema());
  </script>
  <meta name="description"
    content="Try a live Bascik port of Vue's sortable, searchable grid, then compare how Vue components, arrays, events, and state map to Bascik." />
  <title>From Vue - Bascik Docs</title>
</head>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">

      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>
          import { renderSectionLabel } from '@/lib/render-nav.ts';
          console.log(renderSectionLabel('/switch/from-vue'));
        </script>

        <script data-bascik-build>
          import { renderMdRange } from '@/lib/md-renderer.ts';
          console.log(await renderMdRange('./content/switch/from-vue.md', { to: 'When to Switch vs Keep Vue' }, { stripDemoBlocks: true }));
        </script>

        <style>
          /* Stack the search above the grid, as in the original example. */
          .vue-grid-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 100%;
            overflow-x: auto;
          }

          /* The example's light cells assume the browser's default text color, not the
             dark preview theme's light text. */
          .vue-grid-preview td {
            color: #000;
          }
        </style>

        <component-demo data-bascik-prop-file="migration-examples/ports/vue-grid/src/components/">
          <div data-bascik-slot="example">
            <div class="vue-grid-preview">
              <grid-search data-bascik-prop-label="Search" data-bascik-prop-target="grid" />
              <demo-grid id="grid" data-testid="vue-grid-demo">
                <script data-bascik-build>
                  import { gridColumns, gridData } from '../../../../migration-examples/ports/vue-grid/src/data/grid.ts';
                  import { renderGridData } from '../../../../migration-examples/ports/vue-grid/src/lib/grid.ts';
                  console.log(renderGridData({ columns: gridColumns, rows: gridData }));
                </script>
              </demo-grid>
            </div>
          </div>
          <div data-bascik-slot="source-usage">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { extractDemoBlock } from '@/lib/md-renderer.ts';
                console.log(await extractDemoBlock('./content/switch/from-vue.md', 'vue-demo-usage'));
              </script>
            </code-block>
          </div>
          <div data-bascik-slot="output-html">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { extractDemoBlock } from '@/lib/md-renderer.ts';
                console.log(await extractDemoBlock('./content/switch/from-vue.md', 'vue-demo-output'));
              </script>
            </code-block>
          </div>
        </component-demo>

        <script data-bascik-build>
          import { renderMdRange } from '@/lib/md-renderer.ts';
          console.log(await renderMdRange('./content/switch/from-vue.md', { from: 'When to Switch vs Keep Vue' }, { stripDemoBlocks: true }));
        </script>

        <docs-pagination />

      </main>
    </div>
  </div>

  <docs-footer />
</body>

</html>
