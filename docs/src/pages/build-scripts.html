<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { canonical } = await import(
      pathToFileURL(join(process.cwd(), 'src/lib/canonical.ts')).href
    );
    console.log(await canonical());
  </script>
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { openGraph } = await import(
      pathToFileURL(join(process.cwd(), 'src/lib/open-graph.ts')).href
    );
    console.log(await openGraph());
  </script>
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { breadcrumbLd } = await import(
      pathToFileURL(join(process.cwd(), 'src/lib/breadcrumb-ld.ts')).href
    );
    console.log(await breadcrumbLd());
  </script>
  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { articleSchema } = await import(
      pathToFileURL(join(process.cwd(), 'src/lib/article-schema.ts')).href
    );
    console.log(await articleSchema());
  </script>
  <meta name="description"
    content="Build-time scripts let you run Node.js code at transpile time and inject the output directly into your HTML. No runtime overhead." />
  <title>Build-time Scripts - Bascik Docs</title>
</head>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">
      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderSectionLabel } = await import(
            pathToFileURL(join(process.cwd(), 'src/lib/render-nav.ts')).href
          );
          console.log(renderSectionLabel('/build-scripts'));
        </script>

        <!-- Intro rendered from docs/content/build-scripts.md. -->
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderMdRange } = await import(
            pathToFileURL(join(process.cwd(), 'src/lib/md-renderer.ts')).href
          );
          console.log(await renderMdRange('./content/build-scripts.md', { to: 'data-bascik-build' }));
        </script>

        <component-demo data-bascik-prop-file="src/pages/build-scripts.html">
          <div data-bascik-slot="example">
            <script data-bascik-build>
              import { readFile } from 'node:fs/promises';
              import { marked } from 'marked';
              const md = await readFile('./content/why-bascik.md', 'utf8');
              const [heading, paragraph] = md.split('\n\n');
              const title = heading.replace(/^#\s*/, '');
              console.log(`
                <feature-card
                  data-bascik-prop-title="${title}"
                  data-bascik-prop-desc="${marked.parseInline(paragraph).replace(/"/g, '&quot;')}">
                </feature-card>
              `);
            </script>
          </div>
          <div data-bascik-slot="source-usage">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { join } from 'node:path';
                import { pathToFileURL } from 'node:url';
                const { extractDemoBlock } = await import(pathToFileURL(join(process.cwd(), 'src/lib/md-renderer.ts')).href);
                console.log(await extractDemoBlock('./content/build-scripts.md', 'source-usage'));
              </script>
            </code-block>
          </div>
          <div data-bascik-slot="output-html">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { join } from 'node:path';
                import { pathToFileURL } from 'node:url';
                const { extractDemoBlock } = await import(pathToFileURL(join(process.cwd(), 'src/lib/md-renderer.ts')).href);
                console.log(await extractDemoBlock('./content/build-scripts.md', 'output-html'));
              </script>
            </code-block>
          </div>
        </component-demo>

        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderMdRange } = await import(
            pathToFileURL(join(process.cwd(), 'src/lib/md-renderer.ts')).href
          );
          console.log(await renderMdRange('./content/build-scripts.md', { from: 'data-bascik-build' }, { stripDemoBlocks: true }));
        </script>

        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderPagination } = await import(pathToFileURL(join(process.cwd(), 'src/lib/render-nav.ts')).href);
          console.log(renderPagination('/build-scripts'));
        </script>

      </main>
    </div>
  </div>

  <docs-footer />
</body>

</html>
