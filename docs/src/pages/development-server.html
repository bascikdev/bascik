<!doctype html>
<html lang="en">
  <head>
    <docs-head />
    <script data-bascik-build>
      import { canonical } from "@/lib/canonical.ts";
      export default async () => await canonical();
    </script>
    <script data-bascik-build>
      import { openGraph } from "@/lib/open-graph.ts";
      export default async () => await openGraph();
    </script>
    <script data-bascik-build>
      import { breadcrumbLd } from "@/lib/breadcrumb-ld.ts";
      export default async () => await breadcrumbLd();
    </script>
    <script data-bascik-build>
      import { articleSchema } from "@/lib/article-schema.ts";
      export default async () => await articleSchema();
    </script>
    <meta
      name="description"
      content="Local development server in Bascik with file watching, live reload over SSE, and instant error overlay."
    />
    <title>Development Server with Live Reload - Bascik</title>
  </head>

  <body>
    <docs-nav />

    <div class="container">
      <div class="docs-layout">
        <docs-sidebar />

        <main class="docs-content" id="main-content">
          <script data-bascik-build>
            import { renderSectionLabel } from "@/lib/render-nav.ts";
            export default async () =>
              renderSectionLabel("/development-server");
          </script>

          <script data-bascik-build>
            import { renderMdRange } from "@/lib/md-renderer.ts";
            export default async () =>
              await renderMdRange("./content/development-server.md", {
                to: "This Website's Build: A Real-World Example",
              });
          </script>

          <script data-bascik-build>
            import { renderMdRange } from "@/lib/md-renderer.ts";
            export default async () =>
              await renderMdRange("./content/development-server.md", {
                from: "This Website's Build: A Real-World Example",
                to: "Next Steps",
              });
          </script>

          <build-breakdown />

          <script data-bascik-build>
            import { renderMdRange } from "@/lib/md-renderer.ts";
            export default async () =>
              await renderMdRange("./content/development-server.md", {
                from: "Next Steps",
              });
          </script>

          <docs-pagination />
        </main>
      </div>
    </div>

    <docs-footer />
  </body>
</html>
