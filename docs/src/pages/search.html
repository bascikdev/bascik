<!DOCTYPE html>
<html lang="en">

<head>
  <!--
    Why Bascik maintains a dedicated `/search` page:
    1. Search Engine Integration: Google Sitelinks Search Box (Schema.org SearchAction)
       directs direct-from-Google site searches to `bascik.dev/search?q=...`
    2. Progressive Enhancement: Serves as a standard GET fallback if client JS is disabled.
    3. Deep Linking: Allows bookmarking and sharing search result URLs directly.
    4. SEO Isolation: Configured with `noindex` below to prevent search engine indexing of dynamic queries.
  -->
  <docs-head />
  <script data-bascik-build>
    import { canonical } from '@/lib/canonical.ts';
    console.log(await canonical());
  </script>
  <script data-bascik-build>
    import { openGraph } from '@/lib/open-graph.ts';
    console.log(await openGraph());
  </script>
  <meta name="robots" content="noindex" />
  <meta name="description" content="Search the Bascik documentation." />
  <title>Search - Bascik Docs</title>
</head>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">
      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <!-- Content rendered from docs/content/search.md at build time.
             To update page content, edit the MD file — not this file. -->
        <script data-bascik-build>
          import { renderMd } from '@/lib/md-renderer.ts';
          console.log(await renderMd('./content/search.md'));
        </script>
      </main>
    </div>
  </div>

  <docs-footer />

</body>

</html>
