<!doctype html>
<html lang="en">
  <head>
    <docs-head />
    <script data-bascik-build>
      import { canonical } from "@/lib/canonical.ts";
      export default async () => await canonical();
    </script>
    <script data-bascik-build>
      import { openGraph } from "@/lib/open-graph.ts";
      export default async () => await openGraph();
    </script>
    <script data-bascik-build>
      import { breadcrumbLd } from "@/lib/breadcrumb-ld.ts";
      export default async () => await breadcrumbLd();
    </script>
    <script data-bascik-build>
      import { articleSchema } from "@/lib/article-schema.ts";
      export default async () => await articleSchema();
    </script>
    <meta
      name="description"
      content="Create a bascik.config.ts file in your project root to override any default settings and configure your Bascik build."
    />
    <title>Bascik Configuration Reference (bascik.config.ts)</title>
  </head>

  <body>
    <docs-nav />

    <div class="container">
      <div class="docs-layout">
        <docs-sidebar />

        <main class="docs-content" id="main-content">
          <script data-bascik-build>
            import { renderSectionLabel } from "@/lib/render-nav.ts";
            export default async () => renderSectionLabel("/configuration");
          </script>

          <!-- Content rendered from docs/content/configuration.md at build time.
             To update page content, edit the MD file - not this file. -->
          <script data-bascik-build>
            import { renderMdRange } from "@/lib/md-renderer.ts";
            export default async () =>
              await renderMdRange(
                "./content/configuration.md",
                {
                  to: "`scripts.onServerScriptError`",
                },
                { stripDemoBlocks: true },
              );
          </script>
          <!-- No Preview: this docs site uses the default compiler, which rejects an enum. -->
          <component-demo
            data-bascik-prop-no-preview="true"
            data-bascik-prop-file="src/pages/sizes.html"
          >
            <div data-bascik-slot="source-usage">
              <code-block data-bascik-prop-lang="html">
                <script data-bascik-build>
                  import { extractDemoBlock } from "@/lib/md-renderer.ts";
                  export default async () =>
                    await extractDemoBlock(
                      "./content/configuration.md",
                      "ts-config-usage",
                    );
                </script>
              </code-block>
            </div>
            <div data-bascik-slot="source-js">
              <code-block data-bascik-prop-lang="ts">
                <script data-bascik-build>
                  import { extractDemoBlock } from "@/lib/md-renderer.ts";
                  export default async () =>
                    await extractDemoBlock(
                      "./content/configuration.md",
                      "ts-config-esbuild",
                    );
                </script>
              </code-block>
            </div>
            <div data-bascik-slot="output-html">
              <code-block data-bascik-prop-lang="html">
                <script data-bascik-build>
                  import { extractDemoBlock } from "@/lib/md-renderer.ts";
                  export default async () =>
                    await extractDemoBlock(
                      "./content/configuration.md",
                      "ts-config-output-html",
                    );
                </script>
              </code-block>
            </div>
          </component-demo>
          <script data-bascik-build>
            import { renderMdRange } from "@/lib/md-renderer.ts";
            export default async () =>
              await renderMdRange("./content/configuration.md", {
                from: "`scripts.onServerScriptError`",
              });
          </script>

          <docs-pagination />
        </main>
      </div>
    </div>

    <docs-footer />
  </body>
</html>
