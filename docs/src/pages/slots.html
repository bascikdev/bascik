<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />

  <script data-bascik-build>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">
      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>
          import { renderSectionLabel } from '../lib/render-nav.ts';
          console.log(renderSectionLabel('/slots'));
        </script>

        <!-- Intro and demo context rendered from docs/content/slots.md. -->
        <script data-bascik-build>
          import { renderMdRange } from '../lib/md-renderer.ts';
          console.log(await renderMdRange('./content/slots.md', { to: 'Default slots and fallback content' }));
                    console.log(await renderMdRange('./content/slots.md', { from: 'See it in action' }, { stripDemoBlocks: true }));
        </script>

        <component-demo data-bascik-prop-file="src/components/slot-layout-demo/">
          <div data-bascik-slot="example">
            <slot-layout-demo>
              <span data-bascik-slot="eyebrow">Named slot</span>
              <span data-bascik-slot="title">Build-time slot layout</span>
              <p>Use named slots for fixed regions and the default slot for the main body content.</p>
              <a data-bascik-slot="actions" class="slot-demo-link" href="/configuration">Read configuration</a>
            </slot-layout-demo>
          </div>
          <div data-bascik-slot="source-usage">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { extractDemoBlock } from '../lib/md-renderer.ts';
                console.log(await extractDemoBlock('./content/slots.md', 'source-usage'));
              </script>
            </code-block>
          </div>
          <div data-bascik-slot="source-html">
            <code-block data-bascik-prop-lang="html">

              <script data-bascik-build>

                console.log(await extractDemoBlock('./content/slots.md', 'output-html'));
              </script>
            </code-block>
          </div>
        </component-demo>

        <script data-bascik-build>
          import { renderMdRange } from '../lib/md-renderer.ts';
          console.log(await renderMdRange('./content/slots.md', { from: 'Default slots and fallback content', to: 'Named Slots' }, { stripDemoBlocks: true }));
        </script>

        <style>
          .slot-demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            width: 100%;
          }
        </style>

        <component-demo data-bascik-prop-file="src/components/simple-slot-card/">
          <div data-bascik-slot="example">
            <div class="slot-demo-grid">
              <simple-slot-card>
                <p>Custom content replaces the fallback.</p>
              </simple-slot-card>
              <simple-slot-card></simple-slot-card>
            </div>
          </div>
          <div data-bascik-slot="source-usage">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { extractDemoBlock } from '../lib/md-renderer.ts';

        <script data-bascik-build>
          import { renderMdRange } from '../lib/md-renderer.ts';
          console.log(await renderMdRange('./content/slots.md', { from: 'Named Slots', to: 'See it in action' }));
        </script>

        <docs-pagination />

      </main>
    </div>
  </div>

  <docs-footer />
