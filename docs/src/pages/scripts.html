<!doctype html>
<html lang="en">
  <head>
    <docs-head />
    <script data-bascik-build>
      import { canonical } from "@/lib/canonical.ts";
      export default async () => await canonical();
    </script>
    <script data-bascik-build>
      import { openGraph } from "@/lib/open-graph.ts";
      export default async () => await openGraph();
    </script>
    <script data-bascik-build>
      import { breadcrumbLd } from "@/lib/breadcrumb-ld.ts";
      export default async () => await breadcrumbLd();
    </script>
    <script data-bascik-build>
      import { articleSchema } from "@/lib/article-schema.ts";
      export default async () => await articleSchema();
    </script>
    <meta
      name="description"
      content="Bascik runs build, routes, server, and stream scripts in your HTML. Compare when each runs, what it returns, and the environment variables it gets."
    />
    <title>Build, Server, and Stream Scripts in HTML - Bascik</title>
  </head>

  <body>
    <docs-nav />

    <div class="container">
      <div class="docs-layout">
        <docs-sidebar />

        <main class="docs-content" id="main-content">
          <script data-bascik-build>
            import { renderSectionLabel } from "@/lib/render-nav.ts";
            export default async () => renderSectionLabel("/scripts");
          </script>

          <!-- Content rendered from docs/content/scripts.md at build time.
               To update page content, edit the MD file, not this file. -->
          <script data-bascik-build>
            import { renderMdRange } from "@/lib/md-renderer.ts";
            export default async () =>
              await renderMdRange(
                "./content/scripts.md",
                { to: "Rules for every script" },
                { stripDemoBlocks: true },
              );
          </script>
          <!-- No Preview: the server and stream scripts run only per request, and this static site runs neither. -->
          <component-demo
            data-bascik-prop-no-preview="true"
            data-bascik-prop-file="src/pages/book.html"
          >
            <div data-bascik-slot="source-usage">
              <code-block data-bascik-prop-lang="html">
                <script data-bascik-build>
                  import { extractDemoBlock } from "@/lib/md-renderer.ts";
                  export default async () =>
                    await extractDemoBlock(
                      "./content/scripts.md",
                      "scripts-page-usage",
                    );
                </script>
              </code-block>
            </div>
            <div data-bascik-slot="output-html">
              <code-block data-bascik-prop-lang="html">
                <script data-bascik-build>
                  import { extractDemoBlock } from "@/lib/md-renderer.ts";
                  export default async () =>
                    await extractDemoBlock(
                      "./content/scripts.md",
                      "scripts-page-output-html",
                    );
                </script>
              </code-block>
            </div>
          </component-demo>
          <script data-bascik-build>
            import { renderMdRange } from "@/lib/md-renderer.ts";
            export default async () =>
              await renderMdRange(
                "./content/scripts.md",
                { from: "Rules for every script" },
                { stripDemoBlocks: true },
              );
          </script>

          <docs-pagination />
        </main>
      </div>
    </div>

    <docs-footer />
  </body>
</html>
