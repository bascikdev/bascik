<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />
  <script data-bascik-build>
    import { canonical } from '@/lib/canonical.ts';
    console.log(await canonical());
  </script>
  <script data-bascik-build>
    import { openGraph } from '@/lib/open-graph.ts';
    console.log(await openGraph());

  <meta name="description"
    content="Download the official Bascik logos, colors, and press kit, with usage guidelines and recommended image sizes for articles, talks, videos, and social profiles." />
  <title>Brand Guidelines - Bascik Docs</title>
  <style>
    .press-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      margin: 0 0 28px;
    }

    .press-actions-note {
      margin: 0;
      font-size: 0.85rem;
    }

    .docs-content .press-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin: 0 0 40px;
      padding: 0;
      list-style: none;
    }

    .docs-content .press-grid li {
      margin: 0;
    }

    .press-tile {
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .press-swatch {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 150px;
    }

    .press-swatch-dark {
      background: #18191b;
    }

    .press-swatch-mid {
      background: #3a3d40;
    }

    .press-swatch-light {
      background: #f2f3f0;
    }

    .press-swatch img {
      display: block;
      max-width: 80%;
      height: auto;
    }

    .press-tile figcaption {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px 12px;
      padding: 12px 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    .press-tile figcaption span {
      color: var(--text);
      font-weight: 600;
    }

    .press-links {
      display: inline-flex;
      gap: 12px;
    }
  </style>
</head>
