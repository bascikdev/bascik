<!doctype html>
<html lang="en">
  <head>
    <docs-head />
    <script data-bascik-build>
      import { canonical } from "@/lib/canonical.ts";
      export default async () => await canonical();
    </script>
    <script data-bascik-build>
      import { openGraph } from "@/lib/open-graph.ts";
      export default async () => await openGraph();
    </script>
    <meta
      name="description"
      content="Download the official Bascik logos, colors, and press kit, with usage guidelines, image sizes for articles and social profiles, and the press contact."
    />
    <title>Press Resources - Bascik Docs</title>
    <style>
      .press-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        margin: 0 0 28px;
      }

      .press-actions-note {
        margin: 0;
        font-size: 0.85rem;
      }

      .docs-content .press-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        margin: 0 0 40px;
        padding: 0;
        list-style: none;
      }

      .docs-content .press-grid li {
        margin: 0;
      }

      .press-tile {
        margin: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }

      /* The clear-space rule from press.md, by construction: each tile sets the logo's height, and the padding
         around it is a quarter of that height, so no tile width or phone layout can bring an edge closer. */
      .press-swatch {
        --press-logo-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 150px;
        padding: calc(var(--press-logo-height) / 4);
      }

      .press-swatch-square {
        --press-logo-height: 72px;
      }

      .press-swatch-dark {
        background: #18191b;
      }

      .press-swatch-mid {
        background: #3a3d40;
      }

      .press-swatch-light {
        background: #ffffff;
      }

      /* The kit files are cropped to the artwork, so the frame and rounding that styles.css gives every
         .docs-content img would clip the tile's corners. Reset them, as img.demo-shot does. A logo too wide for a
         narrow tile shrinks in proportion instead of overflowing its padding. */
      .docs-content .press-swatch img {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: var(--press-logo-height);
        margin: 0;
        border: none;
        border-radius: 0;
        background: none;
        box-shadow: none;
      }

      /* Clear-space diagram: inline SVGs whose lines use currentColor, so they follow the theme. */
      .press-clear-space {
        color: var(--text-muted);
      }

      .press-clear-space svg {
        display: block;
        width: 100%;
        max-width: 320px;
        height: auto;
        margin: 0 auto;
      }

      .press-clear-space-square svg {
        max-width: 140px;
      }

      .press-tile figcaption {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 4px 12px;
        padding: 12px 16px;
        font-size: 0.85rem;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
      }

      .press-tile figcaption span {
        color: var(--text);
        font-weight: 600;
      }

      .press-links {
        display: inline-flex;
        gap: 12px;
      }
    </style>
  </head>

  <body>
    <docs-nav />

    <div class="container">
      <div class="docs-layout">
        <docs-sidebar />

        <main class="docs-content" id="main-content">
          <script data-bascik-build>
            import { renderSectionLabel } from "@/lib/render-nav.ts";
            export default async () => renderSectionLabel("/press");
          </script>

          <!-- Content rendered from docs/content/press.md at build time.
             To update page content, edit the MD file, not this file. -->
          <div data-testid="press-intro">
            <script data-bascik-build>
              import { renderMdRange } from "@/lib/md-renderer.ts";
              export default async () =>
                await renderMdRange("./content/press.md", {
                  to: "Kit Contents",
                });
            </script>
          </div>

          <div class="press-actions">
            <a
              class="btn btn-primary"
              href="/assets/press/bascik-press-kit.zip"
              download
              data-testid="press-download-kit"
              >Download brand kit (.zip)</a
            >
            <p class="press-actions-note">
              Logos (SVG and PNG), profile images, and social images.
            </p>
          </div>

          <ul
            class="press-grid"
            aria-label="Logo previews"
            data-testid="press-previews"
          >
            <li>
              <figure class="press-tile" data-testid="press-tile-wordmark-dark">
                <div
                  class="press-swatch press-swatch-dark"
                  data-testid="press-swatch-wordmark-dark"
                >
                  <img
                    data-testid="press-logo-wordmark-dark"
                    src="/assets/press/logo/svg/bascik-wordmark.svg"
                    width="228"
                    height="56"
                    alt="Bascik wordmark in full color"
                  />
                </div>
                <figcaption>
                  <span>Wordmark, full color</span>
                  <span class="press-links">
                    <a
                      href="/assets/press/logo/svg/bascik-wordmark.svg"
                      download
                      aria-label="Download wordmark, full color, SVG"
                      >SVG</a
                    >
                    <a
                      href="/assets/press/logo/png/bascik-wordmark-2400.png"
                      download
                      aria-label="Download wordmark, full color, PNG"
                      >PNG</a
                    >
                  </span>
                </figcaption>
              </figure>
            </li>
            <li>
              <figure
                class="press-tile"
                data-testid="press-tile-wordmark-white"
              >
                <div
                  class="press-swatch press-swatch-light"
                  data-testid="press-swatch-wordmark-white"
                >
                  <img
                    data-testid="press-logo-wordmark-white"
                    src="/assets/press/logo/svg/bascik-wordmark.svg"
                    width="228"
                    height="56"
                    alt="Bascik wordmark in full color on white"
                  />
                </div>
                <figcaption>
                  <span>Wordmark on white</span>
                </figcaption>
              </figure>
            </li>
            <li>
              <figure class="press-tile" data-testid="press-tile-wordmark-gray">
                <div
                  class="press-swatch press-swatch-mid"
                  data-testid="press-swatch-wordmark-gray"
                >
                  <img
                    data-testid="press-logo-wordmark-gray"
                    src="/assets/press/logo/svg/bascik-wordmark.svg"
                    width="228"
                    height="56"
                    alt="Bascik wordmark in full color on gray"
                  />
                </div>
                <figcaption>
                  <span>Wordmark on gray</span>
                </figcaption>
              </figure>
            </li>
            <li>
              <figure class="press-tile" data-testid="press-tile-mark-dark">
                <div
                  class="press-swatch press-swatch-square press-swatch-dark"
                  data-testid="press-swatch-mark-dark"
                >
                  <img
                    data-testid="press-logo-mark-dark"
                    src="/assets/press/logo/svg/bascik-mark.svg"
                    width="96"
                    height="96"
                    alt="Bascik mark in full color"
                  />
                </div>
                <figcaption>
                  <span>Mark, full color</span>
                  <span class="press-links">
                    <a
                      href="/assets/press/logo/svg/bascik-mark.svg"
                      download
                      aria-label="Download mark, full color, SVG"
                      >SVG</a
                    >
                    <a
                      href="/assets/press/logo/png/bascik-mark-1024.png"
                      download
                      aria-label="Download mark, full color, PNG"
                      >PNG</a
                    >
                  </span>
                </figcaption>
              </figure>
            </li>
            <li>
              <figure class="press-tile" data-testid="press-tile-mark-white">
                <div
                  class="press-swatch press-swatch-square press-swatch-light"
                  data-testid="press-swatch-mark-white"
                >
                  <img
                    data-testid="press-logo-mark-white"
                    src="/assets/press/logo/svg/bascik-mark.svg"
                    width="96"
                    height="96"
                    alt="Bascik mark in full color on white"
                  />
                </div>
                <figcaption>
                  <span>Mark on white</span>
                </figcaption>
              </figure>
            </li>
            <li>
              <figure class="press-tile" data-testid="press-tile-mark-gray">
                <div
                  class="press-swatch press-swatch-square press-swatch-mid"
                  data-testid="press-swatch-mark-gray"
                >
                  <img
                    data-testid="press-logo-mark-gray"
                    src="/assets/press/logo/svg/bascik-mark.svg"
                    width="96"
                    height="96"
                    alt="Bascik mark in full color on gray"
                  />
                </div>
                <figcaption>
                  <span>Mark on gray</span>
                </figcaption>
              </figure>
            </li>
          </ul>

          <div data-testid="press-guidelines">
            <script data-bascik-build>
              import { renderMdRange } from "@/lib/md-renderer.ts";
              export default async () =>
                await renderMdRange("./content/press.md", {
                  from: "Kit Contents",
                  to: "Colors",
                });
            </script>

            <diagram-figure
              data-bascik-prop-title="Clear space"
              data-bascik-prop-footer="The solid line is the edge of the kit file, cropped to the artwork. The dashed line is one quarter of the logo's height further out: keep everything else outside it."
              data-testid="press-clear-space"
            >
              <diagram-row>
                <diagram-panel data-bascik-prop-label="Wordmark">
                  <div
                    class="press-clear-space"
                    data-testid="press-clear-space-wordmark"
                  >
                    <script data-bascik-build-once>
                      import { clearSpaceSvg } from "@/lib/press-logo.ts";
                      export default async () =>
                        await clearSpaceSvg("wordmark");
                    </script>
                  </div>
                </diagram-panel>
                <diagram-panel data-bascik-prop-label="Mark">
                  <div
                    class="press-clear-space press-clear-space-square"
                    data-testid="press-clear-space-mark"
                  >
                    <script data-bascik-build-once>
                      import { clearSpaceSvg } from "@/lib/press-logo.ts";
                      export default async () => await clearSpaceSvg("mark");
                    </script>
                  </div>
                </diagram-panel>
              </diagram-row>
            </diagram-figure>

            <script data-bascik-build>
              import { renderMdRange } from "@/lib/md-renderer.ts";
              export default async () =>
                await renderMdRange("./content/press.md", {
                  from: "Colors",
                });
            </script>
          </div>

          <docs-pagination />
        </main>
      </div>
    </div>

    <docs-footer />
  </body>
</html>
