<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head />
  <script data-bascik-build>
    import { canonical } from '@/lib/canonical.ts';
    console.log(await canonical('/how-to/markdown'));
  </script>
  <script data-bascik-build>
    import { openGraph } from '@/lib/open-graph.ts';
    console.log(await openGraph());
  </script>
  <script data-bascik-build>
    import { breadcrumbLd } from '@/lib/breadcrumb-ld.ts';
    console.log(await breadcrumbLd());
  </script>
  <script data-bascik-build>
    import { articleSchema } from '@/lib/article-schema.ts';
    console.log(await articleSchema());
  </script>
  <meta name="description"
    content="Bascik does not ship a Markdown pipeline, but build-time scripts are Node.js - so any Markdown library works out of the box." />
  <title>Markdown - Bascik Docs</title>
</head>

<body>

  <docs-nav />

  <div class="container">
    <div class="docs-layout">
      <docs-sidebar />

      <main class="docs-content" id="main-content">
        <script data-bascik-build>
          import { renderSectionLabel } from '@/lib/render-nav.ts';
          console.log(renderSectionLabel('/using-markdown'));
        </script>

        <!-- Intro rendered from docs/content/how-to/markdown.md. -->
        <script data-bascik-build>
          import { renderMdRange } from '@/lib/md-renderer.ts';
          console.log(await renderMdRange('./content/how-to/markdown.md', { to: 'marked' }));
        </script>

        <component-demo>
          <div data-bascik-slot="example">
            <div class="markdown-preview-body">
              <h2>A practical heading</h2>
              <p>Markdown stays comfortable for authors, while the published page stays <strong>vanilla HTML</strong>.
              </p>
              <blockquote>
                <p>Add an editorial treatment with ordinary CSS.</p>
              </blockquote>
            </div>
          </div>
          <div data-bascik-slot="source-usage">
            <code-block data-bascik-prop-lang="md">
              <script data-bascik-build>
                import { extractDemoBlock } from '@/lib/md-renderer.ts';
                console.log(await extractDemoBlock('./content/how-to/markdown.md', 'source-md'));
              </script>
            </code-block>
          </div>
          <div data-bascik-slot="output-html">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { extractDemoBlock } from '@/lib/md-renderer.ts';
                console.log(await extractDemoBlock('./content/how-to/markdown.md', 'output-html'));
              </script>
            </code-block>
          </div>
        </component-demo>

        <script data-bascik-build>
          import { renderMdRange } from '@/lib/md-renderer.ts';
          console.log(await renderMdRange('./content/how-to/markdown.md', { from: 'marked' }, { stripDemoBlocks: true }));
        </script>

        <docs-pagination />
      </main>
    </div>
  </div>

  <docs-footer />

</body>

</html>
