<!-- @bascik
Interactive demo box with Preview, Source, and Output panes and per-language tabs. Used on docs pages to show a live example alongside its source and the scoped build output.
@prop no-preview - Hides the Preview tab and pane.
@prop hide-preview - Alias for no-preview.
@prop no-output - Hides the Output tab, even when output slots have content.
@prop file - Optional file path shown in the demo meta bar.
@slot example - Content rendered in the Preview pane.
@slot source-usage - Usage snippet shown in the Source pane Usage tab.
@slot source-html - HTML snippet shown in the Source pane HTML tab.
@slot source-css - CSS snippet shown in the Source pane CSS tab.
@slot source-js - JavaScript snippet shown in the Source pane JS tab.
@slot code - Fallback catch-all for the Source pane.
@slot output-html - Scoped HTML output shown in the Output pane HTML tab.
@slot output-css - Scoped CSS output shown in the Output pane CSS tab.
@slot output-js - Scoped JavaScript output shown in the Output pane JS tab.
@slot output - Fallback catch-all for the Output pane.
-->
<!--
  Bascik-specific behavior:
  - Empty named slots are hidden at runtime via :empty selectors; the demo
    only shows tabs that have content.
  - The no-preview marker uses :has() and :not(:empty) to toggle layout and
    tab visibility without JavaScript.
  - The CSS relies on modern selectors (:has(), @media (hover: hover)) that
    Bascik scopes per component; keep them inside this file's <style> block.
  - Code examples shown in the slots are authored in docs/content/*.md and
    injected via extractDemoBlock at build time, so they also feed llms.txt
    and SKILL.md.
-->
<div class="box" data-defer-render="demo" data-testid="component-demo">
  <span
    class="no-preview-marker"
    data-bascik-prop-no-preview
    data-bascik-prop-hide-preview
    hidden
  ></span>
  <span class="no-output-marker" data-bascik-prop-no-output hidden></span>
  <div class="nav">
    <!-- Each radio group sits in a form of its own: name ships as written,
         and radios with one name and no form owner are one group across the
         page, so two demos would otherwise share one tab choice. -->
    <form class="tabs">
      <label class="tab" data-testid="demo-tab-preview">
        <input
          type="radio"
          class="radio"
          name="pane"
          value="preview"
          checked
          hidden
        />
        <span>Preview</span>
      </label>
      <label class="tab" data-testid="demo-tab-code">
        <input type="radio" class="radio" name="pane" value="code" hidden />
        <span>Source</span>
      </label>
      <label class="tab" data-testid="demo-tab-output">
        <input type="radio" class="radio" name="pane" value="output" hidden />
        <span>Output</span>
      </label>
    </form>
    <div class="meta" data-bascik-prop-file></div>
  </div>

  <div class="panes">
    <div class="pane" data-pane="preview" data-testid="demo-pane-preview">
      <div class="preview" data-demo-theme="dark">
        <div data-bascik-slot="example"></div>
      </div>
    </div>
    <div
      class="pane"
      data-pane="code"
      data-demo-pane
      data-testid="demo-pane-code"
    >
      <form class="language-form">
        <tab-bar class="language-tabs" aria-label="Source language">
          <label class="language-tab" data-language="usage">
            <input
              type="radio"
              class="language-radio"
              name="source-lang"
              value="usage"
              checked
              hidden
            />
            <span>Usage</span>
          </label>
          <label class="language-tab" data-language="html">
            <input
              type="radio"
              class="language-radio"
              name="source-lang"
              value="html"
              hidden
            />
            <span>HTML</span>
          </label>
          <label class="language-tab" data-language="css">
            <input
              type="radio"
              class="language-radio"
              name="source-lang"
              value="css"
              hidden
            />
            <span>CSS</span>
          </label>
          <label class="language-tab" data-language="js">
            <input
              type="radio"
              class="language-radio"
              name="source-lang"
              value="js"
              hidden
            />
            <span>JS</span>
          </label>
        </tab-bar>
      </form>
      <div class="language-pane" data-language-pane="usage">
        <div data-bascik-slot="source-usage"></div>
      </div>
      <div class="language-pane" data-language-pane="html">
        <div data-bascik-slot="source-html"></div>
      </div>
      <div class="language-pane" data-language-pane="css">
        <div data-bascik-slot="source-css"></div>
      </div>
      <div class="language-pane" data-language-pane="js">
        <div data-bascik-slot="source-js"></div>
      </div>
      <div data-bascik-slot="code"></div>
    </div>
    <div
      class="pane"
      data-pane="output"
      data-demo-pane
      data-testid="demo-pane-output"
    >
      <div class="output-header">
        <form class="language-form">
          <tab-bar class="language-tabs" aria-label="Output language">
            <label class="language-tab" data-language="html">
              <input
                type="radio"
                class="language-radio"
                name="output-lang"
                value="html"
                checked
                hidden
              />
              <span>HTML</span>
            </label>
            <label class="language-tab" data-language="css">
              <input
                type="radio"
                class="language-radio"
                name="output-lang"
                value="css"
                hidden
              />
              <span>CSS</span>
            </label>
            <label class="language-tab" data-language="js">
              <input
                type="radio"
                class="language-radio"
                name="output-lang"
                value="js"
                hidden
              />
              <span>JS</span>
            </label>
          </tab-bar>
        </form>
        <label
          class="info-button"
          aria-label="Output formatting information"
          title="Show output format details"
        >
          <input type="checkbox" class="info-toggle" hidden />
          <svg
            width="14"
            height="14"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="8" cy="8" r="7"></circle>
            <line x1="8" y1="8" x2="8" y2="12"></line>
            <line x1="8" y1="4" x2="8.01" y2="4"></line>
          </svg>
        </label>
      </div>
      <div class="info-notice">
        Output is shown unminified (HTML, CSS, JS, and identifier names) for
        readability.
      </div>
      <div class="language-pane" data-language-pane="html">
        <div data-bascik-slot="output-html"></div>
      </div>
      <div class="language-pane" data-language-pane="css">
        <div data-bascik-slot="output-css"></div>
      </div>
      <div class="language-pane" data-language-pane="js">
        <div data-bascik-slot="output-js"></div>
      </div>
      <div class="output-fallback" data-bascik-slot="output"></div>
    </div>
  </div>
</div>

<style>
  .box {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--r);
    margin: 24px 0;
    overflow: hidden;
    background: var(--bg);
  }

  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-muted);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    overflow-x: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  .nav::-webkit-scrollbar {
    display: none;
  }

  .tabs {
    display: flex;
    flex-shrink: 0;
    margin: 0;
  }

  /* A form only to give the language radios their own group per demo. */
  .language-form {
    display: contents;
  }

  .tab {
    display: inline-flex;
    align-items: center;
    padding: 12px 16px;
    font-size: 0.85rem;
    font-weight: 500;
    line-height: 1;
    color: var(--text-muted);
    background: none;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
    position: relative;
    isolation: isolate;
    transition: color 0.2s;
    -webkit-user-select: none;
    user-select: none;
  }

  .tab::before {
    content: "";
    position: absolute;
    inset: 0;
    clip-path: polygon(7px 0%, 100% 0%, calc(100% - 7px) 100%, 0% 100%);
    z-index: -1;
  }

  @media (hover: hover) {
    .tab:hover {
      color: var(--text);
    }

    .tab:hover:not(:has(.radio:checked))::before {
      background: var(--elevated);
    }
  }

  .tab:has(.radio:checked) {
    color: #18191b;
    font-weight: 600;
  }

  .tab:has(.radio:checked)::before {
    background: var(--accent);
  }

  .meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: var(--mono);
    white-space: nowrap;
    flex-shrink: 0;
    padding-left: 16px;
  }

  .panes {
    position: relative;
    display: flex;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }

  .pane {
    display: none;
    min-height: 0;
  }

  .box:has(.no-output-marker:not(:empty)) .tab[data-testid="demo-tab-output"],
  .box:not(:has(.pane[data-pane="output"] .language-pane > *)):not(
      :has(.output-fallback > *)
    )
    .tab[data-testid="demo-tab-output"] {
    display: none;
  }

  /* When no-preview prop is set, hide the preview tab and pane. The box keeps
     its margin so the heading after it has room; a page that sets the box
     flush in its own layout zeroes the margin there. */
  .box:has(.no-preview-marker:not(:empty))
    .tab[data-testid="demo-tab-preview"] {
    display: none;
  }

  .box:has(.no-preview-marker:not(:empty)) .pane[data-pane="preview"] {
    display: none !important;
  }

  .box:has(.radio[value="preview"]:checked) .pane[data-pane="preview"] {
    display: block;
  }

  .box:has(.radio[value="code"]:checked) .pane[data-pane="code"],
  .box:has(.no-preview-marker:not(:empty)):has(.radio[value="preview"]:checked)
    .pane[data-pane="code"] {
    display: flex;
    flex: 1;
    flex-direction: column;
  }

  .box:has(.no-preview-marker:not(:empty)):has(.radio[value="preview"]:checked)
    .tab[data-testid="demo-tab-code"] {
    color: #18191b;
    font-weight: 600;
  }

  .box:has(.no-preview-marker:not(:empty)):has(.radio[value="preview"]:checked)
    .tab[data-testid="demo-tab-code"]::before {
    background: var(--accent);
  }

  .box:has(.radio[value="output"]:checked) .pane[data-pane="output"] {
    display: flex;
    flex: 1;
    flex-direction: column;
  }

  .language-tab {
    display: inline-flex;
    align-items: center;
    min-width: 48px;
    padding: 8px 12px;
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 0.75rem;
    line-height: 1;
    background: transparent;
    border: none;
    position: relative;
    isolation: isolate;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }

  .language-tab::before {
    content: "";
    position: absolute;
    inset: 0;
    clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
    z-index: -1;
  }

  .language-tab:hover {
    color: var(--text);
  }

  .language-tab:hover:not(:has(.language-radio:checked))::before {
    background: var(--elevated);
  }

  .language-tab:has(.language-radio:checked) {
    color: #18191b;
  }

  .language-tab:has(.language-radio:checked)::before {
    background: var(--accent);
  }

  .language-pane {
    display: none;
  }

  .language-pane:has(> *) {
    flex: 1;
    min-height: 0;
  }

  .language-pane:has(> *) > * {
    height: 100%;
  }

  .pane:has(.language-radio[value="usage"]:checked)
    .language-pane[data-language-pane="usage"] {
    display: block;
  }

  .pane:has(.language-radio[value="html"]:checked)
    .language-pane[data-language-pane="html"] {
    display: block;
  }

  .pane:has(.language-radio[value="css"]:checked)
    .language-pane[data-language-pane="css"] {
    display: block;
  }

  .pane:has(.language-radio[value="js"]:checked)
    .language-pane[data-language-pane="js"] {
    display: block;
  }

  /* Hide empty language tabs. Components expand to their root markup, so test for any child element. */
  .pane:not(:has(.language-pane[data-language-pane="usage"] > *))
    .language-tab[data-language="usage"] {
    display: none;
  }

  .pane:not(:has(.language-pane[data-language-pane="html"] > *))
    .language-tab[data-language="html"] {
    display: none;
  }

  .pane:not(:has(.language-pane[data-language-pane="css"] > *))
    .language-tab[data-language="css"] {
    display: none;
  }

  .pane:not(:has(.language-pane[data-language-pane="js"] > *))
    .language-tab[data-language="js"] {
    display: none;
  }

  /* Hide tablist if all language panes are empty */
  .pane:not(:has(.language-pane > *)) .language-tabs {
    display: none;
  }

  /* Fallback activation when default checked tab is empty */
  .pane:not(:has(.language-pane[data-language-pane="usage"] > *)):has(
      .language-radio[value="usage"]:checked
    )
    .language-pane[data-language-pane="html"]:has(> *) {
    display: block;
  }

  .pane:not(:has(.language-pane[data-language-pane="usage"] > *)):has(
      .language-radio[value="usage"]:checked
    )
    .language-tab[data-language="html"] {
    color: #18191b;
  }

  .pane:not(:has(.language-pane[data-language-pane="usage"] > *)):has(
      .language-radio[value="usage"]:checked
    )
    .language-tab[data-language="html"]::before {
    background: var(--accent);
  }

  .pane:not(:has(.language-pane[data-language-pane="usage"] > *)):not(
      :has(.language-pane[data-language-pane="html"] > *)
    ):has(.language-radio[value="usage"]:checked)
    .language-pane[data-language-pane="css"]:has(> *) {
    display: block;
  }

  .pane:not(:has(.language-pane[data-language-pane="usage"] > *)):not(
      :has(.language-pane[data-language-pane="html"] > *)
    ):has(.language-radio[value="usage"]:checked)
    .language-tab[data-language="css"] {
    color: #18191b;
  }

  .pane:not(:has(.language-pane[data-language-pane="usage"] > *)):not(
      :has(.language-pane[data-language-pane="html"] > *)
    ):has(.language-radio[value="usage"]:checked)
    .language-tab[data-language="css"]::before {
    background: var(--accent);
  }

  .pane:not(:has(.language-pane[data-language-pane="usage"] > *)):not(
      :has(.language-pane[data-language-pane="html"] > *)
    ):not(:has(.language-pane[data-language-pane="css"] > *)):has(
      .language-radio[value="usage"]:checked
    )
    .language-pane[data-language-pane="js"]:has(> *) {
    display: block;
  }

  .pane:not(:has(.language-pane[data-language-pane="usage"] > *)):not(
      :has(.language-pane[data-language-pane="html"] > *)
    ):not(:has(.language-pane[data-language-pane="css"] > *)):has(
      .language-radio[value="usage"]:checked
    )
    .language-tab[data-language="js"] {
    color: #18191b;
  }

  .pane:not(:has(.language-pane[data-language-pane="usage"] > *)):not(
      :has(.language-pane[data-language-pane="html"] > *)
    ):not(:has(.language-pane[data-language-pane="css"] > *)):has(
      .language-radio[value="usage"]:checked
    )
    .language-tab[data-language="js"]::before {
    background: var(--accent);
  }

  .preview {
    padding: 32px;
    background-color: var(--bg);
    background-image:
      linear-gradient(45deg, var(--bg-muted) 25%, transparent 25%),
      linear-gradient(-45deg, var(--bg-muted) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--bg-muted) 75%),
      linear-gradient(-45deg, transparent 75%, var(--bg-muted) 75%);
    background-size: 20px 20px;
    background-position:
      0 0,
      0 10px,
      10px -10px,
      -10px 0px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* The checkerboard behind a preview is screen-only */
  @media print {
    .preview {
      background: none;
    }
  }

  /* An example stage (see examples.ts) is its own page background, so the checkerboard and padding step aside. */
  .preview:has(> [data-example-stage]) {
    padding: 0;
    background: none;
    align-items: stretch;
  }

  /* Page-level examples (site-header, site-footer) span the box instead of shrinking to their content. Element names
     inside :is() stay unscoped, so this matches the example's own <header> and <footer>. */
  /* bascik-ignore css-is-element-names */
  .preview > :is(header, footer) {
    flex: 1;
  }

  .pane code-block {
    margin: 0;
  }

  .output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-right: 12px;
    background: var(--bg-muted);
  }

  .info-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--r-sm, 4px);
    cursor: pointer;
    transition:
      color 0.15s,
      background-color 0.15s;
    flex-shrink: 0;
    margin-left: auto;
    -webkit-user-select: none;
    user-select: none;
  }

  .info-button:hover {
    color: var(--text);
    background: var(--elevated);
  }

  .info-button:has(.info-toggle:checked) {
    color: var(--text);
    background: var(--elevated);
  }

  .pane:not(:has(.info-toggle:checked)) .info-notice {
    display: none;
  }

  .info-notice {
    padding: 10px 16px;
    font-size: 0.75rem;
    color: var(--text-muted);
    background: var(--bg-muted);
    border-bottom: 1px solid var(--border);
    line-height: 1.4;
  }
</style>
