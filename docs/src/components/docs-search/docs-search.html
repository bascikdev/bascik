<button type="button" class="dnav-search-btn" aria-label="Search docs" aria-expanded="false">
  <svg class="search-btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="11" cy="11" r="8"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
  <span class="search-btn-text">Search docs…</span>
  <kbd class="search-btn-kbd" aria-hidden="true">⌘K</kbd>
</button>

<div class="search-overlay" data-testid="search-overlay" hidden>
  <div class="search-backdrop"></div>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search documentation">
    <div class="search-input-row">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="search" id="docs-search-input" name="search" class="search-input" placeholder="Search docs…"
        role="combobox" aria-expanded="false" aria-controls="docs-search-results" aria-autocomplete="list"
        aria-haspopup="listbox" autocomplete="off" spellcheck="false" />
      <kbd class="search-esc">Esc</kbd>
    </div>
    <div id="docs-search-status" class="sr-only" role="status" aria-live="polite"></div>
    <ul id="docs-search-results" class="search-results" role="listbox" aria-label="Search results"></ul>
    <p class="search-empty" hidden>No results.</p>
    <p class="search-hint">Start typing to search all docs pages.</p>
  </div>
</div>
<script data-bascik-build>
  // Combine search-logic.ts (pure functions) and docs-search-dom.js (DOM wiring)
  // into one IIFE so minification can rename consistently across the whole block.
  import { readFile } from 'node:fs/promises';
  import { existsSync } from 'node:fs';
  import { join, resolve } from 'node:path';
  const base = existsSync(resolve(process.cwd(), 'src/components/docs-search'))
    ? resolve(process.cwd(), 'src/components/docs-search')
    : resolve(process.cwd(), 'docs/src/components/docs-search');
  const logic = await readFile(join(base, 'search-logic.ts'), 'utf8');
  const dom = await readFile(join(base, 'docs-search-dom.js'), 'utf8');
  const fns = logic
    .replace(/^\/\*\*[\s\S]*?\r?\n\r?\n/m, '')   // strip file-level JSDoc
    .replace(/^export interface[\s\S]*?\r?\n\}/m, '') // strip SearchEntry interface
    .replace(/:\s*(?:string\s*\|\s*null\s*\|\s*undefined|string(?:\[\])?|number|SearchEntry(?:\[\])?|Record<[^>]+>)/g, '') // strip TS types
    .replace(/^export function /gm, 'function ')
    .replace(/^export const /gm, 'var ');
  console.log('<script>\n(function () {\n' + fns.trim() + '\n\n' + dom.trim() + '\n})();\n</scr' + 'ipt>');
</script>
