<button
  type="button"
  class="button"
  aria-label="Search docs"
  aria-expanded="false"
>
  <svg
    class="button-icon"
    width="14"
    height="14"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="11" cy="11" r="8"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
  <span class="button-text">Search docs…</span>
  <kbd class="button-shortcut" aria-hidden="true">⌘K</kbd>
</button>

<div class="overlay" data-testid="search-overlay" hidden>
  <div class="backdrop"></div>
  <div
    class="panel"
    role="dialog"
    aria-modal="true"
    aria-label="Search documentation"
  >
    <div class="input-row">
      <svg
        class="icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="search"
        id="docs-search-input"
        name="search"
        class="input"
        placeholder="Search docs…"
        aria-label="Search docs"
        role="combobox"
        aria-expanded="false"
        aria-controls="docs-search-results"
        aria-autocomplete="list"
        aria-haspopup="listbox"
        autocomplete="off"
        spellcheck="false"
      />
      <kbd class="escape">Esc</kbd>
    </div>
    <div
      id="docs-search-status"
      class="visually-hidden"
      role="status"
      aria-live="polite"
    ></div>
    <ul
      id="docs-search-results"
      class="results"
      role="listbox"
      aria-label="Search results"
    ></ul>
    <p class="empty" hidden>No results.</p>
    <p class="hint">Start typing to search all docs pages.</p>
  </div>
</div>
<script data-bascik-build-once>
  // Combine search-logic.ts (pure functions) and docs-search-dom.js (DOM wiring)
  // into one IIFE so minification can rename consistently across the whole block.
  import { readFile } from "node:fs/promises";
  import { existsSync } from "node:fs";
  import { stripTypeScriptTypes } from "node:module";
  import { join, resolve } from "node:path";
  import {
    PUBLIC_SEARCH_INDEX_PATH,
    buildSearchEntries,
    searchIndexJson,
    searchIndexPath,
  } from "@/lib/search-index.ts";
  export default async function () {
    // The paths are string literals passed to a call so the script cache key and
    // the dev watcher see both files as dependencies. Without that, editing
    // either file would keep serving a stale cached bundle.
    const root = existsSync(
      resolve(process.cwd(), "src/components/docs-search"),
    )
      ? process.cwd()
      : resolve(process.cwd(), "docs");
    const here = (p) => join(root, p);
    const logic = await readFile(
      here("src/components/docs-search/search-logic.ts"),
      "utf8",
    );
    const dom = await readFile(
      here("src/components/docs-search/docs-search-dom.js"),
      "utf8",
    );
    // Node's strip-only mode erases the types and the interface; the export
    // keywords go because both files are concatenated into one classic IIFE.
    const fns = stripTypeScriptTypes(logic)
      .replace(/^\/\*\*[\s\S]*?\r?\n\r?\n/m, "") // strip file-level JSDoc
      .replace(/^export function /gm, "function ")
      .replace(/^export const /gm, "var ");
    // The index file name carries a hash of the index, built from the same content as the file the build
    // writes (scripts/generate-search-index.ts), so a new deploy never serves a cached old index. A page
    // opened before a deploy names a file the deploy removed, so it falls back to the unhashed index.
    const indexUrl = searchIndexPath(
      searchIndexJson(await buildSearchEntries()),
    );
    return (
      "<script>\n(function () {\nvar SEARCH_INDEX_URL = " +
      JSON.stringify(indexUrl) +
      ";\nvar PUBLIC_SEARCH_INDEX_URL = " +
      JSON.stringify(PUBLIC_SEARCH_INDEX_PATH) +
      ";\n\n" +
      fns.trim() +
      "\n\n" +
      dom.trim() +
      "\n})();\n</scr" +
      "ipt>"
    );
  }
</script>
