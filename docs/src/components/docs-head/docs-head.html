<!-- @bascik
Shared head markup component. Place inside the head block of a page shell:

  <head>
    <docs-head />
    <title>...</title>
  </head>
-->
<!--
  Bascik-specific behavior:
  - This component carries no props or slots; it is pure shared head markup.
  - The inline <script> below is a runtime script, not a data-bascik-build or
    data-bascik-server script. It runs on the client before first paint to
    apply the saved theme and prevent a flash of the wrong theme.
  - Bascik wraps component scripts in an IIFE. This script touches
    document.documentElement and sessionStorage directly (no getElementById /
    querySelector calls), so no DOM selector rewriting is needed.
  - Because it lives in <head>, keep it dependency-free and synchronous so it
    does not block or defer the critical path.
-->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#18191b" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<!-- Apply saved theme before first paint to prevent flash -->
<script>!function () { var t = new URLSearchParams(location.search).get('theme') || sessionStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t) }()</script>
