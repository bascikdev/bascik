<!--
  Code arrives highlighted from the build (src/lib/highlight.ts, called by md-renderer.ts and examples.ts), so
  this component has no script: a script here would be copied into every block on the page. One handler in
  docs-footer copies a block's plain text when its button is clicked, found through the data-cblock-* hooks.
-->
<div class="block" data-testid="code-block">
  <div class="header">
    <span class="language" data-bascik-prop-lang>html</span>
    <span class="file" data-bascik-prop-file></span>
  </div>
  <div class="pre-wrap">
    <pre><code class="body" data-cblock-code><span data-bascik-slot></span></code></pre>
    <button
      class="copy"
      type="button"
      data-cblock-copy
      data-testid="code-block-copy"
      aria-label="Copy code"
      title="Copy"
    >
      <svg
        class="copy-icon"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path
          d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
        ></path>
      </svg>
      <svg
        class="check-icon"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </button>
    <span
      class="status visually-hidden"
      role="status"
      aria-live="polite"
      data-cblock-status
    ></span>
  </div>
</div>
