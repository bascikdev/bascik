<div class="cblock" id="cblock-root">
  <div class="cblock-header">
    <span class="cblock-lang" data-bascik-prop-lang>html</span>
    <span class="cblock-file" data-bascik-prop-file></span>
  </div>
  <div class="cblock-pre-wrap">
    <pre><code class="cblock-body"><span data-bascik-slot></span></code></pre>
    <button class="cblock-copy" aria-label="Copy code" title="Copy">
      <svg class="cblock-copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <svg class="cblock-check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </button>
    <span class="cblock-status sr-only" role="status" aria-live="polite"></span>
  </div>
</div>

<script>
  function e(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  const C = {
    cm: 'cm',
    str: 'str',
    kw: 'kw',
    num: 'num',
    attr: 'attr',
    val: 'val',
    sel: 'sel',
    fn: 'fn',
  };

  function tok(token, s) {
    return '<span data-code-token="' + token + '">' + e(s) + '</span>';
  }

  function highlight(src, lang) {
    if (lang === 'html') return hlHtml(src);
    if (lang === 'css') return hlCss(src);
    if (lang === 'js' || lang === 'javascript' || lang === 'ts' || lang === 'typescript' || lang === 'jsx' || lang === 'tsx') return hlJs(src);
    if (lang === 'sh' || lang === 'bash' || lang === 'shell') return hlSh(src);
    if (lang === 'json') return hlJs(src);
    return null;
  }

  // --- HTML ---
  function hlHtml(src) {
    let out = '', i = 0;
    const n = src.length;
    while (i < n) {
      // Comment
      if (src[i] === '<' && src.startsWith('!--', i + 1)) {
        const j = src.indexOf('-->', i + 4);
        const end = j < 0 ? n : j + 3;
        out += tok(C.cm, src.slice(i, end)); i = end; continue;
      }
      // Tag
      if (src[i] === '<' && i + 1 < n && (src[i + 1] === '/' || /[a-zA-Z!]/.test(src[i + 1]))) {
        out += e('<'); i++;
        if (i < n && src[i] === '/') { out += e('/'); i++; }
        const nm = /^[\w-]+/.exec(src.slice(i));
        if (nm) { out += tok(C.kw, nm[0]); i += nm[0].length; }
        while (i < n && src[i] !== '>') {
          if (src[i] === '/' && src[i + 1] === '>') { out += e('/>'); i += 2; break; }
          if (/\s/.test(src[i])) { out += src[i++]; continue; }
          const am = /^[\w:-]+/.exec(src.slice(i));
          if (am) {
            out += tok(C.attr, am[0]); i += am[0].length;
            if (i < n && src[i] === '=') {
              out += e('='); i++;
              if (i < n && (src[i] === '"' || src[i] === "'")) {
                const q = src[i];
                const qj = src.indexOf(q, i + 1);
                const qe = qj < 0 ? n : qj + 1;
                out += tok(C.val, src.slice(i, qe)); i = qe;
              }
            }
          } else { out += e(src[i++]); }
        }
        if (i < n && src[i] === '>') { out += e('>'); i++; }
        continue;
      }
      out += e(src[i++]);
    }
    return out;
  }

  // --- CSS ---
  function hlCss(src) {
    let out = '', i = 0, depth = 0;
    const n = src.length;
    while (i < n) {
      // Comment
      if (src[i] === '/' && src[i + 1] === '*') {
        const j = src.indexOf('*/', i + 2);
        const end = j < 0 ? n : j + 2;
        out += tok(C.cm, src.slice(i, end)); i = end; continue;
      }
      // String
      if (src[i] === '"' || src[i] === "'") {
        const q = src[i]; let j = i + 1;
        while (j < n && src[j] !== q) { if (src[j] === '\\') j++; j++; }
        out += tok(C.str, src.slice(i, j + 1)); i = j + 1; continue;
      }
      // At-rule
      if (src[i] === '@') {
        const m = /^@[\w-]+/.exec(src.slice(i));
        if (m) { out += tok(C.kw, m[0]); i += m[0].length; continue; }
      }
      if (src[i] === '{') { out += e('{'); depth++; i++; continue; }
      if (src[i] === '}') { out += e('}'); if (depth > 0) depth--; i++; continue; }

      if (depth > 0) {
        if (/\s/.test(src[i])) { out += src[i++]; continue; }
        if (src[i] === ';') { out += e(';'); i++; continue; }
        // Property: word followed by colon
        const pm = /^([\w-]+)(\s*:)/.exec(src.slice(i));
        if (pm) {
          out += tok(C.attr, pm[1]) + e(pm[2]); i += pm[0].length;
          // Value until ; or }
          while (i < n && src[i] !== ';' && src[i] !== '}') {
            if (src[i] === '/' && src[i + 1] === '*') {
              const j = src.indexOf('*/', i + 2); const end = j < 0 ? n : j + 2;
              out += tok(C.cm, src.slice(i, end)); i = end;
            } else if (src[i] === '"' || src[i] === "'") {
              const q = src[i]; let j = i + 1;
              while (j < n && src[j] !== q) { if (src[j] === '\\') j++; j++; }
              out += tok(C.str, src.slice(i, j + 1)); i = j + 1;
            } else if (src[i] === '#') {
              const hm = /^#[0-9a-fA-F]{3,8}/.exec(src.slice(i));
              if (hm) { out += tok(C.num, hm[0]); i += hm[0].length; }
              else { out += e(src[i++]); }
            } else if (/[0-9]/.test(src[i]) || (src[i] === '-' && /[0-9]/.test(src[i + 1] || ''))) {
              const nm = /^-?[\d.]+[\w%]*/.exec(src.slice(i));
              if (nm) { out += tok(C.num, nm[0]); i += nm[0].length; }
              else { out += e(src[i++]); }
            } else if (/[a-zA-Z_]/.test(src[i])) {
              const wm = /^[\w-]+/.exec(src.slice(i));
              if (wm) {
                const we = i + wm[0].length;
                out += (we < n && src[we] === '(') ? tok(C.fn, wm[0]) : tok(C.val, wm[0]);
                i = we;
              } else { out += e(src[i++]); }
            } else { out += e(src[i++]); }
          }
          continue;
        }
      } else {
        // Selector context
        if (!/\s/.test(src[i]) && src[i] !== '{' && src[i] !== '}') {
          const sm = /^[^\s{};]+/.exec(src.slice(i));
          if (sm) { out += tok(C.sel, sm[0]); i += sm[0].length; continue; }
        }
      }
      if (/\s/.test(src[i])) out += src[i++]; else out += e(src[i++]);
    }
    return out;
  }

  // --- JavaScript / TypeScript ---
  const JS_KW = new Set(['const', 'let', 'var', 'function', 'return', 'if', 'else', 'for', 'while', 'do',
    'switch', 'case', 'break', 'continue', 'new', 'class', 'extends', 'import', 'export', 'default', 'from',
    'async', 'await', 'try', 'catch', 'finally', 'throw', 'typeof', 'instanceof', 'in', 'of', 'true', 'false',
    'null', 'undefined', 'this', 'super', 'static', 'get', 'set', 'yield', 'delete', 'void', 'type', 'interface',
    'enum', 'as', 'readonly', 'abstract']);

  function hlJs(src) {
    let out = '', i = 0;
    const n = src.length;
    while (i < n) {
      // Line comment
      if (src[i] === '/' && src[i + 1] === '/') {
        const j = src.indexOf('\n', i);
        const end = j < 0 ? n : j;
        out += tok(C.cm, src.slice(i, end)); i = end; continue;
      }
      // Block comment
      if (src[i] === '/' && src[i + 1] === '*') {
        const j = src.indexOf('*/', i + 2);
        const end = j < 0 ? n : j + 2;
        out += tok(C.cm, src.slice(i, end)); i = end; continue;
      }
      // Template literal
      if (src[i] === '`') {
        let j = i + 1;
        while (j < n && src[j] !== '`') { if (src[j] === '\\') j++; j++; }
        out += tok(C.str, src.slice(i, j + 1)); i = j + 1; continue;
      }
      // String
      if (src[i] === '"' || src[i] === "'") {
        const q = src[i]; let j = i + 1;
        while (j < n && src[j] !== q && src[j] !== '\n') { if (src[j] === '\\') j++; j++; }
        out += tok(C.str, src.slice(i, j + 1)); i = j + 1; continue;
      }
      // Number
      if (/[0-9]/.test(src[i])) {
        const m = /^0x[0-9a-fA-F]+|^[\d.]+([eE][+-]?\d+)?/.exec(src.slice(i));
        if (m) { out += tok(C.num, m[0]); i += m[0].length; continue; }
      }
      // Identifier or keyword
      if (/[a-zA-Z_$]/.test(src[i])) {
        const m = /^[a-zA-Z_$][\w$]*/.exec(src.slice(i));
        if (m) {
          const word = m[0];
          const after = i + word.length;
          if (JS_KW.has(word)) out += tok(C.kw, word);
          else if (after < n && src[after] === '(') out += tok(C.fn, word);
          else out += e(word);
          i = after; continue;
        }
      }
      out += e(src[i++]);
    }
    return out;
  }

  // --- Shell ---
  function hlSh(src) {
    let out = '', i = 0;
    const n = src.length;
    while (i < n) {
      if (src[i] === '#') {
        const j = src.indexOf('\n', i);
        const end = j < 0 ? n : j;
        out += tok(C.cm, src.slice(i, end)); i = end; continue;
      }
      if (src[i] === '"' || src[i] === "'") {
        const q = src[i]; let j = i + 1;
        while (j < n && src[j] !== q) { if (src[j] === '\\') j++; j++; }
        out += tok(C.str, src.slice(i, j + 1)); i = j + 1; continue;
      }
      out += e(src[i++]);
    }
    return out;
  }

  const root = document.getElementById('cblock-root');
  const langEl = root && root.querySelector('.cblock-lang');
  const codeEl = root && root.querySelector('.cblock-body');
  const copyBtn = root && root.querySelector('.cblock-copy');
  const statusEl = root && root.querySelector('.cblock-status');
  if (langEl && codeEl) {
    const lang = langEl.textContent.trim().toLowerCase();
    const raw = codeEl.textContent;
    if (lang && lang !== 'text' && raw.trim()) {
      const result = highlight(raw, lang);
      if (result !== null) codeEl.innerHTML = result;
    }
  }
  if (copyBtn && codeEl) {
    copyBtn.addEventListener('click', function () {
      if (!navigator.clipboard || typeof navigator.clipboard.writeText !== 'function') return;
      navigator.clipboard.writeText(codeEl.textContent).then(function () {
        copyBtn.classList.add('cblock-copy--done');
        copyBtn.setAttribute('aria-label', 'Copied!');
        copyBtn.setAttribute('title', 'Copied!');
        if (statusEl) statusEl.textContent = 'Code copied to clipboard';
        setTimeout(function () {
          copyBtn.classList.remove('cblock-copy--done');
          copyBtn.setAttribute('aria-label', 'Copy code');
          copyBtn.setAttribute('title', 'Copy');
          if (statusEl) statusEl.textContent = '';
        }, 2000);
      }).catch(function () {
        // Clipboard may be unavailable (permissions / non-secure context)
      });
    });
  }
</script>
