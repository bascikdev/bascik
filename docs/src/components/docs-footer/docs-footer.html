        <script data-bascik-build-once>
          import { NAV } from "@/lib/nav.ts";
          import { renderNavListItem } from "@/lib/nav-helpers.ts";
          export default async function () {
            let html = "";
            for (const section of NAV) {
              html += `<div class="dfooter-col"><p class="dfooter-col-heading">${section.section}</p><ul class="dfooter-col-links">`;
              for (const page of section.pages) {
                html += renderNavListItem(page);
              }
              html += "</ul></div>";
            }
            return html;
          }
        </script>

<script>
  function normalizeHashId(raw) {
    if (!raw) return "";
    try {
      raw = decodeURIComponent(raw);
    } catch (_) {}
    return raw
      .replace(/^#/, "")
      .toLowerCase()
      .replace(/&#39;|&apos;/g, "'")
      .replace(/[^\w\s-]/g, "")
      .trim()
      .replace(/\s+/g, "-")
      .replace(/-+/g, "-");
  }

  function findTargetElement(hash) {
    if (!hash) return null;
    let rawId = hash.startsWith("#") ? hash.slice(1) : hash;
    try {
      rawId = decodeURIComponent(rawId);
    } catch (_) {}

    // The id comes from the URL hash or a heading anchor in the page's Markdown, never this component.
    // bascik-ignore js-dynamic-id-lookup
    let el = document.getElementById(rawId);
    if (el) return el;

    const norm = normalizeHashId(rawId);
    if (norm) {
      // bascik-ignore js-dynamic-id-lookup
      el = document.getElementById(norm);
      if (el) return el;
      // bascik-ignore js-attribute-selector
      const headings = document.querySelectorAll("h1, h2, h3, h4, [id]");
      for (let i = 0; i < headings.length; i++) {
        const id = headings[i].id;
        if (id && normalizeHashId(id) === norm) {
          return headings[i];
        }
      }
    }
    return null;
  }

  function scrollToElement(target, smooth, onSettled) {
    if (!target) return;
    const offset =
      parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue(
          "--anchor-scroll-offset",
        ),
      ) || 0;
    const top = Math.max(
      0,
      target.getBoundingClientRect().top + window.scrollY - offset,
    );
    const prefersReduced = window.matchMedia(
      "(prefers-reduced-motion: reduce)",
    ).matches;
    const behavior = smooth && !prefersReduced ? "smooth" : "auto";
    const startY = window.scrollY;
    window.scrollTo({ top: top, behavior: behavior });
    // An instant scroll has landed by now, so the settle knows where it left the page. A smooth one has not.
    const landedY =
      behavior === "auto" && behaviorIsInstant() ? window.scrollY : null;
    settleOn(target, offset, startY, onSettled, landedY);
  }

  // Blocks below the fold use content-visibility: auto, so until they come near the viewport they count at an
  // estimated height. The scroll above aims with those estimates, and the blocks it lands near then render at
  // their real height and move the target. Once the scroll ends, aim again until the target holds still. Any
  // input from the visitor ends this at once, so it never fights their own scrolling. So does a scroll that
  // sends no input event (dragging the scrollbar, a script): when the page is no longer where this left it,
  // it stays where it was moved. onSettled runs once, however the settle ends.
  let cancelSettle = null;
  function settleOn(target, offset, startY, onSettled, landedY) {
    if (cancelSettle) cancelSettle();
    let done = false;
    let corrections = 0;
    const inputs = ["wheel", "touchstart", "keydown", "pointerdown"];
    function stop() {
      if (done) return;
      done = true;
      window.removeEventListener("scrollend", check);
      inputs.forEach(function (type) {
        window.removeEventListener(type, stop);
      });
      if (cancelSettle === stop) cancelSettle = null;
      if (onSettled) onSettled();
    }
    function check() {
      if (done) return;
      window.removeEventListener("scrollend", check);
      // Two frames: one to render the blocks that came into view, one to lay them out.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          if (done) return;
          if (landedY !== null && Math.abs(window.scrollY - landedY) > 1)
            return stop();
          const delta = target.getBoundingClientRect().top - offset;
          if (Math.abs(delta) <= 1 || corrections++ >= 8) return stop();
          window.scrollTo({ top: window.scrollY + delta, behavior: "instant" });
          landedY = window.scrollY;
          check();
        });
      });
    }
    window.addEventListener("scrollend", check);
    inputs.forEach(function (type) {
      window.addEventListener(type, stop, { passive: true });
    });
    cancelSettle = stop;
    // A scroll that did not move the page sends no scrollend, and an instant one may be done already.
    requestAnimationFrame(function () {
      if (window.scrollY === startY || behaviorIsInstant()) check();
    });
    // Never wait longer than a smooth scroll can take.
    setTimeout(stop, 3000);
  }

  function behaviorIsInstant() {
    return (
      getComputedStyle(document.documentElement).scrollBehavior !== "smooth"
    );
  }

  document
    .querySelectorAll("h2 .anchor-link, h3 .anchor-link")
    .forEach(function (a) {
      a.addEventListener("click", function (e) {
        // Preserve standard link behaviors (new tab/window, context menu, etc.)
        if (
          e.defaultPrevented ||
          e.button !== 0 ||
          e.metaKey ||
          e.ctrlKey ||
          e.shiftKey ||
          e.altKey
        )
          return;

        e.preventDefault();

        const href = a.getAttribute("href") || "";
        history.replaceState(null, "", href);

        const target = findTargetElement(href);
        if (target) {
          scrollToElement(target, true);
        }

        if (
          !navigator.clipboard ||
          typeof navigator.clipboard.writeText !== "function"
        )
          return;

        navigator.clipboard
          .writeText(location.href)
          .then(function () {
            a.classList.add("copied");
            setTimeout(function () {
              a.classList.remove("copied");
            }, 1500);
          })
          .catch(function () {
            // Clipboard may be unavailable (permissions / non-secure context)
          });
      });
    });

  function handleAutoScroll() {
    if (!location.hash) return;
    const target = findTargetElement(location.hash);
    if (target) {
      scrollToElement(target, false);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", handleAutoScroll);
  } else {
    handleAutoScroll();
  }
  window.addEventListener("load", handleAutoScroll);
  // The "On this page" list in docs-sidebar sends its clicks here so they get the same re-aim as every other
  // anchor jump. detail.target is the heading; detail.onSettled runs once the page holds still on it.
  document.addEventListener("docs:scroll-to-heading", function (event) {
    const detail = event.detail || {};
    if (!detail.target) return;
    event.preventDefault();
    scrollToElement(detail.target, true, detail.onSettled);
  });
  window.addEventListener("hashchange", function () {
    const target = findTargetElement(location.hash);
    if (target) {
      scrollToElement(target, true);
    }
  });
</script>
<script>
  /* bascik-disable js-attribute-selector */
  // The copy button of every <code-block> on the page. One handler here instead of a script in each block,
  // which the page would carry once per block. The code is highlighted at build time, so textContent is the
  // plain source with no markup.
  document.addEventListener("click", function (event) {
    var target = event.target;
    var button =
      target && target.closest && target.closest("[data-cblock-copy]");
    if (!button) return;
    var wrap = button.parentElement;
    var code = wrap && wrap.querySelector("[data-cblock-code]");
    var status = wrap && wrap.querySelector("[data-cblock-status]");
    if (
      !code ||
      !navigator.clipboard ||
      typeof navigator.clipboard.writeText !== "function"
    )
      return;
    navigator.clipboard
      .writeText(code.textContent)
      .then(function () {
        button.setAttribute("data-copied", "");
        button.setAttribute("aria-label", "Copied!");
        button.setAttribute("title", "Copied!");
        if (status) status.textContent = "Code copied to clipboard";
        setTimeout(function () {
          button.removeAttribute("data-copied");
          button.setAttribute("aria-label", "Copy code");
          button.setAttribute("title", "Copy");
          if (status) status.textContent = "";
        }, 2000);
      })
      .catch(function () {
        // Clipboard may be unavailable (permissions / non-secure context)
      });
  });
</script>
