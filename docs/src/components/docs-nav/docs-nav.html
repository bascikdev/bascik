<nav aria-label="Main">
  <div class="container">
    <a href="/" class="logo" aria-label="Bascik home"><docs-logo /></a>
    <div class="controls">
      <docs-search />
      <button
        type="button"
        class="menu-toggle"
        aria-label="Toggle navigation"
        aria-expanded="false"
      >
        <span class="toggle-icon"></span>
      </button>
      <div class="links-wrapper">
        <ul class="links">
          <li><a href="/why-bascik">Why Bascik</a></li>
          <li><a href="/getting-started">Docs</a></li>
          <li>
            <a
              href="https://github.com/bascikdev/bascik"
              target="_blank"
              rel="noopener"
              >GitHub</a
            >
          </li>
        </ul>
        <div class="mobile-sections">
          <!-- The section links repeat the sidebar, about 300 elements on every page. They wait in a template
               until the menu first opens, so pages do not lay out a menu that is rarely shown. -->
          <template class="sections-template">
            <script data-bascik-build-once>
              import { NAV } from "@/lib/nav.ts";
              import { renderNavListItem } from "@/lib/nav-helpers.ts";
              export default async function () {
                let html = "";
                for (const section of NAV) {
                  html += `<p class="section-heading">${section.section}</p><ul class="section-links">`;
                  for (const page of section.pages) {
                    html += renderNavListItem(page);
                  }
                  html += "</ul>";
                }
                return html;
              }
            </script>
          </template>
          <hr class="separator" />
          <ul class="section-links">
            <li>
              <a
                href="https://github.com/bascikdev/bascik"
                target="_blank"
                rel="noopener"
                >GitHub &#x2197;</a
              >
            </li>
            <li>
              <button type="button" class="mobile-theme">
                <svg
                  class="icon sun"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="5" />
                  <line x1="12" y1="1" x2="12" y2="3" />
                  <line x1="12" y1="21" x2="12" y2="23" />
                  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                  <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                  <line x1="1" y1="12" x2="3" y2="12" />
                  <line x1="21" y1="12" x2="23" y2="12" />
                  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                  <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                </svg>
                <svg
                  class="icon moon"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
                <span class="theme-label">Light</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
      <button
        type="button"
        class="theme-toggle"
        aria-label="Switch to light theme"
      >
        <!-- Sun: shown in dark mode, click to go light -->
        <svg
          class="icon sun"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <!-- Moon: shown in light mode, click to go dark -->
        <svg
          class="icon moon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"

          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />

      </button>
    </div>
  </div>
</nav>
<script>
  /* bascik-disable js-document-class-query */
  (function () {
    var toggle = document.querySelector(".menu-toggle");
    var wrapper = document.querySelector(".links-wrapper");
    if (toggle && wrapper) {
      toggle.addEventListener("click", function () {
        var sections = wrapper.querySelector(".sections-template");
        if (sections) {
          var links = sections.content.cloneNode(true);
          markCurrentLinks(links);
          sections.replaceWith(links);
        }
        var isOpen = toggle.getAttribute("aria-expanded") !== "true";
        toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
        document.body.style.overflow = isOpen ? "hidden" : "";
      });
    }

    var themeBtn = document.querySelector(".theme-toggle");
    var mobileThemeBtn = document.querySelector(".mobile-theme");
    if (themeBtn || mobileThemeBtn) {
      function effectiveTheme() {
        return document.documentElement.getAttribute("data-theme") || "dark";
      }
      function syncThemeLabels() {
        var isDark = effectiveTheme() === "dark";
        if (themeBtn)
          themeBtn.setAttribute(
            "aria-label",
            isDark ? "Switch to light theme" : "Switch to dark theme",
          );
        if (mobileThemeBtn) {
          var span = mobileThemeBtn.querySelector(".theme-label");
          if (span) span.textContent = isDark ? "Light" : "Dark";
        }
      }
      function toggleTheme() {
        var next = effectiveTheme() === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        sessionStorage.setItem("theme", next);
        syncThemeLabels();
      }
      syncThemeLabels();
      // docs-head applies the current theme when a prerendered page is shown; its listener runs first.
      if (document.prerendering)
        document.addEventListener("prerenderingchange", syncThemeLabels, {
          once: true,
        });
      if (themeBtn) themeBtn.addEventListener("click", toggleTheme);
      if (mobileThemeBtn) mobileThemeBtn.addEventListener("click", toggleTheme);
    }

    var path = window.location.pathname;
    function markCurrentLinks(root) {
      root.querySelectorAll("a").forEach(markCurrent);
    }
    function markCurrent(a) {
      var href = a.getAttribute("href");
      if (!href || href.startsWith("http")) return;
      var current = false;
      if (href === "/why-bascik") {
        current = path === "/why-bascik";
      } else if (href === "/getting-started" && a.closest(".links")) {
        current =
          path !== "" &&
          path !== "/" &&
          path !== "/why-bascik" &&
          path !== "/sponsor" &&
          path !== "/press";
      } else {
        current = href === path;
      }
      if (current) a.setAttribute("aria-current", "page");
    }
    document.querySelectorAll(".logo, .links-wrapper a").forEach(markCurrent);
  })();
</script>
