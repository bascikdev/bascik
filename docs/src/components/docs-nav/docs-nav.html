<script>
  (function () {
    var toggle = document.querySelector('.dnav-toggle');
    var wrapper = document.querySelector('.dnav-links-wrapper');
    if (toggle && wrapper) {
      toggle.addEventListener('click', function () {
        var isOpen = toggle.getAttribute('aria-expanded') !== 'true';
        toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        document.body.style.overflow = isOpen ? 'hidden' : '';
      });
    }

    var themeBtn = document.querySelector('.dnav-theme-toggle');
    var mobileThemeBtn = document.querySelector('.mobile-theme-btn');
    if (themeBtn || mobileThemeBtn) {
      function effectiveTheme() {
        return document.documentElement.getAttribute('data-theme') || 'dark';
      }
      function syncThemeLabels() {
        var isDark = effectiveTheme() === 'dark';
        if (themeBtn) themeBtn.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
        if (mobileThemeBtn) {
          var span = mobileThemeBtn.querySelector('.mobile-theme-label');
          if (span) span.textContent = isDark ? 'Light' : 'Dark';
        }
      }
      function toggleTheme() {
        var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        sessionStorage.setItem('theme', next);
        syncThemeLabels();
      }
      syncThemeLabels();
      if (themeBtn) themeBtn.addEventListener('click', toggleTheme);
      if (mobileThemeBtn) mobileThemeBtn.addEventListener('click', toggleTheme);
    }

    var path = window.location.pathname;
    document.querySelectorAll('.dnav a').forEach(function (a) {
      var href = a.getAttribute('href');
      if (!href || href.startsWith('http')) return;
      var current = false;
      if (href === '/why-bascik') {
        current = (path === '/why-bascik');
      } else if (href === '/getting-started' && a.closest('.dnav-links')) {
        current = (path !== '' && path !== '/' && path !== '/why-bascik');
      } else {
        current = (href === path);
      }
      if (current) a.setAttribute('aria-current', 'page');
    });
  })();
</script>
