<!-- @bascik
A framed diagram with a caption. Hold any mix of diagram-row and diagram-steps inside it.
@prop title - Caption shown above the diagram.
@prop footer - Optional note shown below the diagram.
@slot default - The diagram body.
-->
<figure class="diagram">
  <figcaption class="diagram-title" data-bascik-prop-title></figcaption>
  <div data-bascik-slot></div>
  <p class="diagram-footer" data-bascik-prop-footer></p>
</figure>
