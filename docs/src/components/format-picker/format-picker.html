<form data-testid="format-picker">
  <fieldset>
    <legend data-bascik-prop-book>Book</legend>
    <label>
      <input
        type="radio"
        name="format"
        value="ebook"
        data-testid="format-ebook"
      />
      Ebook
    </label>
    <label>
      <input
        type="radio"
        name="format"
        value="paperback"
        data-testid="format-paperback"
      />
      Paperback
    </label>
  </fieldset>
</form>
