<figure class="timeline">
  <figcaption class="caption">
    <span class="kicker">Twenty years of workarounds</span>
    <span class="title"
      >Every wave bolted something onto the web. The browser absorbed most of
      it.</span
    >
  </figcaption>
  <div class="headings">
    <span>What we reached for</span>
    <span>Built into the browser now</span>
  </div>
  <ol class="list">
    <li class="row">
      <div class="then">
        <span class="era">2006 · Patch the browser</span>
        <span class="tool">jQuery, Lodash, Bootstrap</span>
        <span class="syntax">$('.nav').hide()</span>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="now">
        <code>querySelectorAll</code> <code>classList</code> <code>fetch</code>
        <code>Array.map</code> <code>?.</code> <code>&lt;dialog&gt;</code>
      </div>
    </li>
    <li class="row">
      <div class="then">
        <span class="era">2008 · Template the HTML</span>
        <span class="tool">Jinja, Liquid, Handlebars</span>
        <span class="syntax">{{&gt; nav }}</span>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="now">
        <code>&lt;template&gt;</code> <code>`template literals`</code>
      </div>
    </li>
    <li class="row">
      <div class="then">
        <span class="era">2013 · Render it in JavaScript</span>
        <span class="tool">React, Angular, Vue</span>
        <span class="syntax">&lt;Nav items={items} /&gt;</span>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="now">
        <code>customElements</code> <code>import</code> <code>popover</code>
      </div>
    </li>
    <li class="row">
      <div class="then">
        <span class="era">2017 · Rethink CSS</span>
        <span class="tool">Tailwind, Sass, CSS-in-JS</span>
        <span class="syntax">class="flex p-4 md:p-8"</span>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="now">
        <code>var()</code> <code>&amp; nesting</code> <code>@layer</code>
        <code>@container</code> <code>:has()</code> <code>@scope</code>
      </div>
    </li>
    <li class="row row-open">
      <div class="then">
        <span class="era">Still missing</span>
        <span class="tool">A vanilla HTML file as the component</span>
        <span class="syntax">site-nav.html → &lt;site-nav /&gt;</span>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="now now-open">
        <span class="answer">Bascik</span>
        <span class="answer-detail"
          >Standard HTML, CSS, and JavaScript in. Standard HTML, CSS, and
          JavaScript out. No new syntax, no runtime.</span
        >
      </div>
    </li>
  </ol>
  <p class="footnote">
    Each wave taught its own syntax. None of them let vanilla HTML be the
    component.
  </p>
</figure>
