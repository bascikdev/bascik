<article data-testid="showcase-card" data-bascik-attr-data-site="site">
  <a
    data-testid="showcase-card-link"
    data-bascik-attr-href="url"
    target="_blank"
    rel="noopener noreferrer"
  >
    <div class="preview">
      <div data-bascik-slot="image"></div>
    </div>
    <div class="title">
      <h3 data-bascik-prop-name></h3>
      <span class="domain">
        <span data-bascik-prop-domain></span>
        <span aria-hidden="true">&#8599;</span>
        <span class="new-tab">(opens in a new tab)</span>
      </span>
    </div>
  </a>
  <div class="description">
    <div data-bascik-slot="description"></div>
  </div>
</article>
