<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Northwind Tasks roadmap</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        font:
          16px/1.5 Helvetica,
          Arial,
          sans-serif;
        color: #1d2433;
      }
      .timeline {
        position: relative;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .timeline li {
        position: relative;
        padding: 0 0 32px 40px;
      }
      .dot {
        position: absolute;
        left: 0;
        top: 2px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #2457d6;
      }
      .check {
        position: absolute;
        left: 6px;
        top: 8px;
        width: 12px;
        height: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Roadmap</h2>
      <ol class="timeline">
        <li>
          <span class="dot"></span>
          <svg class="check" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2 6l3 3 5-6" stroke="#fff" stroke-width="2" fill="none" />
          </svg>
          Research
        </li>
        <li>
          <span class="dot"></span>
          <svg class="check" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2 6l3 3 5-6" stroke="#fff" stroke-width="2" fill="none" />
          </svg>
          Design review
        </li>
        <li>
          <span class="dot"></span>
          <svg class="check" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2 6l3 3 5-6" stroke="#fff" stroke-width="2" fill="none" />
          </svg>
          Launch
        </li>
      </ol>
    </main>
  </body>
</html>
