<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Milk frother</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Helvetica,
          Arial,
          sans-serif;
        color: #1d2433;
      }
      .timeline {
        position: relative;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .timeline li {
        position: relative;
        padding: 0 0 32px 40px;
      }
      .dot {
        position: absolute;
        left: 0;
        top: 2px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #2457d6;
      }
      .check {
        position: absolute;
        left: 6px;
        top: 8px;
        width: 12px;
        height: 12px;
      }
      .row {
        display: flex;
      }
      .timeline li {
        padding: 0 0 32px 0;
        height: 28px;
        width: 24px;
      }
      .labels {
        list-style: none;
      }
      .labels li {
        height: 60px;
      }
    </style>
  </head>
  <body>
    <main style="padding: 40px">
      <h2>Roadmap</h2>
      <div class="row">
        <ol class="timeline">
          <li>
            <span class="dot"></span
            ><svg class="check" viewBox="0 0 12 12" aria-hidden="true">
              <path
                d="M2 6l3 3 5-6"
                stroke="#fff"
                stroke-width="2"
                fill="none"
              />
            </svg>
          </li>
          <li>
            <span class="dot"></span
            ><svg class="check" viewBox="0 0 12 12" aria-hidden="true">
              <path
                d="M2 6l3 3 5-6"
                stroke="#fff"
                stroke-width="2"
                fill="none"
              />
            </svg>
          </li>
          <li>
            <span class="dot"></span
            ><svg class="check" viewBox="0 0 12 12" aria-hidden="true">
              <path
                d="M2 6l3 3 5-6"
                stroke="#fff"
                stroke-width="2"
                fill="none"
              />
            </svg>
          </li>
        </ol>
        <ol class="labels">
          <li>Research</li>
          <li>Design review</li>
          <li>Launch</li>
        </ol>
      </div>
    </main>
  </body>
</html>
