<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Milk frother</title>
    <style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#1d2433;line-height:1.5;background:#fff}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{background:#fff;border-bottom:1px solid #e3e7ef}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.top a{color:#1d2433;text-decoration:none;font-weight:700}
main{display:block}
.foot{border-top:1px solid #e3e7ef;padding:24px 0;color:#5b6475;font-size:14px}
h1{font-size:36px;line-height:1.2;margin:0 0 16px}
h2{font-size:28px;line-height:1.25;margin:0 0 12px}
h3{font-size:20px;line-height:1.3;margin:0 0 8px}
p{margin:0 0 12px}
section{padding:48px 0}
.hero{background:#eef2fb;padding:64px 0 120px}
.order{padding:0;margin-top:-80px}
.order .card{background:#fff;max-width:560px;margin:0 auto;padding:24px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
    </style>
  </head>
  <body>
<header class="top" data-testid="site-header"><div class="wrap"><a href="/" data-testid="site-header-home">Milk frother</a></div></header>
<main data-testid="main">
<section class="hero" aria-label="Intro" data-testid="intro"><div class="wrap"><h1>Froth at home</h1><p>Café-style foam from your own kitchen.</p></div></section>
<section class="order" aria-label="Order" data-testid="order"><div class="wrap"><div class="card"><h2>Order today</h2><p>Ships in one business day.</p></div></div></section>
<section aria-label="Care" data-testid="care"><div class="wrap"><h2>Care</h2><p>Rinse the whisk after each use.</p></div></section>
</main>
<footer class="foot" data-testid="site-footer"><div class="wrap"><p>© 2026 Milk frother</p></div></footer>

  </body>
</html>
