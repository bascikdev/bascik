name: Shop

on:
  push:
    paths:
      - "shop/**"
      - "pkg/**"
      - "adapters/cloudflare/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/shop.yml"
  pull_request:
    paths:
      - "shop/**"
      - "pkg/**"
      - "adapters/cloudflare/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/shop.yml"
  workflow_dispatch:
    inputs:
      deploy_sandbox:
        description: "Deploy the disabled-commerce sandbox from main"
        type: boolean
        default: false
      deploy_production_prelaunch:
        description: "Deploy isolated production with commerce disabled and no domain cutover"
        type: boolean
        default: false
      deploy_production:
        description: "Deploy live shop.bascik.dev with checkout and fulfillment enabled"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn pkg:build && yarn adapter:cf:build
      - run: yarn shop:build
      - run: yarn shop:typecheck && yarn shop:unit
      - run: yarn workspace bascik-shop integration
      - run: yarn workspace bascik-shop exec playwright install --with-deps chromium
      - run: yarn shop:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: shop-cloudflare-build
          include-hidden-files: true
          path: |
            shop/.output/worker.js
            shop/.output/wrangler.json
            shop/.output/public/
            shop/.output/migrations/
  deploy-preview:
    needs: validate
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && github.repository == 'bascikdev/bascik'
    runs-on: ubuntu-latest
    environment: shop-preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@v4
        with:
          name: shop-cloudflare-build
          path: shop/.output
      - name: Deploy draft-only PR shop
        working-directory: shop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOP_CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          ORDER_TOKEN_SEED: ${{ secrets.ORDER_TOKEN_SEED }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-preview.ts
  deploy-sandbox:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_sandbox && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: shop-sandbox
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@v4
        with:
          name: shop-cloudflare-build
          path: shop/.output
      - name: Deploy isolated sandbox
        working-directory: shop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOP_CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Set SHOP_CLOUDFLARE_API_TOKEN in the shop-sandbox environment."; exit 1; }
          node --input-type=module -e 'import{readFile}from"node:fs/promises";const c=JSON.parse(await readFile(".output/wrangler.json"));if(c.name!=="bascik-shop-sandbox"||c.vars.SHOP_MODE!=="test"||c.vars.SHOP_ENABLED!=="false"||c.vars.SHOP_FULFILLMENT_ENABLED!=="false"||c.routes?.length||c.send_email?.length)throw Error("Unsafe sandbox configuration");'
          yarn exec wrangler d1 migrations apply DB --remote --config .output/wrangler.json
          yarn exec wrangler deploy --config .output/wrangler.json
  deploy-production-prelaunch:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production_prelaunch && !inputs.deploy_production && github.ref == 'refs/heads/main' && github.repository == 'bascikdev/bascik'
    runs-on: ubuntu-latest
    environment: shop-production
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@v4
        with:
          name: shop-cloudflare-build
          path: shop/.output
      - name: Deploy disabled production prelaunch
        working-directory: shop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOP_CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_ACCOUNT: ${{ secrets.STRIPE_ACCOUNT }}
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PRINTFUL_WEBHOOK_SECRET: ${{ secrets.PRINTFUL_WEBHOOK_SECRET }}
          PRINTFUL_WEBHOOK_PUBLIC_KEY: ${{ secrets.PRINTFUL_WEBHOOK_PUBLIC_KEY }}
          ORDER_TOKEN_SECRET: ${{ secrets.ORDER_TOKEN_SECRET }}
          STRIPE_WEBHOOK_ENDPOINT_ID: ${{ secrets.STRIPE_WEBHOOK_ENDPOINT_ID }}
        run: |
          node scripts/check-live-providers.ts
          node scripts/deploy-production-prelaunch.ts
  deploy-production:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.repository == 'bascikdev/bascik' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_production))
    runs-on: ubuntu-latest
    environment: shop-production
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@v4
        with:
          name: shop-cloudflare-build
          path: shop/.output
      - name: Deploy live production shop
        working-directory: shop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOP_CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_ACCOUNT: ${{ secrets.STRIPE_ACCOUNT }}
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PRINTFUL_WEBHOOK_SECRET: ${{ secrets.PRINTFUL_WEBHOOK_SECRET }}
          PRINTFUL_WEBHOOK_PUBLIC_KEY: ${{ secrets.PRINTFUL_WEBHOOK_PUBLIC_KEY }}
          ORDER_TOKEN_SECRET: ${{ secrets.ORDER_TOKEN_SECRET }}
          STRIPE_WEBHOOK_ENDPOINT_ID: ${{ secrets.STRIPE_WEBHOOK_ENDPOINT_ID }}
        run: |
          node scripts/check-live-providers.ts --launch
          node scripts/deploy-production-prelaunch.ts --launch
