name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Stage 1: Static analysis, typechecks, formatting, and spelling ──────────────

  jelly:
    name: Jelly Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Jelly Static Analyzer Globally
        run: npm install -g @cs-au-dk/jelly

      - name: Run Jelly Analysis on package
        run: |
          OUTPUT=$(jelly --obj-spread pkg/src/index.ts)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Analysis errors: 0" || { echo "$OUTPUT"; exit 1; }

  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

  typecheck:
    name: Workspace Typechecks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Typecheck all workspace packages
        run: yarn typecheck:all

  standards:
    name: Spelling & Web Standards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn check:format

      - name: Install codespell
        run: pipx install codespell

      - name: Check spelling
        run: yarn check:spelling

      - name: Check web standards
        run: yarn check:standards

  # ── Stage 2: Unit tests (after every stage 1 job passes) ────────────────────────

  unit-pkg:
    name: Framework Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Run framework unit tests with coverage
        run: yarn pkg:test:ci

  unit-create:
    name: Create-Bascik Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      # scaffold.integration.test.ts compiles scaffolded projects with both.
      - name: Build package and adapter
        run: yarn pkg:build && yarn adapter:cf:build

      - name: Run create-bascik unit tests
        run: yarn create:test:ci

  unit-lsp:
    name: Language Server Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run language server unit tests
        run: yarn lsp:test:ci

  # Windows is a supported platform, so the code that touches paths, processes, and files runs there too. Checkout
  # uses Git for Windows' default line-ending conversion on purpose: `.gitattributes` must keep every file LF, and a
  # failure here that mentions line endings means it no longer does. Each step runs even if an earlier one failed,
  # so one run reports every failing package.
  unit-windows:
    name: Windows Unit Tests
    runs-on: windows-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      # Windows runners ship a global Yarn 1 shim in C:\npm\prefix that precedes
      # Node's directory on PATH; overwrite it before setup-node's cache step runs
      # `yarn --version` and `yarn cache dir`.
      - name: Enable Corepack
        run: |
          $yarnCmd = (Get-Command yarn -ErrorAction SilentlyContinue).Source
          if ($yarnCmd) {
            corepack enable --install-directory (Split-Path $yarnCmd)
          }
          corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      # On Windows, Corepack's shims are written next to the active `node`, so the
      # ones from the runner's preinstalled Node are gone once Node 24 is on PATH.
      - name: Enable Corepack for Node 24
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Framework unit tests
        if: ${{ !cancelled() }}
        run: yarn pkg:unit

      - name: Language server unit tests
        if: ${{ !cancelled() }}
        run: yarn lsp:unit

      # scaffold.integration.test.ts builds the Cloudflare template with it.
      - name: Build Cloudflare adapter
        if: ${{ !cancelled() }}
        run: yarn adapter:cf:build

      - name: Create-Bascik unit tests
        if: ${{ !cancelled() }}
        run: yarn create:unit

  unit-adapter-cloudflare:
    name: Cloudflare Adapter Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package and adapter
        run: yarn pkg:build && yarn adapter:cf:build

      - name: Run Cloudflare adapter unit tests
        run: yarn adapter:cf:test:ci

  unit-docs:
    name: Docs Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run docs unit tests
        run: yarn docs:unit

  unit-skills:
    name: Agent Skills Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run agent skills unit tests
        run: yarn skills:unit

  unit-extension:
    name: Extension Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run extension unit tests
        run: yarn ext:unit

  # ── Stage 3: Integration tests and the Node 22.22 floor (after every unit job) ───

  integration-pkg:
    name: Framework Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        unit-pkg,
        unit-create,
        unit-lsp,
        unit-windows,
        unit-adapter-cloudflare,
        unit-docs,
        unit-skills,
        unit-extension,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Build language server
        run: yarn lsp:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework integration tests
        run: yarn pkg:integration

  integration-docs:
    name: Docs Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        unit-pkg,
        unit-create,
        unit-lsp,
        unit-windows,
        unit-adapter-cloudflare,
        unit-docs,
        unit-skills,
        unit-extension,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run docs integration tests
        run: yarn docs:integration

  integration-skills:
    name: Agent Skills Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        unit-pkg,
        unit-create,
        unit-lsp,
        unit-windows,
        unit-adapter-cloudflare,
        unit-docs,
        unit-skills,
        unit-extension,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      # The bascik-refactor parity checks drive a real browser on fixture pages.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # skills:integration builds the package and the language server for skill-monorepo.integration.test.ts.
      - name: Run agent skills integration tests
        run: yarn skills:integration

  # The published packages declare `engines.node >=22.22.0`, and `bin/bascik.js` enforces it, so one lane proves every
  # workspace still builds and passes its unit tests on that floor, plus the framework integration tests (real builds,
  # servers and sockets; Node 22.22 bundles an older nghttp2 than 24, see body-limit-linger.integration.test.ts). The
  # other jobs stay on Node 24: two pkg test helpers need a V8 13.6 intrinsic and Node 24's TLS cleanup callback
  # ordering, and those tests skip themselves on Node 22.
  node-floor:
    name: Node 22.22 Floor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        unit-pkg,
        unit-create,
        unit-lsp,
        unit-windows,
        unit-adapter-cloudflare,
        unit-docs,
        unit-skills,
        unit-extension,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 22.22
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Build language server
        run: yarn lsp:build

      - name: Build create-bascik
        run: yarn create:build

      - name: Build Cloudflare adapter
        run: yarn adapter:cf:build

      # After the builds: `@bascik/bascik/*` imports (pkg/e2e/bascik.config.ts,
      # the adapter, docs) resolve to the package's dist/ types.
      - name: Typecheck all workspace packages
        run: yarn typecheck:all

      - name: Framework unit tests
        run: yarn pkg:unit

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Framework integration tests
        run: yarn pkg:integration

      - name: Create-Bascik unit tests
        run: yarn create:unit

      - name: Language server unit tests
        run: yarn lsp:unit

      - name: Extension unit tests
        run: yarn ext:unit

      - name: Cloudflare adapter unit tests
        run: yarn adapter:cf:unit

      - name: Docs unit tests
        run: yarn docs:unit

      - name: Agent skills unit tests
        run: yarn skills:unit

  # ── Stage 4: End-to-end tests (after every stage 3 job passes) ──────────────────

  e2e-pkg-static:
    name: Framework E2E (Static)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [integration-pkg, integration-docs, integration-skills, node-floor]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework E2E tests (static)
        run: yarn pkg:e2e

  e2e-pkg-dev:
    name: Framework E2E (Dev Server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [integration-pkg, integration-docs, integration-skills, node-floor]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework E2E tests (dev server)
        run: yarn pkg:e2e:dev

      - name: Run framework E2E tests (dev exec lifecycle)
        run: yarn pkg:e2e:dev:exec

      - name: Run framework E2E tests (exec failure policy)
        run: yarn pkg:e2e:exec:policy

      - name: Run framework E2E tests (exec build lifecycle)
        run: yarn pkg:e2e:exec:build

  e2e-pkg-prod-http1:
    name: Framework E2E (Prod Server HTTP/1.1)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [integration-pkg, integration-docs, integration-skills, node-floor]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework E2E tests (production server HTTP/1.1)
        run: yarn pkg:e2e:prod:http1

  e2e-pkg-prod-http2:
    name: Framework E2E (Prod Server HTTP/2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [integration-pkg, integration-docs, integration-skills, node-floor]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework E2E tests (production server HTTP/2)
        run: yarn pkg:e2e:prod:http2

  e2e-adapter-cloudflare:
    name: Cloudflare Adapter E2E (local workerd)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [integration-pkg, integration-docs, integration-skills, node-floor]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package and adapter
        run: yarn pkg:build && yarn adapter:cf:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Cloudflare adapter E2E tests
        run: yarn adapter:cf:e2e

  e2e-docs:
    name: Docs E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [integration-pkg, integration-docs, integration-skills, node-floor]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run docs E2E tests
        run: yarn docs:e2e

  e2e-create:
    name: Create-Bascik Scaffold E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [integration-pkg, integration-docs, integration-skills, node-floor]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Run create-bascik scaffold generation test
        run: yarn create:test-site

  # ── Stage 5: Deploy to Cloudflare (after every stage 4 job passes) ──────────────
  # Pushes to main deploy both Workers to production. A pull request from a branch of this repo uploads a Preview
  # version of each under one alias per branch and lists the URLs in a single PR comment; a fork's pull request has no
  # secrets and skips the stage. The token reaches only the Wrangler steps. Runbook: DEPLOYMENT.md.

  deploy-docs:
    name: Deploy Docs (bascik.dev)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    needs:
      [
        e2e-pkg-static,
        e2e-pkg-dev,
        e2e-pkg-prod-http1,
        e2e-pkg-prod-http2,
        e2e-adapter-cloudflare,
        e2e-docs,
        e2e-create,
      ]
    # One deploy per ref at a time. A newer push to a pull request replaces its running Preview upload; on main a
    # running production deploy always finishes. The group does not order runs, so the newest-commit step below keeps
    # an older commit whose tests finished late from replacing a newer one.
    concurrency:
      group: deploy-docs-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      preview-url: ${{ steps.upload.outputs.url }}
    steps:
      # Full history: docs/scripts/generate-git-dates.ts reads it for sitemap lastmod and article dates.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (see DEPLOYMENT.md)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is not set (see DEPLOYMENT.md)"; exit 1; }

      # docs:build sets BASCIK_SITE_URL=https://bascik.dev itself.
      - name: Build package and docs
        run: yarn pkg:build && yarn docs:build

      # Runs inside the concurrency group, right before Wrangler. Skips the upload or deploy when the branch has moved
      # on: a newer commit that finished testing first has already deployed, or will, and this one must not replace it.
      - name: Check this is still the newest commit
        id: newest
        env:
          REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          newest="$(node .github/scripts/newest-commit.mjs "$REF" "$SHA")"
          echo "newest=$newest" >> "$GITHUB_OUTPUT"

      - name: Compute the Preview alias
        if: github.event_name == 'pull_request'
        id: alias
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          alias="$(node .github/scripts/preview-alias.mjs "$HEAD_REF" bascik bascik-streaming-test)"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Upload a Preview version
        if: github.event_name == 'pull_request' && steps.newest.outputs.newest == 'true'
        id: upload
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-docs.ndjson
          ALIAS: ${{ steps.alias.outputs.alias }}
          MESSAGE: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.head.sha }} merged into ${{ github.base_ref }}"
        run: |
          yarn wrangler versions upload --preview-alias "$ALIAS" --message "$MESSAGE"
          url="$(node ../.github/scripts/wrangler-preview-url.mjs "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the Preview
        if: github.event_name == 'pull_request' && steps.newest.outputs.newest == 'true'
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: node .github/scripts/smoke-test.mjs "$URL" /=200 /components=200 /components/=307 /semantic-html=301 /name-attribute=301 /no-such-page=404

      - name: Deploy to production
        if: github.event_name == 'push' && steps.newest.outputs.newest == 'true'
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MESSAGE: "main at ${{ github.sha }}"
        run: yarn wrangler deploy --message "$MESSAGE"

      - name: Smoke-test production
        if: github.event_name == 'push' && steps.newest.outputs.newest == 'true'
        run: node .github/scripts/smoke-test.mjs https://bascik.dev /=200 /components=200 /semantic-html=301

  deploy-demo:
    name: Deploy Adapter Demo (cloudflare-adapter.bascik.dev)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    needs:
      [
        e2e-pkg-static,
        e2e-pkg-dev,
        e2e-pkg-prod-http1,
        e2e-pkg-prod-http2,
        e2e-adapter-cloudflare,
        e2e-docs,
        e2e-create,
      ]
    concurrency:
      group: deploy-demo-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      preview-url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (see DEPLOYMENT.md)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is not set (see DEPLOYMENT.md)"; exit 1; }

      # Builds the package, the adapter, then the fixture with --target cloudflare into
      # adapters/cloudflare/e2e/fixture/dist/.bascik/cloudflare (config from the fixture's wrangler.jsonc).
      - name: Build package, adapter, and demo
        run: yarn adapter:cf:demo:build

      # Runs inside the concurrency group, right before Wrangler. Skips the upload or deploy when the branch has moved
      # on: a newer commit that finished testing first has already deployed, or will, and this one must not replace it.
      - name: Check this is still the newest commit
        id: newest
        env:
          REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          newest="$(node .github/scripts/newest-commit.mjs "$REF" "$SHA")"
          echo "newest=$newest" >> "$GITHUB_OUTPUT"

      - name: Compute the Preview alias
        if: github.event_name == 'pull_request'
        id: alias
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          alias="$(node .github/scripts/preview-alias.mjs "$HEAD_REF" bascik bascik-streaming-test)"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Upload a Preview version
        if: github.event_name == 'pull_request' && steps.newest.outputs.newest == 'true'
        id: upload
        working-directory: adapters/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-demo.ndjson
          ALIAS: ${{ steps.alias.outputs.alias }}
          MESSAGE: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.head.sha }} merged into ${{ github.base_ref }}"
        run: |
          yarn wrangler versions upload --config e2e/fixture/dist/.bascik/cloudflare/wrangler.jsonc --preview-alias "$ALIAS" --message "$MESSAGE"
          url="$(node ../../.github/scripts/wrangler-preview-url.mjs "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the Preview
        if: github.event_name == 'pull_request' && steps.newest.outputs.newest == 'true'
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: node .github/scripts/smoke-test.mjs "$URL" /=200 /catalog=200 /catalog-stream=200

      # Also attaches the custom domain listed in the fixture's wrangler.jsonc `routes`.
      - name: Deploy to production
        if: github.event_name == 'push' && steps.newest.outputs.newest == 'true'
        working-directory: adapters/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MESSAGE: "main at ${{ github.sha }}"
        run: yarn wrangler deploy --config e2e/fixture/dist/.bascik/cloudflare/wrangler.jsonc --message "$MESSAGE"

      - name: Smoke-test production
        if: github.event_name == 'push' && steps.newest.outputs.newest == 'true'
        run: node .github/scripts/smoke-test.mjs https://cloudflare-adapter.bascik.dev /=200 /catalog=200 /catalog-stream=200

  # Runs after both uploads, so the comment always lists two URLs from the same commit. A run whose commit was no
  # longer the newest uploaded nothing and leaves the comment to the newer run.
  preview-comment:
    name: Comment Preview URLs
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      needs.deploy-docs.outputs.preview-url != '' && needs.deploy-demo.outputs.preview-url != ''
    permissions:
      contents: read
      pull-requests: write
    needs: [deploy-docs, deploy-demo]
    concurrency:
      group: preview-comment-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Create or update the Preview comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOCS_PREVIEW_URL: ${{ needs.deploy-docs.outputs.preview-url }}
          DEMO_PREVIEW_URL: ${{ needs.deploy-demo.outputs.preview-url }}
        run: node .github/scripts/preview-comment.mjs
