name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Stage 1: Jelly & Unit Tests (Parallel) ───────────────────────────────────

  jelly:
    name: Jelly Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Jelly Static Analyzer Globally
        run: npm install -g @cs-au-dk/jelly

      - name: Run Jelly Analysis on package
        run: |
          OUTPUT=$(jelly --obj-spread pkg/src/index.ts)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Analysis errors: 0" || { echo "$OUTPUT"; exit 1; }

  unit-pkg:
    name: Framework Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Run framework unit tests with coverage
        run: yarn pkg:test:ci

  integration-pkg:
    name: Framework Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Build language server
        run: yarn lsp:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework integration tests
        run: yarn pkg:integration

  unit-create:
    name: Create-Bascik Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Run create-bascik unit tests
        run: yarn create:test:ci

  # Windows is a supported platform, so the code that touches paths, processes, and files runs there too. Checkout
  # uses Git for Windows' default line-ending conversion on purpose: `.gitattributes` must keep every file LF, and a
  # failure here that mentions line endings means it no longer does. Each step runs even if an earlier one failed,
  # so one run reports every failing package.
  unit-windows:
    name: Windows Unit Tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Windows runners ship a global Yarn 1 shim in C:\npm\prefix that precedes
      # Node's directory on PATH; overwrite it before setup-node's cache step runs
      # `yarn --version` and `yarn cache dir`.
      - name: Enable Corepack
        run: |
          $yarnCmd = (Get-Command yarn -ErrorAction SilentlyContinue).Source
          if ($yarnCmd) {
            corepack enable --install-directory (Split-Path $yarnCmd)
          }
          corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      # On Windows, Corepack's shims are written next to the active `node`, so the
      # ones from the runner's preinstalled Node are gone once Node 24 is on PATH.
      - name: Enable Corepack for Node 24
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Framework unit tests
        if: ${{ !cancelled() }}
        run: yarn pkg:unit

      - name: Language server unit tests
        if: ${{ !cancelled() }}
        run: yarn lsp:unit

      - name: Create-Bascik unit tests
        if: ${{ !cancelled() }}
        run: yarn create:unit

  unit-adapter-cloudflare:
    name: Cloudflare Adapter Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package and adapter
        run: yarn pkg:build && yarn adapter:cf:build

      - name: Run Cloudflare adapter unit tests
        run: yarn adapter:cf:test:ci

  unit-docs:
    name: Docs Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run docs unit tests
        run: yarn docs:test

  unit-extension:
    name: Extension Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run extension unit tests
        run: yarn ext:unit

  typecheck:
    name: Workspace Typechecks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Typecheck all workspace packages
        run: yarn typecheck:all

  # The published packages declare `engines.node >=22.18.0`, and `bin/bascik.js` enforces it, so one lane proves every
  # workspace still builds and passes its unit tests on that floor. The other jobs stay on Node 24: two pkg test helpers
  # need a V8 13.6 intrinsic and Node 24's TLS cleanup callback ordering, and those tests skip themselves on Node 22.
  node-floor:
    name: Node 22.18 Floor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 22.18
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck all workspace packages
        run: yarn typecheck:all

      - name: Build package
        run: yarn pkg:build

      - name: Build language server
        run: yarn lsp:build

      - name: Build create-bascik
        run: yarn create:build

      - name: Build Cloudflare adapter
        run: yarn adapter:cf:build

      - name: Framework unit tests
        run: yarn pkg:unit

      - name: Create-Bascik unit tests
        run: yarn create:unit

      - name: Language server unit tests
        run: yarn lsp:unit

      - name: Extension unit tests
        run: yarn ext:unit

      - name: Cloudflare adapter unit tests
        run: yarn adapter:cf:unit

      - name: Docs unit tests
        run: yarn docs:unit

  standards:
    name: Spelling & Web Standards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn check:format

      - name: Install codespell
        run: pipx install codespell

      - name: Check spelling
        run: yarn check:spelling

      - name: Check web standards
        run: yarn check:standards

  # ── Stage 2: E2E Tests (Parallel, Depends on Stage 1) ───────────────────────

  e2e-pkg-static:
    name: Framework E2E (Static)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        jelly,
        unit-pkg,
        integration-pkg,
        unit-create,
        unit-adapter-cloudflare,
        unit-docs,
        unit-extension,
        typecheck,
        standards,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework E2E tests (static)
        run: yarn pkg:e2e

  e2e-pkg-dev:
    name: Framework E2E (Dev Server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        jelly,
        unit-pkg,
        integration-pkg,
        unit-create,
        unit-adapter-cloudflare,
        unit-docs,
        unit-extension,
        typecheck,
        standards,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework E2E tests (dev server)
        run: yarn pkg:e2e:dev

      - name: Run framework E2E tests (dev exec lifecycle)
        run: yarn pkg:e2e:dev:exec

      - name: Run framework E2E tests (exec failure policy)
        run: yarn pkg:e2e:exec:policy

  e2e-pkg-prod-http1:
    name: Framework E2E (Prod Server HTTP/1.1)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        jelly,
        unit-pkg,
        integration-pkg,
        unit-create,
        unit-adapter-cloudflare,
        unit-docs,
        unit-extension,
        typecheck,
        standards,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework E2E tests (production server HTTP/1.1)
        run: yarn pkg:e2e:prod:http1

  e2e-pkg-prod-http2:
    name: Framework E2E (Prod Server HTTP/2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        jelly,
        unit-pkg,
        integration-pkg,
        unit-create,
        unit-adapter-cloudflare,
        unit-docs,
        unit-extension,
        typecheck,
        standards,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework E2E tests (production server HTTP/2)
        run: yarn pkg:e2e:prod:http2

  e2e-adapter-cloudflare:
    name: Cloudflare Adapter E2E (local workerd)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        jelly,
        unit-pkg,
        integration-pkg,
        unit-create,
        unit-adapter-cloudflare,
        unit-docs,
        unit-extension,
        typecheck,
        standards,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package and adapter
        run: yarn pkg:build && yarn adapter:cf:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Cloudflare adapter E2E tests
        run: yarn adapter:cf:e2e

  e2e-docs:
    name: Docs E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        jelly,
        unit-pkg,
        integration-pkg,
        unit-create,
        unit-adapter-cloudflare,
        unit-docs,
        unit-extension,
        typecheck,
        standards,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run docs E2E tests
        run: yarn docs:e2e

  e2e-create:
    name: Create-Bascik Scaffold E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        jelly,
        unit-pkg,
        integration-pkg,
        unit-create,
        unit-adapter-cloudflare,
        unit-docs,
        unit-extension,
        typecheck,
        standards,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Run create-bascik scaffold generation test
        run: yarn create:test-site

  # ── Stage 3: Semgrep Static Analysis (Depends on E2E Tests) ──────────────────

  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        e2e-pkg-static,
        e2e-pkg-dev,
        e2e-pkg-prod-http1,
        e2e-pkg-prod-http2,
        e2e-adapter-cloudflare,
        e2e-docs,
        e2e-create,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
