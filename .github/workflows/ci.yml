name: CI

# A push to a branch other than main runs every stage, then uploads a Preview of both Workers. A push to main (a
# merged pull request, already tested on its branch) skips stages 1 to 4 and only deploys both Workers to
# production: the stage 1 jobs skip on main, every test job after them skips with them, and the deploy jobs run
# anyway because their `if` starts with !cancelled(). On any other branch the deploy jobs still need every stage 4
# job to have succeeded. Tags never run CI (release.yml handles them): a push filter with only `branches` skips
# tag pushes.
#
# Production deploys come only from pull requests merged into main. Because a push to main runs no tests, each deploy
# job on main first asks GitHub for the pull requests of github.sha and fails, deploying nothing, unless one of them
# was merged into main (.github/scripts/merged-pull-request.mjs). A commit pushed straight to main therefore never
# deploys; the manual emergency deploy in DEPLOYMENT.md is the documented bypass.
#
# pull_request is here only so pull requests from forks get tested. A pull request from a branch of this repo is
# already tested by that branch's push run, whose checks are on the same head commit and so show on the pull
# request; the stage 1 jobs skip on such a pull_request event, and every later job needs them, so the rest of that
# run skips too (a skipped `needs` skips the job instead of failing it). A fork's pull request runs stages 1 to 4
# and never stage 5, which runs only on push.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to a branch cancels that branch's older run, Preview upload included. Runs on main never share a
# group, so none is canceled or left pending. No job has its own concurrency group (a shared group holds only one
# pending job, so a later-queued older deploy could cancel a newer one); the newest-commit check before Wrangler keeps
# main's production deploys in order.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Stage 1: Static analysis, typechecks, formatting, and spelling ──────────────

  jelly:
    name: Jelly Static Analysis
    runs-on: ubuntu-latest
    # Skips a same-repo pull request, which its branch's push run tests (see the top of the file).
    if: >-
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Jelly Static Analyzer Globally
        run: npm install -g @cs-au-dk/jelly

      - name: Run Jelly Analysis on package
        run: |
          OUTPUT=$(jelly --obj-spread pkg/src/index.ts)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Analysis errors: 0" || { echo "$OUTPUT"; exit 1; }

  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    # Skips a same-repo pull request, which its branch's push run tests (see the top of the file).
    if: >-
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

  typecheck:
    name: Workspace Typechecks
    runs-on: ubuntu-latest
    # Skips a same-repo pull request, which its branch's push run tests (see the top of the file).
    if: >-
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Typecheck all workspace packages
        run: yarn typecheck:all

  standards:
    name: Spelling & Web Standards
    runs-on: ubuntu-latest
    # Skips a same-repo pull request, which its branch's push run tests (see the top of the file).
    if: >-
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn check:format

      - name: Install codespell
        run: pipx install codespell

      - name: Check spelling
        run: yarn check:spelling

      - name: Check web standards
        run: yarn check:standards

  # ── Stage 2: Unit tests (after every stage 1 job passes) ────────────────────────

  unit-pkg:
    name: Framework Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Run framework unit tests with coverage
        run: yarn pkg:test:ci

  unit-create:
    name: Create-Bascik Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      # scaffold.integration.test.ts compiles scaffolded projects with both.
      - name: Build package and adapter
        run: yarn pkg:build && yarn adapter:cf:build

      - name: Run create-bascik unit tests
        run: yarn create:test:ci

  unit-lsp:
    name: Language Server Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run language server unit tests
        run: yarn lsp:test:ci

  # Windows is a supported platform, so the code that touches paths, processes, and files runs there too. Checkout
  # uses Git for Windows' default line-ending conversion on purpose: `.gitattributes` must keep every file LF, and a
  # failure here that mentions line endings means it no longer does. Each step runs even if an earlier one failed,
  # so one run reports every failing package.
  unit-windows:
    name: Windows Unit Tests
    runs-on: windows-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      # Windows runners ship a global Yarn 1 shim in C:\npm\prefix that precedes
      # Node's directory on PATH; overwrite it before setup-node's cache step runs
      # `yarn --version` and `yarn cache dir`.
      - name: Enable Corepack
        run: |
          $yarnCmd = (Get-Command yarn -ErrorAction SilentlyContinue).Source
          if ($yarnCmd) {
            corepack enable --install-directory (Split-Path $yarnCmd)
          }
          corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      # On Windows, Corepack's shims are written next to the active `node`, so the
      # ones from the runner's preinstalled Node are gone once Node 24 is on PATH.
      - name: Enable Corepack for Node 24
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Framework unit tests
        if: ${{ !cancelled() }}
        run: yarn pkg:unit

      - name: Language server unit tests
        if: ${{ !cancelled() }}
        run: yarn lsp:unit

      # scaffold.integration.test.ts builds the Cloudflare template with it.
      - name: Build Cloudflare adapter
        if: ${{ !cancelled() }}
        run: yarn adapter:cf:build

      - name: Create-Bascik unit tests
        if: ${{ !cancelled() }}
        run: yarn create:unit

  unit-adapter-cloudflare:
    name: Cloudflare Adapter Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package and adapter
        run: yarn pkg:build && yarn adapter:cf:build

      - name: Run Cloudflare adapter unit tests
        run: yarn adapter:cf:test:ci

  unit-docs:
    name: Docs Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run docs unit tests
        run: yarn docs:unit

  unit-skills:
    name: Agent Skills Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run agent skills unit tests
        run: yarn skills:unit

  unit-extension:
    name: Extension Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [jelly, semgrep, typecheck, standards]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run extension unit tests
        run: yarn ext:unit

  # ── Stage 3: Integration tests, linear-time checks, and the Node 22.22 floor (after every unit job)

  integration-pkg:
    name: Framework Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        unit-pkg,
        unit-create,
        unit-lsp,
        unit-windows,
        unit-adapter-cloudflare,
        unit-docs,
        unit-skills,
        unit-extension,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Build language server
        run: yarn lsp:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework integration tests
        run: yarn pkg:integration

  integration-docs:
    name: Docs Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        unit-pkg,
        unit-create,
        unit-lsp,
        unit-windows,
        unit-adapter-cloudflare,
        unit-docs,
        unit-skills,
        unit-extension,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run docs integration tests
        run: yarn docs:integration

  integration-skills:
    name: Agent Skills Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        unit-pkg,
        unit-create,
        unit-lsp,
        unit-windows,
        unit-adapter-cloudflare,
        unit-docs,
        unit-skills,
        unit-extension,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      # The bascik-refactor parity checks drive a real browser on fixture pages.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # skills:integration builds the package and the language server for skill-monorepo.integration.test.ts.
      - name: Run agent skills integration tests
        run: yarn skills:integration

  # The published packages declare `engines.node >=22.22.0`, and `bin/bascik.js` enforces it, so one lane proves every
  # workspace still builds and passes its unit tests on that floor, plus the framework integration tests (real builds,
  # servers and sockets; Node 22.22 bundles an older nghttp2 than 24, see body-limit-linger.integration.test.ts). The
  # other jobs stay on Node 24: two pkg test helpers need a V8 13.6 intrinsic and Node 24's TLS cleanup callback
  # ordering, and those tests skip themselves on Node 22.
  node-floor:
    name: Node 22.22 Floor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        unit-pkg,
        unit-create,
        unit-lsp,
        unit-windows,
        unit-adapter-cloudflare,
        unit-docs,
        unit-skills,
        unit-extension,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 22.22
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Build language server
        run: yarn lsp:build

      - name: Build create-bascik
        run: yarn create:build

      - name: Build Cloudflare adapter
        run: yarn adapter:cf:build

      # After the builds: `@bascik/bascik/*` imports (pkg/e2e/bascik.config.ts,
      # the adapter, docs) resolve to the package's dist/ types.
      - name: Typecheck all workspace packages
        run: yarn typecheck:all

      - name: Framework unit tests
        run: yarn pkg:unit

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Framework integration tests
        run: yarn pkg:integration

      - name: Create-Bascik unit tests
        run: yarn create:unit

      - name: Language server unit tests
        run: yarn lsp:unit

      - name: Extension unit tests
        run: yarn ext:unit

      - name: Cloudflare adapter unit tests
        run: yarn adapter:cf:unit

      - name: Docs unit tests
        run: yarn docs:unit

      - name: Agent skills unit tests
        run: yarn skills:unit

  # Linear-time scaling checks (pkg and the language server): CPU-growth measurements on hostile input. They are
  # slow and platform-independent (an algorithm is linear or not on every OS), so they run once, on Linux, here
  # instead of in the unit jobs, where Windows' coarse CPU clock made them take most of the Windows job.
  linear-time:
    name: Linear-Time Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        unit-pkg,
        unit-create,
        unit-lsp,
        unit-windows,
        unit-adapter-cloudflare,
        unit-docs,
        unit-skills,
        unit-extension,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run linear-time checks
        run: yarn linear-time:all

  # ── Stage 4: End-to-end tests (after every stage 3 job passes) ──────────────────

  e2e-pkg-static:
    name: Framework E2E (Static)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        integration-pkg,
        integration-docs,
        integration-skills,
        node-floor,
        linear-time,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework E2E tests (static)
        run: yarn pkg:e2e

  e2e-pkg-dev:
    name: Framework E2E (Dev Server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        integration-pkg,
        integration-docs,
        integration-skills,
        node-floor,
        linear-time,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework E2E tests (dev server)
        run: yarn pkg:e2e:dev

      - name: Run framework E2E tests (dev exec lifecycle)
        run: yarn pkg:e2e:dev:exec

      - name: Run framework E2E tests (exec failure policy)
        run: yarn pkg:e2e:exec:policy

      - name: Run framework E2E tests (exec build lifecycle)
        run: yarn pkg:e2e:exec:build

  e2e-pkg-prod-http1:
    name: Framework E2E (Prod Server HTTP/1.1)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        integration-pkg,
        integration-docs,
        integration-skills,
        node-floor,
        linear-time,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework E2E tests (production server HTTP/1.1)
        run: yarn pkg:e2e:prod:http1

  e2e-pkg-prod-http2:
    name: Framework E2E (Prod Server HTTP/2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        integration-pkg,
        integration-docs,
        integration-skills,
        node-floor,
        linear-time,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework E2E tests (production server HTTP/2)
        run: yarn pkg:e2e:prod:http2

  e2e-adapter-cloudflare:
    name: Cloudflare Adapter E2E (local workerd)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        integration-pkg,
        integration-docs,
        integration-skills,
        node-floor,
        linear-time,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package and adapter
        run: yarn pkg:build && yarn adapter:cf:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Cloudflare adapter E2E tests
        run: yarn adapter:cf:e2e

  e2e-docs:
    name: Docs E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        integration-pkg,
        integration-docs,
        integration-skills,
        node-floor,
        linear-time,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run docs E2E tests
        run: yarn docs:e2e

  e2e-create:
    name: Create-Bascik Scaffold E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        integration-pkg,
        integration-docs,
        integration-skills,
        node-floor,
        linear-time,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Run create-bascik scaffold generation test
        run: yarn create:test-site

  e2e-extension:
    name: VS Code Extension E2E (real editor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        integration-pkg,
        integration-docs,
        integration-skills,
        node-floor,
        linear-time,
      ]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      # @vscode/test-cli downloads the newest stable VS Code into extensions/vscode-bascik/.vscode-test/. The key
      # changes every ISO week, so CI downloads it about once a week and still picks up a new release within one.
      - name: Compute the VS Code cache key
        id: vscode-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache the VS Code download
        uses: actions/cache@v6
        with:
          path: extensions/vscode-bascik/.vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ steps.vscode-week.outputs.week }}

      # Compiles the extension and bundles the language server from lsp/src, then runs both configurations in
      # .vscode-test.cjs. VS Code is an Electron app, so on Linux xvfb-run gives it a virtual display.
      - name: Run the extension tests in VS Code
        run: xvfb-run -a yarn ext:e2e

  # ── Stage 5: Deploy to Cloudflare (after every stage 4 job passes) ──────────────
  # Runs only on a branch push in this repository, never on a pull_request event, a tag, or a fork. A push to main
  # deploys both Workers to production. A push to any other branch uploads a Preview version of each under one alias
  # per branch, lists both URLs in the run summary, and updates the single Preview comment on the branch's open pull
  # request, if it has one. The token reaches only the Wrangler steps. Runbook: DEPLOYMENT.md.

  deploy-docs:
    name: Deploy Docs (bascik.dev)
    runs-on: ubuntu-latest
    if: >-
      !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') &&
      github.repository == 'bascikdev/bascik' && (github.ref == 'refs/heads/main' ||
      (!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'skipped')))
    permissions:
      contents: read
      pull-requests: read
    needs:
      [
        e2e-pkg-static,
        e2e-pkg-dev,
        e2e-pkg-prod-http1,
        e2e-pkg-prod-http2,
        e2e-adapter-cloudflare,
        e2e-docs,
        e2e-create,
        e2e-extension,
      ]
    # No job-level concurrency group, on purpose. The workflow's group already cancels an older run of a branch, so a
    # branch has one run in stage 5 at a time. On main a shared job group would hold one pending deploy and let an older
    # commit's deploy that queued later cancel a newer commit's pending one, leaving the newest commit undeployed. Main
    # deploys therefore never wait or get canceled; the newest-commit step right before Wrangler keeps an older commit
    # whose tests finished late from replacing a newer one.
    outputs:
      preview-url: ${{ steps.upload.outputs.url }}
    steps:
      # Full history: docs/scripts/generate-git-dates.ts reads it for sitemap lastmod and article dates.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (see DEPLOYMENT.md)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is not set (see DEPLOYMENT.md)"; exit 1; }

      # docs:build sets BASCIK_SITE_URL=https://bascik.dev itself.
      - name: Build package and docs
        run: yarn pkg:build && yarn docs:build

      # A push to main runs no tests (the pull request's branch was tested before the merge), so main deploys only a
      # commit that a merged pull request put there; a commit pushed straight to main fails here. GitHub can take a few
      # seconds to link a fresh merge commit to its pull request, so the step runs after the build and asks up to three
      # times, 10 s apart, while the answer is an empty list. Emergency path: DEPLOYMENT.md.
      - name: Check the commit came from a merged pull request
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PULLS: ${{ runner.temp }}/pulls.json
        run: |
          for attempt in 1 2 3; do
            gh api "repos/$REPO/commits/$SHA/pulls" > "$PULLS"
            [ "$(tr -d '[:space:]' < "$PULLS")" = "[]" ] && [ "$attempt" -lt 3 ] || break
            echo "No pull request lists $SHA yet (try $attempt of 3); asking again in 10 s."
            sleep 10
          done
          node .github/scripts/merged-pull-request.mjs "$SHA" "$PULLS"

      # Runs right before Wrangler. Skips the upload or deploy when the branch has moved on: a newer commit that
      # finished testing first has already deployed, or will, and this one must not replace it.
      - name: Check this is still the newest commit
        id: newest
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          newest="$(node .github/scripts/newest-commit.mjs "$REF" "$SHA")"
          echo "newest=$newest" >> "$GITHUB_OUTPUT"

      - name: Compute the Preview alias
        if: github.ref != 'refs/heads/main'
        id: alias
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          alias="$(node .github/scripts/preview-alias.mjs "$BRANCH" bascik cloudflare-adapter)"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Upload a Preview version
        if: github.ref != 'refs/heads/main' && steps.newest.outputs.newest == 'true'
        id: upload
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-docs.ndjson
          ALIAS: ${{ steps.alias.outputs.alias }}
          MESSAGE: "Preview ${{ steps.alias.outputs.alias }} at ${{ github.sha }}"
        run: |
          yarn wrangler versions upload --preview-alias "$ALIAS" --message "$MESSAGE"
          url="$(node ../.github/scripts/wrangler-preview-url.mjs "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Docs Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the Preview
        if: github.ref != 'refs/heads/main' && steps.newest.outputs.newest == 'true'
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: node .github/scripts/smoke-test.mjs "$URL" /=200 /components=200 /components/=307 /semantic-html=301 /name-attribute=301 /no-such-page=404

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && steps.newest.outputs.newest == 'true'
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MESSAGE: "main at ${{ github.sha }}"
        run: yarn wrangler deploy --message "$MESSAGE"

      - name: Smoke-test production
        if: github.ref == 'refs/heads/main' && steps.newest.outputs.newest == 'true'
        run: node .github/scripts/smoke-test.mjs https://bascik.dev /=200 /components=200 /semantic-html=301

  deploy-demo:
    name: Deploy Adapter Demo (cloudflare-adapter.bascik.dev)
    runs-on: ubuntu-latest
    if: >-
      !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') &&
      github.repository == 'bascikdev/bascik' && (github.ref == 'refs/heads/main' ||
      (!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'skipped')))
    permissions:
      contents: read
      pull-requests: read
    needs:
      [
        e2e-pkg-static,
        e2e-pkg-dev,
        e2e-pkg-prod-http1,
        e2e-pkg-prod-http2,
        e2e-adapter-cloudflare,
        e2e-docs,
        e2e-create,
        e2e-extension,
      ]
    # No job-level concurrency group: see deploy-docs.
    outputs:
      preview-url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (see DEPLOYMENT.md)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is not set (see DEPLOYMENT.md)"; exit 1; }

      # Builds the package, the adapter, then the fixture with --target cloudflare into
      # adapters/cloudflare/e2e/fixture/dist/.bascik/cloudflare (config from the fixture's wrangler.jsonc).
      - name: Build package, adapter, and demo
        run: yarn adapter:cf:demo:build

      # A push to main runs no tests (the pull request's branch was tested before the merge), so main deploys only a
      # commit that a merged pull request put there; a commit pushed straight to main fails here. GitHub can take a few
      # seconds to link a fresh merge commit to its pull request, so the step runs after the build and asks up to three
      # times, 10 s apart, while the answer is an empty list. Emergency path: DEPLOYMENT.md.
      - name: Check the commit came from a merged pull request
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PULLS: ${{ runner.temp }}/pulls.json
        run: |
          for attempt in 1 2 3; do
            gh api "repos/$REPO/commits/$SHA/pulls" > "$PULLS"
            [ "$(tr -d '[:space:]' < "$PULLS")" = "[]" ] && [ "$attempt" -lt 3 ] || break
            echo "No pull request lists $SHA yet (try $attempt of 3); asking again in 10 s."
            sleep 10
          done
          node .github/scripts/merged-pull-request.mjs "$SHA" "$PULLS"

      # Runs right before Wrangler. Skips the upload or deploy when the branch has moved on: a newer commit that
      # finished testing first has already deployed, or will, and this one must not replace it.
      - name: Check this is still the newest commit
        id: newest
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          newest="$(node .github/scripts/newest-commit.mjs "$REF" "$SHA")"
          echo "newest=$newest" >> "$GITHUB_OUTPUT"

      - name: Compute the Preview alias
        if: github.ref != 'refs/heads/main'
        id: alias
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          alias="$(node .github/scripts/preview-alias.mjs "$BRANCH" bascik cloudflare-adapter)"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Upload a Preview version
        if: github.ref != 'refs/heads/main' && steps.newest.outputs.newest == 'true'
        id: upload
        working-directory: adapters/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-demo.ndjson
          ALIAS: ${{ steps.alias.outputs.alias }}
          MESSAGE: "Preview ${{ steps.alias.outputs.alias }} at ${{ github.sha }}"
        run: |
          yarn wrangler versions upload --config e2e/fixture/dist/.bascik/cloudflare/wrangler.jsonc --preview-alias "$ALIAS" --message "$MESSAGE"
          url="$(node ../../.github/scripts/wrangler-preview-url.mjs "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Adapter demo Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the Preview
        if: github.ref != 'refs/heads/main' && steps.newest.outputs.newest == 'true'
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: node .github/scripts/smoke-test.mjs "$URL" /=200 /catalog=200 /catalog-stream=200

      # Also attaches the custom domain listed in the fixture's wrangler.jsonc `routes`.
      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && steps.newest.outputs.newest == 'true'
        working-directory: adapters/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MESSAGE: "main at ${{ github.sha }}"
        run: yarn wrangler deploy --config e2e/fixture/dist/.bascik/cloudflare/wrangler.jsonc --message "$MESSAGE"

      - name: Smoke-test production
        if: github.ref == 'refs/heads/main' && steps.newest.outputs.newest == 'true'
        run: node .github/scripts/smoke-test.mjs https://cloudflare-adapter.bascik.dev /=200 /catalog=200 /catalog-stream=200

  # Runs after both uploads, so the summary and the comment always list two URLs from the same commit. A run whose
  # commit was no longer the newest uploaded nothing and leaves both to the newer run. A branch without an open pull
  # request in this repo gets the summary only.
  preview-comment:
    name: Publish Preview URLs
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' && github.ref != 'refs/heads/main' &&
      needs.deploy-docs.outputs.preview-url != '' && needs.deploy-demo.outputs.preview-url != ''
    permissions:
      contents: read
      pull-requests: write
    needs: [deploy-docs, deploy-demo]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      # This job installs nothing: it runs one dependency-free script. setup-node v5 caches the package manager
      # named in package.json by default, which would call Yarn without Corepack, so the cache is turned off.
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # A push run builds the branch commit itself, github.sha, so that is the commit the comment names.
      - name: Write the summary and the pull request comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOCS_PREVIEW_URL: ${{ needs.deploy-docs.outputs.preview-url }}
          DEMO_PREVIEW_URL: ${{ needs.deploy-demo.outputs.preview-url }}
        run: node .github/scripts/preview-comment.mjs
