name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            packs: ''
          - language: javascript-typescript
            # Marks results that have a `// codeql[rule-id]` comment on the line
            # before them as suppressed in the SARIF.
            packs: codeql/javascript-queries:AlertSuppression.ql

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          packs: ${{ matrix.packs }}

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      # Code scanning does not act on SARIF suppressions by itself. This step
      # dismisses alerts suppressed in source and reopens them when the comment
      # is removed. Dismissal state is repository-wide, so run it on main only.
      - name: Dismiss alerts suppressed in source
        if: matrix.language == 'javascript-typescript' && github.ref == 'refs/heads/main'
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ github.token }}
