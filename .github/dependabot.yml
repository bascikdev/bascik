version: 2
updates:
  # Yarn 4 workspaces: one root lockfile covers every package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches npmMinimalAgeGate: "7d" in .yarnrc.yml so the PR never proposes
    # a version Yarn would refuse to install.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # The types follow the oldest supported runtime, not the newest: Node 24.21 is the published floor, and
      # `engines.vscode` is ^1.91.0 (vsce refuses to package when @types/vscode is newer than that).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/vscode"
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
