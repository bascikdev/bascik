<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Script Import Navigation Fixture</title>
</head>
<body>
  <script data-bascik-build>
    import { helperFn } from './lib/nav-helper.ts';
    console.log(await helperFn());
  </script>

  <script data-bascik-server>
    import { helperFn as serverHelper } from './lib/nav-helper.ts';
    console.log(await serverHelper());
  </script>

  <script data-bascik-build src="./lib/nav-helper.ts"></script>

  <script data-bascik-server src="./lib/nav-helper.ts"></script>

  <script data-bascik-build>
    const mod = await import('./lib/nav-helper.ts');
    console.log(mod);
  </script>

  <script data-bascik-build>
    import { readFile } from 'node:fs/promises';
    console.log(readFile);
  </script>

  <script>
    import { helperFn as clientHelper } from './lib/nav-helper.ts';
    console.log(clientHelper);
  </script>
</body>
</html>
