    console.log(await slashHelper());

  <script type="module">

  <script data-bascik-routes>
    export { helperFn as aliasRouteHelper } from '@/lib/nav-helper.ts';
  </script>

  <script data-bascik-build>
    const aliasMod = await import('@/lib/nav-helper.ts');
    console.log(aliasMod);
  </script>

  <script data-bascik-build src="@/lib/nav-helper.ts"></script>

  <script data-bascik-server src="/lib/nav-helper.ts"></script>

  <script data-bascik-build>
    import scoped from '@scope/nav-helper.ts';

  </script>
