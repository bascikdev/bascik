<!-- @bascik
Interactive demo box with Preview, Source, and Output panes.
@prop no-preview - Hides preview pane.
@prop file - Path to demo file.
@slot example - Content in preview pane.
@slot source-usage - Usage code.
-->
<div class="demo-box">
  <span class="demo-marker" data-bascik-prop-no-preview hidden></span>
  <div class="demo-meta" data-bascik-prop-file></div>
  <div data-bascik-slot="example"></div>
  <div data-bascik-slot="source-usage"></div>
</div>
