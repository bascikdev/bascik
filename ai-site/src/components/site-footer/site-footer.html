<!-- @bascik
The site footer: license note and three navigation links.
-->
<style>
  .footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem 1.5rem;
    padding: 1.5rem;
    border-top: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
  }
  .note {
    margin: 0;
    font-size: 0.9375rem;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .link {
    color: var(--muted);
    font-size: 0.9375rem;
    text-decoration: none;
  }
  .link:hover {
    color: var(--accent);
  }
  .link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
<footer class="footer" data-testid="site-footer">
  <p class="note">MIT licensed. Part of Bascik.</p>
  <nav class="links">
    <a class="link" href="https://bascik.dev/ai" data-testid="site-footer-docs"
      >Docs</a
    >
    <a
      class="link"
      href="https://github.com/bascikdev/bascik"
      data-testid="site-footer-github"
      >GitHub</a
    >
    <a class="link" href="https://bascik.dev" data-testid="site-footer-bascik"
      >Bascik</a
    >
  </nav>
</footer>
