<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Milk frother</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding-top: 64px;
        font-family: Arial, Helvetica, sans-serif;
        color: #1d2433;
        line-height: 1.5;
        background: #fff;
      }
      .top {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        background: #fff;
        border-bottom: 1px solid #e3e7ef;
      }
      .top a {
        color: #1d2433;
        text-decoration: none;
      }
      .brand {
        font-weight: 700;
        line-height: 1.1;
      }
      .top nav {
        display: flex;
        gap: 16px;
      }
      .hero {
        position: relative;
        max-width: 960px;
        margin: 0 auto;
        padding: 64px 16px;
      }
      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(238, 242, 251, 0.9),
          rgba(238, 242, 251, 0)
        );
      }
      .hero h1 {
        position: relative;
        font-size: 36px;
        line-height: 1.2;
        margin: 0 0 16px;
      }
      .hero p {
        position: relative;
        margin: 0;
      }
      .hero svg {
        position: absolute;
        right: 16px;
        top: 72px;
        width: 48px;
        height: 48px;
      }
      .card {
        display: block;
        max-width: 960px;
        margin: 0 auto 24px;
        padding: 16px;
        color: inherit;
        text-decoration: none;
      }
      .card h3 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      .card p {
        margin: 0;
      }
      .contents {
        display: contents;
      }
      .foot {
        border-top: 1px solid #e3e7ef;
        padding: 24px 16px;
        color: #5b6475;
        font-size: 14px;
      }
      .foot a,
      .foot p {
        display: block;
        margin: 0;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <header class="top" data-testid="site-header">
      <a class="brand" href="/">
        MILK
        <br />
        FROTHER
      </a>
      <nav aria-label="Primary">
        <a href="/">Home</a>
        <a href="/faq">FAQ</a>
        <a href="/contact">Contact us</a>
      </nav>
      <ul hidden data-testid="site-header-menu">
        <li><a href="/">Home</a></li>
        <li><a href="/faq">FAQ</a></li>
        <li><a href="/contact">Contact us</a></li>
      </ul>
    </header>
    <main data-testid="main">
      <div class="hero" data-testid="hero">
        <h1>Froth at work</h1>
        <p>Café-style foam from your own kitchen.</p>
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="20" fill="#3156d3"></circle>
        </svg>
      </div>
      <a class="card" href="/deluxe" data-testid="deluxe-card">
        <h3>Milk frother deluxe editions</h3>
        <p>Silky microfoam for lattes and flat whites at home, in seconds.</p>
      </a>
    </main>
    <footer class="foot" data-testid="site-footer">
      <a href="/changelog">Milk frother v5.0.1</a>
      <p><span class="contents">Copyright 2025</span> Milk frother</p>
    </footer>
  </body>
</html>
