<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>About Northwind Tasks</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Helvetica,
          Arial,
          sans-serif;
        color: #1d2433;
      }
      .bascik__site-header__header {
        position: relative;
        display: flex;
        gap: 24px;
        align-items: center;
        padding: 16px 40px;
      }
      .trigger {
        font: inherit;
        padding: 8px 12px;
        border: 0;
        background: none;
        cursor: pointer;
      }
      .menu {
        position: absolute;
        top: 56px;
        left: 40px;
        width: 240px;
        margin: 0;
        padding: 12px;
        list-style: none;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      }
      .menu[hidden] {
        display: none;
      }
      .menu a {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px;
        color: #1d2433;
        text-decoration: none;
      }
      .menu svg {
        width: 16px;
        height: 16px;
      }
      .link {
        color: #2457d6;
        font-weight: 600;
        text-decoration: none;
      }
      .link:hover {
        color: #173a8f;
        text-decoration: underline;
      }
      .hero {
        min-height: 640px;
        padding: 64px 40px;
      }
      .hero h1,
      .intro h1 {
        margin: 0 0 16px;
        font-size: 40px;
        line-height: 48px;
      }
      .hero p {
        max-width: 520px;
        margin: 0 0 24px;
      }
      .cta {
        padding: 12px 20px;
        border: 0;
        background: #2457d6;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      .intro {
        padding: 64px 40px;
      }
      .bascik__feature-grid__features {
        padding: 48px 40px;
        background: #f5f7fb;
      }
      .bascik__feature-grid__features h2 {
        margin: 0 0 24px;
        font-size: 28px;
      }
      .bascik__feature-grid__grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .bascik__feature-grid__grid h3 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .bascik__feature-grid__grid p {
        margin: 0;
      }
      .roadmap {
        padding: 48px 40px;
      }
      .timeline {
        position: relative;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .timeline li {
        position: relative;
        padding: 0 0 32px 40px;
      }
      .dot {
        position: absolute;
        left: 0;
        top: 2px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #2457d6;
      }
      .check {
        position: absolute;
        left: 6px;
        top: 8px;
        width: 12px;
        height: 12px;
      }
      .bascik__site-footer__footer {
        padding: 32px 40px;
        background: #1d2433;
        color: #fff;
      }
      .bascik__site-footer__footer a {
        color: #fff;
      }
      @media (max-width: 767px) {
        .bascik__feature-grid__grid {
          grid-template-columns: 1fr;
        }
        .hero h1,
        .intro h1 {
          font-size: 32px;
          line-height: 40px;
        }
      }
    </style>
  </head>
  <body>
    <header class="bascik__site-header__header" data-testid="site-header">
      <nav aria-label="Main" data-testid="site-header-nav">
        <button
          type="button"
          class="trigger"
          aria-expanded="false"
          aria-controls="products-menu"
          data-testid="site-header-products"
        >
          Products
        </button>
        <ul
          class="menu"
          id="products-menu"
          hidden
          data-testid="site-header-menu"
        >
          <li>
            <a href="/boards" data-testid="site-header-boards"
              ><svg viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="6" fill="#d6455d" /></svg
              >Boards</a
            >
          </li>
          <li>
            <a href="/timelines" data-testid="site-header-timelines"
              ><svg viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="6" fill="#2a7d4f" /></svg
              >Timelines</a
            >
          </li>
        </ul>
        <a class="link" href="/about" data-testid="site-header-about">About</a>
      </nav>
    </header>
    <main data-testid="main">
      <section class="intro" data-testid="intro">
        <h1>About Northwind Tasks</h1>
        <p>We build planning tools for small teams.</p>
      </section>
      <section
        class="bascik__feature-grid__features"
        data-testid="feature-grid"
      >
        <h2>Why teams switch</h2>
        <ul class="bascik__feature-grid__grid">
          <li>
            <h3>One place</h3>
            <p>Plans, files and notes together.</p>
          </li>
          <li>
            <h3>Fast setup</h3>
            <p>Invite the team in a minute.</p>
          </li>
          <li>
            <h3>Clear owners</h3>
            <p>Every task has one person.</p>
          </li>
        </ul>
      </section>
    </main>
    <footer class="bascik__site-footer__footer" data-testid="site-footer">
      <p>
        Northwind Tasks
        <a href="/contact" data-testid="site-footer-contact">Contact</a>
      </p>
    </footer>
    <script>
      const trigger = document.querySelector(
        '[data-testid="site-header-products"]',
      );
      trigger.addEventListener("click", () => {
        const open = trigger.getAttribute("aria-expanded") === "true";
        trigger.setAttribute("aria-expanded", String(!open));
        document.querySelector('[data-testid="site-header-menu"]').hidden =
          open;
      });
    </script>
  </body>
</html>
