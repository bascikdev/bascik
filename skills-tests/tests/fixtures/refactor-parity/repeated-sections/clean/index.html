<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Northwind Tasks</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Helvetica,
          Arial,
          sans-serif;
        color: #1d2433;
      }
      .i_3 {
        padding: 64px 40px;
      }
      .bascik__feature-grid__features {
        padding: 48px 40px;
        background: #f5f7fb;
      }
      .bascik__feature-grid__features h2 {
        margin: 0 0 24px;
        font-size: 28px;
      }
      .bascik__feature-grid__grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .bascik__feature-grid__grid h3 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .bascik__feature-grid__grid p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="i_3">
        <h1>Plan work your team can see</h1>
        <p>Boards, timelines and reports for small teams.</p>
      </section>
      <section class="bascik__feature-grid__features">
        <h2>Features</h2>
        <ul class="bascik__feature-grid__grid">
          <li>
            <h3>Boards</h3>
            <p>Move cards from idea to done.</p>
          </li>
          <li>
            <h3>Timelines</h3>
            <p>See every deadline on one line.</p>
          </li>
          <li>
            <h3>Reports</h3>
            <p>Share progress every Friday.</p>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
