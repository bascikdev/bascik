<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>About Northwind Tasks</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Helvetica,
          Arial,
          sans-serif;
        color: #1d2433;
      }
      .intro {
        padding: 64px 40px;
      }
      .features {
        padding: 48px 40px;
        background: #f5f7fb;
      }
      .features h2 {
        margin: 0 0 24px;
        font-size: 28px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .grid h3 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .grid p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro">
        <h1>About Northwind Tasks</h1>
        <p>We build planning tools for small teams.</p>
        <p>The company started in a garage with two laptops.</p>
      </section>
      <section class="features">
        <h2>Why teams switch</h2>
        <ul class="grid">
          <li>
            <h3>One place</h3>
            <p>Plans, files and notes together.</p>
          </li>
          <li>
            <h3>Fast setup</h3>
            <p>Invite the team in a minute.</p>
          </li>
          <li>
            <h3>Clear owners</h3>
            <p>Every task has one person.</p>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
