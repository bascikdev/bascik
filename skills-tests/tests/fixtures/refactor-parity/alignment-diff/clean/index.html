<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Northwind Tasks</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Helvetica,
          Arial,
          sans-serif;
        color: #1d2433;
      }
      .h_z1 {
        padding: 64px 24px;
        text-align: center;
      }
      .h_z1 h1 {
        margin: 0 0 16px;
        font-size: 36px;
        line-height: 44px;
      }
      .h_z1 p {
        max-width: 520px;
        margin: 0 auto 24px;
      }
      .h_z1 .button {
        display: inline-block;
        padding: 12px 20px;
        background: #2457d6;
        color: #fff;
        text-decoration: none;
      }
      @media (min-width: 900px) {
        .h_z1 {
          text-align: left;
          padding: 96px 80px;
        }
        .h_z1 p {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="h_z1">
        <h1>Plan work your whole team can see</h1>
        <p>
          Boards, timelines and reports in one place, so every person on the
          team knows what ships next and who owns it.
        </p>
        <a class="button" href="/signup">Start free</a>
      </section>
    </main>
  </body>
</html>
