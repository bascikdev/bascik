<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>How Northwind Tasks works</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Helvetica,
          Arial,
          sans-serif;
        color: #1d2433;
      }
      .s_k1,
      .q_k2 {
        padding: 48px 40px;
      }
      .s_k1 h2,
      .q_k2 h2 {
        margin: 0 0 16px;
        font-size: 28px;
        line-height: 36px;
      }
      .s_k1 p {
        margin: 0 0 48px;
      }
      .s_k1 ul {
        margin: 0 0 32px;
        padding-left: 20px;
      }
      .s_k1 .button {
        display: inline-block;
        padding: 12px 20px;
        background: #2457d6;
        color: #fff;
        text-decoration: none;
      }
      .q_k2 p {
        margin: 0 0 20px;
      }
      .q_k2 blockquote {
        margin: 0;
        padding: 16px 24px;
        border-left: 4px solid #2457d6;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="s_k1">
        <h2>How it works</h2>
        <p>Three steps from a messy inbox to a shared plan.</p>
        <ul>
          <li>Import your tasks</li>
          <li>Invite your team</li>
          <li>Share one timeline</li>
        </ul>
        <a class="button" href="/signup">Start free</a>
      </section>
      <section class="q_k2">
        <h2>What customers say</h2>
        <p>Teams of every size plan with Northwind Tasks.</p>
        <blockquote>We stopped losing work in long email threads.</blockquote>
      </section>
    </main>
  </body>
</html>
