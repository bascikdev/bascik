<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Milk frother</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Helvetica,
          Arial,
          sans-serif;
        color: #1d2433;
      }
      .features {
        padding: 40px;
      }
      .features h2 {
        color: #1d2433;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .card {
        padding: 16px;
        border: 1px solid #ddd;
      }
      .card h3 {
        color: #2457d6;
        margin: 0;
      }
      .card p {
        margin: 8px 0 0;
      }
      .odd h3 {
        color: #d6455d;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <nav aria-label="Main">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/about">About</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Home</h1>
      <section class="features">
        <h2>Why our frother</h2>
        <div class="grid">
          <div class="card">
            <h3>Steam wand</h3>
            <p>Microfoam</p>
          </div>
          <div class="card">
            <h3>Auto shutoff</h3>
            <p>Stops</p>
          </div>
          <div class="card">
            <h3>Cold froth</h3>
            <p>Iced drinks</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
