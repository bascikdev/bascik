<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Milk frother</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Helvetica,
          Arial,
          sans-serif;
        color: #1d2433;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
      }
      .card {
        padding: 16px;
        border: 1px solid #ddd;
      }
      .card h3 {
        margin: 0;
      }
      .card p {
        margin: 12px 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h2>Features</h2>
        <div class="container">
          <div class="card">
            <h3>Steam wand</h3>
            <p>Microfoam in seconds</p>
          </div>
          <div class="card">
            <h3>Auto shutoff</h3>
            <p>Stops when done</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
