<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Northwind Tasks</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Helvetica,
          Arial,
          sans-serif;
        color: #1d2433;
      }
      .cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        padding: 40px;
      }
      .card {
        padding: 24px;
        border: 1px solid #d5dbe7;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <header data-testid="site-header">
      <nav aria-label="Main" data-testid="main-nav">
        <a href="/pricing" data-testid="nav-pricing">Pricing</a>
        <a href="/contact" data-testid="nav-contact">Contact</a>
      </nav>
    </header>
    <main data-testid="main">
      <h1>Plan work your team can see</h1>
      <div class="cards">
        <promo-card
          data-bascik-prop-title="Boards"
          data-bascik-prop-body="Move cards from idea to done."
        />
        <promo-card
          data-bascik-prop-title="Timelines"
          data-bascik-prop-body="See every deadline on one line."
        />
      </div>
      <form data-testid="newsletter-form" action="/newsletter" method="post">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          data-testid="newsletter-email"
        />
        <button type="submit">Subscribe</button>
      </form>
    </main>
    <footer>
      <p>Northwind Tasks</p>
    </footer>
  </body>
</html>
