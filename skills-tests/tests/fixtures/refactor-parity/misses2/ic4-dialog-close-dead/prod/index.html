<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Milk frother</title>
    <style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#1d2433;line-height:1.5;background:#fff}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{background:#fff;border-bottom:1px solid #e3e7ef}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.top a{color:#1d2433;text-decoration:none;font-weight:700}
main{display:block}
.foot{border-top:1px solid #e3e7ef;padding:24px 0;color:#5b6475;font-size:14px}
h1{font-size:36px;line-height:1.2;margin:0 0 16px}
h2{font-size:28px;line-height:1.25;margin:0 0 12px}
h3{font-size:20px;line-height:1.3;margin:0 0 8px}
p{margin:0 0 12px}
section{padding:48px 0}
dialog{border:0;border-radius:12px;padding:24px;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.demo button{padding:10px 18px;border-radius:8px;border:0;background:#2457d6;color:#fff;font-size:16px;cursor:pointer}
    </style>
  </head>
  <body>
<header class="top" data-testid="site-header"><div class="wrap"><a href="/" data-testid="site-header-home">Milk frother</a></div></header>
<main data-testid="main">
<section class="demo" aria-label="Demo" data-testid="demo"><div class="wrap"><h2>See it froth</h2>
<button type="button" class="open" data-testid="video-open">Watch the demo</button>
<dialog id="demo" aria-label="Demo video" data-testid="video-dialog"><h2>Demo</h2><p>Watch cold milk turn to microfoam in twenty seconds.</p><button type="button" class="close" data-testid="video-close">Close</button></dialog>
</div></section>
</main>
<footer class="foot" data-testid="site-footer"><div class="wrap"><p>© 2026 Milk frother</p></div></footer>
<script>
document.querySelector('.open').addEventListener('click', () => document.getElementById('demo').showModal());
document.querySelector('.close').addEventListener('click', () => document.getElementById('demo').close());
</script>
  </body>
</html>
