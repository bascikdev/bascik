<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Milk frother</title>
    <style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#1d2433;line-height:1.5;background:#fff}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{background:#fff;border-bottom:1px solid #e3e7ef}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.top a{color:#1d2433;text-decoration:none;font-weight:700}
main{display:block}
.foot{border-top:1px solid #e3e7ef;padding:24px 0;color:#5b6475;font-size:14px}
h1{font-size:36px;line-height:1.2;margin:0 0 16px}
h2{font-size:28px;line-height:1.25;margin:0 0 12px}
h3{font-size:20px;line-height:1.3;margin:0 0 8px}
p{margin:0 0 12px}
section{padding:48px 0}
.top{position:relative;z-index:10}
.top nav > button{border:0;background:none;font:inherit;font-weight:700;cursor:pointer;padding:8px}
.mega{position:absolute;left:0;right:0;top:64px;background:#fff;border-top:1px solid #e3e7ef;z-index:10}
.mega .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px 16px}
.mega a{font-weight:400}
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.45);display:none;z-index:5}
body.menu-open .scrim{display:block}
    </style>
  </head>
  <body>
<header class="top" data-testid="site-header"><div class="wrap"><a href="/" data-testid="site-header-home">Milk frother</a><nav aria-label="Main" data-testid="site-header-nav"><button type="button" aria-expanded="false" aria-controls="mega" data-testid="site-header-shop">Shop</button></nav></div><div id="mega" class="mega" hidden data-testid="site-header-mega"><div class="wrap"><a href="/frothers" data-testid="site-header-frothers">Frothers</a><a href="/pitchers" data-testid="site-header-pitchers">Pitchers</a><a href="/beans" data-testid="site-header-beans">Beans</a></div></div></header>
<main data-testid="main">
<section aria-label="Intro" data-testid="intro"><div class="wrap"><h1>Froth at home</h1><p>Café-style foam from your own kitchen.</p></div></section>
</main>
<footer class="foot" data-testid="site-footer"><div class="wrap"><p>© 2026 Milk frother</p></div></footer>
<script>
(() => { const b = document.querySelector('[aria-controls="mega"]'); b.addEventListener('click', () => { const open = b.getAttribute('aria-expanded') === 'true'; b.setAttribute('aria-expanded', String(!open)); document.getElementById('mega').hidden = open; }); })();
</script>
  </body>
</html>
