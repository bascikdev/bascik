<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Milk frother</title>
    <style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#1d2433;line-height:1.5;background:#fff}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{background:#fff;border-bottom:1px solid #e3e7ef}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.top a{color:#1d2433;text-decoration:none;font-weight:700}
main{display:block}
.foot{border-top:1px solid #e3e7ef;padding:24px 0;color:#5b6475;font-size:14px}
h1{font-size:36px;line-height:1.2;margin:0 0 16px}
h2{font-size:28px;line-height:1.25;margin:0 0 12px}
h3{font-size:20px;line-height:1.3;margin:0 0 8px}
p{margin:0 0 12px}
section{padding:48px 0}
.faq button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:14px 0;border:0;border-bottom:1px solid #e3e7ef;background:none;font:inherit;font-size:18px;cursor:pointer;color:#1d2433}
.faq h3{margin:0}
.faq .chev{flex:none}
.faq [id^="a"] p{padding:12px 0;margin:0}
.faq button[aria-expanded="true"] .chev{transform:rotate(180deg)}
    </style>
  </head>
  <body>
<header class="top" data-testid="site-header"><div class="wrap"><a href="/" data-testid="site-header-home">Milk frother</a></div></header>
<main data-testid="main">
<section class="faq" aria-label="Questions" data-testid="faq"><div class="wrap"><h2>Questions</h2>
<div class="item"><h3><button type="button" aria-expanded="false" aria-controls="a1" data-testid="faq-q1"><span>Does it heat milk?</span><svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="#2457d6" stroke-width="2" fill="none"/></svg></button></h3><div id="a1" hidden><p>Yes, to 65 degrees, then it stops on its own.</p></div></div>
<div class="item"><h3><button type="button" aria-expanded="false" aria-controls="a2" data-testid="faq-q2"><span>Can I froth oat milk?</span><svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="#2457d6" stroke-width="2" fill="none"/></svg></button></h3><div id="a2" hidden><p>Yes. Barista oat milk foams best.</p></div></div>
</div></section>
</main>
<footer class="foot" data-testid="site-footer"><div class="wrap"><p>© 2026 Milk frother</p></div></footer>
<script>
document.querySelectorAll('.faq button').forEach((b) => b.addEventListener('click', () => { const open = b.getAttribute('aria-expanded') === 'true'; b.setAttribute('aria-expanded', String(!open)); document.getElementById(b.getAttribute('aria-controls')).hidden = open; }));
</script>
  </body>
</html>
