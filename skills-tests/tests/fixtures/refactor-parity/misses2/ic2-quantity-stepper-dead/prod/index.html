<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Milk frother</title>
    <style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#1d2433;line-height:1.5;background:#fff}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{background:#fff;border-bottom:1px solid #e3e7ef}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.top a{color:#1d2433;text-decoration:none;font-weight:700}
main{display:block}
.foot{border-top:1px solid #e3e7ef;padding:24px 0;color:#5b6475;font-size:14px}
h1{font-size:36px;line-height:1.2;margin:0 0 16px}
h2{font-size:28px;line-height:1.25;margin:0 0 12px}
h3{font-size:20px;line-height:1.3;margin:0 0 8px}
p{margin:0 0 12px}
section{padding:48px 0}
.buy .qty{display:inline-flex;align-items:center;border:1px solid #c9d3ea;border-radius:8px}
.buy .qty button{width:40px;height:40px;border:0;background:none;font-size:20px;cursor:pointer}
.buy .qty input{width:56px;height:40px;border:0;text-align:center;font-size:16px}
.price{font-size:24px;font-weight:700}
    </style>
  </head>
  <body>
<header class="top" data-testid="site-header"><div class="wrap"><a href="/" data-testid="site-header-home">Milk frother</a></div></header>
<main data-testid="main">
<section class="buy" aria-label="Buy" data-testid="buy"><div class="wrap">
<h1>Milk frother</h1><p class="price">$49</p>
<div class="qty"><button type="button" aria-label="Decrease quantity" data-testid="qty-minus">−</button><input type="number" value="1" min="1" aria-label="Quantity" data-testid="qty-input" /><button type="button" aria-label="Increase quantity" data-testid="qty-plus">+</button></div>
</div></section>
</main>
<footer class="foot" data-testid="site-footer"><div class="wrap"><p>© 2026 Milk frother</p></div></footer>
<script>
(() => { const input = document.querySelector('.qty input');
document.querySelector('[aria-label="Increase quantity"]').addEventListener('click', () => { input.value = Number(input.value) + 1; });
document.querySelector('[aria-label="Decrease quantity"]').addEventListener('click', () => { input.value = Math.max(1, Number(input.value) - 1); }); })();
</script>
  </body>
</html>
