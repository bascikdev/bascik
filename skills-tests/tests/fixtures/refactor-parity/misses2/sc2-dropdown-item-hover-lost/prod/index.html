<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Milk frother</title>
    <style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#1d2433;line-height:1.5;background:#fff}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{background:#fff;border-bottom:1px solid #e3e7ef}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.top a{color:#1d2433;text-decoration:none;font-weight:700}
main{display:block}
.foot{border-top:1px solid #e3e7ef;padding:24px 0;color:#5b6475;font-size:14px}
h1{font-size:36px;line-height:1.2;margin:0 0 16px}
h2{font-size:28px;line-height:1.25;margin:0 0 12px}
h3{font-size:20px;line-height:1.3;margin:0 0 8px}
p{margin:0 0 12px}
section{padding:48px 0}
.top nav{position:relative}
.top nav > button{border:0;background:none;font:inherit;font-weight:700;cursor:pointer;padding:8px}
.menu{position:absolute;right:0;top:100%;margin:0;padding:8px 0;list-style:none;background:#fff;border:1px solid #e3e7ef;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);width:200px;z-index:10}
.menu a{display:block;padding:8px 16px;font-weight:400;color:#1d2433}
.menu a:hover{background:#eef2fb;color:#2457d6}
    </style>
  </head>
  <body>
<header class="top" data-testid="site-header"><div class="wrap"><a href="/" data-testid="site-header-home">Milk frother</a><nav aria-label="Main" data-testid="site-header-nav"><button type="button" aria-expanded="false" aria-controls="m1" data-testid="site-header-shop">Shop</button><ul id="m1" class="menu" hidden><li><a href="/frothers" data-testid="site-header-frothers">Frothers</a></li><li><a href="/pitchers" data-testid="site-header-pitchers">Pitchers</a></li><li><a href="/beans" data-testid="site-header-beans">Beans</a></li></ul></nav></div></header>
<main data-testid="main">
<section aria-label="Intro" data-testid="intro"><div class="wrap"><h1>Froth at home</h1><p>Café-style foam from your own kitchen.</p></div></section>
</main>
<footer class="foot" data-testid="site-footer"><div class="wrap"><p>© 2026 Milk frother</p></div></footer>
<script>
(() => { const b = document.querySelector('[aria-controls="m1"]'); b.addEventListener('click', () => { const open = b.getAttribute('aria-expanded') === 'true'; b.setAttribute('aria-expanded', String(!open)); document.getElementById('m1').hidden = open; }); })();
</script>
  </body>
</html>
