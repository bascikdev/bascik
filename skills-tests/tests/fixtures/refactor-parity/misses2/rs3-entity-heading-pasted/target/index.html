<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Milk frother</title>
    <style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#1d2433;line-height:1.5;background:#fff}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{background:#fff;border-bottom:1px solid #e3e7ef}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.top a{color:#1d2433;text-decoration:none;font-weight:700}
main{display:block}
.foot{border-top:1px solid #e3e7ef;padding:24px 0;color:#5b6475;font-size:14px}
h1{font-size:36px;line-height:1.2;margin:0 0 16px}
h2{font-size:28px;line-height:1.25;margin:0 0 12px}
h3{font-size:20px;line-height:1.3;margin:0 0 8px}
p{margin:0 0 12px}
section{padding:48px 0}
.features .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.features .card{padding:16px;border:1px solid #e3e7ef;border-radius:8px}
@media (max-width:599px){.features .grid{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
<header class="top bascik__site-header__h1" data-testid="site-header"><div class="wrap"><a href="/" data-testid="site-header-home">Milk frother</a><nav aria-label="Main" data-testid="site-header-nav"><a href="/about" data-testid="site-header-about">About</a> <a href="/pricing" data-testid="site-header-pricing">Pricing</a></nav></div></header>
<main data-testid="main">
<section class="hero" aria-label="Home intro" data-testid="hero"><div class="wrap"><h1>Froth at home</h1><p>Café-style foam from your own kitchen.</p></div></section>
<section class="features" aria-label="Features"><div class="wrap"><h2>Froth, steam &amp; pour</h2><div class="grid">
<div class="card"><h3>Fast</h3><p>Microfoam in twenty seconds.</p></div>
<div class="card"><h3>Quiet</h3><p>Softer than a kettle.</p></div>
<div class="card"><h3>Easy</h3><p>Rinse and done.</p></div>
</div></div></section>
</main>
<footer class="foot" data-testid="site-footer"><p>© 2026 Milk frother</p></footer>

  </body>
