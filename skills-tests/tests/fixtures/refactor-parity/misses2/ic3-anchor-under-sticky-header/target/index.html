<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Milk frother</title>
    <style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#1d2433;line-height:1.5;background:#fff}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{background:#fff;border-bottom:1px solid #e3e7ef}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.top a{color:#1d2433;text-decoration:none;font-weight:700}
main{display:block}
.foot{border-top:1px solid #e3e7ef;padding:24px 0;color:#5b6475;font-size:14px}
h1{font-size:36px;line-height:1.2;margin:0 0 16px}
h2{font-size:28px;line-height:1.25;margin:0 0 12px}
h3{font-size:20px;line-height:1.3;margin:0 0 8px}
p{margin:0 0 12px}
section{padding:48px 0}
.top{position:sticky;top:0;z-index:5}
.top nav a{margin-left:16px;font-weight:400}
.tall{min-height:900px}
.tail{min-height:1400px;background:#f5f7fb}
    </style>
  </head>
  <body>
<header class="top" data-testid="site-header"><div class="wrap"><a href="/" data-testid="site-header-home">Milk frother</a><nav aria-label="Main" data-testid="site-header-nav"><a href="#specs" data-testid="site-header-specs">Specs</a></nav></div></header>
<main data-testid="main">
<section class="tall" aria-label="Intro" data-testid="intro"><div class="wrap"><h1>Microfoam in twenty seconds</h1><p>Heat, froth and pour with one button.</p></div></section>
<section id="specs" data-testid="specs"><div class="wrap"><h2>Specs</h2><p>Capacity 240 ml. 500 W. Dishwasher-safe jug.</p></div></section>
<section class="tail" aria-label="More" data-testid="more"><div class="wrap"><p>Every frother ships with a two-year warranty.</p></div></section>
</main>
<footer class="foot" data-testid="site-footer"><div class="wrap"><p>© 2026 Milk frother</p></div></footer>

  </body>
</html>
