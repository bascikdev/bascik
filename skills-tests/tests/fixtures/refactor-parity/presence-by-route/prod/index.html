<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Home | Northwind Tasks</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Helvetica,
          Arial,
          sans-serif;
        color: #1d2433;
      }
      .top {
        position: sticky;
        top: 0;
        display: flex;
        gap: 24px;
        padding: 16px 40px;
        background: #fff;
        border-bottom: 1px solid #e3e7ef;
      }
      .top a {
        color: #1d2433;
        text-decoration: none;
      }
      main {
        min-height: 1400px;
        padding: 64px 40px;
      }
      .consent {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 16px 40px;
        background: #1d2433;
        color: #fff;
        transform: translateY(100%);
        transition: transform 0.3s ease-out;
      }
      .consent.in {
        transform: none;
      }
      .consent[hidden] {
        display: none;
      }
      .consent p {
        flex: 1;
        margin: 0;
      }
      .chat {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 50%;
        background: #2457d6;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <nav aria-label="Main">
        <a href="./">Home</a>
        <a href="about">About</a>
        <a href="pricing">Pricing</a>
      </nav>
    </header>
    <main>
      <h1>Plan work your whole team can see</h1>
      <p>Boards, timelines and reports in one place.</p>
    </main>
    <div class="consent" role="dialog" aria-label="Cookie preferences" hidden>
      <p>We use cookies to remember your preferences and to count visits.</p>
      <button type="button" class="secondary">Manage preferences</button>
      <button type="button" class="primary" data-consent="accept">
        Accept all
      </button>
    </div>
    <script>
      (() => {
        const banner = document.querySelector(
          '[aria-label="Cookie preferences"]',
        );
        if (localStorage.getItem("consent") === "1") return;
        // Shown a moment after load and slid in, like a consent script: the check must wait for a stable render.
        setTimeout(() => {
          banner.hidden = false;
          requestAnimationFrame(() => banner.classList.add("in"));
        }, 150);
        banner
          .querySelector('[data-consent="accept"]')
          .addEventListener("click", () => {
            localStorage.setItem("consent", "1");
            banner.hidden = true;
          });
      })();
    </script>
  </body>
</html>
