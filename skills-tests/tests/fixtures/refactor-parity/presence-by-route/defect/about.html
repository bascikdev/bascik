<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>About | Northwind Tasks</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Helvetica,
          Arial,
          sans-serif;
        color: #1d2433;
      }
      .top {
        position: sticky;
        top: 0;
        display: flex;
        gap: 24px;
        padding: 16px 40px;
        background: #fff;
        border-bottom: 1px solid #e3e7ef;
      }
      .top a {
        color: #1d2433;
        text-decoration: none;
      }
      main {
        min-height: 1400px;
        padding: 64px 40px;
      }
      .consent {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 16px 40px;
        background: #1d2433;
        color: #fff;
        transform: translateY(100%);
        transition: transform 0.3s ease-out;
      }
      .consent.in {
        transform: none;
      }
      .consent[hidden] {
        display: none;
      }
      .consent p {
        flex: 1;
        margin: 0;
      }
      .chat {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 50%;
        background: #2457d6;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <nav aria-label="Main">
        <a href="./">Home</a>
        <a href="about">About</a>
        <a href="pricing">Pricing</a>
      </nav>
    </header>
    <main>
      <h1>About Northwind Tasks</h1>
      <p>A small team building calm planning tools since 2019.</p>
    </main>
    <button type="button" class="chat" aria-label="Chat with us">?</button>
  </body>
</html>
