<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Milk frother</title>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font: 20px/30px sans-serif;
        color: #222;
        background: #fff;
      }
      h1 {
        margin: 0;
        padding: 16px;
        font-size: 28px;
        line-height: 36px;
      }
      #caption {
        margin: 0;
        padding: 0 16px;
      }
      .spacer {
        height: 9000px;
      }
      #photo {
        display: block;
        width: 200px;
        height: 200px;
        margin: 16px;
      }
      [data-reveal] {
        margin: 16px;
        padding: 16px;
        color: #fff;
        background: #2a6;
        opacity: 0;
        transition: opacity 0.3s;
      }
      [data-reveal].in {
        opacity: 1;
      }
      footer {
        height: 400px;
      }
      .banner {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 12px 16px;
        color: #fff;
        background: #123;
      }
    </style>
  </head>
  <body>
    <!-- Production renders late: the caption types itself out after load, a banner is appended 1 s after load, the
         photo is lazy and 9,000 px down (past the widest distance Chromium loads a lazy image ahead), and a card fades in when it scrolls into view. -->
    <h1>Milk frother</h1>
    <p id="caption"></p>
    <div class="spacer"></div>
    <img id="photo" src="photo.png" alt="The Milk frother" loading="lazy" />
    <section data-reveal>Foams oat, soy and dairy milk.</section>
    <footer></footer>
    <script>
      const caption = document.getElementById("caption");
      addEventListener("load", () => {
        setTimeout(() => {
          const banner = document.createElement("aside");
          banner.className = "banner";
          banner.textContent = "We use cookies for the Milk frother cart.";
          document.body.append(banner);
        }, 1000);
        const text =
          "The Milk frother whips oat, soy and dairy milk into a dense foam in ninety seconds.";
        let i = 0;
        const typing = setInterval(() => {
          caption.textContent = text.slice(0, ++i);
          if (i >= text.length) clearInterval(typing);
        }, 30);
      });
      new IntersectionObserver((entries, observer) => {
        for (const entry of entries)
          if (entry.isIntersecting) {
            entry.target.classList.add("in");
            observer.unobserve(entry.target);
          }
      }).observe(document.querySelector("[data-reveal]"));
    </script>
  </body>
</html>
