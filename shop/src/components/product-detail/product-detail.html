<section
  id="root"
  class="detail"
  data-testid="product-detail"
  data-bascik-attr-data-product="product"
>
  <div>
    <div class="photo">
      <script data-bascik-server src="./image.ts"></script>
    </div>
    <div class="thumbnails" role="group" aria-label="Product images">
      <script data-bascik-server src="./gallery.ts"></script>
    </div>
  </div>
  <div>
    <p class="eyebrow">THE BASCIK COLLECTION</p>
    <h1 data-bascik-prop-title></h1>
    <p class="price cost" data-bascik-prop-price></p>
    <p class="muted">Shipping and applicable tax calculated at checkout.</p>
    <shipping-promotion />
    <form data-product-form data-testid="product-form">
      <label for="color">Color</label>
      <select id="color" name="color" data-testid="product-color">
        <script data-bascik-server src="./colors.ts"></script>
      </select>
      <script data-bascik-build src="./sizes.ts"></script>
      <label for="quantity">Quantity</label>
      <input
        id="quantity"
        name="quantity"
        type="number"
        min="1"
        max="10"
        value="1"
        required
        data-testid="product-quantity"
      />
      <button class="primary" type="submit" data-testid="add-to-cart">
        Add to cart
      </button>
      <p class="status" role="status" data-product-status></p>
      <a
        class="button view-cart"
        href="/cart"
        data-testid="product-view-cart"
        hidden
        >View cart &amp; checkout</a
      >
    </form>
    <h2>Details</h2>
    <p class="description" data-bascik-prop-description></p>
    <p><a href="/shipping">Shipping, sizing &amp; returns</a></p>
  </div>
</section>
<script type="module" src="./product-detail.ts"></script>
