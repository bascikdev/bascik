<!-- @bascik
A compact shipping note linking to the full policy.
@prop mode - Use progress for live cart and delivery eligibility; otherwise show the offer.
-->
<p
  id="root"
  class="note"
  data-bascik-attr-data-mode="mode"
  data-testid="free-shipping-banner"
>
  <span
    data-free-shipping-progress
    data-testid="free-shipping-progress"
    aria-live="polite"
  >
    <script data-bascik-build-once type="text/typescript">
      import {html} from "@bascik/bascik/html";
      import {freeShippingOffer} from "@/lib/free-shipping.ts";
      export default () => html`${freeShippingOffer}`;
    </script>
  </span>
  <a href="/shipping" data-testid="free-shipping-terms">Details</a>
</p>
<script type="module" src="./shipping-promotion.ts"></script>
