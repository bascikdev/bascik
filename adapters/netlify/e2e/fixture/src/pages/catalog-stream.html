<!doctype html>
<html lang="en">
  <head>
    <fixture-head data-bascik-prop-title="Bascik · Streamed cards" />
  </head>
  <body>
    <fixture-nav />
    <footer data-testid="catalog-stream-footer">
      <span>Bascik · Streamed cards on Netlify</span>
      <a href="https://bascik.dev/scripts/stream">Stream scripts docs &rarr;</a>
    </footer>
    <main>
      <header class="hero">
        <h1 data-testid="catalog-stream-heading">Streamed cards</h1>
        <p class="subtitle" data-testid="catalog-stream-intro">
          Three independent stream scripts send component batches progressively,
          without client-side JavaScript.
        </p>
      </header>
      <section class="grid" data-testid="catalog-stream-grid">
        <script data-bascik-stream type="text/typescript">
          import { html } from "@bascik/bascik/html";

          export default async (request: Request, _context: unknown, { signal }: { signal?: AbortSignal }) => {
            const requested = Number(new URL(request.url).searchParams.get("delay") ?? 100);
            const delay = Number.isFinite(requested) ? Math.min(Math.max(requested, 0), 4000) : 100;
            if (delay > 0) {
              await new Promise<void>((resolve, reject) => {
                const timer = setTimeout(resolve, delay);
                signal?.addEventListener("abort", () => {
                  clearTimeout(timer);
                  reject(signal.reason);
                }, { once: true });
              });
            }
            return html`<book-card data-bascik-prop-title="Practical Type Systems" data-bascik-prop-author="Ada Okafor"><span>New</span></book-card>
              <book-card data-bascik-prop-title="Testing at the Edges" data-bascik-prop-author="Priya Nair"><span>Paperback</span></book-card>`;
          };
        </script>
