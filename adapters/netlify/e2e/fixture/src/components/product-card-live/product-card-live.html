<article id="tile" class="tile" data-testid="product-card-live">
  <h2 class="tile-name" data-testid="product-card-name" data-bascik-prop-name>
    Unnamed product
  </h2>
  <p class="tile-price" data-testid="product-card-price" data-bascik-prop-price>
    Price on request
  </p>
  <div class="tile-badge" data-testid="product-card-badge">
    <span data-bascik-slot>Standard</span>
  </div>
  <script data-bascik-server>
    import { html } from "@bascik/bascik/html";

    export default function (request) {
      const path = new URL(request.url).pathname;
      return html`<p class="stock" data-testid="product-card-stock">
        In stock · checked for ${path} at request time
      </p>`;
    }
  </script>
  <script>
    window.__productCards = (window.__productCards ?? 0) + 1;
  </script>
</article>
