<article id="tile" class="tile" data-testid="product-card">
  <h2 class="tile-name" data-testid="product-card-name" data-bascik-prop-name>
    Unnamed product
  </h2>
  <p class="tile-price" data-testid="product-card-price" data-bascik-prop-price>
    Price on request
  </p>
  <div class="tile-badge" data-testid="product-card-badge">
    <span data-bascik-slot>Standard</span>
  </div>
  <script>
    window.__productCards = (window.__productCards ?? 0) + 1;
  </script>
</article>
