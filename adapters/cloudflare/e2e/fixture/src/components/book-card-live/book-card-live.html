<!-- @bascik
The catalog tile with a request-time stock line: the same props and badge
slot as <book-card>, plus its own server script, which the Worker runs
once per rendered tile with the current request (a nested job, prompt 157).

  <book-card-live data-bascik-prop-title="Refactoring the Monolith" data-bascik-prop-author="Grace Lin">
    <span>Live</span>
  </book-card-live>
-->
<!--
  Keep the server script class-only: a body that embeds the instance id (an
  id or name selector) would make the component unsupported at request time.
  Nested scripts receive no props, so the stock line reads the request only.
-->
<article id="tile" class="tile" data-testid="book-card-live">
  <h3 class="tile-title" data-testid="book-card-title" data-bascik-prop-title>
    Untitled book
  </h3>
  <p class="tile-author" data-testid="book-card-author" data-bascik-prop-author>
    Unknown author
  </p>
  <!-- The slot element is replaced by what the usage puts inside the tag, so
       the badge container that tests and styles target sits around it. -->
  <div class="tile-badge" data-testid="book-card-badge">
    <span data-bascik-slot>Paperback</span>
  </div>
  <script data-bascik-server>
    export default function (request) {
      const path = new URL(request.url).pathname;
      return `<p class="stock" data-testid="book-card-stock">Copies in stock · checked for ${path} at request time</p>`;
    }
  </script>
  <script>
    window.__bookCards = (window.__bookCards ?? 0) + 1;
  </script>
</article>
