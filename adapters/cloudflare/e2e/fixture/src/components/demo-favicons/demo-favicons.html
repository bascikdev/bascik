<!-- @bascik
Bascik favicon links shared by every page of the Cloudflare adapter demo site. Place inside the head block:

  <head>
    <demo-favicons />
    <title>...</title>
  </head>
-->
<!--
  The icon files are copied from the docs site (docs/src/pages/favicon.ico and
  docs/src/pages/assets/) into this fixture's src/pages/, so the asset layer
  serves them statically without invoking the Worker.
-->
<meta name="theme-color" content="#18191b" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
