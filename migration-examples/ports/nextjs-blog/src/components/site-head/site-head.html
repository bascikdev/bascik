<!-- Static part of the upstream root layout <head>. The computed title and social tags are
     printed by each page's build script with renderHead(). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/styles.css">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<link rel="manifest" href="/favicon/site.webmanifest">
<meta name="theme-color" content="#000">
<script>
     const STORAGE_KEY = "nextjs-blog-starter-theme";
     const media = matchMedia("(prefers-color-scheme: dark)");
     window.updateDOM = () => {
          const css = document.createElement("style");
          css.textContent = "*,*:after,*:before{transition:none !important;}";
          document.head.appendChild(css);
          const mode = localStorage.getItem(STORAGE_KEY) ?? "system";
          const resolved = mode === "system" ? (media.matches ? "dark" : "light") : mode;
          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.setAttribute("data-mode", mode);
          getComputedStyle(document.documentElement);
          setTimeout(() => css.remove(), 1);
     };
     window.updateDOM();
     media.addEventListener("change", window.updateDOM);
</script>
