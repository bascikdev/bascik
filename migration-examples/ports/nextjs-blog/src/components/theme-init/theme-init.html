<!--
  First half of theme-switcher.tsx: the `NoFOUCScript` that applies the stored color scheme before
  first paint. It is a separate component because it must be placed in <head>. Production HTML
  minification moves body scripts to the end of the body, but the head is minified on its own,
  so a script written in <head> stays there and runs before the body is parsed.

  `dark` is a Tailwind class toggled on <html>. This component has no stylesheet, so Bascik
  leaves the name global and Tailwind's `dark:` variants match it.
-->
<script>
  const STORAGE_KEY = "nextjs-blog-starter-theme";
  const media = matchMedia("(prefers-color-scheme: dark)");
  window.updateDOM = () => {
    // Suppress transitions while the class changes, like the upstream modifyTransition().
    const css = document.createElement("style");
    css.textContent = "*,*:after,*:before{transition:none !important;}";
    document.head.appendChild(css);
    const mode = localStorage.getItem(STORAGE_KEY) ?? "system";
    const resolved = mode === "system" ? (media.matches ? "dark" : "light") : mode;
    document.documentElement.classList.toggle("dark", resolved === "dark");
    document.documentElement.setAttribute("data-mode", mode);
    getComputedStyle(document.documentElement);
    setTimeout(() => css.remove(), 1);
  };
  window.updateDOM();
  media.addEventListener("change", window.updateDOM);
</script>
