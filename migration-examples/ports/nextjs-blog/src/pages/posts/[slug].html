<!doctype html>
<html lang="en">

<head>
  <!-- src/app/posts/[slug]/page.tsx. generateStaticParams becomes the routes script,
  generateMetadata becomes the head build script, and the page body is a build script. -->
  <script data-bascik-routes>
    import { getAllPosts } from '@/lib/api.ts';
    console.log(JSON.stringify(getAllPosts().map((post) => ({ params: { slug: post.slug } }))));
  </script>
  <site-head />
  <script data-bascik-build>
    import { getPostBySlug } from '@/lib/api.ts';
    import { SITE_TITLE } from '@/lib/constants.ts';
    import { renderHead } from '@/lib/site.ts';
    const { params } = JSON.parse(process.env.BASCIK_ROUTE);
    const post = getPostBySlug(params.slug);
    console.log(renderHead({ title: `${post.title} | ${SITE_TITLE}`, image: post.ogImage.url }));
  </script>
</head>

<body class="dark:bg-slate-900 dark:text-slate-400">
  <theme-switcher />
  <div class="min-h-screen">
    <main>
      <post-alert />
      <page-container>
        <site-header />
        <script data-bascik-build>
          import { getPostBySlug } from '@/lib/api.ts';
          import { renderPost } from '@/lib/render.ts';
          const { params } = JSON.parse(process.env.BASCIK_ROUTE);
          console.log(await renderPost(getPostBySlug(params.slug)));
        </script>
      </page-container>
    </main>
  </div>
  <site-footer />
</body>

</html>
