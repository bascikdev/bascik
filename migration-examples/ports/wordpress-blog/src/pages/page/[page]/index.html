<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- /page/2/, /page/3/, ... The first page is the home page. -->
  <script data-bascik-routes>
    import { loadSnapshot, pageCount } from '@/lib/model.ts';
    const total = pageCount((await loadSnapshot()).posts.length);
    console.log(JSON.stringify(Array.from({ length: total - 1 }, (_, i) => ({ params: { page: String(i + 2) } }))));
  </script>
  <script data-bascik-build>
    import { loadSnapshot, listingPath } from '@/lib/model.ts';
    import { documentTitle, renderHead } from '@/lib/render.ts';
    const page = Number(JSON.parse(process.env.BASCIK_ROUTE).params.page);
    const snapshot = await loadSnapshot();
    console.log(renderHead(snapshot, { title: documentTitle(snapshot, undefined, page), path: listingPath(page) }));
  </script>
</head>

<body>
  <site-header></site-header>
  <main id="main">
    <script data-bascik-build>
      import { loadSnapshot } from '@/lib/model.ts';
      import { homeListing } from '@/lib/render.ts';
      const page = Number(JSON.parse(process.env.BASCIK_ROUTE).params.page);
      console.log(homeListing(await loadSnapshot(), page));
    </script>
  </main>
  <site-footer></site-footer>
</body>

</html>
