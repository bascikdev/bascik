<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Child pages at /<parent>/<child>/. A route parameter cannot contain "/", so each depth needs its own template. -->
  <script data-bascik-routes>
    import { loadSnapshot } from '@/lib/model.ts';
    const { pages } = await loadSnapshot();
    console.log(JSON.stringify(pages.filter((page) => page.parent).map((page) => ({ params: { parent: page.parent, child: page.slug } }))));
  </script>
  <script data-bascik-build>
    import { loadSnapshot } from '@/lib/model.ts';
    import { documentTitle, findPage, renderHead } from '@/lib/render.ts';
    const { params } = JSON.parse(process.env.BASCIK_ROUTE);
    const snapshot = await loadSnapshot();
    const path = `/${params.parent}/${params.child}/`;
    const page = findPage(snapshot, path);
    console.log(renderHead(snapshot, { title: documentTitle(snapshot, page.title), description: page.excerpt, path }));
  </script>
</head>

<body>
  <site-header></site-header>
  <main id="main">
    <script data-bascik-build>
      import { loadSnapshot } from '@/lib/model.ts';
      import { findPage, renderPage } from '@/lib/render.ts';
      const { params } = JSON.parse(process.env.BASCIK_ROUTE);
      console.log(renderPage(findPage(await loadSnapshot(), `/${params.parent}/${params.child}/`)));
    </script>
  </main>
  <site-footer></site-footer>
</body>

</html>
