<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Top-level WordPress pages at /<slug>/. Child pages use [parent]/[child]/. -->
  <script data-bascik-routes>
    import { loadSnapshot } from '@/lib/model.ts';
    const { pages } = await loadSnapshot();
    console.log(JSON.stringify(pages.filter((page) => !page.parent).map((page) => ({ params: { pageslug: page.slug } }))));
  </script>
  <script data-bascik-build>
    import { loadSnapshot } from '@/lib/model.ts';
    import { documentTitle, findPage, renderHead } from '@/lib/render.ts';
    const snapshot = await loadSnapshot();
    const path = `/${JSON.parse(process.env.BASCIK_ROUTE).params.pageslug}/`;
    const page = findPage(snapshot, path);
    console.log(renderHead(snapshot, { title: documentTitle(snapshot, page.title), description: page.excerpt, path }));
  </script>
</head>

<body>
  <site-header></site-header>
  <main id="main">
    <script data-bascik-build>
      import { loadSnapshot } from '@/lib/model.ts';
      import { findPage, renderPage } from '@/lib/render.ts';
      const path = `/${JSON.parse(process.env.BASCIK_ROUTE).params.pageslug}/`;
      console.log(renderPage(findPage(await loadSnapshot(), path)));
    </script>
  </main>
  <site-footer></site-footer>
</body>

</html>
