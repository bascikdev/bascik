<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- One page per post at the WordPress "Day and name" permalink, /2026/03/15/raised-beds/. -->
  <script data-bascik-routes>
    import { loadSnapshot } from '@/lib/model.ts';
    const { posts } = await loadSnapshot();
    console.log(JSON.stringify(posts.map((post) => {
      const [year, month, day] = post.date.slice(0, 10).split('-');
      return { params: { year, month, day, slug: post.slug } };
    })));
  </script>
  <script data-bascik-build>
    import { loadSnapshot, postPath } from '@/lib/model.ts';
    import { documentTitle, findPost, renderHead } from '@/lib/render.ts';
    const snapshot = await loadSnapshot();
    const post = findPost(snapshot, JSON.parse(process.env.BASCIK_ROUTE).params);
    console.log(renderHead(snapshot, { title: documentTitle(snapshot, post.title), description: post.excerpt, path: postPath(post) }));
  </script>
</head>

<body>
  <site-header />
  <main id="main">
    <script data-bascik-build>
      import { loadSnapshot } from '@/lib/model.ts';
      import { findPost, renderPost } from '@/lib/render.ts';
      const snapshot = await loadSnapshot();
      console.log(renderPost(snapshot, findPost(snapshot, JSON.parse(process.env.BASCIK_ROUTE).params)));
    </script>
  </main>
  <site-footer />
</body>

</html>
