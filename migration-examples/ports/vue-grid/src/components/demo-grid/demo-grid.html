<div class="grid">
  <div id="input" hidden>
    <div data-bascik-slot></div>
  </div>
  <table id="table" hidden>
    <thead>
      <tr id="head"></tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
  <p id="empty" hidden>No matches found.</p>
  <template id="heading-template">
    <th><button type="button" class="sort"><span class="label"></span> <span class="arrow asc"></span></button></th>
  </template>
  <template id="cell-template">
    <td></td>
  </template>
</div>
<script>
  const table = document.getElementById('table');
  const head = document.getElementById('head');
  const body = document.getElementById('body');
  const empty = document.getElementById('empty');
  const headingTemplate = document.getElementById('heading-template');
  const cellTemplate = document.getElementById('cell-template');
  const { columns, rows: data } = JSON.parse(document.getElementById('input').firstElementChild.textContent);
  const root = table.closest('.grid');

  const sortOrders = Object.fromEntries(columns.map((key) => [key, 1]));
  let sortKey = '';
  let filterKey = '';

  function capitalize(text) {
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  // Vue renders null and undefined as an empty string.
  function display(value) {
    return value == null ? '' : String(value);
  }

  function filteredData() {
    let rows = data;
    if (filterKey) {
      const needle = filterKey.toLowerCase();
      rows = rows.filter((row) =>
        Object.keys(row).some((key) => String(row[key]).toLowerCase().indexOf(needle) > -1));
    }
    if (sortKey) {
      const order = sortOrders[sortKey];
      rows = rows.slice().sort((a, b) => {
        a = a[sortKey];
        b = b[sortKey];
        return (a === b ? 0 : a > b ? 1 : -1) * order;
      });
    }
    return rows;
  }

  const headings = columns.map((key) => {
    const heading = headingTemplate.content.firstElementChild.cloneNode(true);
    heading.querySelector('.label').textContent = capitalize(key);
    heading.querySelector('.sort').addEventListener('click', () => {
      sortKey = key;
      sortOrders[key] *= -1;
      render();
    });
    head.append(heading);
    return { key, heading, arrow: heading.querySelector('.arrow') };
  });

  function render() {
    for (const { key, heading, arrow } of headings) {
      const ascending = sortOrders[key] > 0;
      heading.classList.toggle('active', sortKey === key);
      if (sortKey === key) heading.setAttribute('aria-sort', ascending ? 'ascending' : 'descending');
      else heading.removeAttribute('aria-sort');
      arrow.classList.toggle('asc', ascending);
      arrow.classList.toggle('dsc', !ascending);
    }
    const rows = filteredData();
    table.hidden = rows.length === 0;
    empty.hidden = rows.length > 0;
    body.replaceChildren(...rows.map((row) => {
      const tr = document.createElement('tr');
      for (const key of columns) {
        const cell = cellTemplate.content.firstElementChild.cloneNode(true);
        cell.textContent = display(row[key]);
        tr.append(cell);
      }
      return tr;
    }));
  }

  // grid-search tells the grid what to filter by.
  root.addEventListener('grid-filter', (event) => {
    filterKey = event.detail.query;
    render();
  });

  render();
</script>
