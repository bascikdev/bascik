<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cloudflare stream</title>
  <style>
    /* Author CSS owns the placeholder swap; no framework bytes are injected. */
    [data-testid="cf-slot"] { min-height: 3rem; }
  </style>
</head>
<body>
  <header data-testid="cf-header">header</header>

  <p data-testid="cf-greeting">
    <script data-bascik-server>
      export default function (request, context) {
        const name = new URL(request.url).searchParams.get('name') ?? 'Guest';
        return 'Hello ' + name.replace(/[<>&"']/g, '') + ' on ' + context.platform.name;
      }
    </script>
  </p>

  <section data-testid="cf-slot" aria-busy="true">
    <p data-testid="cf-skeleton" role="status">Loading account...</p>
    <script data-bascik-stream>
      export default async function (request, context, { signal }) {
        const requested = Number(new URL(request.url).searchParams.get('delay') ?? 0);
        const delay = Number.isFinite(requested) ? Math.min(Math.max(requested, 0), 5000) : 0;
        if (delay > 0) {
          await new Promise((resolve, reject) => {
            const t = setTimeout(resolve, delay);
            signal?.addEventListener('abort', () => { clearTimeout(t); reject(signal.reason); }, { once: true });
          });
        }
        return '<article data-testid="cf-result" data-delay="' + delay + '">account loaded</article>';
      }
    </script>
  </section>

  <footer data-testid="cf-footer">footer</footer>
</body>
</html>
