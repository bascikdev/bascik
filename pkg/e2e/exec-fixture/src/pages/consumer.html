<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Consumes generated output</title>
</head>

<body>
  <script data-bascik-build>import { readFileSync } from 'node:fs'; readFileSync('content/doc.md', 'utf8');</script>
  <h1>Exec producer/consumer</h1>
  <p data-testid="generated-value">
    <script
      data-bascik-build>import { readFileSync } from 'node:fs'; try { console.log(JSON.parse(readFileSync('dist/generated.json', 'utf8')).value); } catch (e) { console.log('missing'); }</script>
  </p>
  <p data-testid="parallel-value">
    <script
      data-bascik-build>import { readFileSync } from 'node:fs'; try { console.log(JSON.parse(readFileSync('dist/parallel.json', 'utf8')).value); } catch (e) { console.log('missing'); }</script>
  </p>
</body>

</html>
