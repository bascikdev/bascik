<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inline Style Test</title>
    <style>
      body {
        margin: 0;
        padding: 32px 24px;
        background: #111;
        color: #eee;
        font-family: sans-serif;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }

      .instances {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
    </style>
  </head>

  <body>
    <h1>Inline Style Test</h1>
    <p>Outside paragraph — should NOT inherit component p styles.</p>

    <div class="instances">
      <inline-style
        data-bascik-prop-title="Card A"
        data-bascik-prop-body="Body text for card A."
      ></inline-style>
      <inline-style
        data-bascik-prop-title="Card B"
        data-bascik-prop-body="Body text for card B."
      ></inline-style>
    </div>
  </body>
</html>
