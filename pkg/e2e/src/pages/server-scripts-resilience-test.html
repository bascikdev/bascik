<!DOCTYPE html>
<html lang="en">

<head>
  <title>Server Scripts Resilience Test</title>
</head>

<body>
  <h1>Server Scripts Resilience</h1>

  <p id="resilience-before" data-testid="resilience-before">start</p>

  <!-- 1. Script with runtime error -->
  <script data-bascik-server>
    throw new Error('Resilience test error');
  </script>

  <!-- 2. Script with syntax error -->
  <script data-bascik-server>
    const === invalid_syntax;
  </script>

  <!-- 3. Script producing large stdout payload -->
  <script data-bascik-server>
    export default function () {
      const largeStr = 'A'.repeat(50000);
      return `<div id="large-payload" data-testid="large-payload" data-len="${largeStr.length}">LargePayload</div>`;
    }
  </script>

  <!-- 4. Script reading multiple request headers -->
  <script data-bascik-server>
    export default function ({ req }) {
      const count = Object.keys(req.headers).filter(k => k.startsWith('x-stress-')).length;
      return `<p id="custom-headers-count" data-testid="custom-headers-count">${count}</p>`;
    }
  </script>

  <p id="resilience-after" data-testid="resilience-after">end</p>
</body>

</html>
