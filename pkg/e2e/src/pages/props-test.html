<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Props Test</title>
    <style>
      body {
        margin: 0;
        padding: 32px 24px;
        background: #111;
        color: #eee;
        font-family: sans-serif;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }

      .instance-label {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #888;
        margin: 0 0 10px;
      }

      .instances {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
    </style>
  </head>

  <body>
    <h1>Props Test</h1>

    <div class="instances">
      <div>
        <p class="instance-label">Usage 1 — all props provided</p>
        <prop-test
          data-bascik-prop-title="My Custom Title"
          data-bascik-prop-description="A custom description."
          data-bascik-prop-badge="premium"
          data-bascik-prop-count="42"
        ></prop-test>
      </div>

      <div>
        <p class="instance-label">Usage 2 — only title and count provided</p>
        <prop-test
          data-bascik-prop-title="Partial Props"
          data-bascik-prop-count="7"
        ></prop-test>
      </div>

      <div>
        <p class="instance-label">Usage 3 — no props (all fallbacks)</p>
        <prop-test></prop-test>
      </div>
    </div>
  </body>
</html>
