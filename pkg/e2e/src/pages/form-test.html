<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Scoping Test</title>
  <style>
    body {
      margin: 0;
      padding: 32px 24px;
      background: #111;
      color: #eee;
      font-family: sans-serif;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    .desc {
      color: #aaa;
      font-size: 0.85rem;
      margin: 0 0 24px;
      max-width: 560px;
    }

    .instances {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    .instance-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
      margin: 0 0 10px;
    }
  </style>
</head>

<body>
  <h1>Form Name Scoping — Live Test</h1>
  <p class="desc">
    Two independent instances of the same form component. Name attributes must be
    scoped per-instance so FormData keys carry the scoped names.
  </p>

  <div class="instances">
    <div data-testid="form-instance-one">
      <p class="instance-label">Instance A</p>
      <form-test></form-test>
    </div>
    <div data-testid="form-instance-two">
      <p class="instance-label">Instance B</p>
      <form-test></form-test>
    </div>
  </div>

  <div data-testid="reference-instance-one"><id-reference-demo></id-reference-demo></div>
  <div data-testid="reference-instance-two"><id-reference-demo></id-reference-demo></div>
</body>

</html>
