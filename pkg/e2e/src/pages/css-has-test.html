<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS :has() Test</title>
    <style>
      body {
        margin: 0;
        padding: 32px 24px;
        background: #111;
        color: #eee;
        font-family: sans-serif;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }

      .instances {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        margin-top: 16px;
      }

      .instance {
        flex: 1;
        min-width: 280px;
      }
    </style>
  </head>

  <body>
    <h1>CSS :has() Test</h1>
    <p>
      Two instances of &lt;css-has&gt; for :has() pseudo-class scoping tests.
    </p>

    <div class="instances">
      <div class="instance" id="instance-a">
        <p>Instance A</p>
        <css-has></css-has>
      </div>
      <div class="instance" id="instance-b">
        <p>Instance B</p>
        <css-has></css-has>
      </div>
    </div>
  </body>
</html>
