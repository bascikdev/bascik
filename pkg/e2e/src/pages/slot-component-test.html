<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slot Component Test</title>
    <style>
      body {
        margin: 0;
        padding: 32px 24px;
        background: #111;
        color: #eee;
        font-family: sans-serif;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }

      .instance-label {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #888;
        margin: 0 0 10px;
      }

      .instances {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
    </style>
  </head>

  <body>
    <h1>Slot Component Test</h1>

    <div class="instances">
      <div>
        <p class="instance-label">Usage 1 — component in default slot</p>
        <slot-card>
          <div data-bascik-slot="header">Card with Component Slot</div>
          <status-badge data-bascik-prop-status="online" />
          <p>This card's default slot contains a status-badge component.</p>
          <div data-bascik-slot="footer">Footer text</div>
        </slot-card>
      </div>

      <div>
        <p class="instance-label">Usage 2 — plain text only</p>
        <slot-card>
          <div data-bascik-slot="header">Plain Text Card</div>
          <p>Just plain content here.</p>
          <div data-bascik-slot="footer">Plain footer</div>
        </slot-card>
      </div>

      <div>
        <p class="instance-label">Usage 3 — all fallbacks</p>
        <slot-card></slot-card>
      </div>
    </div>
  </body>
</html>
