<form data-testid="radio-form">

    <legend>Billing</legend>
    <label
      ><input
        type="radio"
        name="plan"
        value="monthly"
        data-testid="monthly-plan"
      />

    <label
      ><input
        type="radio"
        name="plan"
        value="yearly"

      />
      Yearly</label
    >
  </fieldset>
</form>
