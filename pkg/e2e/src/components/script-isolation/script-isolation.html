<div class="wrapper">
  <div id="display" class="display">No result yet</div>
  <div class="btn-row">
    <button id="set-local-btn">Set local var</button>
    <button id="check-global-btn">Check window.leakVar</button>
    <button id="read-local-btn">Read local var</button>
    <button id="increment-btn">Increment counter</button>
    <button id="read-counter-btn">Read counter</button>
  </div>

  <!-- Sentinel -->
  <span hidden class="updated"></span>

  <script>
    // These should be isolated to this IIFE, not on window
    var leakVar = "instance-local-value";
    let counter = 0;
    const localMsg = "only in this instance";

    const display = document.getElementById("display");

    document.getElementById("set-local-btn").addEventListener("click", () => {
      leakVar = "set-by-click";
      display.textContent = "leakVar set: " + leakVar;
      display.classList.add("updated");
    });

    document
      .getElementById("check-global-btn")
      .addEventListener("click", () => {
        // window.leakVar should be undefined because var is inside IIFE
        const globalVal = window.leakVar;
        display.textContent = "window.leakVar = " + globalVal;
        display.classList.add("updated");
      });

    document.getElementById("read-local-btn").addEventListener("click", () => {
      display.textContent = "local leakVar = " + leakVar;
      display.classList.add("updated");
    });

    document.getElementById("increment-btn").addEventListener("click", () => {
      counter++;
      display.textContent = "counter = " + counter;
      display.classList.add("updated");
    });

    document
      .getElementById("read-counter-btn")
      .addEventListener("click", () => {
        display.textContent = "counter = " + counter;
        display.classList.add("updated");
      });
  </script>
</div>
