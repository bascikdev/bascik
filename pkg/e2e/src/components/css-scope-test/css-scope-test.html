<div class="wrapper">
  <!-- Sentinel: declares runtime-toggled class so bascik includes it in the scoped map -->
  <span hidden class="active"></span>

  <div id="box" class="box">box</div>
  <button id="toggle-btn">Toggle active</button>
  <p>Inside component paragraph</p>

  <script>
    document.getElementById("toggle-btn").addEventListener("click", () => {
      document.getElementById("box").classList.toggle("active");
    });
  </script>
</div>
