<div class="wrapper" data-testid="wrapper">
  <!-- Outside the preserved family, so it scopes normally. -->
  <p class="text" id="outer" name="outer" data-testid="outer">Outer text</p>

  <!-- Every tag matching vendor-* is preserved: its own id/name/class, its
       contents, and its descendants stay literal. -->
  <vendor-widget class="widget" id="widget-root" name="widget-root" data-testid="widget">
    <span class="label" id="label" name="label" data-testid="label">Literal inner text</span>
  </vendor-widget>
</div>
