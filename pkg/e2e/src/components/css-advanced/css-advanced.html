<div class="wrapper" id="root">
  <!-- Sentinel: declares runtime-toggled class so bascik includes it in the scoped map -->
  <span hidden class="playing"></span>

  <!-- Custom property test -->
  <div class="accent-box">accent box</div>

  <!-- ID selector in CSS test -->
  <div id="special" class="special-box">special box</div>

  <!-- Animation test -->
  <div id="anim-trigger-btn" class="anim-btn">Trigger animation</div>
  <div id="animated-box" class="animated-box">animated</div>

  <script>
    document
      .getElementById("anim-trigger-btn")
      .addEventListener("click", () => {
        document.getElementById("animated-box").classList.toggle("playing");
      });
  </script>
</div>
