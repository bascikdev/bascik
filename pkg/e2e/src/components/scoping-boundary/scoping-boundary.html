<div
  class="boundary-wrapper"
  data-class="preserve-data-class"
  data-style="preserve-data-style"
>
  <button id="boundary-btn" class="boundary-box">Click Me</button>
  <div id="boundary-output" class="boundary-output">Ready</div>
  <code class="boundary-code">data-bascik-prop-sample="literal"</code>
  <textarea class="boundary-textarea" aria-label="Literal markup" readonly>
<button id="boundary-btn" class="boundary-box" data-bascik-prop-sample="x"></button></textarea>
  <div class="a b a-b" data-testid="boundary-multi-tokens">
    <span class="token-probe">tokens</span>
  </div>
</div>

<style>
  .boundary-wrapper {
    padding: 1rem;
    border: 1px solid #ccc;
    margin-bottom: 1rem;
  }

  .boundary-box {
    background-color: #f0f0f0;
    padding: 0.5rem 1rem;
  }

  .boundary-box::before {
    content: ".boundary-box #boundary-btn { color: red; } @keyframes fake";
  }

  .boundary-active {
    color: green;
    font-weight: bold;
  }

  .a {
    --v: 10px;
    --v-long: 24px;
    padding-left: var(--v);
    padding-right: var(--v-long);
  }

  .b {
    font-style: italic;
  }

  .a-b {
    text-decoration: underline;
  }
</style>

<script data-src="/lazy-chunk.js">
  // document.querySelector("#boundary-btn");
  /* document.getElementsByClassName("boundary-box"); */

  const btn = document.querySelector("#boundary-btn");
  const out = document.querySelector("#boundary-output");

  if (btn && out) {
    btn.addEventListener("click", () => {
      btn.classList.add("boundary-active");

      // Static scoped query works
      out.textContent = "Clicked Successfully";
      out.setAttribute(
        "data-multi-class-count",
        String(document.getElementsByClassName("a b").length),
      );

      // Dynamic variable lookup is intentionally unsupported at build time
      const targetId = "boundary-output";
      const dynamicEl = document.getElementById(`${targetId}`);
      out.setAttribute("data-dynamic-unscoped", String(dynamicEl === null));
    });
  }
</script>
