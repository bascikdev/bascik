<!-- Usage: put content between <slot-card> and </slot-card>. This comment names the
     component's own tag. The dev server keeps comments, so it must stay text. -->
<article class="card">
  <header class="card-header">
    <div data-bascik-slot="header"><span class="default-header">No header</span></div>
  </header>
  <div class="card-body">
    <div data-bascik-slot>
      <p class="default-body">No content provided.</p>
    </div>
  </div>
  <footer class="card-footer">
    <div data-bascik-slot="footer"><span class="default-footer">No footer</span></div>
  </footer>
</article>
