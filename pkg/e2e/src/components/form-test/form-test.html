<form class="form" id="login-form" data-testid="form">
  <div class="field-group">
    <label class="label" for="username-input" data-testid="username-label">Username</label>
    <input id="username-input" class="input" name="username" type="text" value="alice" data-testid="username-input">
  </div>
  <div class="field-group">
    <label class="label" for="email-input">Email</label>
    <input id="email-input" class="input" name="email" type="email" value="alice@example.com" data-testid="email-input">
  </div>
  <div class="field-group">
    <label class="label" for="role-select">Role</label>
    <select id="role-select" class="select" name="role" data-testid="role-select">
      <option value="admin">Admin</option>
      <option value="user" selected>User</option>
    </select>
  </div>
  <div id="result" class="result" data-testid="result">No submission yet</div>
  <div class="btn-row">
    <button id="submit-btn" class="btn" type="button" data-testid="submit-btn">Read FormData</button>
    <button id="check-entries-btn" class="btn" type="button" data-testid="check-entries-btn">Count FormData
      entries</button>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const result = document.getElementById("result");

    document.getElementById("submit-btn").addEventListener("click", () => {
      const fd = new FormData(form);
      const entries = [...fd.entries()];
      result.textContent = "keys: " + entries.map(([k]) => k).join(", ");
    });

    document.getElementById("check-entries-btn").addEventListener("click", () => {
      const fd = new FormData(form);
      result.textContent = "count: " + [...fd.entries()].length;
    });
  </script>
</form>
