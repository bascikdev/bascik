<div class="wrapper" id="root">
  <div id="box" class="box">Target box</div>

  <!-- Results display -->
  <div id="result" class="result">Click a button to test</div>

  <!-- Buttons for each test -->
  <div class="btn-group">
    <button id="qs-id-btn">querySelector('#box')</button>
    <button id="qsa-id-btn">querySelectorAll('#box')</button>
    <button id="closest-id-btn">box.closest('#root')</button>
    <button id="closest-class-btn">box.closest('.wrapper')</button>
    <button id="matches-id-btn">box.matches('#box')</button>
    <button id="matches-class-btn">box.matches('.box')</button>
    <button id="classname-btn">el.className = 'active'</button>
    <button id="set-attr-btn">setAttribute('class', 'active')</button>
    <button id="reset-btn">reset box</button>
  </div>

  <!-- Sentinel for dynamic classes -->
  <span hidden class="active found"></span>

  <script>
    const result = document.getElementById("result");
    const box = document.getElementById("box");

    document.getElementById("qs-id-btn").addEventListener("click", () => {
      const el = document.querySelector("#box");
      result.textContent = el
        ? "querySelector('#box'): found"
        : "querySelector('#box'): null";
      result.classList.add("found");
    });

    document.getElementById("qsa-id-btn").addEventListener("click", () => {
      const els = document.querySelectorAll("#box");
      result.textContent = "querySelectorAll('#box'): " + els.length;
      result.classList.add("found");
    });

    document.getElementById("closest-id-btn").addEventListener("click", () => {
      const el = box.closest("#root");
      result.textContent = el
        ? "closest('#root'): found"
        : "closest('#root'): null";
      result.classList.add("found");
    });

    document
      .getElementById("closest-class-btn")
      .addEventListener("click", () => {
        const el = box.closest(".wrapper");
        result.textContent = el
          ? "closest('.wrapper'): found"
          : "closest('.wrapper'): null";
        result.classList.add("found");
      });

    document.getElementById("matches-id-btn").addEventListener("click", () => {
      result.textContent = "matches('#box'): " + box.matches("#box");
      result.classList.add("found");
    });

    document
      .getElementById("matches-class-btn")
      .addEventListener("click", () => {
        result.textContent = "matches('.box'): " + box.matches(".box");
        result.classList.add("found");
      });

    document.getElementById("classname-btn").addEventListener("click", () => {
      box.className = "active";
      result.textContent = "className set to: " + box.className;
      result.classList.add("found");
    });

    document.getElementById("set-attr-btn").addEventListener("click", () => {
      box.setAttribute("class", "active");
      result.textContent = "setAttribute class: " + box.className;
      result.classList.add("found");
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
      box.className = "box";
      result.textContent = "reset";
    });
  </script>
</div>
