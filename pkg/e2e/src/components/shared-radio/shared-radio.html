<!-- No form of its own: every copy's radios are one group on the page, as the
     HTML spec defines radio groups. Kept on purpose to pin that behavior. -->
<!-- bascik-disable shared-name-group -->
<fieldset data-testid="shared-radio-group">
  <legend>Size</legend>
  <label
    ><input type="radio" name="size" value="small" data-testid="size-small" />
    Small</label
  >
  <label
    ><input type="radio" name="size" value="large" data-testid="size-large" />
    Large</label
  >
</fieldset>
<!-- bascik-enable -->
