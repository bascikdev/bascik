nodeLinker: node-modules
npmMinimalAgeGate: "7d"
# Exempt from the 7-day age gate, pinned to exact versions so a later release still waits.
# They close Dependabot alert 107 (GHSA-3g3m-2fjr-6pw4, glob 14.0.2) and clear alert 108
# (GHSA-g3hv-75wg-m249, minimatch 11.0.1) for mocha, @vscode/test-cli and test-exclude.
# Alert 108 stays open for minimatch 10 under vscode-languageclient (it calls makeRe,
# which minimatch 11 removed) and minimatch 3 under glob 7. path-scurry 3 and
# @isaacs/nonrecursive-glob-match are new dependencies of glob 14 and minimatch 11 from the
# same week. The gate opens for all four by 2026-11-04; remove this list after that date.
npmPreapprovedPackages:
  - glob@14.0.3
  - minimatch@11.0.3
  - path-scurry@3.0.0
  - "@isaacs/nonrecursive-glob-match@1.0.3"
